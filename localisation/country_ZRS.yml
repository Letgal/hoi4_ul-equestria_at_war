 everfree_forest_resistance_tt: "§CВічнодикий ліс нестримний§!\n\nЕфективність повітряних завдань: §R-150.0%§!\nІмовірність нещасть у повітрі: §R+150.0%§!\nШвидкість дивізій: §R-150.0%§!\nАтака дивізій: §R-150.0%§!\nЗахист дивізій: §R-150.0%§!\nВиснаження дивізій: §R— ВИДАЛЕНО —§!\nВідновлення організації: §R-150.00%§!\nШанс захворіти: §R+150.00%§!" # (&?)
 everfree_forest_resistance_tt_delayed: "§LПротягом тисячоліть Вічнодикий ліс залишався місцем неприборканої, дикої природи, домом для дивовижних і жахливих створінь, які колись вважалися вигадкою чи легендою. Він протистояв зусиллям земних поні з його обробітку, погодним маніпуляціям пегасів, магічним атакам єдинорогів і, навіть коли Промислова революція охопила решту Еквуса, найкращим спробам еквестрійських капітанів індустрії експлуатувати його добре приховані, але щедрі природні ресурси. У той час як натиск цивілізації стирає останні сліди магічного й таємничого в природі, від джунглів Південного Сходу до колись негостинних пусток полярної тундри, саме Вічнодикий ліс досі непохитно стоїть проти смертоносного маршу сучасного прогресу.\n\nІ поки темрява Пакс Кризалії опускається на континент, Вічнодикий ліс знову взяв на себе свою споконвічну роль оплоту проти дисгармонії та руйнування, повставши, щоб повалити непослідовні спроби чейнджлінґів керувати Лісом. Вічнодикий ліс захищає різношерста армія звіриних антитіл: деревні вовки, баґбіри, кокатриси й навіть кілька лісових гідр кидають виклик природному порядку, щоб взяти участь у єдиному фронті проти загарбників. Вони не самотні у своїй боротьбі; коли Еквестрія зазнала краху наприкінці Великої війни, багато поні-партизанів знайшли притулок у непрохідних глибинах Вічнодикого лісу. Тепер під проводом зебри Зекори їхня боротьба за захист лісу втілює симбіотичні відносини між природою та всіма створіннями, що ґрунтуються не на експлуатації чи винищенні, а на взаємодопомозі та гармонійному співіснуванні.§!" # (@+++)

