### НОВИННІ ПОДІЇ ###
 zebrica_news.1.t: "Роялісти перемагають у Громадянській війні в Сідловій Арабії" # увесь блок переклав (@+++)
 zebrica_news.1.d: "[This.GetNewspaperHeader]Громадянська війна в Сідловій Арабії завершилася, і монархія тріумфує. [SDL.GetLeader] виступив із промовою в столиці, вихваляючи важку працю вірних офіцерів та народу, а також швидке повернення до старого статус-кво.\n\nПоки нововідроджена Арабія дивиться назовні, її сусіди з Ліги Чотирьох Емірів уже готуються до найгіршого."
 zebrica_news.1.a: "За Принца!"
 zebrica_news.1.b: "Старий порядок зберігся."

 zebrica_news.2.t: "Демократи перемагають у Громадянській війні в Сідловій Арабії"
 zebrica_news.2.d: "[This.GetNewspaperHeader]Громадянська війна в Сідловій Арабії завершилася, і Республіка здобула перемогу. [SDS.GetLeader] заявив про необхідність залучення громадян молодої демократії до її політичного життя, а також про майбутнє визволення тих, хто досі перебуває під монархічною тиранією.\n\nПоки нововідроджена Арабія дивиться назовні, її сусіди з Ліги Чотирьох Емірів уже готуються до найгіршого."
 zebrica_news.2.a: "За свободу!"
 zebrica_news.2.b: "Свобода на заході."

 zebrica_news.3.t: "Соціалісти перемагають у Громадянській війні в Сідловій Арабії"
 zebrica_news.3.d: "[This.GetNewspaperHeader]Громадянська війна в Сідловій Арабії завершилася, і Соціалістична Республіка вийшла переможцем. [SDC.GetLeader] звернувся до ідей міжнародного комунізму та неминучої фінальної битви пролетаріату з капіталізмом.\n\nПоки нововідроджена Арабія дивиться назовні, її сусіди з Ліги Чотирьох Емірів уже готуються до найгіршого."
 zebrica_news.3.a: "Пролетарі всіх країн, єднайтеся!"
 zebrica_news.3.b: "Червона пустеля."

 zebrica_news.4.t: "Націоналісти перемагають у Громадянській війні в Сідловій Арабії"
 zebrica_news.4.d: "[This.GetNewspaperHeader]Громадянська війна в Сідловій Арабії завершилася, і Національна Держава знищила всіх суперників. [SDF.GetLeader] розкритикував інші фракції за те, що вони «розірвали тканину нашої країни на шматки», і підтвердив свою тверду віру в те, що лише міцний національний зв'язок може забезпечити виживання арабійського народу.\n\nПоки нововідроджена Арабія дивиться назовні, її сусіди з Ліги Чотирьох Емірів уже готуються до найгіршого."
 zebrica_news.4.a: "Тепер нас ніхто не зупинить!"
 zebrica_news.4.b: "Нація понад усе."

