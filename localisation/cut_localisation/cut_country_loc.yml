 ELF_ask_for_states_back: "Відновлення Еквестрії"
 ELF_ask_for_states_back_desc: "Ми були не єдині в боротьбі проти загрози чейнджлінґів; багато інших держав світу допомогли нам у наших визвольних зусиллях. Однак деякі еквестрійські території, визволені з-під окупації чейнджлінґів, перебувають під контролем цих союзників, і вони мусять негайно повернутися до нас." # (&)
 ELF_ask_for_states_back_decision: "Переговори про відновлення"
 ELF_ask_for_states_back_decision_desc: "Ми об'єдналися супротив спільного ворога, але нашим союзникам слід дати відшкодувати втрати, пережиті в боротьбі за визволення Еквестрії та її поні від гніту чейнджлінґів. Борги перед ним стануть важким тягарем для нашої молодої свободи, але врешті-решт це прийнятна ціна." # (&)

