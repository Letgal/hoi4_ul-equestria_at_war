 ### ІДЕЇ ###
  TBK_fake_republic: "Фальшива республіка"
  TBK_fake_republic_desc: "Тобук! Вільна, сучасна та суверенна республіка! Єдина проблема полягає в тім, що жоден житель Тобука насправді не хотів цього. Або, радше, та дрібка тих, хто цього хотів, не хотіла, щоби нею керував якийсь торгівець зброєю. На цій землі, що процвітала під владою монархії, проголошення республіки дорівнює гарматному ядру, вистреленому з нестачею пороху: воно просто гучно вдарилося в землю.\n\nУрешті-решт, проголошенням республіки нікого не вдалося обманути — навіть гіпогрифських і мейргипетських послів, які були раді умовно підтримати ідею, що Хіроптеррі, Варзені та Зарантії слід двічі подумати, перш ніж увійти сюди. Але бітси допомагають згладити ситуацію, і фальшива республіка знаходить спосіб упорядковувати рішення уряду."
  TBK_warlord_reliance: "Опора на воєначальників"
  TBK_zarantian_loyalism: "Вірність Зарантії"
  TBK_home_act: "Закон про переміщення"

  TBK_took_cuts: "Недофінансована держава"
  TBK_amended_republic: "$TBK_fake_republic$"
  TBK_amended_republic_desc: "$TBK_fake_republic_desc$\n\nНещодавні вибори загалом знайшли підтримку громадськості, але певна злоба лишається; адже ще треба вирішити так помітну урядову корупцію. Васіле зробить усе на краще для держави, чи не так?" # (&)

