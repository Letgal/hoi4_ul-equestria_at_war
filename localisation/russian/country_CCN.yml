 CCN_exavia: "Королева Екзавія"
 EXAVIA_NAVY_DESC:0 "§YДата рождения§!§L: 18-го сентября 968 в Дитрисиуме§!\n\n§YЗвание§!§L: Адмирал§!\n\n§YБиография§!§L: Поступив в военно-морскую академию в возрасте двадцати, через пять лет Эксавия выпустилась в звании лейтенанта. Амбициозная чейнджлинг тринадцать лет добивалась звания капитана и собиралась стать адмиралом. Однако Эксавия привлекла внимание УОБВ своим эксцентричным поведением и симпатиям к пони. Когда стало ясно, что она сочувствует делу Торакса, королева Кризалис приказала арестовать её и казнить.\n\nК счастью для Эксавии, восстание Торакса позволило ей скрыться от агентов УОБВ, перейдя на сторону повстанцев. Хотя ей по-прежнему не хватало опыта, чтобы получить звание адмирала или даже контр-адмирала, Эксавия всё равно была самым старшим и опытным флотским офицером в рядах сторонников Торакса.\n\nУ свежеиспечённого адмирала нет флота, но, несмотря на это, она полна решимости сделать всё необходимое для победы.§!\n\n§YАвтор портрета§!§L: Yuri/floppochkin§!"
