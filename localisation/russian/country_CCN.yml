 GENERAL_SIRICIDAE_DESC:0 "§YДата рождения§!§L: 2 апреля 977 года, Презепис§!\n\n§YЗвание§!§L: генерал-лейтенант§!\n\n§YБиография§!§L: Сирицида выросла в бедной рабочей семье в небольшом улье Презепис, который оказался в числе последних территорий, покорённых Кризалис во время объединительных войн. Местные чейнджлинги восторженно приветствовали решение королевы отменить кастовую систему, поэтому в юности Сирицида была преданной сторонницей Кризалис. Несмотря на тяжёлые времена, родители сумели скопить достаточно средств, чтобы отправить дочь в местное офицерское училище. Она специализировалась на тактике партизанской войны, надеясь однажды помочь "освободить Акорнидж от тирании Селестии". И хотя в 1002 году она не участвовала в штурме Кантерлота, Сирицида усердно вела агитацию среди чейнджлингов Акорниджа, склоняя их на сторону королевы.\n\nОднако судьба приготовила для молодого офицера иной поворот: вскоре она узнала, что Презепис посетит ветеран вторжения в Кантерлот, который расскажет о великом будущем, ждущем народ чейнджлингов. Услышав, как Торакс описывает своё идеалистическое видение дружбы между народами и примирения с Эквестрией – и всё это под мудрым и благосклонным правлением Кризалис, – Сирицида была очарована. Она примкнула к сторонникам Торакса, когда это движение ещё оставалось легальным, и искренне надеялась, что королева прислушается к голосу разума.\n\nУвы, этому не суждено было случиться. Когда тораксианцы оказались вне закона, Сирицида ушла в подполье. Её старые навыки ведения партизанской войны обрели новую цель: отныне она будет сражаться против тирании Кризалис, Триммеля и Кардо за Свободные Земли Чейнджлингов!§!\n\n§YАвтор портрета§!§L: kelKessel§!"
 CCN_ersatz: "Ларкс Ерзац"

