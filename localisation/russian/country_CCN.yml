 thoraxian_horus_victory: "§YТоракс виграв громадянську війну§!"

 politics_thorax_desc:0 "Изгнанный из всех ульев, Торакс стал одним из первых чейнджлингов, принявших идеи гармонии. Он искренне верил, что любовь можно обрести через дружбу и мирную торговлю с соседями. Постепенно его взгляды начали находить отклик у угнетённых чейнджлингов – тех, кто ощущал, что их жизни зазря растрачиваются ради милитаристской экспансии. Тем не менее, его идеи пока что остаются малораспространёнными. Королевы ульев презирают Торакса и считают гармонию опасной, вредной и противоестественной для чейнджлингов. Всё изменилось после его успешного возвращения из ссылки и победы в революции. Взяв на себя лидерство ульями, Торакс прилагает все усилия, чтобы привести свой народ к светлому будущему.\n\n§YАвторы портрета§!: AnaStaFury и BlakaSmoko"
 politics_king_thorax_desc:0 "Изгнанный из всех ульев, Торакс стал одним из первых чейнджлингов, принявших идеи гармонии. Он искренне верил, что любовь можно обрести через дружбу и мирную торговлю с соседями. Постепенно его взгляды начали находить отклик у угнетённых чейнджлингов – тех, кто ощущал, что их жизни зазря растрачиваются ради милитаристской экспансии. Тем не менее, его идеи пока что остаются малораспространёнными. Королевы ульев презирают Торакса и считают гармонию опасной, вредной и противоестественной для чейнджлингов. Всё изменилось после его успешного возвращения из ссылки и победы в революции. Взяв на себя лидерство ульями, Торакс прилагает все усилия, чтобы привести свой народ к светлому будущему.\nУсилия Торакса были высоко оценены как среди чейнджлингов и оленей, так и их правителей. Его брак с Вельвет стал символом успеха – как на политическом, так и на личном уровнях.\n\n§YАвторы портрета§!: AnaStaFury и BlakaSmoko"

