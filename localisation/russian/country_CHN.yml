 CHN_tank_sirius_mustang_desc:0 "Консолидированное Государственное Предприятие Сириус-Мустанг, образованное в результате слияния бывших эквестрийских компаний «Сириус Метал Уоркс» и «Мустанг Девелопментс» под управлением чейнджлингов. Теперь оно является флагманом ВПК Гегемонии и желает ассимилировать остальной эквестрийский бизнес и её промышленные компании."

