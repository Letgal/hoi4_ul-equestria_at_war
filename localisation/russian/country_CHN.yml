 CHN_equestrian_insurgency_category: "Повстанська діяльність проти чейнджлінґів"
 CHN_equestrian_insurgency_category_desc:0 "Возможно, мы победили в §CВеликой Войне§!, но наше завоевание континента далеко не завершено. §RГармоническое Сопротивление§!, а также мириады прочих повстанческих движений, угрожают нашему слабому контролю над побеждёнными пони и оленями. Пока это движение не будет подавлено, мы не можем быть уверены в контроле над Эквестрией и Эквусом."
