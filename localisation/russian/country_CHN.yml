 CHN_decentralised_fear_desc: "Іноді невинна брехня представляє суворішу небезпеку, ніж відверті погрози. У характерному прояві хитрості чейнджлінґів, УГБВ запустило «кампанію» масового набору до лав інфільтраторів. У дійсності ж наплив нових осіб, котрі працюють на УГБВ безпосередньо, залишилося відносно таке ж у порівняння з попередніми місяцями, але поні тим не менш підозрюють всякого, вважаючи їх чейнджлінґами під прикриттям. Це значно зменшило потребу в активному нагляді." # (&)
 CHN_decentralised_fear_better: "$CHN_decentralised_fear$"
 CHN_decentralised_fear_better_desc: "Іноді невинна брехня представляє суворішу небезпеку, ніж відверті погрози. У характерному прояві хитрості чейнджлінґів, УГБВ запустило «кампанію» масового набору до лав інфільтраторів. У дійсності ж наплив нових осіб, котрі працюють на УГБВ безпосередньо, залишилося відносно таке ж у порівняння з попередніми місяцями, але поні тим не менш підозрюють всякого, вважаючи їх чейнджлінґами під прикриттям. Подальші вдосконалення цієї стратегії [CHN_GetJachsRank]ом Яксом суттєво зменшило потребу в активному нагляді." # (&)
