# БЛОК: усе до цього
changelings_paxchrysalia.44.t:0 "Ячейка сопротивления в Винниаполисе уничтожена"
changelings_paxchrysalia.44.d:0 "Сегодня задолго до рассвета послышались выстрелы, когда отделения нашего гарнизона в Винниаполисе были мобилизованы по приказу королевской гвардии. С помощью информации, переданной инфильтраторами из главной ячейки сопротивления города, гарнизон одновременно напал на десятки различных укрытий и оперативных центров по всему городу. Бои были ожесточенными, схватки часто вспыхивали на улицах и между зданиями, так как панцергренадеры и бронетехника работали в тандеме с местным гарнизоном, чтобы уничтожить опорные пункты сопротивления и выманить эквестрийцев из их нор. Сопротивление отбивалось удивительно свирепо, они использовали украденное оружие чейнджлингов вроде противотанковые ружей и панцерфаустов, чтобы нанести значительный урон гарнизону, но к концу дня дым, поднимающийся из-за города, провозгласил нашу победу. Ячейка сопротивления в Винниаполисе была разгромлена, её выжившие члены разбежались, а контроль над городом стал крепким, чем когда-либо прежде.\n\nОднако главная цель операции — захват лидера сопротивления Трикси Луламун — не была выполнена. Кобыла смогла ускользнуть от наших войск после короткой стычки с панцергренадерами у главного укрытия сопротивления. При этом она нанесла нам немалый ущерб. Хотя мы искали беглянку повсюду, эти поиски ни к чему не привели и она, вероятно, к этому моменту уже покинула город. Похоже, что наш шанс поймать одного из лидеров эквестрийского сопротивления провалился, а в следующий раз она, несомненно, будет более осторожной и её будет куда труднее найти."
changelings_paxchrysalia.44.a:0 "Сегодня мы победили, но до конца войны ещё далеко."

changelings_paxchrysalia.844.t:0 "Месть сопротивления за Винниаполис"
changelings_paxchrysalia.844.d:0 "[This.GetNewspaperHeader]    Ячейки сопротивления, действующие на всём эквестрийском северо-западе, совершили серию террористических атак, направленных на наши гарнизоны, самой заметной из которых был особенно кровавый расстрел приезжих высокопоставленных чейнджлингов в театре Винниаполиса. Атаки, по-видимому, слабо координировались, и разведка УОБВ предполагает, что они, скорее всего, были ответом на наше кровавое умиротворение Винниаполиса месяц назад. Лидер повстанцев Трикси Луламун, которая, как полагают, залегла на дно после операций после развёртывания направленных против повстанцев операций чейнджлингов, похоже, вновь появилась, чтобы координировать это наступление. Граффити с изображением её знака были найдены на стенах рядом с местами атак гармонического сопротивления, а также и лозунги вроде «Великая и Могущественная» и «Эквестрия всё ещё сражается»."
changelings_paxchrysalia.844.a:0 "Гармоническое сопротивление — это сорняк, который не исчезнет, если его не выкорчевать с корнем."

changelings_paxchrysalia.45.t:0 "Больше ресурсов для инфильтраторов"
changelings_paxchrysalia.45.d:0 "— Я не знаю, как вы это сделали, но вы этого добились, — сказала [CHN_GetAlcippeRank] Алкиппе, стоя рядом с Яхсом, когда они вдвоём просматривали сводки, поступившие от агентов УОБВ в Винниаполисе. Тамошние оперативники обезопасили последнюю доставку припасов и прочих материальных средств, а теперь аккуратно работали над тем, чтобы в главную ячейку сопротивления проникло больше чейнджлингов.\n\n— Я и сам не знаю, — признался Яхс, хлопая своими крыльями. — Капитан Кардо предпочел бы пойти в лобовую атаку, но это не самое правильное решение.\n\n— Тут вы полностью правы. — Алкиппе прищурилась, перечитывая записи и отчёты оперативников УОБВ. — Ну и что теперь? У нас есть ещё несколько инфильтраторов наготове, готовых исполнить наши приказы. Следует ли нам послать их напрямую за Трикси или им стоит действовать более осторожно?\n\n— Нам не помешали бы ещё инфильтраторы в этой ячейке, — начал говорить Яхс, — но рано или поздно мы достигнем критического числа, где не сможем скрыть от лидеров ячейки тот факт, что они скомпрометированы. Нам стоит попытаться приблизить инфильтраторов к самой Трикси. Это даст нам более полную информацию о планах сопротивления и позволит следить непосредственно за ней. Это будет сложнее, но если получится..."
changelings_paxchrysalia.45.a:0 "Пусть инфильтраторы подберутся к Трикси."
changelings_paxchrysalia.45.b:0 "Главное — проникнуть в остальные части сопротивления в Винниаполисе, а не шпионить за самой Трикси."

changelings_paxchrysalia.46.t:0 "Резня Луламун"
changelings_paxchrysalia.46.d:0 "Яхс проснулся от звона бьющегося стекла. Ему снилось, что он находится среди пышной растительности, в ботаническом саду башни великой королевы, и в последние сонные мгновения он представлял себе, как застекленные окна в крыше разбиваются вдребезги, обнажая тропическую листву холодному северному дождю.\n\nВ темноте его спальни кто-то двигался. Перед разбитым окном стоял жеребец, а лунный свет отражался от сабли, которую он держал в зубах. Его задние ноги были напряжены, от готовился к прыжку, и Яхс подумал, что вряд ли он вовремя успеет дотянуться до пистолета на прикроватном столике. Но тут дверь распахнулась, и на пороге появился Алкиппе, освещенная светом из коридора. В следующее мгновение она выстрелила в пони из винтовки, которую она держала в своей магии. Звук выстрела оглушил и дезориентировал Яхса, и когда он смог видеть чётко, то увидел, как она обошла тело его несостоявшегося убийцы, чтобы занять огневую позицию перед разбитым окном.\n\n— Это Луламун и её головорезы, — сказала Алкиппе, прервав Яхса прежде, чем тот успел заговорить. — Они прижали нас у входа в казарму, но теперь я думаю, что это просто отвлекающий маневр. Учитывая... ну, вы понимаете. — Она указала на мёртвого жеребца. Выскользнув из постели, Яхс присел у окна рядом с Алкиппе.\n\n— Если мы выберемся отсюда живыми, напомни мне, чтобы я как-нибудь пригласил тебя выпить, — сказал он. — Не каждый вечер сама Трикси Луламун удостаивает тебя своим присутствием.\n\nАлкиппе довольно фыркнула. — Да, сэр. Она оказала вам немалую честь.\n\nВ ночном мраке послышались выстрелы. Толпа солдат армии в серой форме вперемежку с гвардейцами королевы во всём чёрном, собралась и устремилась к месту сражения. Но атака замедлилась, передние ряды рухнули под воздействием какой-то невидимой силы. Затем из тени появилась сама Трикси Луламун. Она двигаясь быстрее, чем любой пони, которого когда либо видел Яхс. Трикси уворачиваясь от пуль и взрывов и прорвалась сквозь контратаку чейнджлингов с помощью своих смертоносных заклинаний. Яхс в тревоге вскочил на копыта, рядом с ним Алкиппе смотрела в прицел своей винтовки со снайперским хладнокровием. Но им незачем было беспокоиться; во вспышке голубого дыма Трикси исчезла так же быстро, как и появилась, оставив за собой гору изуродованных тел чейнджлингов.\n\nТрикси оставила после себя визитную карточку. На следующее утро уборщик обнаружил разнообразные конечности и неровные куски хитина в мусорке казармы. Агенты УОБВ, которые заглянули чуть позже, подтвердили, что эти части тел принадлежали полудюжине высокопоставленных инфильтраторов, объявленных пропавшими без вести. Никто ничего не сказал; армия всё ещё пыталась справиться с последствиями рейда, но Яхс знал, что в ближайшее время он точно не пошлёт больше чейнджлингов за Трикси."
changelings_paxchrysalia.46.a:0 "Я рад, что она не пришла за мной лично."

changelings_paxchrysalia.47.t:0 "Погасить путеводную звезду"
changelings_paxchrysalia.47.d:0 "— Моя королева, я получил срочное известие, требующее вашего внимания.\n\nКоролева Кризалис лениво приподняла бровь, когда [CHN_GetJachsRank] Яхс приблизился к её креслу на балконе с видом на Кантерлот. — Что случилось, [CHN_GetJachsRank]? — спросила она, даже не потрудившись взглянуть на чейнджлинга. Если ей повезёт, то это, скорее всего будет какая-то бесполезная жалоба на то, что с пони обращаются слишком грубо и что гарнизону следует умерить свою прыть. Она чувствовала, что [CHN_GetJachsRank] всё сильнее начинает сочувствовать пони. Возможно, вскоре потребуется внести кое-какие изменения...\n\n— Это срочное сообщение от наших оперативников в Бэйлсе, — ответил ей Яхс, не подозревая о мыслях королевы. — Ключевая фигура сопротивления, чьё кодовое имя Путеводная звезда, будет лично присутствовать в городе для наблюдения за крупной операцией. Настоящее имя пони – Старлайт Глиммер.\n\nГлаза Кризалис расширились, и она встревоженно повернулась к Яхсу, вся во внимании. — Старлайт Глиммер будет в Бэйлсе? — спросила она, и на её морде появилась угрожающая ухмылка. — Личная ученица Твайлайт Спаркл? Это она стоит за всем этим хаосом? И где она сейчас? Я позабочусь о том, чтобы с ней разобрались. О! Я сама с ней покончу!\n\nЯхс сделал шаг назад и обменялся обеспокоенным взглядом с капитаном королевской гвардии Кардо, который тоже был поблизости. — Моя королева... это неразумно. Это слишком рискованно для вас делать такие вещи лично. Понадобится лишь один пони с винтовкой в нужном месте...\n\n— Чепуха! — Воскликнула Кризалис, вставая. — Старлайт Глиммер – протеже Твайлайт Спаркл. Она слишком опасна, чтобы оставить её в покое. Её необходимо остановить."
changelings_paxchrysalia.47.a:0 "Я лично убью эту шавку и покончу с наследием Твайлайт раз и навсегда!"
changelings_paxchrysalia.47.b:0 "Если подумать, то, возможно, на самом деле слишком рискованно лично делать это."

changelings_paxchrysalia.48.t:0 "Танец со звёздами"
changelings_paxchrysalia.48.d:0 "Дверь в подвал заброшенного здания с силой распахнулась, и двое пони, стоявших на страже рядом с ней, едва успели среагировать, как зелёная магия схватила их за горло и ударила головами друг о друга, немедленно вырубив их. — Выходи, Старлайт Глиммер! — Пропела королева Кризалис, шагнув в дверной проем и пустив в ход свою магию против других пони. В мгновение ока сразу восемь пони из сопротивления погибли или были смертельно ранены магией королевы. Их товарищи либо бежали, спасая свои жизни, или хватали своё оружие, пытаясь отступить на лучшие позиции, пока солдаты-чейнджлинги заходили в комнату, следуя за своей королевой.\n\nТо есть все, кроме одной пони. Розовая единорог стояла в центре комнаты с расстегнутой кобурой пистолета и сияющей вокруг рога голубой магией. Старлайт Глиммер презрительно ухмыльнулась королеве Кризалис и даже осмелилась подойти к ней поближе. — Королева чейнджлингов? Тут? Я должна быть польщена? — насмешливо спросила она, и её усмешка превратилась в ухмылку. — Ты лично захотела меня прикончить?\n\n— Я пришла покончить с наследием Твайлайт Спаркл, — прорычала королева Кризалис. — Её нация разорвана на клочки, а друзья рассеяны. Осталась лишь ты!\n\n— О, далеко не только я, — сказала Старлайт, хрустнув шеей и расправив свои плечи. — Но я не против сразиться с тобой от имени их всех."
changelings_paxchrysalia.48.a:0 "О, я так долго ждала этого момента."

changelings_paxchrysalia.848.t:0 "Магическая дуэль"
changelings_paxchrysalia.848.d:0 "Две кобылы немедленно бросились друг на друга, магические заклинания слетела с их рогов и разрывали комнату на части. Солдаты-чейнджлинги нырнули в укрытие и отступили назад, когда магический заряд пронзил воздух рядом с ними, а пони из сопротивления воспользовались этой возможностью, чтобы выбраться из здания. Зелёная магия Кризалис прорезала опорную колонну, разбрасывая бетонную шрапнель вокруг, а Старлайт попросту телепортировалась в безопасное место, прежде чем обломки могли зацепить её. Она ответила несколькими быстрыми вспышками энергии из своего рога, которые Кризалис отразила щитом. Потом Старлайт вытащила пистолет и выстрелила несколько раз в королеву чейнджлингов, двигаясь при этом. Кризалис бросилась к Старлайт Глиммер, обогнув колонну, и единорог попятилась, пытаясь держаться подальше, пока заклинания вылетали из её рога и наносили огромный ущерб окружающей комнате, одновременно поднимая завесу пыли. Но когда Кризалис пронеслась сквозь пыль, Старлайт Глиммер там уже не было видно.\n\n— Эй, дырявая! Не меня ищешь? — Старлайт появилась в дальнем конце комнаты с гордо поднятой головой, а Кризалис зарычала на неё.\n\n— Иди сюда, проклятая лошадь! — Крикнула Кризалис, уже несясь к ней через всю комнату. — Не можешь сбежать от меня?\n\n— Не могу? — Сказала Старлайт, когда её магия охватила две оставшиеся опорные колонны в центре комнаты. — Как думаешь, может нам стоит закопать топор войны? — Через мгновение Старлайт потянула магией колонны и они рассыпались, как только Кризалис прошла мимо них.\n\nЗдание содрогнулось, с потолка посыпалась пыль, и прежде чем Кризалис успела что-либо предпринять, всё здание рухнуло прямо в подвал, обрушив тысячи фунтов бетона и стали на королеву чейнджлингов и её солдат внутри."
changelings_paxchrysalia.848.a:0 "Неужели всё кончится именно так?!"

changelings_paxchrysalia.948.t:0 "Спасательная операция"
changelings_paxchrysalia.948.d:0 "Прошло несколько часов, прежде чем спасателям удалось найти её среди обломков, но уже довольно скоро королева Кризалис увидела свет над своей головой и услышала голоса чейнджлингов, как только прошло её оцепенение. — Мы нашли её! — воскликнул какой-то чейнджлинг, и она закашлялась, когда черные передние копыта обвились вокруг её ног и осторожно вытащили её на свободу. Её зрение было затуманено, а рог болел от мощного заклинания щита, которое и помогло ей спастись от обрушения целого здания на голову. Но она была жива, и это было всё, что имело значение. Какой-то чейнджлинг предложил ей немного воды, которую она с жадностью приняла, а потом спасатели повели её прочь от зоны бедствия под радостные приветствия солдат окружения.\n\nОни усадили её на безопасном расстоянии и начали задавать вопросы, но Кризалис должна была узнать ответ на собственный вопрос. — Старлайт... Глиммер, — прохрипела она, ведь её горло пересохло и болело от долгого вдыхания бетонной пыли. — Она... мертва?\n\nК сожалению, чейнджлинги отрицательно покачали головами. — Старлайт Глиммер и остальные члены сопротивления Бэйлса сбежали после обвала, — сказал один из них. — Мы больше беспокоились о том, чтобы выкопать вас, чем о том, чтобы преследовать партизан. Вам нельзя напрягаться несколько недель, моя королева. Ваш экзоскелет и панцирь получили повреждения.\n\nКризалис застонала и повернула своё туловище в разные стороны, чувствуя, как сломанные пластины её панциря скрежещут друг о друга. — Я... да... ты прав, — призналась она, морщась от боли. Когда прибывшие на место происшествия медики быстро обработали остальные её раны, Кризалис могла лишь хмуро смотреть на город вокруг себя. Она тут же решила, что ненавидит город Бэйлс, а ещё сильнее – кобылу, что уронила на неё одно из зданий этого города."
changelings_paxchrysalia.948.a:0 "Теперь мне придётся отращивать новый панцирь..."

changelings_paxchrysalia.49.t:0 "Победа над сопротивлением"
changelings_paxchrysalia.49.d:0 "После значительного времени и усилий, потраченных на тщательное внедрение инфильтраторов по всему гармоническому сопротивлению, армия и гвардия королевы вместе с УОБВ сегодня нанесли серию сокрушительных ударов по силам партизан всего эквестрийского сердца и северо-запада. Информация о планах партизан была передана военным, которые координировали атаки с агентами УОБВ, чтобы громить и уничтожать ячейки сопротивления, пока те пытались выполнять свои цели. Убежища ячеек подвергались штурмам, а диверсантов и террористов встречала подготовленная оборона и засады, которые прорезали их ряды как горячий нож через масло. В течение нескольких часов большая часть региональной сети сопротивления была объята хаосом или уничтожена. Некоторые изолированные партизанские группы всё ещё сражались, пытаясь спастись, но по мере продвижения наших сил их число неуклонно сокращалось.\n\nОднако, несмотря на все наши успехи, лидерам гармонического сопротивления, двум кобылам по имени Трикси Луламун и Старлайт Глиммер, удалось избежать этой кровавой бойни. Их местонахождение в настоящее время неизвестно, но считается, что они направились на восток, чтобы избежать хватки УОБВ и Весалиполиса. И всё же, несмотря на все их усилия, неважно, насколько далеко они убегут, так как само гармоническое сопротивление разрушено и вряд ли скоро оправится от этого тяжёлого удара. Сегодня мы можем отпраздновать нашу хорошо выполненную работу и поаплодировать отличной координации между различными подразделениями, которая и сделала эту победу возможной."
changelings_paxchrysalia.49.a:0 "Мы отрубили все головы этой гидре одним решительным ударом."

changelings_paxchrysalia.50.t:0 "Засада!"
changelings_paxchrysalia.50.d:0 "Армия работала, тесно сотрудничая с УОБВ, для проведения операции по обширной зачистки всей Эквестрии от сопротивления, но как раз в тот момент, когда мы уже собирались начать операции, сопротивление нанесло свой неожиданный и мощный удар. Вокруг наших плацдармов взрывались бомбы, пехотные роты попадали в засады на пути к известным укрытиям сопротивления, а также наши склады снабжения подвергались прямым атакам, что снижало возможности реагирования местных гарнизонов. Даже наша Великая Королева не избежала опасности: каким-то образом сопротивление завладело маршрутом её следования в Бэйлс для наблюдения за антипартизанскими операциями и устроило засаду на её конвой. Хотя Королеве Кризалис удалось уйти невредимой, остальная часть конвоя была части рассеяна и уничтожена, а оставшаяся часть отступила.\n\nПосле анализа всей серии неудач, приведших к краху наших антипартизанских операций, сотрудники УОБВ выдвинули предположение, что предыдущая неудача с размещением инфильтраторов возле лидера сопротивления Трикси Луламун предупредила сопротивление о наших планах, и поэтому они сместили свой фокус на противодействие нашим будущим операциям. Это полная катастрофа, и сопротивление, несомненно, будет извлекать немалую выгоду из хаоса в ближайшие недели."
changelings_paxchrysalia.50.a:0 "Всех офицеров УОБВ нужно отдать под суд за некомпетентность."

changelings_paxchrysalia.51.t:0 "Анти-партизанская стратегия"
changelings_paxchrysalia.51.d:0 "— Эти неудачи не должны остаться безнаказанными! — Прорычал капитан королевской гвардии Ласин Кардо, расхаживая взад и вперёд перед столом [CHN_GetJachsRank]а Яхса. — Мы должны были заставить Трикси Луламун и Старлайт Глиммер подчиниться нам. Или, хотя бы, нам нужно всадить пулю в одну из них!\n\n— Они неуловимы, надо отдать им должное в этом, — сказал Яхс, пожимая плечами. — Мы были близки, но иногда нам просто не хватает удачи.\n\n— Забудь об удаче! — Воскликнул капитан Кардо. — Мы же чейнджлинги! Мы сами создадим себе удачу! — Капитан порылся в кармане жилета и положил на стол Яхса бумагу с королевской печатью. — У меня есть разрешение королевы мобилизовать всю армию, чтобы сокрушить это сопротивление. В каждом городе, в каждом городке, на каждой ферме разместятся солдаты, которые будут следить за соблюдением и исполнением наших законов. Во всей Эквестрии не останется ни одного места, где эти партизаны могли бы укрыться. Мы используем всё, что у нас есть, всю армию, если понадобится, чтобы выследить этих предателей и повесить их всех до единого!\n\nЯхс мог лишь недоверчиво смотреть на чейнджлинга перед собой. — Вы же понимаете, насколько невозможен этот приказ, капитан? — спросил он. — Такое просто невозможно выполнить. Нам придётся прекратить все операции по внедрению только для того, чтобы получить достаточное количество чейнджлингов для выполнения этого заказа, и нет совершенно никаких гарантий, что это сработает.\n\n— Фортуна благоволит смелым, [CHN_GetJachsRank], — настаивал на своём Кардо. — А армию нельзя не назвать смелой."
changelings_paxchrysalia.51.a:0 "Как скажешь, дружище."
changelings_paxchrysalia.51.b:0 "Ладно, мы будем смелыми, но на моих условиях."

changelings_paxchrysalia.52.t:0 "Невероятная трата ресурсов"
changelings_paxchrysalia.52.d:0 "— Мы ничего не добились, капитан Кардо. На самом деле даже большего, чем ничего. Мы потратили на этот фарс значительные ресурсы и рекрутов. — [CHN_GetJachsRank] Яхс изо всех сил старался сохранить невозмутимое выражение лица, когда противостоял капитану королевской гвардии в его кабинете. Там, судя по роскошным украшениям, висевшим на стенах, Ласин Кардо был больше сосредоточен на том, чтобы выглядеть как можно лучше, а не на выполнении своего долга в меру своих способностей. — Мы не только нанесли немалый ущерб армии, но и подавляющее количество солдат по всей Эквестрии не смогло сделать ничего иного, кроме как напугать сопротивление и заставило его спрятаться. Мы не столько устранили проблему, сколько немного спрятали её с глаз долой.\n\n— И всё же партизанская деятельность прекратилась, не так ли? — Возразил Ласин Кардо, приподняв одну бровь. — За последние три месяца мы отметили самые низкие темпы атак партизан с момента оккупации страны. Три месяца эффективной полицейской работы наконец-то решили эту проблему.\n\n— Мы ничего не решили, капитан. Мы только заставили ячейки сопротивления затаиться. — Яхс бросил на стол Ласина папку с отчетами своих оперативников, работавших в полевых условиях. — Как только сопротивление осознало, что мы делаем, они отправили всем своим агентам сигнал затаиться, пока мы не ослабим давление. Сейчас мы находимся в самом разгаре вывода войск армии, и мои инфильтраторы уже сообщают, что партизаны снова начинают готовиться к боевым действиям. Да и проблема не только в этом. Партизаны использовали это время, чтобы набрать новых солдат. Как только наши войска будут выведены, проблема вернется, и даже в большей степени, чем когда-либо прежде.\n\nКапитан Кардо на мгновение задумался над этим, пока дым от кончика его сигареты тянулся к потолку тонкой струйкой. — Это вы, [CHN_GetJachsRank], считаете так? Или объективный факт? Потому что я считаю, что эта операция была полным и абсолютным успехом.\n\n— Это... моё мнение, капитан, — сказал Яхс, прищурившись. — Мнение, сформированное на основе фактов и простых рассуждений.\n\n— Ну что ж, — сказал Кардо с улыбкой. — Тогда моё мнение нравится мне больше вашего."
changelings_paxchrysalia.52.a:0 "Вера в ложь, отличающуюся от реальности, не поможет, бесполезная ты тля."

changelings_paxchrysalia.53.t:0 "Золотой чейнджлинг королевской гвардии"
changelings_paxchrysalia.53.d:0 "[CHN_GetJachsRank] Яхс налил себе стакан виски и устроился в удобном кресле, которое заказал для своего кабинета. День подходил к концу, и, к счастью, в Кантерлоте всё немного успокоилось, так что у него было не так много работы, как обычно. Поэтому сейчас было идеальное время для стакана выпивки и небрежного просмотра файлов некоторых чейнджлингов, рекомендованных для продвижения по службе. Это была приятная перемена попыткам потушить пожары по всей Эквестрии.\n\nОднако, открыв папку из самого верха стопки, он заметил, что на ней была одобрительная печать самой королевской гвардии. Нахмурившись, Яхс внимательно изучил досье молодого лейтенанта, пробегая глазами по составленным для него заметкам. Судя по всему, этот молодой лейтенант, жук по имени Глоссус Сикарус, был образцовым офицером-чейнджлингом: патриотичным, лихим, смелым и, по общему мнению, успешным и компетентным. Но были и другие записки, сделанные чейнджлингами не из королевской стражи. Лейтенант Сикарус имел репутацию офицера, смелого до безрассудства, а также был известным радикальным сторонником превосходства чейнджлингов. Однако внимание Яхса привлекла нехватка информации о деятельности Глоссусса в качестве инфильтратора в тылу эквестрийцев в последние дни войны. Отчёты о важных действиях просто отсутствовали, а те, что имелись, были сильно отредактированы.\n\nЯхс вздохнул. Пропавшая информация выглядела явно подозрительно, но чего ещё можно ожидать от королевской гвардии?"
changelings_paxchrysalia.53.a:0 "Дайте лейтенанту испытательный срок на 90 дней, прежде чем мы снова рассмотрим его дело."
changelings_paxchrysalia.53.b:0 "Он явно хорош, если королевская гвардия так сильно хочет заполучить его."

changelings_paxchrysalia.54.t:0 "Глоссус Сикарус, мясник Солт-Лик-Сити"
changelings_paxchrysalia.54.d:0 "Сегодня днем до нас дошли донесения о ситуации в Солт-Лик-Сити. В течение последних месяцев армия проводила антипартизанские акции в городе и его окрестностях. Солт-Лик-Сити является соляристским оплотом, полных пони, которые видят в Селестии не только свою принцессу, но и свою богиню, и этот город рассадником сопротивления нашей власти с момента своей оккупации.\n\nНедавно повышенный в должности в королевской гвардии, оберст Глоссус Сикарус был направлен в город для наблюдения за операциями по борьбе с повстанцами. По его доктрине не следует щадить всех, кто выступает против власти нашей королевы, поэтому оберст Сикарус потребовал, чтобы все лидеры партизан города сдались гарнизону чейнджлингов в течение двенадцати часов. После этого он объявил весь центр города заложниками армии, на тот случай, если гармоническое сопротивление не подчинится.\n\nЕго ультиматум был отвергнут, после генерал Сикарус вывел всех солдат-чейнджлингов из центра города, заблокировать главные магистрали, а потом немедленно начал обстреливать город из тяжёлой артиллерии, размещенной в пригородах. Беспорядочный обстрел продолжался несколько часов подряд. Жертвы среди гражданского населения, как ожидается, будут исчисляться сотнями, если не тысячами, а ущерб самому городу даже по предварительным оценкам будет гигантским. Обстрел оберста прекратился лишь тогда, когда его коллеги из армии отказались доставить ему больше боеприпасов.\n\nБольшая часть Солт-Лик-Сити лежит в руинах, а многие его кварталы были систематически сровнены с землёй залпами снарядов. Часть партизанских отрядов, всё ещё остававшихся внутри города, попытались сдаться королевской гвардии, чтобы избавить Солт-Лик-Сити от ещё большего ущерба, но некоторым удалось прорвать блокаду при поддержке местных жителей. После того, как эта информация распространилась, многие пони на территориях вокруг Солт-Лик-Сити взялись за оружием. Даже некоторые генералы армии потребовали, чтобы Сикарус был немедленно понижен в должности или, по крайней мере, подвергнут дисциплинарному взысканию. Королевская гвардия решительно воспротивилась таким действиям, утверждая, что Сикарус является воплощением верного и ревностного солдата-чейнджлинга. Когда его попросили прокомментировать ситуацию, генерал Сикарус лишь заметил, что «Все до единого пони в этом отвратительном городе являются предателями. Я сожалею лишь о том, что армия не дала мне достаточно снарядов, чтобы закончить работу»."
changelings_paxchrysalia.54.a:0 "В любви, как на войне, все средства хороши?"

changelings_paxchrysalia.55.t:0 "Меч и щит"
changelings_paxchrysalia.55.d:0 "— Над чем вы работаете, [CHN_GetJachsRank]?\n\nЯхс оторвался от составления приказа и увидел, что в дверях его кабинета стоит [CHN_GetAlcippeRank] Алкиппе. Он моргнул, потянулся и закряхтел, разминая мускулы, которыми не пользовался весь день. — Алкиппе. Я не слышал, как вы постучали. — Он махнул копытом в сторону своего стола. — Взгляните.\n\nАлкиппе шагнула в кабинет Яхса и, приподняв брови, приблизилась к стопке бумаг. Она подняла одну из них своей магии и начала читать. — Sturmjäger-Abteilung? — спросила она, склонив голову набок и глядя прямо на [CHN_GetJachsRank]а. — А это ещё зачем?\n\n— Эквестрия разделена на различные комиссариаты, и держать войска вдоль жёстких границ просто невозможно, учитывая угрозу со стороны партизан, с которой мы имеем дело, — объяснил Яхс. — Поэтому эти силы быстрого реагирования будут размещены в железнодорожных узлах по всей стране, откуда они смогут быстро развернуться в любом нужном месте. В борьбе с сопротивлением нужно более быстрое, а не тяжелое копыто. — Он вздохнул, взял ручку и принялся писать на листе бумаги. — К сожалению, создание чего-то вне рамок обычной структуры армии отнимает много времени и, мягко говоря, весьма утомительно. Скорее всего, я буду работать над этим всю ночь напролет.\n\n— Возможно... Я могу помочь? — Сказала Алкиппе со слабой улыбкой. — Я могу вам чем-нибудь помочь, Яхс?\n\n— Я уверен, что мы сможем что-нибудь придумать, — сказал Яхс, радуясь компании другого чейнджлинга. — Подвинь себе стул, и мы можем начать.\n\nАлкиппе сделала так, как её попросили. Она поставила свой стул рядом с креслом Яхса, максимально эффективно используя ограниченное пространство. Яхс дал ей несколько официальных писем, чтобы она проверила их на предмет грамматических ошибок и опечаток, и плечом к плечу два чейнджлинга работали до глубокой ночи.\n\nНе то чтобы кто-то из них возражал против этого."
changelings_paxchrysalia.55.a:0 "Как две свечи, пылающие во мраке самых тёмных ночей."

changelings_paxchrysalia.56.t:0 "Последний ужин"
changelings_paxchrysalia.56.d:0 "Мэр Санни Скай стоял за трибуной и ждал.\n\nОн ждал с самого раннего утра. По правде говоря, он ждал этого гораздо дольше. С тех пор как в Хоуп Холлоу пришла весть о том, что война проиграна и Эквестрия официально сдалась, он ждал этого самого дня. Но не с предвкушением и волнением, о нет. Со страхом. Хоуп Холлоу был так далеко от линии фронта, что боевые действия не коснулись этой местности. Хотя несколько пони отправились воевать, город был слишком мал, чтобы рекрутеры навещали их. Долгое время единственной вещью, напоминавшей Хоуп Холлоу о войне, которая велась далеко от него, были радиосообщения из Кантерлота, пока они не умолкли.\n\nНо всё изменилось. В город прибыли чейнджлинги. Они желали собрать сведения из переписи населения и получить клятву верности от мэра, от него самого. Его долгом было оказать им теплый прием, изобразить свою самую яркую улыбку и лизать сапоги завоевателей. От него ожидали послушания и были готовы вознаградить за верность. Хотелось надеяться, что если он будет умиротворять чейнджлингов, то с пони Хоуп Холлоу будут справедливо обращаться. Отбросив остатки собственного достоинства, он сделает самое малое, чтобы они были в безопасности.\n\n— Санни?\n\nСанни Скай подпрыгнул, испуганное внезапным обращением. Он оглянулся через плечо и увидел, что Петуния Петалс беспокойно трёт копытом о свою ногу. — Санни... они всё ещё идут сюда?\n\n— Да, — сказал он, печально кивая. — Они скоро будут здесь. Должны быть.\n\n— О. — Петуния заёрзала на месте, потом прочистила горло. — Ну, пока ты ждёшь их, не желаешь ли чего-нибудь поесть, дорогой? Ток Врэнч поджарила кукурузу в магазине, пытаясь сделать побольше хорошей еды, прежде чем придут жуки и заберут её. Вы же были здесь с самого утра...\n\nМэр заколебался, не желая покидать свой пост в случае появления жуков, но у желудка было другое мнение. Он вообще ел что-нибудь на обед? Вероятно, быстрый перерыв не помешает. Наконец он сдался и отошел от трибуны. — Ладно, Петуния, звучит неплохо. Я думаю, что мне не помешает немного поесть."
changelings_paxchrysalia.56.a:0 "Последняя встреча друзей перед самым концом."

changelings_paxchrysalia.856.t:0 "Пусть надежда и слаба..."
changelings_paxchrysalia.856.d:0 "Санни Скай последовал за своей женой через весь город, в своих мыслях он всё ещё обдумывал грядущий приезд чейнджлингов, не в силах забыть о них ни на секунду. Петуния почувствовала его неловкость и потерлась плечом о его плечо. — Не думай об этом, дорогой, — сказала она, покачав головой. — Нас впереди ждёт ещё много печали и мрака, но сегодня вечером мы можем притвориться, что ничего об этом не знаем. У нас есть наши друзья, пони из Хоуп Холлоу, и мы сможем быть вместе в последний раз, прежде чем появятся жуки. Они не могут забрать это у нас, разве ты не понимаешь?\n\n— Да... да, наверное, ты права, — признал Санни Скай. Он изо всех сил постарался отодвинуть свои тревоги как можно дальше, и запах жареной кукурузы, доносившийся из лавки Ток Врэнч, помог ему, так как у мэра сразу потекли слюнки. — Ух-ты... пахнет просто потрясающе.\n\n— А на вкус ещё лучше, — сказала Петуния, чмокнув его в щеку, прежде чем рысцой забежать внутрь. Санни рассеянно улыбнулся и последовал за своей женой в мастерскую, как раз чтобы услышать, как она воскликнула — Эй, я привела его!\n\nРаздался хор одобрительных возгласов и смешков, успокоивший Санни Скай. Он прошёл в заднюю часть мастерской, где множество знакомых лиц собрались вокруг длинного верстака, превращенного теперь в стол. Он увидел Ток Врэнч и Керфаффл, мистера и миссис Хуфингтон, Муди Рута и даже двух лихих пегасов-летунов, Барли и Пикли Баррел, а также их родителей. Они и ещё многие повернулись к нему, когда Санни приблизился, и счастливые маленькие улыбки украсили их морды. Если бы не тихая атмосфера, повисшая в помещении, то можно было бы притвориться, что это не последняя встреча друзей перед тем, как жизнь изменится навсегда. Почти наверняка.\n\n— Всем привет, — сказал Санни, робко позволив Петунии усадить себя в центре стола. — Здесь хорошо пахнет.\n\n- Ой, да заткнись ты, — сказала Ток Врэнч, закатив глаза и ставя перед ним тарелку с жареной кукурузой и картофельным пюре. — Может, я и кобыла на все копыта, но стряпня — это точно не моё ремесло.\n\n— Я позволю себе не согласиться, — сказала Керфаффл, хихикая. — Может быть, тебе стоит подумать о смене профессии?\n\nПосле этого раздался ещё один сердечный смех, и это радость помогла всем присутствующим немного позабыть своё глубинное внутреннее напряжение. Санни видел это по тому, как Ток переминалась с копыта на копыто, по тому, как Керфаффл вспушивала свои крылья, по тому, как Петуния не отходила от его боку, по тому, как близнецы Баррелы каждые несколько минут останавливали свою игру, чтобы оглядеться, будто что-то услышав. Никто не знал, что ждет город Хоуп Холлоу в будущем, и не питал никаких иллюзий, что жить будет лучше, чем под властью Кантерлота. Но они должны были пройти через это вместе. В этом Санни Скай не сомневался.\n\nПоэтому он схватил стакан сидра, стоявший перед ним, и поднял его в воздух. — Эй, народ. Позабудем о жуках. Давайте сделаем эту ночь такой, чтобы её хотелось помнить!"
changelings_paxchrysalia.856.a:0 "...её так просто не сломить."

changelings_paxchrysalia.57.t:0 "Генеральный план Лебенсраум"
changelings_paxchrysalia.57.d:0 "[CHN_GetJachsRank] Яхс нырнул в закусочную на углу Мейн-Стрит, в его ушах до сих пор звенели звуки парада, мимо которого он проходил. Королева Кризалис вернулась в Кантерлот и, конечно же, приказала устроить ещё один парад, чтобы возвестить о своём возвращении в город. К счастью, Яхс смог свалить планирование этого парада на Алкиппе, у которой уже был целый шкаф, полный описаний всех приготовлений, которые город должен был проводить каждый раз, когда королева возвращается, чтобы понежиться в лучах славы своего триумфа в Эквестрии. У Яхса были более важные дела, чем потакать самолюбию его королевы. Например, не дать её проклятой стране развалиться на части.\n\nК счастью, чейнджлинг, которого искал Яхс, уже сидел в закусочной. Генерал-оберштабсарцт Марсилио с праздным интересом наблюдал за парадом через окно и медленно перевел взгляд на Яхса, когда тот сел напротив него. — [CHN_GetJachsRank], — кивнул Марсилио. — Надеюсь, у вас всё хорошо?\n\n— Всё так же, как и обычно, — отмахнулся Яхс. — Я всё переживу. Итак, повторите ещё раз что нам нужно сделать?\n\n— Мы должны создать шестой великий улей, — сказал Марсилио, открывая свой портфель и кладя перед Яхсом папку с документами, чтобы тот мог их внимательно изучить. — Вы прекрасно знаете, как я уверен, что вблизи старой границы есть города, в которых ещё до Великой войны жило немало чейнджлингов. Наша Великая Королева хочет, чтобы мы сделали ещё один шаг вперед и выбрали тот, на котором сосредоточим наши усилия. Моя команда и я рассматривали разные варианты и остановились на двух вариантах: Акорнидж и Ванхувер. Там уже проживает немало чейнджлингов и, если мы приложим ещё чуть-чуть усилий, то эти города можно «колонизировать», чтобы большинство населения там составляли этнические чейнджлинги."
changelings_paxchrysalia.57.a:0 "Ладно, так в чём же подвох?"

changelings_paxchrysalia.857.t:0 "Повесть о двух городах"
changelings_paxchrysalia.857.d:0 "— Подвох заключается в том, что Ванхувер и Акорнидж — два совершенно разных города, — сказал Марсилио. — Акорнидж – это город, но весьма небольшой. В нём проживает немало чейнджлингов, которые уже неплохо интегрированы в город. Точнее так было до войны, но позже их вытеснили жители-пони, поскольку война тянулась довольно долго, несмотря на то, что мы быстро оккупировали этот город в начале конфликта. В городе немало места для строительства, и я слышал, что климат там весьма умеренный и приятный. Это идеальное место для строительства нового улья.\n\n— Тогда почему мы рассматриваем вариант Ванхувера? — Яхс спросил, приподнимая бровь.\n\n— Ну, Ванхувер – один из крупнейших городов Эквестрии, — объяснил Марсилио. — Он имеет немалый военно-промышленный потенциал, что делает его невероятно ценным для нашего флота. Это также самый престижный из двух городов. Представьте себе, что мы смогли бы превратить Ванхувер, эквестрийскую крепость, в шестой большой улей. — Но энтузиазм Марсилио быстро угас. — Однако всё не так просто. Да, популяция чейнджлингов там больше, чем в Акорнидже, но в процентном отношении их меньше. Они также слабее интегрированы в сообщество, чем чейнджлинги в Акорнидже. Большинство чейнджлингов живут в эксклавах и общинах, окружающих город, а не в самом городе. Интеграция его может оказаться сложной и дорогостоящей, учитывая огромное количество пони, живущих в нём. Превратить чейнджлингов в этом городе в этническое большинство может оказаться для нас слишком сложной задачей... однако это ваши земли, которыми вы можете распоряжаться по своему усмотрению. Кризалис доверила эту обязанность вам, а не мне и моей команде. Поэтому, прежде чем я начну что-то делать, мне нужно получить ваше одобрение по одному из проектов."
changelings_paxchrysalia.857.a:0 "Из Ванхувера получится великолепный шестой улей!"
changelings_paxchrysalia.857.b:0 "Наверное, нам лучше перестраховаться."

changelings_paxchrysalia.58.t:0 "Колонизация Ванхувера"
changelings_paxchrysalia.58.d:0 "...и таким образом вполне уместно, чтобы Ванхувер стал новейшей драгоценностью в короне Гегемонии.\n\nКризалис широко ухмыльнулась, когда Ликитус, исполнительный директор Вонунгсабтейлунг, показал последний слайд своей презентации. — Мне это нравится, — сказала королева, наклоняясь вперед и хлопая копытами. Ванхувер станет шестым великим ульем Гегемонии. Мы ещё больше унизим проклятых принцесс, когда заставим их смотреть издалека на то, как мы превращаем один из величайших городов пони в огромный и современный улей. Это будет похоже на начало новой эры. На начало эры королевы. — Кризалис ещё немного посмеялась про себя, а затем лениво откинулась на спинку трона. — Итак, когда мы сможем начать?\n\n— Э-э-э... Моя королева, — вмешался один из королевских советников, прежде чем Ликитус успел ответить. — Ванхувер – это огромный мегаполис пони. Эксклавы чейнджлингов, которые жили вокруг него до войны, находятся на окраинах города, полностью изолированные от пони. Мы должны вывезти так много пони, перестроить очень много районов города, а затем покрыть расходы на перемещение чейнджлингов в Ванхувер и перестройку города... Я не знаю, сможем ли мы провести такую операцию.\n\n— Знать это – вот твоя работа, — рявкнула на него Кризалис, сурово нахмурившись. — Ванхувер станет следующим великим ульем. Это БУДЕТ сделано. Тут нет места спорам. — Затем Кризалис снова обратила своё внимание на Ликитуса. — Сделай так, чтобы это было сделано."
changelings_paxchrysalia.58.a:0 "Шестой великий улей будет стоить расходов."

changelings_paxchrysalia.59.t:0 "Колонизация Акорниджа"
changelings_paxchrysalia.59.d:0 "— Акорнидж? Из всех возможных мест вы выбрали это захолустье?\n\nКоролева Кризалис сердито уставилась на чейнджлингов, выстроившихся перед ней, в том числе и [CHN_GetJachsRank]а Яхса и генерал-оберстабсарцта Марсилио. Двое офицеров армии, а также чейнджлинги из жилищного департамента нервно сделали шаг назад, когда Кризалис сердито посмотрела на них. — Это был... наиболее подходящий кандидат, — отважился заговорить со своей разъяренной королевой Яхс. — В Акорнидже уже живет большое сообщество чейнджлингов, которые составляют значительную часть его населения. Он также близко к границе, и его можно значительно дешевле и проще превратить в настоящий улей чейнджлингов. Это самый логичный выбор.\n\n— Это бесполезная глубинка, вот что это такое! — Воскликнула Кризалис. — Почему вы не выбрали один из великих городов Эквестрии? Почему не Ванхувер или Бэйлс? Даже из Понивилля получился бы лучший шестой улей, чем из этого Акорниджа!\n\n— Просто доверьтесь нам, моя королева, — взмолился Марсилио. — Мы уже разобрались с логистикой, у нас есть чёткий план действий. Если вы доверитесь нам, мы сможем сделать Акорнидж самым великолепным из всех ульев Гегемонии. Мы сделаем его жемчужиной короны Гегемонии, ульем, который затмит все остальные. Даже сам Весалиполис. — Он умоляюще склонил голову. — Просто доверьтесь нам, моя королева, и дайте немного времени. И вы не будете разочарованы.\n\nКазалось, прошла целая вечность, прежде чем Кризалис наконец вздохнула и взмахнула свои копытом. — Прекрасно, Марсилио. Можешь рассчитывать на моё терпение и доверие... на сегодня. Но если вы не справитесь с поставленной задачей, то готовьтесь встретиться с не самыми приятными последствиями. — Она наклонилась чуть ближе, угрожающе ухмыльнувшись. — Смекаете?"
changelings_paxchrysalia.59.a:0 "Конечно, моя королева."

changelings_paxchrysalia.60.t:0 "Расовые волнения в Ванхувере"
changelings_paxchrysalia.60.d:0 "— Хаос и анархия! Да что вы там творите в Ванхувере?!\n\nКризалис ударила копытами по столу перед собой, заставив остальных присутствующих чейнджлингов отодвинуть свои стулья на безопасное расстояние. Ликитус осмелился заговорить с королевой. — Этот проект доставляет немного больше... хлопот, чем мы первоначально предполагали, — начал исполнительный директор Вонунгсабтейлунг. — Кто-то, не умеющий держать язык за зубами, проболтался, что мы планируем депортировать пони из культурного района города и разрушить находящиеся там, чтобы построить там надлежащие жилища чейнджлингов, и новость распространилась по городу, как лесной пожар. Наши войска изо всех сил пытаются сдержать беспорядки, но со всего города поступают сообщения о расправах над чейнджлингами и пони. Нам пришлось выделить дополнительные силы для защиты сообществ чейнджлингов, расположенных на окраинах города. — Затем, тяжело сглотнув, он нервно продолжил. — Моя королева... это уже выходит из-под контроля. Может быть, нам лучше вообще отказаться от этого проекта?\n\n— Лучше отказаться? Ты что, идиот? — Крылья Кризалис затрепетали от ярости. — Сдаться – значит признать своё поражение. А я не потерплю поражения в этом вопросе. Ванхувер станет шестым великим ульем, потому что я требую этого!"
changelings_paxchrysalia.60.a:0 "Мы сделаем это во имя королевы."
changelings_paxchrysalia.60.b:0 "Мы должны немедленно прекратить впустую тратить силы!"

changelings_paxchrysalia.61.t:0 "Скучное совещание по бюджету"
changelings_paxchrysalia.61.d:0 "— Благодарю всех присутствующих за то, что вы согласились принять участие в этом срочном совещании по составлению бюджета, — начал Ликитус, оглядывая тесный кабинет, доверху заполненный офицерами, промышленниками, бюрократами и даже несколькими членами королевской гвардии. — Я сразу же перейду к делу: Ванхувер – это катастрофа. Мы потратили очень много средств, но даже сейчас вероятность того, что наша колонизация успешно завершится, крайне мала. В городе просто живёт очень много пони, и их сопротивление нашим усилиям слишком сильно. И вся наша деятельность лишь способствует росту сопротивления в городе и прилегающей к нему сельской местности. Я хочу сказать, что мы остановимся на достигнутом прогрессе и оставим всё как есть.\n\n— А как же королева? — спросил один из офицеров королевской гвардии. — Этот город же должен был стать её шестым великим ульем.\n\n— Я удивлюсь, если наша королева ещё помнит о том, что мы собирались это делать, — сказал Ликитус. — Честно говоря, у неё память как у мухи-одноднёвки. И я надеюсь, что эти слова не покинут эту комнату. — В ответ раздался хор лёгких смешков, так что Ликитус кивнул и поднял копыто. — Итак, все, кто выступает за то, чтобы тихо отложить проект колонизации Ванхувера, просто скажите «Да»."
changelings_paxchrysalia.61.a:0 "Да!"

changelings_paxchrysalia.62.t:0 "Колония-улей Альвариум"
changelings_paxchrysalia.62.d:0 "[CHN_GetJachsRank] Яхс улыбнулся и восхищённо взглянул на парад, проходящий за его окном. Прошёл почти целый год, полный тяжёлой работы, но они справились. С помощью армии и Вонунгсабтейлунга город Акорнидж был превращен в шестой великий улей Гегемонии, и сами результаты были не менее выдающимися. Целые кварталы были снесены и перестроены в соответствии с требования чейнджлингов. А также по всей стране, и особенно в рядах армии, нашлось множество пышущих энтузиазмом переселенцев-патриотов, которых привлекали в этот город толпами обещания свободного и просторного жилья. Также относительно небольшой размер Акорниджа сделали депортацию местных пони, которые считались ненадёжными эквестрийским лоялистами, простой и лёгкой. Город стал настоящим городом чейнджлингов, и этот факт ещё больше укрепился, когда сама королева Кризалис проехала по главной улице во главе триумфального шествия и приняла официальный сюзеренитет над новым ульем в качестве его королевы.\n\nЯхс понимал, что это не было (и никогда не могло быть) совершенной трансформацией. Переселить половину пони из города в сельскую местность и заменить их таким же количеством чейнджлингов-поселенцев практически невозможно. В конце концов, в городе где-то около 75% населения составляли пони, но с этим числом Яхс был готов мириться. Население пони, по большей части ставшее жителями второго сорта, должно было обеспечить достаточное количество необходимой чейнджлингам любви, так что улей можно считать самоподдерживающимся. А приток новых солдат-поселенцев означал, что за партизанской деятельностью в новом улье будут наблюдать ещё более тщательно. Генерал-оберстабсарцт Марсилио пообещал королеве, что Акорнидж станет самой яркой драгоценностью короны, и благодаря своему превращению в колонию-улей Альвариум, он стал именно таким."
changelings_paxchrysalia.62.a:0 "Этот успех стоит отпраздновать."

changelings_paxchrysalia.63.t:0 "Манифест судьбы"
changelings_paxchrysalia.63.d:0 "Унтер-офицер Мурлен Касс явился на вокзал ровно в 07:00. Ни минутой раньше, ни минутой позже, как того и следовало ожидать от члена армии. С собой у него был лишь чемодан и перекинутая через плечо винтовку в чехле. Верное оружие времен Великой войны обеспечивало чувство комфорта, пока он двигался вместе с другими присутствующими чейнджлингами. Все они были солдатами, как и сам Мерлен, но никто не носил их форму. Сегодня они были «гражданскими лицами» в самом широком смысле этого слова.\n\nЛейтенант Филигри наблюдала, как её солдаты подсознательно выстраиваются строем перед ней, инстинкты улья брали верх над ними, когда те приближались к поезду на станции. Крылья лейтенанта затрепетали, когда она наблюдала, как каждый из них находит своё место, а затем она поднялась в воздух и зависла перед ними. Мурлен и все остальные присутствующие солдаты инстинктивно уставились на своего командира, после чего она обратилась к толпе:\n\n— Верные солдаты армии! — провозгласила она, повысив голос, чтобы её речь можно было легко услышать среди шума поездов. — Сегодня мы отправляемся на юго-восток, где армия щедро одарила нас всех необходимым имуществом, которое поможет нам заселить варварскую пустыню эквестрийского приграничья. Многие из вас, конечно, видят в этом дар или награду, и хотя ваша служба во время войны помогла получить эту землю, этот дар всё же не бесплатен. Прежде всего мы солдаты армии, а лишь потом граждане Гегемонии. Эта земля дана нам не для того, чтобы мы сложили оружие и растолстели на любви к пони, о нет. Эта земля дана нам для того, чтобы мы охраняли её и контролировали. Верховное командование считает, что лишь поселения опытных и закаленных солдат, живущих среди общин пони, смогут положить конец партизанской деятельности. И именно поэтому вам всем была предоставлена земля в собственность. Мы должны создать новые общины и контролировать города, где мы будем жить. Именно так мы обеспечим контроль нашей королевы над Эквестрией. Такова наша судьба!\n\nСобравшиеся солдаты зааплодировали, и Мурлен присоединился к ним. Затем раздался свисток поезда, и, как будто это был долгожданный сигнал, собравшиеся солдаты начали по очереди садиться в вагоны."
changelings_paxchrysalia.63.a:0 "Мы — солдаты, что сделают эту землю безопасной для тех, кто придёт после нас."

changelings_paxchrysalia.64.t:0 "Приятный ужин"
changelings_paxchrysalia.64.d:0 "[CHN_GetJachsRank] Яхс вошел в новый ресторан чейнджлингов, который недавно открылся в Кантерлоте, и направился к столику, где его уже ждал другой чейнджлинг. Он должен был признать, что рад том, что всё больше чейнджлингов наконец-то открывали свой бизнес в Кантерлоте – было очень неплохо снова почувствовать вкус еды из дома. Хотя еда, которую подавали в Тэйсти Трит, в последнее время действительно стала ему нравиться...\n\nДругой чейнджлинг посмотрел на приближающегося Яхса и ухмыльнулся. — [CHN_GetJachsRank]! Прошло уже так много времени, — сказал он, протягивая ему копыто.\n\nЯхс усмехнулся и потряс предложенное ему копыто. — Да забудь ты про эти титулы, Врен! У нас уже несколько месяцев не было возможности поговорить, и первое, что ты сказал – это «[CHN_GetJachsRank]». Ты лишь напоминаешь мне, сколько времени прошло с того момента, как мы были соседями по казарме.\n\nАркус Врен рассмеялся, когда Яхс сел напротив него. — О, старые добрые деньки, не так ли? Попадать в неприятности за спинами сержантов, стоять в карауле под дождем в наказание...\n\n— Некоторые вещи я вспоминаю с теплотой, — сказал Яхс, качая головой. — О, чуть не забыл. Поздравляю с повышением, оберст Врен. Армии нужно больше офицеров вроде тебя.\n\n— И если бы ты не потянул за ниточки, то этого не произошло, не так ли? — Спросил Врен, на что Яхс мог лишь застенчиво улыбнуться. Врен усмехнулся, потом вздохнул и потёр копытом основание своего рога. — Ну, армии нужно больше пони вроде нас. Гвардия королевы становится всё более... радикальной... с каждым днём. Я уверен, что и ты это заметил. Кто-то должен держать их в узде, и я думаю, что именно нам придётся разгребать всё это дерьмо, верно?\n\n— К сожалению, да, – ответил Яхс. — Но я надеюсь, что мы вдвоём сможем держать их под контролем."
changelings_paxchrysalia.64.a:0 "Интересы армии и ульев нужно защитить как от внутренних, так и от внешних угроз."

changelings_paxchrysalia.65.t:0 "Сбалансированная асимметрия"
changelings_paxchrysalia.65.d:0 "[CHN_GetJachsRank] Яхс наблюдал, как новая группа младших офицеров, отправленных под его командование, рассаживается по своим местам в конференц-зале. Они были молоды для своего звания, и Яхс знал, что по их оценкам эффективности они не были лучшими из лучших, но ему приходилось работать с тем, что есть. Казалось, что все талантливые кадеты идут в королевскую гвардию, но сейчас это его не слишком беспокоило: он предпочел бы иметь под своим началом чейнджлинга, способного думать самостоятельно, чем даже самых умелых фанатиков королевы.\n\n— Доброе утро, офицеры, — начал говорить Яхс, как только все расселись. — Я [CHN_GetJachsRank] Яхс, и сегодня мы рассмотрим самую важную часть ваших назначений: операции по борьбе с повстанцами. Для этого мы с моим штабом разработали теорию ведения войны, которая, как мне кажется, является ключом к решению этой проблемы: я называю её доктриной сбалансированной асимметрии.\n\nОн нажал кнопку и проектор показал первый слайд со словами «СБАЛАНСИРОВАННАЯ АСИММЕТРИЯ», напечатанными жирным шрифтом. — Ульи не живут в мире; не делайте тут ошибок, мы по-прежнему воюем. Вопреки информации, распространяемой некоторыми высокопоставленными представителями армии и правительства, эквестрийское население и близко не является послушными подданными нашей королевы.\n\n— Наша борьба против подрывной деятельности гармонического сопротивления не будет обычной войной. Тут правят бал партизаны и диверсанты, где любой гражданский, которого вы встретите на улице, может быть членом сопротивления. Забудьте об огневой поддержке и прикрытии с воздуха, когда вы движетесь от здания к зданию. В девяти случаях из десяти вашим солдатам придётся полагаться лишь на свой ум и на чейнджлингов-товарищей.\n\n— Армия была создана, чтобы сокрушить эквестрийские вооруженные силы, но теперь мы должны приспособиться, чтобы продолжать эффективно действовать в мире без официальных армий. В мире, где постоянно вспыхивают мятежи и спорадические восстания. Примирись с фактом, что славные блицкриги великой войны стали пережитком прошлого, если вы ещё этого не сделали. Прежде чем я продолжу... есть ли у вас какие-нибудь вопросы?"
changelings_paxchrysalia.65.a:0 "Адаптируйтесь или умрите, если хотите выжить в новом и опасном мире."

changelings_paxchrysalia.66.t:0 "Выученная беспомощность"
changelings_paxchrysalia.66.d:0 "[CHN_GetJachsRank] Яхс тихо прокрался в аудиторию через черный ход, аккуратно и беззвучно закрыв дверь за собой. Оратор на сцене уже вовсю готовилась к выступлению, а офицеры и генералы королевской гвардии, сидевшие в первых рядах, уделяли ей самое пристальное внимание. Однако вместо того, чтобы сесть в первых рядах, Яхс проскользнул на задние, где генерал-оберштабсарцт Марсилио со скучающим видом наблюдал за докладом.\n\n— Прошу прощения за опоздание, — извинился Яхс, садясь рядом с главным хирургом. — Проблемы с составлением бюджета для сотрудников отняли больше времени, чем предполагалось.\n\n— Не извиняйся, ты мало что пропустил, — медленно сказал Марсилио. Он лениво указал копытом на чейнджлинга в униформе на сцене, меняющую слайды своего выступления. — Эта недопсихолог издевается сразу над целой областью психологии. Её больше интересует зарплата от королевы, чем честное проведение исследований.\n\n— Вот как? — Яхс нахмурился, глядя на слайд, на котором была изображена карикатура на пони, съежившегося под хлыстами трёх чейнджлингов, стоящих над ним. — О чём она рассказывает?\n\n— «Выученная беспомощность», — сказал Марсилио, изобразив в воздухе кавычки копытами. — Гвардейцы королевы верят, что если они наступят на шеи пони, то те в конце концов перестанут сопротивляться нам, полагая, что их беспомощность – естественное состояние мира. Вот почему они считают, что широкомасштабные действия по подавлению партизан, которые они провели несколько месяцев назад, эффективны.\n\nЯхс лишь усмехнулся этому. — Они лишь заставили ячейки сопротивления залечь и временно прекратить деятельность. Они думают, что добились успеха, хотя на самом деле лишь ухудшили ситуацию.\n\nМарсилио покачал головой. — Попробуй сказать им это."
changelings_paxchrysalia.66.a:0 "Я пытался... много, много, много раз."

changelings_paxchrysalia.866.t:0 "Выученная услужливость"
changelings_paxchrysalia.866.d:0 "Яхс не мог дождаться, когда закончится бубнёж самозваного психолога. К счастью, пытка милосердно закончилась всего через час. Они с Марсилио решили заглянуть в бар, прежде чем разойтись, и обсудить услышанный ими обоими идиотизм.\n\n— Выученная беспомощность. Какая глупость, — посетовал Марсилио. — Эта концепция существует лишь потому, что королевская гвардия и фанатики верят в свою собственную пропаганду. Они думают, что пони – это не более чем простой скот, которого можно запугать и заставить подчиниться. Они не могут понять, что жестокое угнетение никогда не заставит пони прекратить борьбу с нами. Если бы у любого разумного существа был выбор между повторяющейся болью и страданиям и шансом так или иначе покончить со всем этим, то оно бы однозначно выбрало последний вариант.\n\n— Так оно и есть, — сказал Яхс, медленно кивая. — Вот почему дела идут плохо. Королевская гвардия и прочие ревностные командиры армии, похоже, наслаждаются жестоким обращением с населением из-за своих ошибочных взглядов. И именно это жестокое насилие приводит нас к смертям невинных, гибели солдат и ослаблении нашей хватки на Эквестрии. Они ещё не поняли, что необходим более умеренный подход, подход с пониманием. И я не думаю, что они когда-нибудь дойдут до этого.\n\nМарсилио на мгновение замолчал, обдумывая услышанное. — Ну, мы, конечно, не можем контролировать всю армию, королевскую гвардию или фанатиков, которыми окружает себя наша королева, но мы можем выполнять свою часть работы по-своему, — наконец сказал он. — Вы и я, [CHN_GetJachsRank], чейнджлинги, что ставят рационализм превыше фанатизма. Мы понимаем бедственное положение пони и солдат, которые должны взаимодействовать с ними больше и чаще королевы и её охраны. Вероятно, именно нам придётся сделать все возможное, чтобы обезопасить пони и остановить кровопролитие.\n\n— Да, — согласился Яхс. — Скорее всего, вы правы насчёт этого."
changelings_paxchrysalia.866.a:0 "Рационализм должен одержать верх... ради общего блага."

CHN_event_67_variant_one_loc:0 "Морнинг Фрост зевнула и повернулась в постели на другой бок, когда её будильник начал звонить. Она лениво потянулась к нему копытом и наконец выключила. Она хотела было снова заснуть: одеяла были такими удобными, но в конце концов сумела выбраться из постели и встать на копыта. Сегодня была суббота, а это означало, что весь день был в её полном распоряжении.\n\nПозавтракав и приготовившись к новому дню, Фрост вышла на улицу и на мгновение поёжилась от дуновения прохладного утреннего воздухе, одновременно любуясь лёгким инеем на растениях в саду. Была весна, но скоро наступит лето, и утренние морозы исчезнут до осени. Стоило наслаждаться этим, пока сохранялась возможность.\n\nКобыла отважилась покинуть свои владения и направилась по тротуару прямо в город на рынок. Она держала магией небольшую корзинку и что-то напевала себе под нос. Она обменялась приветствиями с некоторыми соседями, с которыми смогла подружиться с момента приезда в город несколько месяцев назад, и остановилась у забора Лили Лайлак, чтобы поделиться несколькими сочными сплетнями. Ей нравилось разговаривать с Лили; маленькая земная пони всегда умела рассмешить её, и она всегда рассказывала самые интересные вещи. Но как только она собралась уходить, Лили нахмурилась и склонилась чуть ближе к забору. — Ты слышала, что случилось с жеребёнком Карпентера?\n\n— Нет, — ответила Морнинг, озабоченно склонив голову набок. — И что же случилось?\n\n— Карпентер поймал его вчера поздно вечером, после наступления комендантского часа, — ответила Лили. — Он думает, что жеребенок пытался войти в контакт с сопротивлением. Глупый подросток. Его убьют, если поймают!\n\nЛицо Морнинг побледнело. — О нет, — испуганно ответила она, тревожно переступая копытами. — Как ты думаешь, кто-нибудь знает об этом?\n\n— Пока нет, — покачала головой Лили. Но потом она прищурилась и посмотрела на дом на другой стороне улицы. — Но не забывай следить за Риверами вон там, — сказала она. — Последние несколько дней они наблюдали за тем, как я работаю во дворе. Я думаю, что они шпионы жуков."
CHN_event_67_variant_two_loc:0 "Морнинг Фрост вышла из своей парадной двери и закачалась взад-вперед на дрожащих копытах, чувствуя, как нервная энергия пробегает по её телу. То, что она видела и слышала прошлой ночью, одновременно напугало её и наполнило праведной энергией. Морнинг чувствовала себя готовой нанести ответный удар жукам, которые отняли у неё страну. Она сомневалась, что когда-нибудь сможет забыть слова лидера сопротивления: «Единственный способ вернуть Эквестрию – заставить жуков чувствовать боль на каждом шагу, пока они не устанут и не отступят». Даже древесные волки знали, что нельзя совать нос туда, где больно; чейнджлинги же усвоят этот урок через несколько дней.\n\n— Доброе утро, Морнинг, — кобыла подпрыгнула, услышав своё имя, но вскоре успокоилась, поняв, что к ней всего лишь обратился её пожилой сосед Патч. Старый жеребец посмотрел на неё так, будто знал, что что-то тут не так, и подошел ближе к забору, разделявшему их участки. — У тебя что-то на уме, Морнинг? Ты вчера была где-то допоздна. Я надеюсь, что ты не ввязываешься ни в какие дела, что задумали эти хулиганы.\n\nНесмотря на добрые манеры пожилого пони, Морнинг Фрост ощетинилась и рассердилась. — Они не хулиганы, Патч, — совершенно спокойно сообщила она ему. — Они – единственные пони, которые пытаются хоть что-то изменить. И я собираюсь помочь им в кое-каком деле с жуками, чей конвой будет завтра проезжать через город.\n\nПатч нахмурился, глядя на неё. — Морнинг, ты по уши увязла в вещах, от которых тебе стоит держаться подальше. Ты сама себя убьешь, понимаешь?\n\n— Если я умру, сражаясь с жуками, то так тому и быть, — сказала она, хмуро глядя на соседа. — Кто-то должен быть готов пожертвовать своей жизнью, чтобы остановить жуков. И я точно знаю, что этот пони – не ты."
CHN_event_67_variant_one_button:0 "Я обязательно буду следить за собой рядом с ними."
CHN_event_67_variant_two_button:0 "Мы должны занять твердую позицию, чтобы сделать наш район лучше."

CHN_event_867_variant_one_loc:0 "Морнинг Фрост нахмурилась, когда Терракота указал копытом на проходящие мимо броневики чейнджлингов, патрулирующие рынок. — С каждым днём их становится всё больше, — проворчал жеребец. — И они останавливают тебя по любому поводу. Странно на них смотришь? Всё. Они тормозят и обыскивают тебя, а если ты позволишь себе сказать что-то лишнее? Они отвезут тебя в участок. Чизел что-то сказал им несколько дней назад, и с тех пор его никто не видел. Я уверен, что жуки забрали его. Он точно у них.\n\n— Но ведь они же не убьют его, правда? — тревожно спросила Морнинг. — Он же не сделал ничего плохого!\n\n— Скажи это жукам, — сказал Терракота, сплёвывая на тротуар, когда мимо проехала последняя машина чейнджлингов. — Им наплевать на нас, на пони. Совершенно наплевать. И у них везде есть свои шпионы, так что следи за всем, что говоришь. И особенно возле Риверов.\n\n— Лили тоже говорила что-то о Риверах, — сказала Морнинг Фрост, прикусывая губу. — Ты действительно думаешь, что они шпионы?\n\n— Не сомневаюсь, — сказал Терракота. — Они переехали сюда всего неделю назад, а у них уже есть свой большой дом, который выглядит очень мило. Ни один пони не получил ни один из этих больших красивых домов после захвата власти жуками. Ни один пони, а вот жук...\n\nТерракота покачал головой, когда два пони молча остановились на краю дороги. — Ты получала какую-нибудь... почту в последнее время? — наконец спросил Терракота.\n\n— Нет... а что?\n\n— А я вот получил. Особую скидку на фермерском рынке в пятницу. Думаю, что мне... стоит это проверить. Тебе это интересно?\n\nТо, как он это сказал, заставило гриву Морнинг встать дыбомчему бы этим пони не быть, и его слова заставили что-то щёлкнуть у неё в голове. — Терракота... Я... правда, не думаю, что это хорошая идея. Многие пони хотят получить такие скидки, понимаешь? Кто-то может пострадать, особенно если об этом узнают жуки.\n\n— Кто-то же должен пойти туда, — хмыкнув, сказал Терракота. — Почему бы мне не стать этим пони? Нельзя просто сидеть и ждать, Морнинг. Иногда ты должен просто пойти туда сам, если хочешь, чтобы всё было сделано правильно."
CHN_event_867_variant_two_loc:0 "Попрощавшись с Патчем, Морнинг Фрост провела остаток дня, ухаживая за своим садом позади дома, в попытке сделать всё возможное, чтобы вернуть себе хоть какое-то подобие нормальной жизни. Было бы нехорошо вести себя как-то странно на тот случай, если жуки начнут патрулировать её улицу. Но она просто должна была продержаться до конца сегодняшнего дня, а затем подготовиться к встрече с остальными членами сопротивления в полночь, чтобы начать закладывать бомбы...\n\n— Добрый день, Фрост, — послышался голос кобылы, и Морнинг подняла голову, чтобы увидеть Лили Лайлак, прислонившуюся к её забору. Она была членом совета ещё до того, как жуки приехали в город и распустили городской совет. — Прекрасный день для посадки цветов, не так ли?\n\n— Да, сегодня прекрасный день, — сказала Морнинг. — И он стал бы ещё лучше, если бы мы смогли избавиться от этих проклятых жуков, жужжащих повсюду.\n\nЛили медленно посуровела. — Ты всё ещё беспокоишься о чейнджлингах? — Тихо спросила она.\n\n— А ты разве нет? — Спросила Морнинг, приподняв бровь.\n\nЛили отрицательно покачала головой. — Конечно я расстроена, — сказала она, — но борьба лишь ухудшит ситуацию. Все действия сопротивления ведут лишь к усилению репрессий чейнджлингов. Ты ведь помнишь про это, правда?\n\n— Нет, конечно же нет. Но ведь мы всё равно должны что-то сделать! Мы не можем просто сидеть здесь и позволять им угнетать нас вечно!\n\n— Иногда мы можем потерпеть неудачу, даже если будем делать всё, что в наших силах, ведь жизнь не идеальна, — сказала Лили. Она перепрыгнула через забор и положила копыто на плечо Морнинг. — Что они пытаются заставить тебя сделать, Морнинг? — спросила она.\n\nМорнинг заколебалось, но в конце концов она вздохнула и склонила голову. — Мы собирались взорвать мост через реку, когда по нему завтра пройдёт конвой, — сказала она.\n\nЛили медленно кивнула. — Не ходи туда, — настаивала она. — Радикальные действия приведут лишь к большему насилию и новым смертям. Но если мы сможем пойти на компромисс... может быть, нам удастся мирно сосуществовать с чейнджлингами... тогда вещи могут измениться к лучшему для всех нас."
CHN_event_867_variant_one_button:0 "Но есть некоторые вещи, в которые мы не должны вмешиваться..."
CHN_event_867_variant_two_button:0 "Ты действительно так думаешь?"

CHN_event_967_variant_one_loc:0 "Морнинг Фрост вздохнула, когда она наконец вернулась домой и поставила продукты на кухонный стол. Весь город просто казался таким напряженным, особенно её соседи, её близкие друзья, которых она завела с тех пор, как переехала сюда. Казалось, что с каждым днем чейнджлинги всё сильнее и сильнее укрепляли своё присутствие в городе, и всё больше пони присоединялись к рядам сопротивления. Казалось, что если подождать ещё немного, то все пони выберут свою сторону в этом назревающем конфликте.\n\nПотратив некоторое время на то, чтобы убрать продукты, Морнинг вернулась в свою спальню и закрыла дверь. Она легла на кровать, потирая копытами усталые глаза, и застонала, когда её позвоночник расслабился. Её мысли постоянно возвращались к тому, что сказали Терракота и Лили. Риверы казались такой милой парой. Было странно, что её друзья сразу же посчитали их шпионами чейнджлингов. Она почувствовала укол совести так как новая пара уже была подвергнута остракизму в обществе, а ведь они живут тут всего несколько дней. И она не могла сделать для них ничего хорошего, чтобы даже её друзья не подумали, что она симпатизирует чейнджлингам...\n\nБудильник у её кровати снова зазвонил ровно в три часа. Закряхтев, Морнинг Фрост встала и полезла под кровать, вытащив оттуда чемодан. Когда она открыла его, её взору предстал целый клубок проводов, микрофон и антенна. Подняв антенну и направив её к окну, Морнинг Фрост задернула шторы и переступила с копыта на копыто, ожидая получения сигнала.\n\n— Оперативник Фрост, приём. Пришло время для получения вашего доклада.\n\nПосле короткой вспышки зелёной магии и маскировка Морнинг Фрост исчезла, теперь на месте пони стояла хитинистая чейнджлинг. — Я здесь, — устало ответила она. — И сегодня я узнала кое-что интересное."
CHN_event_967_variant_two_loc:0 "Стрельба началась незадолго до рассвета, резко разбудив Морнинг Фрост. Над городом разносились звуки выстрелов, смешанных с далёкими криками и грохотом тяжёлых пушек. Но всё закончилось почти сразу после начала, и вскоре Морнинг увидела, как машины чейнджлингов катятся по дороге. Все они были целыми, за исключением нескольких свежих пулевых отверстий здесь и там.\n\nМорнинг вышла в город, а там уже все говорили о неудачной диверсии партизан. Как назло, патруль чейнджлингов наткнулся на солдат сопротивления, когда они закладывали взрывчатку под мостом через реку, и между двумя сторонами вспыхнула ожесточенная перестрелка. Партизаны были перебиты почти до последнего, а судьба тех немногих пленников, которых захватили чейнджлинги, определенно не была намного лучше. Но благодаря действиям гарнизона мост был спасен от разрушения, а это означало, что город всё ещё мог торговать с остальной Эквестрией и Гегемонией. Жизнь могла продолжаться как и прежде.\n\nКогда Морнинг Фрост вернулась домой, она закрыла за собой дверь и прислонилась к стене. Если бы не предостережение от Лили Лайлак, она точно была бы среди тех убитых на мосту пони. Она едва избежала смерти и не подозревала об этом до самого последнего момента, а теперь была благодарна своим соседям.\n\nВремя забыть о сопротивлении. Их дело обречено. Но, по крайней мере, ей удалось спастись. И, возможно, можно изменить ситуацию как-то по-другому. Она может последовать совету Лили и сделать сообщество мирным и счастливым местом в эти непростые времена."

