 CHN_chaos_in_the_everfree: "Безладдя у Вічнодикому лісі"
 CHN_chaos_in_the_everfree_desc:0 "Мы победили всё, что Эквестрия бросала в нас, но мы не завоевали саму её землю. Вечнодикий лес, старый и мистический бастион, обладающий удивительной магической силой, теперь сопротивляется нашей военной машины. Партизаны стекаются в лес, где под предводительством зебры Зекоры они используют магический рост леса, чтобы наносить нам сокрушительные удары. Если мы надеемся победить §RЗекору§!, §Rпартизан§! и §Cсам лес,§! мы должны разработать §Yэффективную стратегию§!. Хотя §Rполное и абсолютное уничтожение§! уникальной и экзотической флоры и фауны этого леса будет очень значительной потерей для некоторых, она всё же не сравнится с §Yпотерей немалой части центральной Эквестрии!§!"
 CHN_chaos_in_the_everfree_ticking_mission: "Приборкання лісу"
 CHN_chaos_in_the_everfree_ticking_mission_desc:0 "Рост Вечнодикого леса вышел из-под контроля. Магия леса, усиленная зеброй Зекорой, заставляет деревья и лианы постоянно продвигаться вперёд с высокой скоростью. И за лесом обязательно следуют партизаны и монстры. Мы должны окружить лес по периметру и постоянно атаковать его, если мы надеемся сдержать его рост. Если мы этого не сделаем, то вскоре вся центральная Эквестрия может быть быстро захвачена этим лесом!\n\n§Yна протяжении [?days_mission_timeout@CHN_chaos_in_the_everfree_ticking_mission] дней:§!\n§WКаждый день §Rнеограниченный рост§! §CВечнодикого леса§! будет захватывать §Yсоседнюю провинцию§!.§!"
 CHN_ZRS_everfree_tamed_tt:0 "§CВечнодикий лес§! больше не будет сопротивляться нам!"
 CHN_ZRS_everfree_failure_tt:0 "Мы вынуждены §Rотступить§!, так как больше не можем противостоять §Rужасному истощению§! §CВечнодикого леса§!.\n"
 CHN_operation_breakthrough:0 "Операция Durchbruch"
 CHN_operation_breakthrough_desc:0 "Чтобы победить Вечнодикий лес, мы должны использовать все доступные нам технологии против магии старого мира. Бронепоезда при поддержке танков станут острием копья, которое будет продвигаться всё глубже в лес, давая нам столь желанные позиции для начала антиповстанческих операций и атак. Пони-рабочие будут трудиться до смерти, чтобы вырубать заросли и класть рельсы. В конце концов, это именно их братья и сёстры обратили лес против нас, и так они должны доказать свою преданность Гегемонии, чтобы спасти свои семьи."
 CHN_operation_longrangerecon:0 "Операция Fernauf"
 CHN_operation_longrangerecon_desc:0 "Как и на войне, для эффективной атаки требуется знать, где находится противник, а затем сокрушить его превосходящей огневой мощью или перехитрить благодаря большей скорости. Мы отправим элитные полки ферншпехера в Вечнодикий лес, чтобы найти там опорные пункты партизан и сразиться с пони, прячущимися в лесу на их же собственной территории. Для этих миссий, которые почти гарантированно будут самоубийственными, будут отобраны лучшие из лучших. Их жертва во имя Гегемонии не будет забыта."

 CHN_resource_exploitation_cat: "Das KuKC Erforschung- und Extraktion Konzern"
 CHN_resource_exploitation_cat_desc:0 "Das Königin und Kaiserin Chrysalis Erforschung- und Extraktion Konzern, или Корпорация Разведки и Добычи Имени Королевы и Императрицы Кризалис – это квазигосударственный орган, ответственный за управление и использование природных ресурсов в пределах Гегемонии Чейнджлингов."
 CHN_resource_exploitation_decision:0 "Экспроприировать ресурсы региона [From.GetName]"
 CHN_resource_exploitation_decision_state_req_tt:0 "[From.GetName] принадлежит и контролируется §Yмарионеткой§! чейнджлингов."

### МЕХАНІКА СПОЖИВАННЯ ЛЮБОВІ & ІНТЕРФЕЙС ###
 CHN_love_consumption_mechanic: "Витягнення та споживання любові"
 CHN_love_consumption_mechanic_desc: "§CЛюбов§! — живильна сила раси чейнджлінґів, витягувана з підданих §GГегемонії Чейнджлінґів§!. Методологія, якою обчислюється зібрана любов, залишається туманною наукою; £lovetax_text£ §Cерот§! позначає об'єм любові достатній, щоби значно посилити можливості малого вулика.\n\n§CКоролівська Армія Чейнджлінґів§! є установа, відповідальна за найвищі рівні споживання §Cлюбові§! у світі. Ненаситний апетит Армії до любові означає, що на ефективність воєнної машини чейнджлінґів безпосередньо впливає §Cлюбов§! — або її відсутність, — накопичена в запаси держави чейнджлінґів.\n" # (&+)
 CHN_love_erot_explainer_tt: "Кількість накопиченої §Cлюбові§! в §Cеротах§!:"
 CHN_love_erot_stored_explainer_tt:0 "£lovetax_text  §CЛюбовь§! можно получить с помощью §Yрешений§!, §Yнепрерывного фокуса§!, и §Yсобытий§!, а также её можно тратить для получения различных бонусов.\n\nЕсли возникнет дефицит любви, то будут наложены различные штрафы, тяжесть которых будет масштабироваться в зависимости от дефицита и определяться по формуле (§RD§!) = (§CE§!) × 25%\nМаксимальная величина штрафов — §R-150%§!."
 CHN_battalions_explainer_tt: "Кількість розгорнутих §Gфронтових батальйонів§!:"
 CHN_battalions_detailed_explainer_tt:0 "Это общее количество фронтовых батальонов и вспомогательных рот, развёрнутых в составе наших дивизиях. Батальоны и роты, дислоцированные в гарнизонах, не учитываются в этом расчёте."
 CHN_carrying_capacity_explainer_tt: "Поточна найбільша підтримувана кількість §Gфронтових батальйонів§!, яку можна розгорнути:" # (&+)
 CHN_carrying_capacity_detailed_explainer_tt:0 "Максимальное допустимое число фронтовых батальонов определяется по этой формуле:\n( 10 + (§YS§!) ) × 10 батальонов на регион.\n\n[CHN_billeting_system_bonus_loc_string](§YS§!) представляет собой общее количество §Yненациональных§! регионов под контролем государства [CHN.GetNameDef] (§Y[?CHN_directly_controlled_noncorestates_var]§!), в дополнение к §Y50%§! от общего количества регионов, контролируемых §Yмарионетками§! (§Y[?CHN_weekly_love_gain_state_PUPPETS_var]§! × §Y50%§!)."
 CHN_love_erot_cost_explainer_tt: "Об'єм §Cлюбові§! в §Cеротах§!, який §Rщотижня віднімається§! від числа §Gфронтових батальйонів§! у перевищенні підтримуваної кількості:" # (&+)
 CHN_love_erot_cost_detailed_explainer_tt:0 "За каждый батальон свыше максимально допустимого их числа будет накладываться штраф в §R0.001§! эротов.\n\nВ настоящий момент мы превышаем максимально допустимое число батальонов на §R[?CHN_excess_battalions]§!, что накладывает на нас еженедельный штраф в §R[?CHN_excess_battalions_cost]§! эротов (§Y[?CHN_excess_battalions]§! × §Y0.001§!)."
 CHN_love_variable_tt: "§C[?CHN_love_variable]§!"
 CHN_excess_battalions_cost_tt: "[?CHN_excess_battalions_cost|-]"

### СЛУЖБОВА ЛОКАЛІЗАЦІЯ/МІТКИ ###
 CHN_post_war_5_unlocks_love_mechanic_tt: "\nВідмикає механіку §C$CHN_love_consumption_mechanic$§!, в якій §Cлюбов§! можна надобувати шляхом §Yрішень§!, §Yбезперервних фокусів§! і §Yподій§!, а споживати для отримання різних §Gбонусів§!:\n      Відмикає безперервний фокус: §Y$CHN_continuous_love_harvesting$§!.\n    Відмикає рішення: §Y$CHN_gain_love_decision$§!.\n    Відмикає рішення: §Y$CHN_factories_for_love_decision$§!.\n    Відмикає рішення: §Y$CHN_rations_as_growth_incentive$§!.\n    Відмикає рішення: §Y$CHN_rations_for_political_power$§!.\n    Відмикає рішення: §Y$CHN_rations_for_war_support$§!.\n    Відмикає рішення: §Y$CHN_rations_for_stability$§!.\n"
 CHN_post_war_5_c_unlocks_love_decisions_tt: "\nВідмикає сукупність рішень §CСпоживання любові§!:\n    Відмикає рішення: §Y$CHN_rations_for_recruits$§!.\n    Відмикає рішення: §Y$CHN_rations_for_researchers$§!.\n    Відмикає рішення: §Y$CHN_rations_for_drones$§!.\n    Відмикає рішення: §Y$CHN_rations_for_settlers$§!."
 CHN_queens_tower_custom_tt: "\nЗі своєї §GВежі Великої Королеви§!, Її Величність править §CПакс Кризалією§!.\nЗдобуде модифікатор §YСерце Гегемонії§! у §YВесаліполісі§!, що даватиме:\n    $MODIFIER_LOCAL_INTEL_TO_ENEMIES$: §G-25%§!\n    $MODIFIER_LOCAL_SUPPLIES$: §G+25%§!\n    $MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+25%§!\n    $MODIFIER_INTEL_NETWORK_GAIN$: §G+25%§!\n    $MODIFIER_MAX_DIG_IN_FACTOR$: §G+25.0%§!\n    $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+25.0%§!\n    $MODIFIER_STATIC_ANTI_AIR_HIT_CHANCE_FACTOR$: §G+25.00%§!\n    $MODIFIER_STATIC_ANTI_AIR_DAMAGE_FACTOR$: §G+25.00%§!\n    $MODIFIER_LOCAL_BUILDING_SLOTS$: §G+3§!\n" # (&+): перша частина
 CHN_vesalipolis_queens_tower_tt: "§CСерце Гегемонії§!\n\n$MODIFIER_LOCAL_INTEL_TO_ENEMIES$: §G-25%§!\n$MODIFIER_LOCAL_SUPPLIES$: §G+25%§!\n$MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+25%§!\n$MODIFIER_INTEL_NETWORK_GAIN$: §G+25%§!\n$MODIFIER_MAX_DIG_IN_FACTOR$: §G+25.0%§!\n$MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: §G+25.0%§!\n$MODIFIER_STATIC_ANTI_AIR_HIT_CHANCE_FACTOR$: §G+25.00%§!\n$MODIFIER_STATIC_ANTI_AIR_DAMAGE_FACTOR$: §G+25.00%§!\n$MODIFIER_LOCAL_BUILDING_SLOTS$: §G+3§!"
 CHN_vesalipolis_queens_tower_tt_delayed:0 "§LБашня великой королевы, в которой есть 110 надземных и 10 подземных этажей, является самым высоким сооружением во всех Землях Чейнджлингов. Это здание построено вокруг центрального шпиля Весалиполиса, который был втиснут в самый большой атриум башни. Эта постройка из стекла и стали доминирует над горизонтом Весалиполиса, возвышаясь над фабриками, офисами, казармами и жилыми домами столицы чейнджлингов. На самом верху башни находится тронный зал великой королевы Кризалис, где могут размещаться сотни чейнджлингов её двора. За исключением личных покоев королевы, расположенных на вершине башни, остальная часть зданий предназначена для размещения государственного и правительственного аппарата Гегемонии.\n\nЭта похожая на крепость башня является одновременно и военным объектом, и королевским дворцом, и правительственной резиденцией. Вдоль его наклонных стен расположены зенитные батареи, радиолокационные станции, снайперские гнёзда и артиллерийские огневые точки. Турмваче — это особый батальон королевской гвардии, постоянно расквартированный в башне и отвечающий за её охрану и защиту. Наконец, в дополнение к офисам армии, люфтваффе и других компонентов вооружённых сил чейнджлингов, в башне также находится штаб-квартира Управления Общественной Безопасности Весалиполиса. Пока директор Васпир Орн Кладисиум управляет операциями самой опасной в мире разведывательной службы из своего кабинета, что располагается всего несколькими этажами ниже тронного зала, следователи и психологи-палачи УОБВ работают в тени, предпочитая скрываться в подземных глубинах подвальных уровней башни.§!"
 CHN_acornage_colonisation_custom_tt: "Здобуває модифікатор §Y$CHN_acornage_colonisation_modifier_updated$§! в §YЕйкорнеджі§!, що дає:\n      $MODIFIER_LOCAL_FACTORIES$: §G+50%§!\n      $MODIFIER_LOCAL_BUILDING_SLOTS_FACTOR$: §G+50%§!\n      $MODIFIER_RESISTANCE_DECAY$: §G+50%§!\n      $MODIFIER_RECRUITABLE_POPULATION_FACTOR$: §G+50.00%§!\n      $MODIFIER_GLOBAL_MONTHLY_POPULATION$: §G+75.00%§!\n      $MODIFIER_LOCAL_NON_CORE_MANPOWER$: §G+75.00%§!"
 CHN_acornage_colony_tt: "§CРій-колонія Альваріум§!\n\nМісцеві заводи: §G+50%§!\nМежа заводів у областях: §G+50%§!\nШвидкість спадання спротиву: §G+50%§!\nВійськовозобов'язане населення: §G+50.00%§!\nЩомісячний приріст населення: §G+75.00%§!\nПоні-ресурси в неосердній області: §G+75.00%§!"
 CHN_acornage_colony_tt_delayed:0 "§LКолония-улей Альвариум была основана на месте эквестрийского города Акорнидж. Ранее он располагался на границе с Землями Чейнджлингов, так что там уже жил немалый процент жуков. Акорнидж был одним из первых эквестрийских городов, павших во время Великой войны, так что он стал центром военных перевозок и логистики, через который снаряжение, вооружение и солдаты направлялись на тот участок фронта, который требовал их больше всего.\n\nДавнее присутствие чейнджлингов в городе сделало его главным кандидатом на крупномасштабную колонизацию после войны. Бывший квартал чейнджлингов в Акорнидже вскоре охватил большую часть всего города, а жившие там ранее пони были перемещены в пригороды или внутригородские гетто, где они всё ещё составляют большую часть населения города. Иммигранты-чейнджлинги, живущие в настоящее время в колонии-улье, в основном проживают в центре города, где несколько городских кварталов были разрушены, дабы освободить место для строительства массивного улья, построенного в стиле метрополий вроде Весалиполиса, Вракса и Дитрисиума. За пределами города колонии поселенцев-чейнджлингов распространяются по сельской местности. Некоторые из них полностью создаются с нуля, а другие, вроде Альвариума, основываются на месте эквестрийских городов или деревень. Эти периферийные колонии поддерживают основную колонию-улей, обеспечивая её пищей, водой, ресурсами и рабочими. Они также в значительно более высокой степени военизированы, пока сам Альвариум остаётся в процессе перехода от военной оккупации к квазигосударственному колониальному правлению. А вот периферийные колонии являются бастионами, позволяющими чейнджлингам контролировать регион. Они готовы в любой мобилизовать своё население и идти на Альвариум, если пони открыто начнут проявлять несогласие.§!"

 CHN_canterlot_palace_focus_effect_tt: "\nЗдобуває модифікатор §YКантерлотський комісаріат§! у §YКантерлоті§!, що даватиме:\n$CHN_scripted_loc_Jachs$$CHN_scripted_loc_Marsilio$$CHN_scripted_loc_Alcippe$$CHN_scripted_loc_Finicus$\n" # перевірити, чи працює
 CHN_canterlot_palace_tt: "§5Кантерлотський комісаріат§!\n                                                          £CHN_CanterlotCommissariat_icon_text£\n\n[CHN_scripted_loc_string_Jachs][CHN_scripted_loc_string_Marsilio][CHN_scripted_loc_string_Alcippe][CHN_scripted_loc_string_Second_Wind][CHN_scripted_loc_string_Finicus][CHN_scripted_loc_string_Gloriosa][CHN_scripted_loc_string_Octavia]\n"
 CHN_canterlot_palace_tt_delayed:0 "§LСформированный в [?CHN.CHN_canterlot_commissariat_GetFormDate] по приказу великой королевы Кризалис Специальный Автономный Комиссариат по Администрации городом Кантерлотом и Бывшими Королевскими Владениями, является полуавтономным государством, ответственным за управление городом Кантерлотом и его сельскими окрестностями, состоящими из земельных владений, когда-то находившихся под непосредственным управлением эквестрийской короны.\n\nКантерлотский комиссариат возглавляет [CHN_GetJachsRank]ом Яхсом из Королевского Армии Чейнджлингов. Сам комиссариат Кантерлота обладает уникальным статусом в пределах Гегемонии чейнджлингов благодаря осуществлению исключительной юрисдикции над бывшей столицей Эквестрии. Как таковой, кантерлотский комиссариат обладает немалой степенью административной автономии и более широкой юрисдикцией в решении местных правовых и экономических вопросов относительно иных административных региональных комиссариатов в Гегемонии чейнджлингов.§!"
 CHN_second_wind_focus_effect_tt: "\nЗдобуває модифікатор §YКомандант $CHN_canterlot_commissariat_modifier_second_wind$§! у §YКантерлоті§!, що даватиме:$CHN_scripted_loc_Second_Wind$\n"
 CHN_96th_canterlonian_modifier_effect_tt: "\nЗдобуває модифікатор §YDas 96. Infanterie-Division «Canterlonian»§! у §YКантерлоті§!, що даватиме:\n      $MODIFIER_RESISTANCE_TARGET$: §G-25%§!\n      $MODIFIER_RESISTANCE_DECAY$: §G+25%§!\n"
 CHN_96th_canterlonian_division_effect_tt: "\nРозгортає §Y96. Infanterie-Division «Canterlonian»§!, очолюване §Cгенерал-майором Яксом§!.\nРозгортає §YSchutzkommando III-Kanterlot§!, очолюване §Cоберст-лейтенантом Алкіппою§!."
 CHN_gloriosa_event_effect_tt: "\nЗдобуває модифікатор §Y$CHN_canterlot_commissariat_modifier_gloriosa$§! в §YКантерлоті§!, що даватиме:$CHN_scripted_loc_Gloriosa$\n"
 CHN_MHI_PPPP_event_effect_tt: "\nЗдобуває модифікатор §Y$CHN_canterlot_commissariat_modifier_PPP$§! у §YКантерлоті§!, що даватиме:\n      $MODIFIER_LOCAL_SUPPLIES$: §G+20%§!\n      $MODIFIER_LOCAL_MANPOWER$: §G+20%§!\n      $MODIFIER_STATE_PRODUCTION_SPEED_BUILDINGS_FACTOR$: §G+20%§!"

 CHN_continuous_love_harvesting_custom_effect_tt:0 "--------------\n\n£lovetax_text  = ( (§YS§!) × 0.005% ) × ( ( 100 - (§RR§!) ) ÷ 100 )\n\n[CHN_love_refineries_bonus_loc_string]Приведенная выше формула используется для расчета общего количества £lovetax_text  §Cлюбви§! §Yежедневно§! получаемого от непрерывного фокуса, §Yокругленного§! в сторону меньшего значения до 3 знаков после запятой: [CHN_continuous_love_harvesting_LOVE_var_scripted_loc_string].\n\n(§YS§!) представляет собой общее число ненациональных регионов, непосредственно контролируемых государством [CHN.GetNameDef], в дополнение к (§Y50%§!) из всех регионов, принадлежащих и контролируемых нашими марионетками (§Y[?CHN_weekly_love_gain_state_var]§!).\n\n(§RR§!) средний уровень сопротивления во всех регионах под чейнджлингской оккупацией [CHN_average_resistance_TOOLTIP_FOR_MILITARY_LOVE_REQUISITIONS]."
 CHN_continuous_love_harvesting_LOVE_var_unselected_tt:0 "(§Yбудет рассчитано при выборе§!)"
 CHN_continuous_love_harvesting_LOVE_var_selected_tt:0 "(§C[?CHN_continuous_love_harvesting_LOVE_var]§! эротов)"
 CHN_continuous_love_harvesting_LOVE_var_selected_negligible_tt:0 "(§Rколичество получаемой любви ничтожно мало§!)"

