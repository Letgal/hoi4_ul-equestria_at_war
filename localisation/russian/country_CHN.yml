 CHN_indefinite_undercover_ops: "Безстрокові таємні операції"
 CHN_indefinite_undercover_ops_desc:0 "Чейнджлинги в образе пони внедрятся в местное население, чтобы жить почти нормальной жизнью среди них. Они не будут явно противодействовать повстанцам или собирать разведывательные данные, а лишь наблюдать. Они сродни спящим агентам, наделенным полномочиями действовать в случае наступления непредвиденных обстоятельств."
