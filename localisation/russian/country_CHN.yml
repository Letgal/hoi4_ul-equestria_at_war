 CHN_remove_fobs: "Вивести передові оперативні бази з експлуатації"
 CHN_remove_fobs_desc:0 "По некой причине армия приняла решение, что сеть передовых оперативных баз в Эквусе стала слишком избыточной или же вообще ненужной. Вывод из эксплуатации этих баз позволит использовать персонал гарнизонов для иных целей, хотя некоторые в армии обеспокоены долгосрочными последствиями такого решения."

 CHN_settlement_plan_cat: "Siedlungsplan-експансіонізм" # інак. Експансіонізм Siedlungsplan-у
 CHN_settlement_plan_cat_desc:0 "Лучший способ контролировать Эквестрию – это наполнить её нашими чейнджлингами. Планы по колонизации регионов вдоль старой границы с Эквестрией позволят нам заселить эти земли верными чейнджлингами, многие из которых сражались в Великой Войне, и тем самым укрепить наш контроль над окружающими землями. Так мы можем понизить §RСопротивление§! и увеличить §CПодчинение§! на этих территориях, а также получить больше ресурсов с них."
