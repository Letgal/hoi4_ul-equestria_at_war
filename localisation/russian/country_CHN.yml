  CHN_factories_for_love_decision: "Додатковий синтез любові"
  CHN_factories_for_love_decision_desc:0 "Мы назначим несколько гражданских фабрик на обработку и переработку низкокачественной любви, непригодной в своём сыром виде для потребления."
  CHN_factories_for_love_decision_req_tt:0 "У нас есть как минимум §Y6§! гражданских фабрик, которые могут быть использованы для проектов."
  CHN_erots_TOOLTIP_FOR_FACTORY_GAIN:0 "(§G+0.20§!) §Yэротов§! синтетической £lovetax_text  §Cлюбви§! будет добавлено в чейнджлингское хранилище.\n"

