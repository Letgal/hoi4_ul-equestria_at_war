changelings_paxchrysalia.414.t:0 "Злая ведьма Вечнодикого леса"
changelings_paxchrysalia.414.d:0 "[CHN_GetJachsRank] Яхс, капитан Ласин Кардо и директор УОБВ Васпир Орн Кладисиум низко поклонились королеве Кризалис, когда та вошла в зал заседаний кантерлотского замка. Кризалис не обратила на них никакого внимания, она сразу же подошла к столу и поставила копыта на его край, широко улыбаясь при этом. — Вечнодикого леса больше нет, — гордо провозгласила она. — Этот проклятый лес превратился лишь в обугленные палки и обгоревшие камни. Отличная работа, [CHN_GetJachsRank]. Я всегда знала, что могу на тебя рассчитывать.\n\nЯхс смиренно опустил голову. — Благодарю вас, моя королева.\n\n— Ну а теперь, — начала Кризалис, — что насчёт самой ведьмы? Той зебры, что доставляла нам столько проблем?\n\n— Мои лучшие и храбрейшие шпионы уверены, что зебра, известная как Зекора, всё ещё жива и находится где в пределах Вечнодикого леса, — сказал Васпир, поджигая сигарету и беря её в рот. — Её партизанское движение полностью уничтожено, но у зебры всё ещё сохранилась разношерстная группа выживших. Там уже почти не осталось лесов, в которых она могла бы спрятаться. Рано или поздно её время придёт.\n\n— Так давайте же выкурим её оттуда! — Воскликнул Ласин. — Теперь у нас есть шанс нанести смертельный удар этой глупой ведьме. Теперь, когда лес больше не представляет угрозы, как долго она сможет прятаться там?\n\n— Я мобилизовал специальную оперативную группу, которая прочешет Вечнодикий лес с земли и воздуха, — сказал Яхс, двигая папку в центр стола. — Нам нужен лишь ваш приказ, моя королева, и мы начнём.\n\nКризалис на мгновение задумалась, а потом улыбнулась ещё шире. — Я должна лично поохотиться на зебру, — заявила она. — Лишь величайшая из королев чейнджлингов могла бы получить в качестве трофея голову зебры, которая причинила нам столько хлопот!\n\nТрое одновременно обменялись озабоченными взглядами. — Э... прошу прощения, моя королева, — сказал Васпир. — Но лес слишком опасен для вас, даже в его ослабленном состоянии. Я уверен, что оперативная группа сможет и сама справиться. Если с вами что-нибудь случится..."
changelings_paxchrysalia.414.a:0 "Чепуха! Я Великая Королева чейнджлингов! И я ничего не боюсь!"
changelings_paxchrysalia.414.b:0 "С другой стороны, возможно, ты и прав..."

changelings_paxchrysalia.415.t:0 "Неурядицы при охоте на ведьму"
changelings_paxchrysalia.415.d:0 "Глубоко в лесу охотники тряслись от страха. Они разбили свой лагерь там, где от леса не осталось ничего, кроме сажи и пепла, и сгрудились вокруг незажжённых костров. Костры же было нечем разжечь из-за отсутствия листвы, которая могла бы послужить топливом. Чейнджлинги рассказывали друг другу истории о чудовищах, которые всё ещё скрывались в темноте.\n\nНесмотря на свой страх перед лесом, солдаты Фернспехера гордились своей службой, ибо только лучшие из лучших чейнджлингов могли углубиться в Вечнодикий лес и вернуться обратно. Они отбились от медвежуков и параспрайтов, выдержали атаки лесных партизан, но даже в выжженном и мёртвом Вечнодиком лесу его самая печально известная обитательница по-прежнему оставалась непокорённой и свободной.\n\nВедьма Зекора шла в бой с лицом, скрытым за шаманской маской. Некоторые говорили, что она могла менять своё тело как настоящий чейнджлинг. Ни один чейнджлинг не видел лица этой ведьмы. Ну, или не прожил достаточно долго, чтобы рассказать об этом. Партизаны, которые разукрашивали свои тела рудиментарным, эзотерическим камуфляжем отдавали дань уважения своему лидеру своими повторениями племенных знаков зебр. Чейнджлинги охотились именно на неё, одновременно боясь эту зебру до дрожи.\n\nОни рассказывали друг другу о том, что случилось с их товарищами-охотниками, вспоминая те обрывки информации, что ускользнули от внимания цензоров и пропагандистов. Они пили тосты за павших братьев по оружию: майора Пагнакса, лидера обреченной кампфгруппы, чьё окостеневшее под воздействием колдовства тело было найдено торчащим из башни его же танка. Или же трёх дюжин фаллширмджагеров, которых сбросили в самое сердце леса. Храбрые бойцы исчезли под кронами деревьев и лес их поглотил. Лишь спустя несколько дней патруль обнаружил их тела: весь взвод висел на своих парашютных ремнях, превращённых в импровизированные петли.\n\nКомандиры чейнджлингов в Кантерлоте изучали донесения, поступавшие от охотников, что смогли вернуться из леса живыми. Они приходили с пустыми копытами и страдали как от физических, так и от психологических травм. Когда стало ясно, что армия не сможет выследить ведьму, отчеты были подшиты и отложены куда подальше, чтобы о них тихо забыли. Охотников же назначили на другие, менее опасные должности, а зебра была попросту вычеркнута из всех официальных записей. В конце концов, то, чего не существует, не может быть угрозой."
changelings_paxchrysalia.415.a:0 "Зекора может забрать остатки своего леса."

changelings_paxchrysalia.416.t:0 "Конец восстания"
changelings_paxchrysalia.416.d:0 "Вечнодикий лес не ровня магии великой королевы чейнджлингов. Её сила велика как никогда, усиленная поглощением свежесобранной любви. Королева Кризалис оставляла за собой полосу разрушений, продвигаясь через больное сердце Вечнодикого леса. Её сопровождала и поддерживала оперативная группа лучших и умнейших чейнджлингов армии. Охотники с Кризалис в авангарде без особого труда пробирались сквозь выгоревшие остатки леса, направляясь к последнему бастиону, где пряталась сама зебра-ведьма.\n\nКогда Кризалис ворвалась на поляну, партизаны встретили её градом выстрелов. Но мощнейший щит королевы смог защитить её саму и телохранителей. Завывая как гончие, чейнджлинги ворвались на поляну, горя желанием наброситься на немногочисленных усталых и измученных партизан, которым как-то удалось уцелеть под натиском армии. Бой не был честным: он был больше похож на тренировку стрельбы по мишеням, поскольку пони один за другим падали под натиском пуль и штыков.\n\n— Покажись, ведьма! — Заревела Кризалис, разрывая палатку за палаткой и разбрасывая обломки во все стороны. — Сдайся, и я, возможно, пощажу тебя. А лучше не сдавайся, так будет веселее. — Она закрыла глаза и подняла нос к небу, делая глубокий вдох, чтобы произнести заклинание. Затем, усмехнувшись, она повернулась к дальнему углу леса и пошла в ту сторону как кошка, преследующая загнанную в угол мышь. — Я чувствую твой страх, зебра, и он восхитителен на вкус...\n\nЕе магия ухватилась за непритязательную палатку и разорвала ткань пополам..."
changelings_paxchrysalia.416.a:0 "Выходи, ведьма!"

changelings_paxchrysalia.8416.t:0 "Ведьма наносит ответный удар"
changelings_paxchrysalia.8416.d:0 "Там, среди остатков палатки, отыскалась сама зебра. Она выглядела весьма жалко. Черный пепел испачкал линии между её полосками, зелёная племенная краска почти стерлась, а ожоги покрывали всё лицо, шею и передние ноги. Передняя нога висела на перевязи и была прижата к груди, а глаза налились кровью от лихорадки. Она пережила попытки армии уничтожить Вечнодикий лес, но лишь на первый взгляд.\n\n— Вот ты где, — промурлыкала Кризалис, схватив своей магией Зекору за горло и вытащив её из палатки. Зебра кашляла и вырывалась, но была слишком слаба, чтобы серьёзно сопротивляться. — Как ты могла пасть так низко, — поддразнила её Кризалис. — Ты слишком долго была занозой в моём боку, понимаешь? Но теперь я тебя, наконец, поймала.\n\n— Так ты думаешь... что меня поймала? — Зебра начала задыхаться в хватке Кризалис. — Как бы тебе... не показалось мало!\n\nКопыто зебры ударило Кризалис по рогу, и королева чейнджлингов выронила Зекору, внезапно почувствовав резкую боль. Телохранители Кризалис бросились в атаку, но Зекора ударила копытом по земле, и стена хищных лиан вырвалась из земли, отрезая их от королевы. Зекора и Кризалис остались вдвоём, и чейнджлинг оскалила клыки на зебру. — Ах ты, полосатая шавка! Да я тебе голову оторву!\n\nОна бросилась вперед, чтобы атаковать Зекору, но зебра быстро, как молния, выхватила из своей перевязи пузырек с голубой жидкостью и швырнула его в Кризалис. Стекло разбилось о её морду, а жидкость зашипела, прожигая хитин Кризалис, заставив королеву чейнджлингов завыть от боли. Затем Зекора начала распевать:"
changelings_paxchrysalia.8416.a:0 "Что она творит?!"

changelings_paxchrysalia.9416.t:0 "Проклятье ведьмы"
changelings_paxchrysalia.9416.d:0 "«Оглянись же кругом, королева жуков,\nВедь режим твой разрушиться вскоре готов.\nПусть сегодня ты впрямь нанесла нам урон,\nМы найдём иной путь привнести наш фурор.\nТы построила мир на угрозах и лжи,\nИ что крах пережить ты сумеешь не жди.\nВсё, что было отнято, себе возвратим,\nИ «хозяев» из Ульев мы в бег обратим.\n\nВнимательно послушай, Кризалис-Королева,\nПришло время узнать, что есть в тебе проблема:\nКлеймом для тебя будет твой же позор,\nОт него отвести ты не сможешь свой взор.\nЯдовитая шутка прокляла твою особь,\nИ забудешь ты, как изменить свой же образ.\n\nНе будет больше ужас накрывать нас тенью,\nИ видеть ваш упадок нам будет загляденье;\nВнимайте, паразиты, шатко ваше положение:\nЭквестрия не будет мириться с угнетением!»\n\nКризалис слишком сильно мучалась от боли, чтобы ответить. Её лицо практически плавилось, хитиновые пластинки трескались и опадали, когда зелье из флакона творило свою грязную магию. Стиснув зубы, Зекора сплюнула на землю, прежде чем развернуться и убежать в самое глубокое, самое тёмное сердце Вечнодикого леса. Того бастиона, который так и не покорился всей мощи армии чейнджлингов. Лес, казалось, смыкался прямо за ней, деревья пододвигались всё ближе друг к другу, а их ветви переплетались, образуя непроницаемую стену.\n\nЛишь через час егерям удалось прорваться сквозь хищные лозы и добраться до своей королевы. К тому времени она уже потеряла сознание, и нервный шепот пронёсся по рядам чейнджлингов, когда они немедленно вызвали доктора." # Спасибо Беспартийному — главе русскоязычной вики — за перевод-адаптацию стиха
changelings_paxchrysalia.9416.a:0 "Что случилось с нашей королевой?!"

changelings_paxchrysalia.417.t:0 "Чейнджлинг, что не может измениться"
changelings_paxchrysalia.417.d:0 "— Представьте себе форму, Ваше Величество. Вообще любую форму.\n\nКризалис зарычала на доктора, стоявшего напротив неё. — Я пытаюсь, бесполезный ты болван, — огрызнулась она. Оскалив зубы от отчаяния, Кризалис прижала Копыта к лицу, пытаясь призвать магию, которая была столь естественна для неё всю жизнь.\n\n— Э... осторожнее, моя королева. Хирурги приложили немало усилий, чтобы восстановить ваше лицо. Если вы слишком сильно напряжётесь, то можете повредить хитин...\n\nКризалис хотела что-то рявкнуть ему, но не видела в этом смысла. Потребовались усилия лучших хирургов ульев, чтобы исправить её лицо. Ну, или хотя бы сделать его похожим на прежнее. Которое было у неё до того, как проклятая зебра прокляла её той ядовитой шуткой из флакона. Но никто не смог исправить наложенное на неё настоящее проклятие, и это беспокоило её намного больше внешнего вида. В основном потому, что она больше не могла изменять свою форму и внешность.\n\nТем не менее, она сделала так, как просил доктор, и почувствовала, как волна магии вспыхнула кольцом зелёного огня вокруг неё. Теперь на неё из зеркала смотрела хорошенькая розовая фигурка принцессы Каденс, почти идеальная... но всё же не настолько: её рог был немного длинноват, глаза были неправильного оттенка синего, и даже градиент фиолетового на её крыльях был некорректным! — Почему это не сработает?! — Кризалис провыла голосом Каденс. — Не идеально! Всё это неправильно!\n\nДоктор осторожно записал что-то в свой блокнот и попытался ободряюще улыбнуться своей королеве. — Но моя королева... всё выглядит идеально. Вы выглядите точно так же, как принцесса Каденс. В точности как тогда, когда вы проникли на королевскую свадьбу в Кантерлоте. — Он поколебался, потом добавил. — Моя королева... возможно, так называемое "проклятие" Зекоры повлияло на ваш разум, а не на ваши силы. Ведьма обманула вас, заставив думать, что ваши преображения не идеальны, хотя на самом деле они безупречны как и всегда.\n\nКризалис схватила доктора своей магией. — Лжец! — заорала королева на него. — Не надо меня опекать и поддерживать! Превращения неправильны! Я знаю, что это так! — Она вышвырнула доктора за дверь и выбежала из комнаты, прежде чем сбросить своё обличье и вернуться к естественной форму. — Зекора, проклятая ты ведьма! — закричала Кризалис. — Что ты со мной сделала?!"
changelings_paxchrysalia.417.a:0 "Я буду мучить её всеми мыслимыми и немыслимыми способами!"

changelings_paxchrysalia.418.t:0 "Последние дни Нового Понивилля"
changelings_paxchrysalia.418.d:0 "Глубокой ночью Кэррот Топ всё ещё бодрствовала и смотрела на звёзды. За её садом, над крышами Понивилля во всей красе предстало ночное небо.\n\nВсего несколько недель назад Вечнодикий лес ворвался в Понивилль подобно цунами, вытеснив гарнизон чейнджлингов потоком буйной растительности. Даже после того, как самая агрессивная часть леса отступила, некоторые его обитатели остались в городе, поселившись среди кварталов, ныне заросших экзотической растительностью.\n\nТеперь лесные волки бродили по улицам, время от времени вступая в драки с медвежуком, который устроил себе логово в развалинах ратуши. В пустых остовах домов прятались плотоядные параспрайты, звёздные пауки или даже кокатрисы. А ещё была большая медведица, мать дюжины молодых детёнышей, которые всё ещё жили в пределах самого Вечнодикого леса, но сделали недавно покрывшийся лесом Понивилль частью своих охотничьих угодий. Огромная, усыпанная звездами громада матери-медведицы сливалась с ночным небом.\n\nКэррот Топ наблюдала как медведица исчезает в предместьях города. Она задумалась о том, как изменится топография города после визита большой медведицы. На рассвете она отправится на новый фермерский рынок, построенный на остатках Барньярд Баргэинс, и будет продавать там морковь тем немногим пони, которые всё ещё называли Понивилль своим домом.\n\nЭто не будет лёгким путешествием. Сначала ей придётся обойти ферму семьи Перл, где окопался взвод пехотинцев-чейнджлингов, брошенный позади во время панического бегства армии. Иногда, когда она чувствовала себя особенно храброй, она подползала настолько близко, насколько она осмеливалась. Она подслушивала разговоры застрявших там чейнджлингов, слушала, как они препираются между собой и мечтают вернуться на свою холодную северную родину. Что-то в окружающей магии, пропитавшей воздух, не давало им менять обличье.\n\nПонивилль не был ничейной землей. Некоторые звери, бродившие по улицам, не испугались бы одинокого пони, даже их рядов бойцов зебры Зекоры. Экспедиция лесных партизан в город закончилась резней, когда в центре города они спровоцировали медвежука. Они, хоть и отрезанные от остальной части Эквестрии, всё ещё были верны гармоническому сопротивлению и лелеяли мечты о Понивилле, восстановленном в своём прежнем великолепии в качестве оплота дружбы. Между ними и сторонниками Зекоры существовало непрочное перемирие. Ни одна из сторон не претендовала на пустой замок Дружбы, хотя это было единственное строение в городе, не тронутое лесом. Некоторые из его окон были широко распахнуты, призывая безрассудных зайти внутрь.\n\nБольшая часть оставшегося населения Понивилля жила на единственной улице, отгороженной от остального города баррикадами, которые охраняли осторожные пони с дробовиками и вилами. Стены были снесены, чтобы создать проходы среди рядов домов. Сейчас в каждой комнате жило по одной семье. В подвале находилась школа, которая импровизированно обучала жеребят и кобылок общины. Кэррот Топ предпочитала уединение своей морковной фермы, но была счастлива вести дела с выжившими. Они были её друзьями, и её поставки моркови, хотя и недостаточно регулярные, были способом показать, что она всё ещё заботится о своих бывших соседях."
changelings_paxchrysalia.418.a:0 "Мир меняется, но друзья остаются прежними."

changelings_paxchrysalia.419.t:0 "Более странно, чем фанфики"
changelings_paxchrysalia.419.d:0 "ЗАКЛЮЧИТЕЛЬНЫЙ ДОКЛАД ОТНОСИТЕЛЬНО ТРАЙСА ФОЛИ, БЫВШЕГО ФИЗИКА-ТЕОРЕТИКА ИНСТИТУТА ПЕРЕДОВОЙ ФИЗИКИ Г. ВРАКСА:\n\nПредставлено на рассмотрение, только для В.О. Кладисиума.\n\nДва месяца назад доктор Трайс Фоли, физик-теоретик института передовой физики города Вракса, был захвачен нашими агентами для проведения широкого психологического теста после того, как в агентство просочились подробности его работы. В лаборатории нашлись записи, содержимое которых можно описать только как бред индивидуума, находящегося на грани серьезного психического срыва. Его записи включали гипотезы о разрушении Замка Дружбы в Понивилле с помощью теоретической гипермагической сингулярности, которая увеличила бы локальную гравитацию в городе до более чем 50 000 G в радиусе 30 метров от бесконечно малой точки внутри замка, что мгновенно уничтожило бы его. Хотя его работы посчитали непрактичными и противоречащими всем известным законам физики и магии, мы считаем, что некоторые другие его исследования заслуживают особого внимания со стороны УОБВ.\n\nОдна из больших папок была заполнена гипотезами о возможном расширении Вечнодикого леса из-за его нестабильных и неисследованных магических свойств. Учёный предположил, что если лес будет магически расширяться, то текущих возможностей армии будет недостаточно для сдерживания его роста. Трайс предположил, что лишь целенаправленные бомбардировки с использованием биологических, химических и ядерных боеприпасов смогут сдерживать рост леса. В других частях его записей обсуждается эффективность развёртывания бронепоездов в качестве мобильных оперативных баз, а также создание специальных егерских отрядов для операций в Вечнодиком лесу. Эти опасения должны быть доведены до сведения командования армии в том случае, если произойдет самое худшее. Хотя, как указано в данных докладах, это представляется маловероятным развитием событий.\n\nЧто же касается психологического состояния доктора, то здесь мы почти ничего не добились. Он редко бывает достаточно адекватен для прямого допроса и с трудом выполняет базовые вещи вроде еды, питья, сна и гигиены. Похоже, что психику доктора можно восстановить только с помощью многолетней психологической терапии. Мы рекомендуем поместить его в учреждение, где он сможет прожить оставшееся ему время, вместо того, чтобы тратить время и усилия на восстановление его разума без гарантий на успех."
changelings_paxchrysalia.419.a:0 "Подпись: Полковник-Психолог Мэйфлай."

## Canterlot Finale ##
changelings_paxchrysalia.500.t:0 "Добро пожаловать в Кантерлот!"
changelings_paxchrysalia.500.d:0 "[CHN_GetAlcippeRank] Алкиппе поприветствовала двух чейнджлингов, что вышли из бронепоезда. Их телохранители стремительно заняли позиции по всей платформе и сделались практически невидимыми. — Добро пожаловать, генерал-оберштабсарцт! — Весело сказала она первому чейнджлингу, тряся его копыто. Затем она кивнула второму и поприветствовала его с такой же радостью, почти переходящей в энтузиазм. — И Финикус Весали, президент компании «Мейн-Хайв Индастриз». Надеюсь, ваша поездка прошла без происшествий?\n\n— Как обычно без происшествий, — заметил генерал-оберштабсарцт Марсилио. — И я рад такому исходу. Я бы предпочёл позволить армии разбираться с партизанами, подрывающими рельсы, чем лично сходить с них.\n\n— А где же новый губернатор? — Спросил Финикус, оглядываясь вокруг. — Он слишком важен и занят, чтобы встретить нас сейчас?\n\nАлкиппе уловила легкомысленный и дразнящий тон в голосе Финикуса и поэтому ответила ему лёгкой улыбкой вместо резкой и хмурой. — К сожалению, повышение для Яхса означало лишь то, что ему нужно делать в два раза больше бумажной работы за половину прежнего времени. Теперь он должен уделять внимание и гражданским делам Эквестрии, а не только операциям армии. Но к обеду он будет свободен, и тогда мы сможем его поздравить.\n\n— Так что же нам делать всё это время? — Спросил Финикус. — Я не для того ехал так долго в поезде, чтобы просидеть тут ещё восемь часов.\n\n— Как насчёт экскурсии по городу? — Спросила их Алкиппе. — После окончания войны мы часто бывали в Кантерлоте, но лишь по делам. Я думаю, что пришло время немного расслабиться и осмотреть достопримечательности, не будучи ограниченной какой-то официальной миссией."
changelings_paxchrysalia.500.a:0 "Звучит просто отлично!"

changelings_paxchrysalia.8500.t:0 "Встреча с новым старым губернатором"
changelings_paxchrysalia.8500.d:0 "Алкиппе встала, увидев разрешающий это кивок адъютанта, и жестом пригласила Марсилио и Финикуса сделать то же самое. При этом она изо всех сил старалась подавить свой зевок: путешествовать целый день по Кантерлоту, конечно, весьма забавно, хотя и утомительно. Было приятно побывать в архивах Кантерлота и старых музеях города, даже если передвижение по Кантерлоту было довольно напряжённым. Она, конечно же, не упустила из виду, как телохранители силой освободили эти места от всех присутствовавших там пони ещё до их прибытия. Просто предосторожности на всякий случай...\n\nНо сейчас всё это было совершенно неважно: пришло время поприветствовать нового губернатора Кантерлота. Поэтому, ведя своих друзей к двери генерала-майора Яхса, она постучала в неё лишь раз, прежде чем ворваться внутрь с весёлым выкриком: — Поздравляю!\n\nЯхс подскочил на своём стуле, явно удивлённый внезапным появлением. Ситуацию не успокоило и то, что Финикус громко открыл бутылку шампанского со звуком, похожим на выстрел. Однако, увидев, что внутрь вошли его друзья, Яхс радостно вздохнул и встал. — Не пугай меня так, — поддразнил он Алкиппе. — Я думал, что чиновники королевы вернулись ради второго раунда.\n\n— Головорезы Криззи ведь не принесли бы шампанское, верно? — Спросил Финикус, быстро разливая шипучий напиток по четырём стаканам и раздавая их присутствующим. — Поздравляю с новым званием. Хотя, насколько я поняла, вы бы предпочли обойтись без повышения, да?\n\n— Это немалая честь, даже если ответственность этой должности пугает, — Признал Яхс. — Теперь я должен не только координировать стратегию армии по всей Центральной Эквестрии, но и заниматься гражданскими делами. По крайней мере, в этом мне сможет помочь Алкиппе.\n\n— А я займусь лабораториями и продолжением исследований тут, в Кантерлоте, — сказал Марсилио. — Тебе не придётся беспокоиться об этом.\n\n— Это хорошо, — сказал Яхс. Затем он приподнял бровь и посмотрел на Финикуса. — А что привело президента и генерального директора «Мейн-Хайв» в Кантерлот?\n\n— Ну, официально я тут в качестве директора штаб-квартиры «Мейн-Хайв» в Кантерлоте, — начал Финикус, но тут же добавил, подмигнув. — Но на самом деле мне просто был нужен отпуск. Жукам нужно иногда расслабляться, понимаете? — Затем он поднял свой бокал. — Так чего же мы ждем? Мы поднимем тост за нового губернатора или нет?"
changelings_paxchrysalia.8500.a:0 "Поздравляем, [CHN_GetJachsRank]!"

changelings_paxchrysalia.501.t:0 "Старые добрые деньки"
changelings_paxchrysalia.501.d:0 "Последние несколько недель были полны такой бешеной активности, что [CHN_GetJachsRank] Яхс едва мог заметить смену дней. Его повышение до губернатора Кантерлота было одновременно и шансом, что выпадает раз в жизни, и невероятной ответственностью, что легла на его плечи. Одной из вещей, которой он пожертвовал ради гладкой работы на новой должности, был хороший ночной сон.\n\nНо когда он сидел на балконе, наслаждаясь видом на Кантерлот со стаканом виски, его мысли начали возвращаться к более простым временам. Просто невероятно думать о том, какой путь он прошёл от полковника 96-й пехотной дивизии, известной в просторечии как "Das 96-й". От полковника, брошенного в одну из самых тяжёлых и отвратительных битв за всю войну, до губернатора Кантерлота и всей Центральной Эквестрии... просто удивительно, как быстро летит время.\n\nМысли про старую 96-ую заставили Яхса вспомнить о солдатах, с которыми он служил раньше. Все они прошли через наихудшие проявления современной войны, но каким-то образом выжили. Они видели всё – от осады Акорниджа до бомбёжки Клаудсдейла и падения Кантерлота. Многие из его старых товарищей вернулись к гражданской жизни в конце войны, часть назначили командовать другими дивизиями, а некоторые даже стали частью королевской гвардии. А из-за необходимости демобилизации 96-ая дивизия, как одна из самых пострадавших, была расформирована. Мир сделал то, что не удалось войне: солдат 96-ой дивизии раскидал по свету ветер. Это была мрачная мысль – знать, что они никогда не будут служить вместе в эти новые мирные времена.\n\nНо было ли это так на самом деле? Яхс нахмурился, глядя в свой стакан. Его недавнее повышение по службе, как бы он ни сетовал по своей ответственности, открыло двери, которые давно были закрыты перед ним. Он мог принимать окончательные решения по поводу всего, что происходило в Кантерлоте, который он теперь непосредственно контролировал. В старой столице побежденной страны он мог делать всё, что хотел.\n\nТак что же теперь его останавливает?"
changelings_paxchrysalia.501.a:0 "Посмотрим к чему могут привести несколько телефонных звонков..."

changelings_paxchrysalia.8501.t:0 "Собирая старую команду"
changelings_paxchrysalia.8501.d:0 "[CHN_GetAlcippeRank] Алкиппе вышла на балкон, держа магией досье перед собой. — [CHN_GetJachsRank]... Что всё это все такое? — спросила она, откладывая бумаги в сторону и поворачиваясь к Яхсу, который, казалось, со спокойным интересом наблюдал за облаками, нависшими над городом. — Мы обрабатывали документы о повторном зачислении в армию очень многих ветеранов... Вы что-то задумали?\n\n— Старый жук просто вспоминает славные деньки, — сказал Яхс, взглянув на Алкиппе и приглашая её садиться. – Я хочу посмотреть и узнать, кто из них всё ещё здесь и заинтересован в том, чтобы приехать в Кантерлот и что-то изменить.\n\nАлкиппе подавила свой небольшой смешок. — Ты точно не старый жук, Яхс, — сказала она. — А что ты имел в виду, говоря: «Приехать в Кантерлот и что-то изменить»?\n\n— Нам нужно больше жуков вроде нас в Кантерлоте, — объяснил Яхс. — Нам нужны чейнджлинги, которые не лезут вон из кожи ради королевы и страны. Нам нужны чейнджлинги, готовые найти баланс между благом ульев и пони, которыми мы правим. Сейчас в армии полно ревностных новобранцев и фанатиков. Они идеально подходят для гвардии королевы, но не для поддержания мира. И если я смогу собрать своих товарищей из старой 96-ой дивизии под моим командованием... если я смогу заставить нас стать образцом того, как чейнджлинги должны вести себя в Эквестрии... тогда я думаю, что у «Пакс Кризалии» появится шанс вы выживание.\n\n— Но откуда ты знаешь, что они все будут разделять твоё мнение, Яхс? — Спросила Алкиппе. — Война – это одно, но мир... это совсем другое дело.\n\n— Во время Великой войны нас семь раз наказывали за то, что мы были слишком снисходительны к пленным, — сказал Яхс, хмуро глядя на горизонт. — Мы были настолько умеренны и терпимы в этом, насколько это вообще было возможно для дивизии. И я очень сомневаюсь, что то, что видели мои старые товарищи после окончания войны, ожесточило их сердца вместо того, чтобы вновь подтвердить наши убеждения.\n\nОн смотрел прямо на Алкиппе, словно заглядывал ей прямо в душу. — Нам совсем не обязательно наступать сапогами на шею пони. Я снова соберу 96-ую, и мы покажем чейнджлингам и пони, что оккупация не обязательно означает угнетение."
changelings_paxchrysalia.8501.a:0 "Армии нужны умеренные чейнджлинги не только среди офицеров."

changelings_paxchrysalia.9501.t:0 "Солдаты Кантерлота"
changelings_paxchrysalia.9501.d:0 "Понадобилось некоторое время, всё же Яхсу удалась его задумка. Непрерывная череда телефонных звонков, телеграмм и личных встреч вели к этому моменту. А получить официальное разрешение от самой королевы было проще всего. Яхс просто представил ей бумагу на подпись и заявить, что этот приказ предназначен для набора большего количества солдат в гарнизон Кантерлота и поддержания мира. Кризалис было всё равно, кого хочет Яхс, когда он пообещал ей, что в столице пони будет больше солдат-чейнджлингов. Ей нравилось смотреть на маленькие цифры в бумагах и смеяться, когда математика была на её стороне, вместо того, чтобы подробно изучать смысл этих цифр.\n\nИ вот теперь, когда на площади Солнца стихли фанфары труб и топот копыт, [CHN_GetJachsRank] Яхс ступил на трибуну в своем лучшем парадном мундире. Он был совершенно новым и сшитым специально для этого случая. Яхс лишь позволили себе сохранить старую нашивку 96-ой дивизии от предыдущей формы и нашить её на новую. Перед ним стояли чейнджлинги 96-ой "Кантерлотской" пехотной дивизии, где примерно половина солдат – включая большую часть сержантов и офицеров – состояла из членов первоначальной дивизии, а другая половина была новичками, которых Яхсу рекомендовали разделяющие его идеи единомышленники. Они были впечатляющей и прекрасной силой, и Яхс знал, что эти солдаты заставят его гордиться ими.\n\nУ него есть поддержка целой дивизии, так что настало время изменить «Пакс Кризалия» к лучшему. И начать стоит с Кантерлота."
changelings_paxchrysalia.9501.a:0 "Служить справедливо и преданно, всем без исключений."

changelings_paxchrysalia.502.t:0 "Смена гвардии"
changelings_paxchrysalia.502.d:0 "— Шевелитесь, шевелитесь! Двигайте ногами, кобылки! Вы называете это маршем? вы считаете это простой прогулкой? Партизаны не сдадутся, если вы попросите у них разрешения арестовать их!\n\nКоммандант Секонд Винд нахмурился, наблюдая, как новобранцы новоиспеченной кантерлотской гвардии безуспешно пытаются маршировать вперёд и назад по плацу позади кантерлотского замка. Всё в них было насмешкой над настоящей Королевской Гвардией Кантерлота, элитным полком, к которому он сам принадлежал до того, как чейнджлинги выиграли войну и уничтожили старую гвардию. Доспехи, в которые были облачены его новые рекруты, были покрыты золотом, чтобы напоминать золотую форму старой королевской гвардии, но посередине была нарисована толстая чёрная полоса, которая как будто разделяла каждого пони на две части. И вместо герба Сестёр на воротнике и боках формы теперь красовался трезубец чейнджлингов. Если бы Сёстры были здесь, им было бы стыдно за унижение их королевской гвардии жуками. Может быть, в этом и был смысл.\n\nНо Секонд Винду было все равно. До войны королевская гвардия была для него бесперспективной работой. У него не было достойной родословной, необходимой для карьеры в её рядах, поскольку сам он не вёл свой род из знатной семьи. А продвижение Секонд Винда по службе незадолго до окончания войны было вызвано лишь отчаянием, порожденным ухудшением ситуации на фронте. Он не испытывал любви к единорогам-аристократам, заполнившим верхние эшелоны Королевской гвардии, и, возможно, именно поэтому он стал самым высокопоставленным офицером, перешедшим из несуществующей Королевской гвардии в новую кантерлотскую гвардию. Теперь-то уж точно жаловаться было почти не на что. Ему нужно было лишь слушать жуков, и те давали ему почти полную свободу действий в формировании кантерлотской гвардии согласно собственным желаниям.\n\nВозможно, победа чейнджлингов в войне всё же не была такой уж плохой вещью."
changelings_paxchrysalia.502.a:0 "— Прибавьте шагу и следите, чтобы оставаться в своей проклятой шеренге!"

changelings_paxchrysalia.8502.t:0 "Именной детерминизм"
changelings_paxchrysalia.8502.d:0 "Секонд Винд встал и отдал честь, когда [CHN_GetJachsRank] Яхс приблизился к столу в дальнем конце бара. — [CHN_GetJachsRank]. Рад тебя видеть, — сказал пегас, склонив голову в знак уважения к своему начальнику-чейнджлингу. В конце концов, своим новым положением он был обязан распоряжениям Яхса.\n\n— Коммандант, — сказал Яхс, сняв свою шляпу и бросив её на стол, прежде чем сесть. — Пожалуйста, присаживайся. Ты, наверное, весь день был на копытах.\n\n— Я не ожидал, что так долго провожусь с новобранцами. Я потратил целую кучу времени, чтобы просто научить их хоть как-то маршировать в строю, — признался Секонд Винд, садясь напротив [CHN_GetJachsRank]а. — Большинство пони с военной подготовкой просто не осмелились бы записаться в кантерлотскую гвардию. А большинство моих товарищей по старой гвардии, вероятно, содрали бы с меня шкуру заживо, если бы узнали, как я устроился в послевоенной жизни.\n\n— Ну, после окончания войны, ты определенно добился большего, чем многие, – сказал Яхс. Он хихикнул, когда ему в голову пришла одна мысль, и он покачал головой. — Разумеется, я читал твоё досье. Мне кажется забавным, что пони по имени Секонд Винд, который вывозил раненых товарищей из зоны боевых действий на голой спине так и не получил признания от своего старого начальства, но оказался во главе совершенно нового учреждения при новом режиме.\n\n— Полагаю, это вполне уместно, — сказал Секонд Винд, пожимая плечами. — Мне всегда казалось забавным, как работают наши имена, хотя я и не так сильно верю в их пророческую силу, как большинство. Очень жаль, что под моим командованием нет пони по имени Лонг Марш или Парейд Формэйшн.\n\nОба усмехнулись, объединённые духом товарищества в этот момент, но вскоре Секонд Винд начал медленно хмуриться. — Что же мне сейчас делать, [CHN_GetJachsRank]? — Спросил он Яхса. — Да, надо признать, что я не очень-то любил королевскую гвардию, но Эквестрия по-прежнему мой дом. И я ненавижу видеть, как она страдает, а когда я сам тренирую новые войска, то чувствую себя частью этой проблемы. — Винд болезненно скривился и посмотрел на Яхса, ожидая ответа. — Так что же мне теперь делать?"
changelings_paxchrysalia.8502.a:0 "Не высовывайся и постарайся использовать всё, что у тебя есть."
changelings_paxchrysalia.8502.b:0 "Статус-кво не должен обязательно являться правильным положением вещей."

changelings_paxchrysalia.503.t:0 "Кантерлотские архивы"
changelings_paxchrysalia.503.d:0 "— Да, Финикус, это раздражает, но я надеюсь, что однажды архивы Кантерлота станут жемчужиной знаний, известной во всём мире.\n\nГенерал-оберстабсарцт Марсилио сделал глоток мимозы, приготовленной для него Финикусом. Оба чейнджлинга в данный момент сидели на балконе третьего этажа его нового поместья. Это было столь впечатляющее здание, что даже ученый, больше озабоченный своими исследованиям, чем анализом кантерлотской архитектуры, смог оценить здание по достоинству. Многие дворяне сбежали из Кантерлота задолго до того, как армия чейнджлингов приблизилась к подножию горы, и теперь все их древние фамильные дома были проданы с аукциона по очень низкой цене. Финикус, конечно же, не терял времени даром, и использовал полученную во время войны прибыль для покупки самого лучшего из особняков.\n\n— Не понимаю что тут особенного, — отмахнулся Финикус. — Архивы – это такая же добыча, как и всё остальное в этом городе. И конечно победители будут сражаться за самые лакомые кусочки.\n\n— Но это бесполезно для всех: как для чейнджлингов, так и для пони, — сказал Марсилио. — На бумаге архивы должны были быть открыты для всех существ, желающих ознакомиться с хранящимися там знаниями. Однако армия рыщет в архивах в поисках крупиц знаний о тёмной магии и давно потерянном оружии и заклинаниях, а корпорации, подобные твоей, заполняют ящик за ящиком эзотерическими томами, которые отправляются обратно в ульи. Я сомневаюсь, что эти книги когда-нибудь снова увидят свет, если в них найдётся хоть что-то интересное.\n\n— Этот просто бизнес, — отмахнулся Финикус. Но когда Марсилио нахмурился, промышленник прикусил губу и наклонился чуть ближе к своему другу. — Но... даю тебе слово, что позабочусь о том, чтобы всё вернулось в архив целым и невредимым, когда мы закончим с этим делом."
changelings_paxchrysalia.503.a:0 "Нет ничего более могущественного, чем знания, и каждый хочет получить их частичку."

changelings_paxchrysalia.504.t:0 "Тройная угроза"
changelings_paxchrysalia.504.d:0 "— Сколько сегодня?\n\nЭтот вопрос Яхс всегда первым задавал Алкиппе по утрам, когда она приносила ему нужные вещи. Предметом обсуждения были чёрные папки, которые Алкиппе положила поверх стопки. Эти папки, чёрные, как ночное небо, содержали информацию об угрозах, критически важных для поддержания стабильности и функционирования Кантерлотского комиссариата. Обычно их не было, хотя иногда она приносила одну или две. Но вот сегодня...\n\n— Три, — сказала Алкиппе, кладя стопку на стол Яхса и поднимая три верхние. — Зачитать их вам, [CHN_GetJachsRank]?\n\nБрови Яхса поднялись на этих словах. — Три? Ну что же, продолжайте. Кратко, если сможете.\n\nАлкиппе кивнула и, открыв первую папку, быстро просмотрела её содержимое. — Послание от УОБВ, — начала она. — Они считают, что раскрыли подпольное общество сторонников превосходства единорогов здесь, в Кантерлоте. Они называют себя обществом «Рога изобилия». УОБВ собирается усилить свои операции, чтобы выяснить больше подробностей, но пока они бы хотели, чтобы и вы знали.\n\nОна отложила эту папку в сторону и взяла следующую. — Письмо от нескольких обеспокоенных горожан, а также рапорт от королевской гвардии. Горожане утверждают, что на нижних уровнях Кантерлота существует какой-то подпольный наркопритон, вызывающий беспорядки; а королевская гвардия считает, что они являются частью ячейки гармонического сопротивления, и требуют, чтобы вы сделали что-то с этим, прежде чем сама королева посетит Кантерлот для своей великой коронации.\n\nЗатем Алкиппе схватила последнюю папку и нахмурилась, глядя на слова внутри. — А это... это письмо от Финикуса с предложением попробовать этот новый "любовный притон", который он нашел в нижнем Кантерлоте. — Она отшвырнула эту папку в сторону. — Значит, у нас есть только две важные вещи. Нам нужно напомнить Финикусу, чтобы он не использовал срочные папки для своей личной почты...\n\nЯхс задумчиво почесал подбородок. — Культ сторонников превосходства, убежище сопротивления и притон наркоманов... сколько ты хочешь поставить на то, что они все как-то связаны?"
changelings_paxchrysalia.504.a:0 "Я не думаю, что соглашусь на это пари, сэр."

changelings_paxchrysalia.8504.t:0 "Юникорния Блюз"
changelings_paxchrysalia.8504.d:0 "Это был, мягко говоря, весьма напряжённый день, и Яхс был более чем счастлив наконец вернуться домой к ночи и снять свою шляпу. Последние несколько дней он наблюдал за противоповстанческой операцией по проникновению и уничтожению этого так называемого общества «Рога Изобилия», и у него не осталось абсолютно никаких опасений, что что-то пойдет не так. Войска были неплохо обучены, а оперативный план хорошо продуман и многократно отточен после множества иных уже проведённых операций по борьбе с повстанцами. Это была не первая ячейка Яхса, которую он должен был уничтожить во что бы то ни стало. Хотя к этому моменту он уже начал задаваться вопросом о том, когда же у него, наконец, появится шанс покончить с последней ячейкой. Если ему повезет, то может быть и скоро.\n\nОднако, когда он открыл дверь в свою спальню, то с удивлением заметил письмо, лежащее на подушке. Сгорая от любопытства, он придвинул его поближе магией и внимательно осмотрел. Там не было ничего, что указывало бы на отправителя или то, как попало сюда. На конверте была написана простая фраза: «губернатору Кантерлота». Нахмурившись, Яхс открыл конверт и вытащил оттуда изящный листок бумаги, на котором были аккуратно выведены два предложения:\n\n«Общество сердечно приглашает вас посетить наше следующее собрание, которое пройдёт в 2 часа ночи во время следующего новолуния. Приходите в одиночку на угол улиц Бит и Бридл в нижнем городе».\n\nКонечно, это было весьма зловещее послание, и на следующий день Яхс решил обсудить его с Алкиппе и Марсилио. Объяснив им ситуацию и прочитав содержание письма, [CHN_GetJachsRank] хотел услышать соображения его подчиненных по этому поводу.\n\nАлкиппе, разумеется, тут же отрицательно помотала головой. — Это слишком рискованно, — сказала она. — Это определенно ловушка. Они ведь партизаны, верно? Они хотят встретиться с вами только для того, чтобы убить вас, это точно.\n\n— Мы не знаем, партизаны ли они. По крайней мере, не совсем уверены, — заметил Марсилио. — По правде говоря, мы вообще пока не знаем, что именно представляет из себя это общество «Рог изобилия». И всё же я должен согласиться с Алкиппе. Это слишком опасно. Ничего хорошего из этого точно не выйдет."
changelings_paxchrysalia.8504.a:0 "Вероятно... вероятно не выйдет."

changelings_paxchrysalia.505.t:0 "Отель Калихорния"
changelings_paxchrysalia.505.d:0 "[CHN_GetJachsRank] Яхс поднялся на крышу ближайшей радиостанции, где высота здания давала ему прекрасную возможность наблюдать за операцией, которая должна была состояться в нескольких кварталах чуть дальше по улице. [CHN_GetAlcippeRank] Алкиппе сопровождал его вместе с отрядом связистов, которые должны были держать их в курсе предстоящего сражения.\n\nНиже по улице несколько отрядов чейнджлингов уже направились к предполагаемой штаб-квартире общества «Рог изобилия» – отелю Калихорния. Отклонив приглашение общества, Яхс проанализировал карту местности, прилегающей к пересечению Бит-Стрит и Бридл-авеню, и пришёл к выводу, что роскошная, но всё ещё закрытая гостиница могла бы стать идеальным штабом для ячейки сопротивления, действующей прямо у него под носом. Инфильтраторы подтвердили активность пони в предположительно пустующем здании, и это было всё, что требовалось Яхсу для начала операции. Теперь его солдатам придётся захватить отель и достать всё ценное имущество, которое они смогут найти внутри.\n\nНо сначала солдатам нужно было добраться до отеля. Когда они были на полпути к месту назначения, стекло разлетелось вдребезги от множества выстрелов и на улице вспыхнула перестрелка. Солдаты рассредоточились, ныряя в любые доступные им укрытия, когда из высоких зданий по обеим сторонам открыли огонь мятежники.\n\nАлкиппе повернулась, чтобы бросить на Яхса обеспокоенный взгляд, но [CHN_GetJachsRank] не сводил глаз с улицы внизу. Теперь им лишь оставалось наблюдать и ждать."
changelings_paxchrysalia.505.a:0 "Мы должны верить в наших солдат."

changelings_paxchrysalia.8505.t:0 "Конец отеля Калихорния"
changelings_paxchrysalia.8505.d:0 "Не теряя ни секунды, солдаты-чейнджлинги разделились на две группы: первая группа бросилась в соседние здания, выбивая двери и разбивая окна, чтобы ворваться внутрь, а вторая группа взлетела и начала прикрывать их огнём, прежде чем долететь до крыш и закрепиться на возвышенностях. За пыльными окнами вспыхивали выстрелы, когда солдаты и партизаны вступали в ближний бой, и хотя у пони была надёжная и подготовленная оборона, солдаты-чейнджлинги были хорошо обучены, дисциплинированы и двигались как единое целое. Здание за зданием, комната за комнатой солдата Яхса уничтожали сопротивление, смело продвигаясь вперёд под безжалостным огнём пулеметов. Даже без поддержки бронетехники чейнджлинги были не по зубам партизанам, и пони начали отступать.\n\nКазалось, что прошла целая вечность, но вскоре за отрядами солдат начали двигаться пожарные команды. Закрепившись на своих позициях и подготовив заряды для прорыва во внутренние помещения, отряды снова приготовились пойти на штурм. Но, прежде чем они успели это сделать, отель содрогнулся от взрывов в подвале. Всё здание начало раскачиваться, когда его фундамент рухнул. Солдаты-чейнджлинги бежали так быстро, как только могли, преследуемые падающим мусором, и вскоре всё восьмиэтажное здание превратилось в лавину бетона и цемента, лавиной несущуюся вниз по улице. Страшный грохот сотряс весь город, и в воздух поднялось облако сухой и удушливой пыли. Алкиппе прикрыла свою изумленную морду, а Яхс недоверчиво наблюдал за происходящим. А когда пыль наконец осела, от отеля «Калихорния» не осталось и следа.\n\nНаконец Яхс повернулся к радисту, стоявшему рядом с ним. — Начинайте отзывать подразделения, и пусть поисково-спасательные службы просеивают обломки в поисках пропавших, — приказал он. – Сегодня наш день.\n\nРадист сделал, как ему было велено, и Яхс просто смотрел, как оседает пыль, когда его солдаты, хромая, покидают место кровавой бойни. Они победили, но отель был полностью разрушен. Если Яхс и надеялся побольше узнать об этом обществе «Рога изобилия», теперь эти надежды исчезли навсегда.\n\nНе то чтобы это имело большое значение. Ещё одна ячейка сопротивления была уничтожена, и королева может спокойно отправиться в Кантерлот ради своей грандиозной коронации."
changelings_paxchrysalia.8505.a:0 "И всё это за один день."

changelings_paxchrysalia.506.t:0 "Заигрывания с эзотерикой"
changelings_paxchrysalia.506.d:0 "— Я всё ещё не понимаю, зачем вы это делаете, [CHN_GetJachsRank]. Это очень, очень опасно.\n\nЯхс, стоящий на углу Бит-Стрит и Бридл-Авеню, освещенным лишь мерцающим уличным фонарем над головой, нервно ёрзал. Он накинул тяжёлый плащ, но даже это не остановило холод, который, казалось, пробирался прямо под его экзоскелет. Ночь была слишком тихой, слишком спокойной, и даже присутствие егерей в соседних зданиях и Алкиппе, разговаривающей с ним через наушник, не очень-то успокаивало [CHN_GetJachsRank]а.\n\n— Я должен знать, — сказал Яхс, хмуро глядя на пустынные дороги. Микрофоны, встроенные в его одежду, улавливали его голос и передавали его обратно Алкиппе, позволяя им общаться на расстоянии. — Мне нужно знать, что всё это значит на самом деле. Кроме того, было бы невежливо отказаться от приглашения.\n\n— Дать себя убить было бы весьма грубо по отношению ко мне, — проворчала Алкиппе, и в её голосе зазвучали странные нотки, которые тут же исчезли. — Если вы попадете в беду, то превратитесь во что-нибудь сильное и выбирайтесь оттуда. Егеря доберутся до вас за шестьдесят секунд, а через пять минут у вас будет машина, готовая отвезти вас обратно во дворец.\n\n— Я всегда могу рассчитывать на тебя, не так ли? — Яхс слегка усмехнулся, а затем вздохнул, пытаясь избавиться от части нервного напряжения. Он взглянул на часы на передней лапе и нахмурился, когда секундная стрелка медленно сделала ещё один оборот вокруг циферблата. Было около двух часов ночи. Где же это так называемое общество «Рога изобилия»?\n\nДалекие колокольные башни начали играть мрачную мелодию, прежде чем закончить её двумя гулкими ударами, которые, казалось, эхом разнеслись по всему спящему городу навсегда. И именно тогда Яхс услышал слабое урчание приближающегося двигателя. Он осмотрел весь перекресток, а также прилегающие улицы, но ничего не увидел. Может быть, машина ехала в соседнем квартале...?\n\nЗатем он услышал рокот двигателя прямо перед собой, и в воздухе замерцала магия, из которой, как мираж в пустыне, появился белый автомобиль. Яхс моргнул и потёр глаза, дабы убедиться, что ему ничего не мерещится. Но машина всё ещё стояла на дороге, ожидая его. И пока он смотрел, задняя дверь открылась сама по себе, открывая его взору пустое сиденье."
changelings_paxchrysalia.506.a:0 "Похоже, что машина приехала за мной..."

changelings_paxchrysalia.1506.t:0 "Общество «Рог изобилия»"
changelings_paxchrysalia.1506.d:0 "— Ну, пока всё выглядит нормально...\n\nЯхс отошёл от столба и нерешительно приблизился к ожидавшей его машине. Он осторожно заглянул внутрь и обнаружил, что пассажирская часть салона отделена от водителя декоративной панелью. Сзади никого не было, и поэтому, глубоко вздохнув, Яхс уселся. — А куда мы едем? — спросил он вслух, но ответа так и не получил. Вместо этого дверь за ним закрылась, и он почувствовал, как машина начала ускоряться. Когда он попытался выглянуть из окна машины, то увидел только кружащиеся ночные звёзды, но не здания Кантерлота. Тот, кто зачаровал эту машину, проделал безупречную работу; Яхс практически ощущал магию, витающую в воздухе.\n\nПоездка была недолгой, но Яхс быстро потерял чувство направления, когда машина сворачивала от одного квартала к другому. Но наконец она остановилась, и дверца машины снова открылась сама по себе. Яхс на мгновение заколебался, ожидая, что появится пони с винтовкой окрасит заднее сиденье в цвет его крови, но ничего подобного не последовало, так что Яхс вышел из машины и огляделся.\n\nПоходе, что он был в каком-то гараже, единственным украшением которого были пятна воды на стенах и мусор в разных углах помещения. Это место выглядело так, будто оно уже было заброшено в течение некоторого времени, и единственным иным предметом в гараже была машина. Сгорая от любопытства, Яхс подошел к водительскому месту и заглянул через стекло, желая увидеть лицо пони, который привез его сюда, но с удивлением обнаружил лишь пустое сиденье. Неужели машина сама привезла его сюда?\n\nВ гараже была ещё одна достойная внимания вещь: простая дверь прямо перед машиной. Нахмурившись, Яхс медленно подошел к ней. — Я сейчас войду, — пробормотал он в микрофон. — Пожелай мне удачи.\n\nЗатем, глубоко вздохнув, Яхс постучал в дверь. На уровне глаз открылась щель, явив его взору пару глаз цвета глубокого аметиста. — Губернатор Яхс, — промурлыкал страстный голос, и он понял, что эти глаза улыбаются ему. — Это великая честь для меня. Минутку, если можно.\n\nЩель закрылась, и крепкие замки двери открылись один за другим. Затем она распахнулась внутрь, и на пороге показалась высокая кобыла-единорог в тонком платье, кокетливо улыбающаяся ему из-под маски. — Добро пожаловать в общество «Рог изобилия». Вы можете звать меня Глориосой. Пожалуйста, входите."
changelings_paxchrysalia.1506.a:0 "Прямиком в логово зверя..."

changelings_paxchrysalia.2506.t:0 "Тёплый прием"
changelings_paxchrysalia.2506.d:0 "Захлопнувшаяся за Яхсом дверь заставила его подпрыгнуть, когда он вошел в комнату, хотя чейнджлинг изо всех сил старался не показывать своего беспокойства. Стоявшая перед ним кобыла в маске внимательно оглядела его, её темно-фиолетовые глаза, казалось, пронизывали его насквозь. Затем она улыбнулась. Яхс, близко знакомый с ненавистью и страхом пони Эквестрии, никак не ожидал этой реакции. — Я хотела спросить: присоединишься ли ты к нам или нет, — сказала кобыла, хватая магией Яхса за пальто и ведя его вглубь здания. — Я чувствую, что мы так немало выиграем от общения друг с другом.\n\n— Я всегда готов поговорить, — сказал Яхс, нерешительно следуя за высокой единорожкой вглубь тёмных комнат. — Говорить гораздо лучше, чем драться, да и так страдает гораздо меньше существ.\n\nГлориоса хмыкнула. — Да, я склонна согласиться. И я верю, что вместе мы сможем сделать Кантерлот... чем-то особенным. — Они вошли на широкое открытое пространство, мягко освещённое красными и розовыми огнями. На ковре комнаты повсюду лежали плюшевые подушки и пустые стеклянные бутылки. По всей комнате валялись единороги в разных стадиях подпития, многие из них бормотали друг другу невнятные слова, другие же лениво хихикали, а ещё больше пони лежали без сознания на подушках и с улыбками на своих лицах. Глориоса провела Яхса мимо всех них, затем усадила его на краю комнаты и жестом копыта указала на остальных единорогов. — Мы и есть общество «Рог изобилия», — сказала она вместо приветствия. — Все мы единороги, кто-то родом из благородных домов, кто-то – нет. С учётом недавних событий – вроде Великой войны – наша численность в моем городе значительно возросла. Единороги ищут спасения... никто из нас не должен подчиняться другим расам, не говоря уже о других видах.\n\nЭта фраза заставила Яхса нахмуриться. — Если вы просите, чтобы я передал контроль над Кантерлотом вашему обществу, боюсь, мне придётся отказать вам, — заявил он. — Я пришел сюда, чтобы узнать о сути вашего "общества", и выяснить, может ли оно быть полезным для меня, а не для того, чтобы вы диктовали мне условия.\n\nУлыбка Глориосы не исчезла и даже ни разу не дрогнула; её было совершенно невозможно прочесть, да и позолоченная фарфоровая маска, закрывавшая верхнюю половину её лица, совсем не помогала в этом отношении. — Я понимаю, губернатор, и если бы я хотела получить контроль над Кантерлотом, то убила бы вас, а не беседовала. — Она сделала небольшую паузу, а затем подняла магией два бокалами Мартини и поставила их между ними. — Я делаю вам... предложение, — сказала она. — Это компромисс между вами и мной. Я думаю, что вы найдете его вполне удовлетворительным."
changelings_paxchrysalia.2506.a:0 "Хорошо... я хочу услышать его."

changelings_paxchrysalia.3506.t:0 "Скромное предложение"
changelings_paxchrysalia.3506.d:0 "— Единороги должны получить своё законное место в Эквестрии, — сказала Глориоса. — И оно не должно быть в самом низу. Мы не будем служить вам рабами вместе с пегасами и земными пони или, не дай Сёстры, фестралами. — Она вытащила пузырек с розово-фиолетовой жидкостью и налила по порции в каждый стакан. Розово-белый туман вырвался из пузырящегося варева, когда оно коснулось стекла, и выплеснулся за его края, как пар из охладительной системы. Яхс хмуро посмотрел предложенный ему странный напиток. — У общества есть лучшие из лучших из расы единорогов. У нас также есть способы... эвакуировать единорогов из неприятных ситуаций, в которой сейчас оказалось так много эквестрийцев. — Она жестом указала на стоящий перед ней бокал, а затем подняла его вверх своей магии. — Ты когда-нибудь задумывался, что произойдет, если взять любовь пони, очистить её и отдать обратно пони?\n\n — Я... не могу сказать, что знаю, — сказал Яхс, осторожно поднимая свой бокал.\n\n— Блаженство, — сказала Глориоса, закрывая свои затрепетавшие глаза. — Способ на время забыть о мире. Мы нашли способ усовершенствовать обработку любви. До этого не додумался даже ваш вид. Поэтому я предлагаю вам следующее: уменьшите нагрузку на единорогов в Кантерлоте. Дайте нам достойные посты по всему городу и в вашей администрации. Пусть единороги встанут рядом с чейнджлингами, а не на коленях перед ними, а взамен я дам тебе средства для достижения ваших амбиций. — Она покрутила стакан своей магией. — Озарение со дна бутылки.\n\n— А если я откажусь? — Спросил Яхс, приподнимая бровь. — А что, если я вместо этого прикажу армии расправиться с этим наркотическим притоном?\n\nНа этот раз улыбка Глориосы сменилась резким и хмурым взглядом. — Тогда мы будем сражаться так же яростно, как и остальные представители нашего вида, — сказала она. — И будут иные последствия.\n\nЗатем она жестом указала на бокал. — Мы договорились, губернатор?"
changelings_paxchrysalia.3506.a:0 "§CВзять§! напиток."
changelings_paxchrysalia.3506.b:0 "§RОтказаться§! от напитка."

changelings_paxchrysalia.4506.t:0 "Особое озарение"
changelings_paxchrysalia.4506.d:0 "— Яхс, не делай этого, — заорала ему в ухо Алкиппе. — Что бы ты ни собирался...\n\nЯхсу хотелось успокоить её, но он не мог этого сделать, не выдав того, что у него есть микрофоны. Вместо этого он окинул взглядом туманный напиток, который держал своей магией. — Ну... я поступил бы глупо, если бы отказался от помощи, — сказал Яхс, обращаясь и к кобыле в маске, и к Алкиппе. — Он поднял свой бокал. — Просто из вежливости. Не ждите, что я стану постоянным клиентом.\n\nГлориоса улыбнулась ему в ответ. — Конечно, — сказала она, хотя дразнящий тон её голоса ясно дал понять, что она не совсем ему верит. — За дружбу между губернатором Яхсом и обществом «Рога изобилия».\n\nОна поднесла бокал к губам, глубоко вдыхая клубящийся туман, а потом откинула голову назад и выпила переработанную любовь. Яхс на мгновение заколебался, задаваясь вопросом, не было ли это какой-то особо хитрой ловушкой, но потом он собрался с духом и сделал то же самое. Он чуть не закашлялся, когда почувствовал сладкий запах, а когда жидкость коснулась его губ, то практически задрожал, ощутив сладкий и пикантный вкус любви. Он заставил себя допить напиток, заметив, что Глориоса уже допила свой. Когда Яхс поставил свой бокал на стол, его магия мерцала и колебалась, пока тело чейнджлинга впитывало любовь, очищенную до невероятно высокой степени.\n\n— Наслаждайтесь, губернатор Яхс, — пробормотала Глориоса, откинув голову назад и прикрыв глаза. — Наслаждайтесь щедростью общества «Рог изобилия»..."
changelings_paxchrysalia.4506.a:0 "§CПозабыть§! о своих бедах..."

changelings_paxchrysalia.5506.t:0 "Мы живём в отеле Калихорния"
changelings_paxchrysalia.5506.d:0 "Яхс отшатнулся от стола неуклюжими и онемевшими копытами. Красные и розовые огни комнаты вспыхнули яркой радугой, а вялые единороги, лежащие вокруг, внезапно превратились в оживленных, хихикающих посетителей парка солнечным летним днём. Алкиппе что-то кричала ему на ухо, но её голос быстро превратился в пение птиц. В конце концов, Яхс больше не был на службе; он был рядом с прекрасным озером в Королевских Садах Кантерлота.\n\nОн обошёл вокруг озера из кристально чистой воды, чувствуя свежескошенную траву своими копытами. Прохладный ветерок делал жаркое летнее солнце вполне терпимым, и Яхс снял шляпу, бросив её на землю. Он остановился у пирса, что располагался у самой кромки воды, узнав стоящего там единорога. Точнее, чейнджлинга под маскировкой: он бесчисленное количество раз до этого видел, как Финикус использовал эту же самую личину жеребца-единорога. — Финикус? — спросил он, придвигаясь ближе. — Что ты здесь делаешь?\n\nФиникус удивленно обернулся, но на его морде появилась широкая улыбка, когда он увидел приближающегося Яхса. Его личина исчезла во вспышке зелёной магии, и два чейнджлинга встретились на середине пирса. — Яхс! А я всё думал, когда же ты ко мне присоединишься! — Финикус положил ногу на плечо Яхса и указал на толпу перед ними. — Посмотри на это... разве это не прекрасно? Это прекрасно, верно?\n\nЯхс оглянулся назад и его глаза расширились. Это был не тот уставший от последствий войны Кантерлот, к которому он так привык. Вместо пони, съежившихся под сапогами оккупантов, он видел пони и чейнджлингов, сидящих бок о бок, устраивающих пикники, поющих песни и наслаждающихся жизнью как равные между собой друзья. Он видел, как чейнджлинги сочиняли музыку, рисовали пейзажи и обсуждали загадочные философские вопросы. Исчезло гнетущее индустриальное общество ульев, где чейнджлинги изо всех сил трудились ради славы ульев и порочных капризов королевы, властвующей над своими подданными. Это была настоящая утопия, а не тот чудовищный кошмар, который представляло собой сегодняшнее общество чейнджлингов. А потом Яхс заметил, что у чейнджлингов, как и у их товарищей-пони, на боках были красочные картинки, знаки различия... \n\n— Верно... оно прекрасно, — сказал Яхс, с трудом подбирая слова. Он посмотрел в сторону и понял, что откуда-то достал ещё один клубящийся дымом напиток, а когда снова посмотрел на Финикуса, то заметил, что и его друг тоже держит бокал. Они одновременно поднесли бокалы к губам и запрокинули головы."
changelings_paxchrysalia.5506.a:0 "Мир может быть таким §Cиным§!..."

changelings_paxchrysalia.6506.t:0 "Похмелье"
changelings_paxchrysalia.6506.d:0 "Яхс проснулся, когда он скатился с кровати и ударился головой о тумбочку. Выругавшись, он схватился за свою пульсирующую голову, прежде чем волна тошноты заставила его свернуться калачиком на полу. Прошло несколько минут, прежде чем его состояние улучшилось и только тогда он смог осторожно подняться на копыта. Его ноги дрожали, и Яхс прислонился к стене, чтобы не упасть, но в конце концов собрался с силами и вышел из спальни.\n\nОн прошел по короткому коридору на кухню, где увидел двух чейнджлингов: Финикуса, который сидел за кухонным столом и потирал голову, и Алкиппе, которая готовила еду на плите. Она обернулась, услышав, как Яхс тяжело опустился на стул у стола, и на её лице друг друга последовательно сменили удивление, облегчение и гневом. Нахмурившись, Алкиппе поставила магией тарелку и столовые приборы перед Яхсом, а затем положила туда яичницу-болтунью. — Доброе утро, [CHN_GetJachsRank], — коротко поздоровалась она. — Хорошо спалось?\n\n— Нет, — простонал Яхс, снова потирая голову. Он огляделся и понял, что не помнит, как добрался домой прошлой ночью. — А как я...?\n\n— Сегодня рано утром мы нашли вас с Финикусом, когда вы бродили по улицам в одиночестве, — сказала Алкиппе. — Каким-то образом вам удалось проскользнуть мимо егерей, охранявших это место. Вам ещё повезло, что мы нашли вас раньше всех членов сопротивления! О чем вы только думали, соглашаясь выпить этот напиток?!\n\n— Эй, потише, — прорычал Финикус, кладя голову на стол. — Не так громко, пожалуйста. О, моя бедная голова...\n\nПока Алкиппе свирепо смотрела на него, Яхс покачал головой. — Прости, что заставил тебя волноваться, Алкиппе, — извинился он. — Но ты же слышала, что я сказал. Будет очень хорошо, если мы привлечём общество на нашу сторону. Я просто сделал то, что должен был сделать, чтобы скрепить сделку.\n\nАлкиппе вздохнула. — Ладно, хорошо. Но на какое-то время вам обоим лучше не принимать любви. Мы не знаем, насколько сильна эта штука, и что она может сделать с вами. Последнее, что нам нужно, это чтобы губернатор Кантерлота стал наркоманом. — Она сняла фартук и отбросила его в сторону. — Мне нужно выпить, если я собираюсь играть в сиделку. Странно, что я не начала пить ещё раньше...\n\nОна ушла, оставив Финикуса и Яхса одних за столом. Они посмотрели друг на друга, вспоминая то, что пережили прошлой ночью, и Финикус заговорил. — Яхс... те чейнджлинги, которых мы видели... ты видел, что у них было на боках?\n\n — Знаки отличия, — ответил Яхс, хмуро смотря на свою тарелку. — И они так гармонично жили с пони..."
changelings_paxchrysalia.6506.a:0 "Что же это значит?"

changelings_paxchrysalia.7506.t:0 "Неприятная правда"
changelings_paxchrysalia.7506.d:0 "Нахмурившись, Яхс поставил бокал обратно и покачал головой. — Я должен отказаться, — сказал он, вставая. Он кивнул Глориосе, которая резко и недовольно нахмурилась. — А теперь, когда я знаю, что это общество полно единорогов-сторонников превосходства, боюсь, мне придётся его распустить. Вы – угроза для Гегемонии, и я не могу позволить вам существовать.\n\n— Это та часть, где ваши головорезы выбивают двери и арестовывают нас всех? — Глориоса усмехнулась. Из-под стола появился пистолет, явно заставший Яхса врасплох. — Они не сумеют добраться сюда достаточно быстро, чтобы спасти твою жизнь.\n\nЯхс покачал головой. — Конечно, нет. Я отвечу на вашу любезность своей собственной. Сейчас я уйду, а на рассвете мои егеря ворвутся в это место. Я бы посоветовал вам всем исчезнуть к тому времени. — Он отвернулся и пошёл к двери, оставив Глориосу рычать от злости позади него. — Доброго вечера, Глориоса.\n\nОн почти ожидал, что единорожка выстрелит, когда он будет уходить, но ничего такого не последовало. Вместо этого Яхс открыл дверь и выскользнул наружу, обойдя припаркованную машину и направляясь к лестнице, ведущей на поверхность. Через несколько минут он уже был на улице, где его встретили егеря, а штабная машина увезла [CHN_GetJachsRank]а в безопасное место. Алкиппе уже была внутри, и когда Яхс сел рядом с ней, на её губах появилась облегченная улыбка. — Я на мгновение испугалась за вас, — сказала она. — Я уже была готова послать егерей пораньше.\n\n— Я рад, что ты так веришь в меня, — слегка поддразнил её Яхс. Затем он вздохнул и закрыл глаза, откинувшись на спинку сиденья. — Эти единороги так или иначе захотят нанести свой удар. Усиль охрану на ближайшие несколько недель, хотя бы до коронации королевы. Именно тогда они, вероятно, попытаются действовать.\n\n— А почему бы просто не взять это место штурмом прямо сейчас? — Спросила Алкиппе. — Зачем давать им время бежать?\n\n— Потому что они не убили меня, — ответил Яхс. — Будем считать это знаком взаимного уважения. Кроме того, у нас будет больше шансов поймать их во время операции, чем во время штурма укрепленного наркопритона.\n\nПохоже, что Алкиппе это совсем не убедило, но она всё равно кивнула. — Как скажете, Яхс...\n\nКогда на следующее утро прибыли пять рот егерей, то наркопритон был пуст."
changelings_paxchrysalia.7506.a:0 "Похоже, что мы заработали себе ещё одного врага."

changelings_paxchrysalia.8506.t:0 "Рогатые друзья на важных должностях"
changelings_paxchrysalia.8506.d:0 "— О, [CHN_GetJachsRank]! А я то всё гадал, когда же ты вернёшься.\n\nЯхс подскочил, закрывая дверь, и, оглянувшись, увидел Васпира Орн Кладисиума который не только сидел за его столом, но и задрал на него свои ноги. — Васпир... Я тебя не заметил, — нахмурившись, произнёс Яхс и отошёл от двери. — Чему я обязан честью наслаждать вашим присутствием здесь и сейчас?\n\n— Просто небольшое опасение, которое я хотел бы лично развеять, — сказал Васпир. Он взял стопку бумаг со стола Яхса и помахал ими, как огромным веером. — УОБВ отслеживает подозрительно большое количество гражданских должностей, передаваемых единорогам среднего статуса по всему Кантерлоту в последнее время, — сказал он. — На большинстве из этих назначений есть твоя подпись. Мне это показалось странным, так что я хотел бы услышать твои доводы.\n\nЯхс отмахнулся от этого. — Это мой город, Васпир. Когда я был назначен губернатором, то думал, что получил хотя бы некоторую автономию и теперь каждый приближенный к королеве чейнджлинг не будет сомневаться в моих действиях. Но если ты действительно хочешь знать, то эти единороги – коллаборационисты, и возвращение некоторых элементов гражданской жизни вроде открытия музеев и университетов под бдительным присмотром преданных нам пони позволит нам контролировать этот город лучше, чем с помощью одной только военной силы.\n\nВаспир на мгновение задумался, словно пытаясь найти в словах Яхса хоть малейший признак слабости, а потом махнул головой и встал. — Ну, если вы считаете так, [CHN_GetJachsRank]... Я оставлю эксперта заниматься охраной Кантерлота. Но я хотел бы предостеречь тебя по поводу этих единорогов. УОБВ считает, что они связаны с какой-то ячейкой нежелательных элементов, действующих внутри города. Было бы опасно ставить их на один пьедестал с нами, чейнджлингами.\n\nЗатем он усмехнулся. — Но ты ведь уже и так знаешь это, верно?"
changelings_paxchrysalia.8506.a:0 "Я был бы плохим губернатором, если бы не был в курсе."

changelings_paxchrysalia.507.t:0 "Среди элиты общества"
changelings_paxchrysalia.507.d:0 "Яхс и Алкиппе прибыли на вечеринку через полчаса после её начала, так как такое опоздание считалось весьма модным. Оба чейнджлинга были одеты в свои лучшие парадные мундиры, как и подобало солдатам армии на вечеринке высшего общества Кантерлота – ну или того, что от него осталось. Большинство аристократов сбежали из Кантерлота, когда к нему вплотную подошла армия чейнджлингов, но оставшиеся мелкие дворяне и прочие светские львицы были более чем готовы занять эти освободившиеся места. Под бдительным присмотром своих чейнджлингов-оккупантов, конечно. Похоже, что для некоторых пони было важнее получить лучшее место за обеденным столом, чем сохранять патриотизм по отношению к своей стране.\n\nПросторный особняк, принадлежавший какому-то выскочке из знатного рода, чьё имя Яхс так и не удосужился запомнить, был полон пони и чейнджлингов Яхс с первого взгляда понял, что на вечеринке было полно инфильтраторов, превратившихся в самых богатых и привлекательных дворян, перед которыми заискивали и лебезили все остальные скучные и глупые гости, но Яхс не обращал на них внимания. Он хотел поговорить только с одной пони: со знаменитой виолончелисткой, игравший успокаивающую, хотя и мрачную мелодию в бальном зале особняка.\n\nОн ждал на почтительном расстоянии окончания выступления Октавии Мелоди, и только когда она отложила свой смычок, чейнджлинг подошёл к ней. — Прекрасная мелодия, — сказал Яхс, подходя ближе. — Теперь я понимаю, почему вы так прославились ещё до войны.\n\n— И во время неё, — добавила Октавия, избегая встречаться взглядом с Яхсом. Пони отвернулась к маленькому столику, на котором стояли стакан воды и тарелка с едой. — А теперь, когда все концертные залы закрыты, новое правительство внесло меня в чёрный список за то, что я помогала пропаганде Эквестрии. Так что мне приходится играть на таких маленьких вечеринках вроде этой. Кстати, спасибо вам за эту возможность.\n\nЯхс не позволил колкому замечанию задеть его; Октавия была всего лишь одной из многих пони, чьи жизни перевернула с ног на голову война. — Прискорбный побочный эффект мерзкого дела, которое мы называем войной, — сказал Яхс, пытаясь таким образом выразить сочувствие. — Именно поэтому я хочу поговорить с вами. У меня есть предложение, которое, как мне кажется, пойдет на пользу нам обоим."
changelings_paxchrysalia.507.a:0 "..."

changelings_paxchrysalia.8507.t:0 "Блюз военнопленных"
changelings_paxchrysalia.8507.d:0 "— Я хочу, чтобы вы сыграли на великой коронации королевы Кризалис в Кантерлоте, — озвучил своё предложение Яхс. — Её Величество заслуживает того, чтобы величайшие музыканты всего Эквуса были на её коронации, где она станет королевой как Ульев, так и Эквестрии. Вы были одной из лучших. — Заметив равнодушное выражение лица Октавии, Яхс нахмурился и переступил с копыта на копыто. — Вам щедро заплатят...\n\n— Нет, — Октавия бросила сердитый взгляд на [CHN_GetJachsRank]а. — Я не буду ничего играть ни для вас, ни для вашей королевы. Моё сердце принадлежит Эквестрии, а не вашим проклятым Ульям. И даже если бы я захотела играть, то я знаю, что нужна вам не потому, что являюсь лучшей. Вы хотите меня, потому что я – символ прошлой Эквестрии. Вы хотите опутать верёвками мои копыта и заставить танцевать перед всем миром в качестве вашей марионетки. Это всё не более чем политика, и я ценю свои убеждения больше жизни. И я отказываюсь быть марионеткой, танцующей под дудку иной марионетки.\n\nПока Яхс пытался подобрать ответ, Алкиппе ощетинилась и шагнула вперед. — Боюсь, что у вас нет выбора, — прямо сказала она кобыле. — И вы обязаны проявлять больше уважения к [CHN_GetJachsRank]у.\n\n— [CHN_GetAlcippeRank], — предостерег Яхс свою подчинённую, качая головой. Затем он снова повернулся к Октавии. — Но всё-таки она права. Это не предмет обсуждений. Я здесь из вежливости, чтобы обсудить компенсацию за оказанные услуги. Поймите, другие чейнджлинги на моём месте посадили бы вас на цепь и заставили играть, ничего не дав взамен.\n\nПрошло несколько мгновений, прежде чем Октавия ответила. — Плати мне сколько хочешь. Это не та компенсация, которую я хочу. Я хочу две вещи. Во-первых, я хочу, чтобы Сапфир Шорс разрешили провести концерт для военнопленных эквестрийцев, которых, как я знаю, вы всё ещё держите в лагерях. Она, как и я, стала персоной нон грата и концерт поможет как ей, так и этим военнопленным. А во-вторых... — она заколебалась, как будто не была уверена, стоит ли вообще озвучивать такую просьбу. — Не устраивайте парад военнопленных, который, как я знаю, вы планируете для коронации Кризалис. Проявите хоть каплю милосердия, если оно вообще есть у чейнджлингов. Эквестрия уже повержена и сломлена; сколько ещё вы собираетесь втаптывать нас в грязь?\n\nЭто застало Яхса врасплох. — Как вы вообще узнали про это? Парад должен быть тайной.\n\n— Вы бы удивились, узнав, что можно услышать на вечеринках вроде этой, — сказала Октавия. Затем она взяла смычок и приложила его к струнам виолончели, готовясь начать играть следующую мелодию. — Пожалуйста, пересмотрите ваш план парада. И помогите Сапфир Шорс. Сделайте всё это, и я проведу своё выступление в день коронации."
changelings_paxchrysalia.8507.a:0 "Концерт для военнопленных никому не повредит."
changelings_paxchrysalia.8507.b:0 "Последнее, что нам нужно, так это давать сломленным пони ложную надежду."

changelings_paxchrysalia.508.t:0 "Концерт за колючей проволокой"
changelings_paxchrysalia.508.d:0 "Автобус прибыл ровно в девять утра, привезя Сапфир Шорс, Октавию Мелоди и прочих пони, которые должны были участвовать в концерте, а также их оборудование. Яхс и Алкиппе наблюдали за происходящим с балкона кабинета начальника тюрьмы, а позади них резко вздымалась гора Кантерхорн. У стен тюрьмы были выставлены дополнительные часовые, и двое солдат стояли у пулемёта, смотревшего на двор внизу, готовые открыть огонь в любой момент.\n\nВ одном конце двора была построена грубая сцена из дерева и стали, а напротив неё собрались военнопленные. Многие пони были покрыты шрамами и синяками, появившимися от стычек с их охранниками, а некоторые были очень худыми, практически истощенными. Но когда Сапфир и Октавия начали своё страстное и живое представление, то пони переменились: как будто часть энергии исполнительниц была поглощена самими заключенными, и у тех впервые за многие месяцы, а то и годы, появилась причина улыбнуться.\n\nКогда концерт закончился и охранники постепенно разогнали пленников по баракам, Яхс и Алкиппе спустились вниз, чтобы повидаться с Октавией. Виолончелистка только что закончила сердечно обнимать Сапфир Шорс, и даже когда она повернулась к Яхсу, то не смогла полностью избавиться от улыбки. — Благодарю вас за предоставленную возможность, [CHN_GetJachsRank], — сказала Октавия. — Этот концерт очень многое значил для заключенных. Может быть, вы не так уж и плохи... для чейнджлинга.\n\nЯхс слегка усмехнулся в ответ. — В последнее время я часто об этом слышу, хотя и не уверен, верю ли в это. Но возможно, что в этом есть доля правды.\n\n— Возможно, — согласилась Октавия. Затем она оглядела Яхса с ног до головы. — Надеюсь, вы не пытаетесь подлизываться ко мне, [CHN_GetJachsRank]. Вы же знаете, что я жената на своей музыке.\n\nАлкиппе закатила глаза и встала между Яхсом и Октавией. — Знаешь, мы всё же не всегда охотимся за любовью. [CHN_GetJachsRank] лишь хочет поступить правильно со всеми нами: как чейнджлингами, так и пони.\n\n— Это была шутка, — сказала Октавия, слегка отступая назад. Затем она склонила голову. — Надеюсь, что сегодняшний день открыл вам глаза, [CHN_GetJachsRank]. Подумайте о том, о чём я говорила чуть раньше – о параде. Если вы действительно пытаетесь поступать правильно...\n\nВторую часть этого предложения не обязательно было произносить вслух."
changelings_paxchrysalia.508.a:0 "Я подумаю об этом, обещаю."

changelings_paxchrysalia.509.t:0 "Позолоченные цепи"
changelings_paxchrysalia.509.d:0 "Коммандант Секонд Винд почувствовал, как у него мурашки бегут по коже, когда он бродил от стола к столу на званом вечере, ища хоть что-нибудь, что поможет скоротать время, пока ему не разрешат вернуться домой. Его беспокоила отнюдь не парадная форма, хотя эта новая форма кантерлотской гвардии была одной из самых неудобных, которые он когда-либо носил. Его, скорее, беспокоила сама цель этого званого вечера: вечеринка в честь предстоящего уничтожения Школы Одаренных Единорогов имени Селестии, на которой присутствовали все важные чейнджлинги, а также коллаборационисты-пони, старающиеся произвести хорошее впечатление на своих новых хозяев. Если бы у Секонд Винда был выбор, то его бы здесь не было, но как коммандант кантерлотской гвардии, он обязан был присутствовать на этом мероприятии.\n\nВечеринка и так была едва выносимой, но тут генерал-чейнджлинг подошла поприветствовать его. — Коммандант, — сказала генерал с отвратительной ухмылкой на своей клыкастой морде. — Рада видеть вас здесь. Всегда приятно видеть, как разумные пони извлекают максимум возможного в своём новом положении в жизни.\n\nСеконд Винд смог найти достаточно профессионализма, чтобы приветствовать генерала должным образом. — Генерал Актия, — сказал он, быстро вспоминая имя чейнджлинга. — Я тоже рад вас видеть, мэм. Надеюсь, у вас всё хорошо.\n\n— Лучше, чем когда-либо, — рассмеялась генерал Актия. — Хотя я, конечно, мечтаю об азарте войны. Мир – чудное дело. Скажи, как думаешь, мы когда-нибудь встречались на поле боя?\n\nОна усмехнулся и помахала пони, не дожидаясь ответа Секонд Винда. — Вы случайно не знаете Виндбрейк? Она тоже была солдатом во время войны. И я думаю, что она также была частью вашей королевской гвардии.\n\nСеконд Винд удивленно моргнул, когда встретился глазами с Виндбрейк. Кобыла сражалась вместе с ним на войне, но была захвачена в плен во время эвакуации из Бэйлса. Он думал, что она умерла... — Мы... наши пути пересеклись, — сказал Секонд Винд, кивнув пегаске, которая склонила голову. — Я рад видеть, что у неё всё хорошо.\n\n— Теперь, когда я взяла её под своё крылышко в качестве личной служанки, дела у неё идут лучше, чем когда-либо прежде. — Генерал Актия положила своё тонкое крыло на спину Виндбрейк, и Секонд Винд заметил, как кобыла подавила дрожь. Затем генерал вежливо приподнял свою шляпу. — Ну, мне пора. Продолжайте делать свою хорошую работу. Ты – вдохновение для таких пони, как Виндбрейк.\n\nГенерал повернулась и ушла, прихватив с собой Виндбрейк. Кобыла смотрела на Секонд Винда умоляющими глазами. Секонд Винду оставалось лишь смотреть, как она уходит, а медали на его мундире стали тяжелыми позолоченными цепями."
changelings_paxchrysalia.509.a:0 "Чейнджлинги превращают моих друзей в рабов, а я могу лишь улыбаться..."

changelings_paxchrysalia.510.t:0 "Вторые шансы"
changelings_paxchrysalia.510.d:0 "Секонд Винд решил пообедать в городе, а не в своем офисе в тот день. После тяжелого дня, когда он вовсю тренировал новобранцев и скармливал им пропаганду чейнджлингов, Винду нужно было ненадолго отвлечься от всего этого. И поэтому пегас полетел на один из нижних уровней Кантерлота, чтобы посетить один из его любимых баров. Хорошо, что жуки были слишком озабочены тем, чтобы верхние уровни выглядели красиво и презентабельно, так что они не беспокоили владельцев малого бизнеса внизу. И их дырявые копыта не добрались до того, чтобы конфисковать закусочную у владельца и отдать её начинающим предпринимателям-чейнджлингам.\n\nОн зашёл внутрь и сел, приветствуя хозяев, которых хорошо знал ещё с довоенных лет. Ему не нужно было брать меню; Свит Соти и её муж знали наизусть его обычный заказ. Он просто сидел у окна и смотрел, потягивая воду из стакана, как пони бродят по улицам.\n\n— Не возражаешь, если я присоединюсь к тебе? — Незнакомка улыбнулась, стоя рядом со стулом напротив него. Секонд Винд не узнал её, и не был уверен, что хочет говорить с кем-либо ещё, но она была крайне хорошенькой. Когда в последний раз хорошенькая кобыла приглашала его на ланч?\n\n— Конечно, — сказал он, указывая на стул. Когда пони села, он приподнял бровь и изобразил легкую улыбку, пытаясь вернуть себе хоть немного того обаяния, которым он так славился в колледже. — Я весь день ждал, чтобы хорошенькая кобылка заняла это место. Могу ли я узнать твоё имя?\n\nКобыла откинула назад свою гриву и наклонилась вперед. — Зови меня Блубелл, Секонд Винд. — Жеребец моргнул от удивления от того факта, что она знает его имя, но Блубелл продолжала. — Я уже давно хотела с тобой поговорить... ну, пони, с которыми я работаю. Твоё назначение коммандантом кантерлотской гвардии позволит тебе подобраться к чейнджлингам гораздо ближе, чем к любому иному пони в городе. Идеально, если, скажем, кто-то захочет что-то сделать с королевой чейнджлингов, которая планирует посетить город через пару недель.\n\nСеконд Винд нахмурился. — Тебе не следует говорить о таких вещах, — предупредил он её. — Мой долг – останавливать сопротивление, где бы я его ни обнаруживал\n\n— Долг перед твоими хозяевами-чейнджлингами, конечно, — сказала Блубелл. Потом положила перед ним на стол визитку и встала. — Но если у тебя есть хоть какой-то долг перед своей страной...\n\nОна подмигнула ему и исчезла, взмахнув хвостом. Секонд Винд поднял визитку, которую она оставила, и нахмурился. Её прощальные слова всё ещё звучали в ушах, пока он смотрел на написанный на ней номер телефона. Был ли он собакой, верно служившей хозяину, или невольным рабом режима... как Виндбрейк?"
changelings_paxchrysalia.510.a:0 "Неужели бой действительно проигран, если ещё есть пони, готовые выйти на ринг?"

changelings_paxchrysalia.8510.t:0 "Вторые шансы"
changelings_paxchrysalia.8510.d:0 "Секонд Винд решил пообедать в городе, а не в своем офисе в тот день. После тяжелого дня, когда он вовсю тренировал новобранцев и скармливал им пропаганду чейнджлингов, Винду нужно было ненадолго отвлечься от всего этого. И поэтому пегас полетел на один из нижних уровней Кантерлота, чтобы посетить один из его любимых баров. Хорошо, что жуки были слишком озабочены тем, чтобы верхние уровни выглядели красиво и презентабельно, так что они не беспокоили владельцев малого бизнеса внизу. И их дырявые копыта не добрались до того, чтобы конфисковать закусочную у владельца и отдать её начинающим предпринимателям-чейнджлингам.\n\nОн зашёл внутрь и сел, приветствуя хозяев, которых хорошо знал ещё с довоенных лет. Ему не нужно было брать меню; Свит Соти и её муж знали наизусть его обычный заказ. Он просто сидел у окна и смотрел, потягивая воду из стакана, как пони бродят по улицам.\n\n— Не возражаешь, если я присоединюсь к тебе? — Незнакомка улыбнулась, стоя рядом со стулом напротив него. Секонд Винд не узнал её, особенно в надетой маске, и не был уверен, что хочет говорить с кем-либо ещё, но она была крайне хорошенькой. Когда в последний раз хорошенькая кобыла приглашала его на ланч?\n\n— Конечно, — сказал он, указывая на стул. Когда пони села, он приподнял бровь и изобразил легкую улыбку, пытаясь вернуть себе хоть немного того обаяния, которым он так славился в колледже. — Жаль, что такой хорошенькой кобылке, как тебе, приходится прятать лицо. Могу ли я узнать твоё имя?\n\nКобыла откинула назад свою гриву и наклонилась вперед. — Зови меня Глориоса, Секонд Винд. — Жеребец моргнул от удивления от того факта, что она знает его имя, но Глориоса продолжала. — Я уже давно хотела с тобой поговорить. Твоё назначение коммандантом кантерлотской гвардии позволит тебе подобраться к чейнджлингам гораздо ближе, чем к любому иному пони в городе. Идеально, если, скажем, кто-то захочет что-то сделать с королевой чейнджлингов, которая планирует посетить город через пару недель.\n\nСеконд Винд нахмурился. — Тебе не следует говорить о таких вещах, — предупредил он её. — Мой долг – останавливать сопротивление, где бы я его ни обнаруживал.\n\n— Долг перед твоими хозяевами-чейнджлингами, конечно, — сказала Глориоса. Потом положила перед ним на стол визитку и встала. — Но если у тебя есть хоть какой-то долг перед своей страной...\n\nОна подмигнула ему и исчезла, взмахнув хвостом. Секонд Винд поднял визитку, которую она оставила, и нахмурился. Её прощальные слова всё ещё звучали в ушах, пока он смотрел на написанный на ней номер телефона. Был ли он собакой, верно служившей хозяину, или невольным рабом режима... как Виндбрейк?"
changelings_paxchrysalia.8510.a:0 "Неужели бой действительно проигран, если ещё есть пони, готовые выйти на ринг?"

changelings_paxchrysalia.511.t:0 "Не мы разожгли пламя"
changelings_paxchrysalia.511.d:0 "Грузовик за грузовиком с самого рассвета подъезжали к закрытой ставнями школе, выстраивались во дворе и ждали, пока в них не загрузят все ценности из здания. Секонд Винд и кантерлотская гвардия прибыли вскоре после этого, чтобы удержать любопытную толпу от приближения к школе. Его солдаты выстроились полукругом вокруг Школы Одарённых Единорогов имени Селестии, когда чейнджлинги избавляли здание от всех ценностей. Жуки выносили научное оборудование, исследовательские работы и магические артефакты, упакованные в картонные коробки и загружали их в ожидающие грузовики. Один за другим грузовики отъезжали, вывозя украденные из школы ценности. А когда не осталось ничего особо важного, королевская стража вытащила из здания всё, что не было прибито. Они ободрали всё, вплоть до самого последнего кусочка позолоты со стен. Вскоре некогда величественное здание выглядело не более чем обветшалой развалиной.\n\nТогда-то на сцене и появились огнемёты.\n\nСеконд Винд стиснул зубы, когда его солдаты делали всё возможное, чтобы сдержать разъяренную и испуганную толпу, когда солдаты королевской гвардии подожгли здание изнутри и снаружи. Ярко-оранжевое пламя взметнулось высоко в небо, и из окон полетел пепел, который начал образовывать в небе ядовитые облака. А затем затрещали опорные колонны, по вековой каменной кладке побежали трещины и школа сложилась как карточный домик, выбрасывая угли и обломки высоко в небо, как душа, покидающая тело на своём пути к загробной жизни.\n\nТолпа перестала сопротивляться, и Секонд Винд смог увидеть ужас в их глазах. Кто-то сзади зарыдал, и всхлипывания пони резко контрастировали с радостными возгласами и смехом чейнджлингов, плюющих на пепел рухнувшего здания. Пони Эквестрии потеряли ещё один кусочек своей истории и нации из-за действий чейнджлингов – и Секонд Винд стоял в неправильной толпе.\n\nКогда в тот вечер Секонд Винд, наконец, вернулся домой, он открыл ящик тумбочки и достал оттуда визитную карточку. Затем, взяв трубку телефона одним крылом, он вторым начал набирать номер."
changelings_paxchrysalia.511.a:0 "..."

changelings_paxchrysalia.512.t:0 "Этот день будет идеальным"
changelings_paxchrysalia.512.d:0 "[CHN_GetAlcippeRank] Алкиппе стояла в богато украшенном тронном зале кантерлотского дворца, пока пегасы и единороги усердно трудились, расставляя по всему залу украшения для предстоящей коронации королевы Кризалис. Последние несколько дней были полны очень бурной деятельности, да и следующие, вероятно, будут такими же. Алкиппе держала своей магией контрольный список и вычёркивала в нём ещё один пункт, пока пони заканчивали расставлять украшения. Это было легко сделать. Стоит надеяться, что и со всем остальным также не возникнет особых проблем.\n\nОна просмотрела список, развернулась и пошла обратно в свой кабинет. Алкиппе позаботилась о том, чтобы разослать приглашения остаткам знати Кантерлота, а также некоторым светским деятелям и коллаборационистам, которые играли важную роль в поддержании мира в городе. Повсюду была выставлена охрана, и каждое здание вдоль маршрута парада проверялось солдатами армии на тот случай, если в нём скрывались агенты сопротивления или пони, сочувствующие партизанам. Для охраны королевы во время парада был выделен отряд телохранителей, отобранных из наиболее талантливых коллаборационистов и перебежчиков, дабы показать, как сильно королева любима Эквестрией. А Секонд Винд и его кантерлотская гвардия будут стоять в почётном карауле.\n\nАлкиппе засунула свой список обратно в карман и, напевая себе под нос, пошла дальше. Всё пока шло гладко. Теперь чейнджлинги наконец-то смогут отомстить за поражение 1002 года. Тот день не был идеальным, но этот будет.\n\nОна была уверена в этом. "
changelings_paxchrysalia.512.a:0 "Что может пойти не так?"

changelings_paxchrysalia.513.t:0 "Одно последнее унижение?"
changelings_paxchrysalia.513.d:0 "— После того как королевская процессия пройдет по городу, Кризалис поднимется на трибуну тут, в королевском дворце, где и будет наблюдать за остальной частью парада, — сказал [CHN_GetJachsRank] Яхс, обводя копытом маршрут парада. Другие генералы верховного командования армии, а также прочие высокопоставленные чиновники из королевской гвардии внимательно наблюдали за происходящим. — первыми пройдут полки королевской гвардии, которые завершат свой марш и расположатся на площади вокруг нашей королевы. Как только всё увидят её стойких защитников, пройдут егеря армии и сопровождающие их бронетанковые полки. Затем хайвсмаршал Триммель произнесёт свою речь, а Кризалис будет коронована императрицей Кантерлота и близлежащих земель, после чего она произнесёт свою собственную речь. Королевские фанфары от Октавии Мелоди, аплодисменты, пролёт авиации, а потом всё закончится. Вопросы?\n\nГенералы-чейнджлинги отрицательно покачали головами и пробормотали слова своего согласия. За исключением одного. — А как насчёт военнопленных, [CHN_GetJachsRank]? — Спросил Ласин Кардо. — Вы же знаете, что Её Величеству было бы приятно увидеть, как эти грязные негодяи корчатся в цепях перед ней. Это будет просто вишенкой на торте.\n\nЯхс нахмурился. — Военнопленные пройдут впереди танков, — сказал он. — Я надеюсь, что вида побеждённых пони, которых гонят перед нашими металлическими монстрами, сломившими Эквестрию, будет достаточно, чтобы порадовать королеву.\n\n— Конечно, — согласился Ласин, самодовольно улыбаясь. — И это даст нам повод для гордости. Я не могу дождаться, чтобы увидеть это.\n\nВскоре после этого чейнджлинги разошлись, чтобы подготовиться к предстоящей коронации, оставив Яхса с его планами парада. Он нахмурился, глядя на свои записи и думая о марше военнопленных. Октавия умоляла его отменить всё это... но может ли он сделать такое? Можно ли внести такое изменение в последнюю минуту? Но лучше задать правильный вопрос... а должен ли он?\n\n«Пакс Кризалия» была лишь жестоким унижением для пони Эквестрии. Сапог чейнджлинга никогда ещё не стоял так крепко на их шеях, как в последнее время. Вид некогда гордых эквестрийцев, которые сейчас пройдут через Кантерлот в качестве истощенных военнопленных, был бы последним оскорблением для побежденного населения.\n\nСможет ли «Пакс Кризалия» пережить ещё одно оскорбление от оккупантов-чейнджлингов?"
changelings_paxchrysalia.513.a:0 "Эта часть парада должна быть отменена."
changelings_paxchrysalia.513.b:0 "Это последнее оскорбление должно заставить пони осознать своё место раз и навсегда."

changelings_paxchrysalia.514.t:0 "Недостающий фрагмент"
changelings_paxchrysalia.514.d:0 "[CHN_GetAlcippeRank] Алкиппе пересмотрела расписание парада ещё раз, когда солдаты уже готовились к маршу через Кантерлот под взором своей королевы. Все уже отметились: от фанатиков из Королевской Гвардии до пони-коллаборационистов из Кантерлотской Гвардии. За исключением одного ключевого пони. Алкиппе нахмурилась, когда поняла, что Секонд Винд так и не отметился, а Кантерлотской Гвардии вряд ли могла пройтись маршем без своего командира. Возможно, что-то задержало его? Было бы разумно пойти и проверить.\n\nАлкиппе передала свой контрольный список лейтенанту и взяла с собой маленькую портативную рацию. — Проследите за тем, чтобы парад начался вовремя, — приказала она лейтенанту, отправляясь в путь. — Ничто не должно выбиться из графика. — Затем Алкиппе отправилась осматривать казармы в поисках Секонд Винда.\n\nОна много где была, но так и не нашла пегаса. Его не было ни в своей квартире, ни в офисе... Вообще нигде в комплексе. Алкиппе нахмурилась и уже собралась было вернуться, когда заметила, что тяжелая дверь в тюремный блок слегка приоткрыта. Сгорая от любопытства, чейнджлинг распахнула дверь и проскользнула внутрь. — Коммандант? — спросила она, услышав впереди какой-то шум. — Вы здесь?\n\nОна завернула за угол и остановилась. Перед ней стояли двое пони: Секонд Винд и кобыла по имени Блубелл, арестованная несколько дней назад за сговор с сопротивлением. У Секонд Винда на груди было что-то весьма похожее на жилет с взрывчаткой, и Блубелл только что закончила закреплять это на нём. Все трое потрясенно посмотрели друг на друга несколько мгновений, прежде чем резко начали действовать.\n\nБлубелл потянулась за своим пистолетом, лежащим на столе позади неё, но Алкиппе уже успела выхватить свой и сделать несколько быстрых выстрелов. Пули мгновенно убили партизанку на месте, но за это время Секонд Винд выпрыгнул в ближайшее окно и исчез в открытом небе. Алкиппе выругалась, зная, что никогда не сможет поймать пегаса в воздухе, и потянулась за рацией."
changelings_paxchrysalia.514.a:0 "— Подкрепление! Мне нужно подкрепление! Секонд Винд – предатель!"

changelings_paxchrysalia.515.t:0 "Признания"
changelings_paxchrysalia.515.d:0 "Парад должен был вот-вот начаться, но у Яхса ещё оставалось немного времени для быстрого перекуса. Он знал, что маршировать на пустой желудок, а потом ещё часами наблюдать за войсками – не самая разумная затея, [CHN_GetJachsRank] ушёл на столь необходимый ему обеденный перерыв, чтобы успокоиться перед бурей и подготовиться к предстоящему параду. Но даже тогда его смогли отыскать дела, когда пара солдат поспешно ворвалась в его кабинет после быстрого стука в дверь.\n\n— Лучше бы самой королеве быть в опасности, а иначе вам несдобровать, — прорычал Яхс, откладывая сэндвич в сторону. — В чём дело?\n\n— Пони утверждает, что у неё есть какая-то важная информация, но она будет говорить только с вами, — сказал один из солдат. — Она утверждает, что является... или же была членом Сопротивления... Это Октавия Мелоди, сэр.\n\nЯхс почувствовал себя так, будто получил пощёчину. — Октавия? — недоверчиво переспросил он. Потом встал, позабыв про свой обед. — Отведи меня к ней. Сейчас же.\n\nЧерез несколько минут он вошёл в комнату для допросов, где за голым столом сидела Октавия. Яхс даже не стал дожидаться, пока за ним закроется дверь, и стал сразу задавать вопросы. — Сейчас мне всё равно, состоишь ли ты в сопротивлении или нет. Что ты хотела мне сказать?\n\nОктавия посмотрела на Яхса и кивнула. — Отколовшаяся ячейка сопротивления в Кантерлоте хочет убить королеву Кризалис, — сказала кобыла. — Несмотря на желания остальных членов Сопротивления, радикалы хотят взорвать бомбу во время парада. Ваш собственный капитан кантерлотской гвардии собирается лично доставить бомбу.\n\nЯхс ошеломленно заморгал. — Секонд Винд? Ты... откуда ты это знаешь? И зачем мне это говорить?\n\n— Это не важно, — сказала Октавия, качая головой. — Важно лишь то, что сейчас к пони в Кантерлоте терпимо относятся, во многом благодаря именно вашим усилиям, но убийство королевы чейнджлингов лишь ухудшит ситуацию. Никаких репрессий не будет; если королевская гвардия будет мстить за свою королеву, то они прибегнут к массовому геноциду. — Октавия перегнулась через стол. — Делай со мной что хочешь, но ты должен остановить это ради всех нас.\n\nЯхс топнул копытом и выругался. — Я позабочусь об этом, — сказал он, резко развернувшись и направляясь к двери. — А ты вернись и приготовься играть, как мы и договаривались прежде!"
changelings_paxchrysalia.515.a:0 "Мы теряем драгоценное время!"

changelings_paxchrysalia.516.t:0 "Стадии Апокалипсиса"
changelings_paxchrysalia.516.d:0 "Яхс в считанные минуты приказал отрядам егерей распределиться по Кантерлоту для поисков Секонд Винда и бомбы, предназначенной для королевы. Сам Яхс тоже взлетел в воздух, отказавшись от участия в ранней стадии парада. Он бы полностью отменил его, но королева Кризалис уже выехала, и он не думал, что она остановится, даже если будет знать о грозящей ей опасности. Всё это было бы лишь пустой тратой драгоценного времени, так что теперь его единственной надеждой было найти Секонд Винда, пока не стало слишком поздно.\n\nКраем глаза Яхс заметил фигуру на вершине ближайшей колокольни, и тут же изменил курс. Он взлетел на вершину башни и одним движением выхватил пистолет, нацелив его на пегаса. — Секонд Винд! — Крикнул Яхс, заставив пегаса подпрыгнуть и обернуться. Два солдата встретились взглядами. Они находились на противоположных концах башни, и лишь большой медный колокол разделял их. — Не делай этого, — настаивал Яхс. — Что бы ты ни пытался сделать, тебе это не удастся.\n\nСеконд Винд заметно дрогнул, когда ответил. — Чейнджлинги слишком долго угнетали пони! — крикнул он в ответ с яростью и болью в голосе. — Вы пришли и забрали у нас всё, а когда и этого оказалось недостаточно, то превратили нас в рабов! Виндбрейк, кобыла, из королевской гвардии, которая когда-то была героем, теперь стала личной рабыней какой-то генеральши жуков, которая теперь может поступать с ней, как ей заблагорассудится! Эгоистичные завоевания вашей порочной королевы и презрение ко всему моему роду принесли Эквестрии такие беды и страдания, которых она ещё никогда не знала!\n\nОн коснулся копытом жилета с бомбой, надёжно закрепленного на его теле. — И я собираюсь остановить это, — крикнул Секонд Винд дрожащим от боли голосом. — Мне всё равно, что со мной будет, но она должна умереть. Она должна умереть ради свободы Эквестрии."
changelings_paxchrysalia.516.a:0 "Колокола начинают звонить..."

changelings_paxchrysalia.517.t:0 "Победа в поражении" ## Red Ending ##
changelings_paxchrysalia.517.d:0 "Яхс рискнул сделать ещё один шаг и когда Секонд Винд не дрогнул, сделал ещё один шаг, а потом и ещё. Он преодолел половину расстояния между ними, прежде чем придумал что сказать. — Ты лишь ухудшишь положение пони в Эквестрии, Секонд Винд, — сказал Яхс. — Королева Кризалис слишком поглощена собой, чтобы когда-либо обращать внимание на всё остальное. У неё хватает жестоких капризов и несбыточных фантазий, но покажи ей что-нибудь другое, чтобы отвлечь её, и королеву можно отговорить от этих идей. — Он указал на улицу внизу, где процессия медленно приближалась к колокольне. — Помнишь, я говорил тебе, что надо использовать всё, что у нас есть? Работать внутри системы и пытаться внести какие-то небольшие изменения? Я отменил парад военнопленных. Я знаю, что для пони по всей Эквестрии это было бы просто унизительно. Поэтому я использовал свои полномочия губернатора Кантерлота, чтобы положить этому конец. Я не стал говорить королеве, что это нарушит права пони или вызовет больше проблем. Лучше просить прощения, чем разрешения. Я смогу изменить ситуацию, используя своё положение. Не всякое изменение должно происходить через насильственную революцию.\n\nОн сделал ещё несколько шагов вперед и положил копыто на плечо Секонд Винда. — Убийство Кризалис приведёт лишь к жестоким и суровым репрессиям со стороны королевской гвардии. Их будет далеко не так легко отвлечь, и они будут тратить каждое своё мгновение на месть пони. Мы не можем этого допустить, так что Кризалис должна жить. И вместе мы сможем использовать наши посты, чтобы сдержать худшие из её эксцессов, чтобы они не причиняли вреда вашему виду.\n\nСлёзы потекли по лицу Секонд Винда, и спустя практически вечность, он опустил голову. — Ты прав, — простонал он. — Просто я... так разозлился... мир не должен быть таким жестоким.\n\n— Не должен быть, — согласился Яхс. — И мы можем внести свою лепту, чтобы сделать мир менее опасным. А теперь пошли. Давай снимем с тебя эту штуку и вернемся на парад. Если мы поторопимся, то всё будет как и прежде."
changelings_paxchrysalia.517.a:0 "Одно существо не может изменить мир, но нескольким существам, работающим вместе, это по силам."

changelings_paxchrysalia.518.t:0 "Пакс Кризалия Магнифика" ## Red Ending ##
changelings_paxchrysalia.518.d:0 "Только когда Яхс понял, что стоит позади Кризалис перед королевским дворцом, его сердце, наконец, перестало бешено биться. Он не был уверен, что сможет остановить Секонд Винда на колокольне, но был рад, что пегас наконец-то прислушался к голосу разума. И было совершенно невозможно сказать, что этот пегас, ведущий процессию кантерлотских гвардейцев перед королевой Кризалис, совсем недавно хотел взорвать бомбой себя вместе с королевой.\n\nОстальная часть парада была совсем размытой для измученного чейнджлинга. Маршировали солдаты, катились танки, над головами ревели самолеты, а чейнджлинги из верховного командования по очереди произносили свои речи. Сам Яхс, как губернатор Кантерлота, должен был произнести свою собственную речь, и когда пришло время, он поднялся на трибуну и вытащил из внутреннего кармана пиджака пару сложенных бумажек. Затем, откашлявшись, он обратился к собравшимся чейнджлингам и пони, и его голос гулко разносился по площади.\n\n— Граждане Кантерлота, солдаты армии и все прочие, кто почтил нас своим присутствием здесь и сегодня, — начал он, оглядывая толпу. — Это было трудным путешествием, чтобы добраться до сегодняшнего дня. Нам пришлось делать нелёгкие выборы. Нам пришлось делать рискованные выборы. Мы упорно сражались, чтобы завоевать Эквестрию, и ещё упорнее, чтобы удержать её. Но мы справились. И сегодня наша Великая Королева получит свою законную корону и станет императрицей. Но это было бы невозможно без тяжёлой работы как пони, так и чейнджлингов, которые вместе сделали «Пакс Кризалия» действительно мирной. Нам предстоит ещё немало работы, и мы по-прежнему сталкиваемся как с внутренними, так и с внешними угрозами, но есть одна вещь, которую я знаю наверняка: мы преодолели самые тёмные времена. И теперь как пони, так и чейнджлинги, могут начать работать, чтобы приблизить наступление более светлых времён.\n\nЗатем он повернулся к королеве Кризалис и низко поклонился. — Да здравствует императрица Кризалис, истинная хранительница «Пакс Кризалии»!\n\nПоследовали громовые аплодисменты в честь Кризалис, и Яхс отступил в сторону, чтобы позволить королеве получить её новую корону. И когда королева подняла её с атласной подушки своей магией, весь мир понял, что поражение 1002 года, наконец-то, было отомщено."
changelings_paxchrysalia.518.a:0 "Да здравствует императрица!"

changelings_paxchrysalia.519.t:0 "Развязка" ## Red Ending ##
changelings_paxchrysalia.519.d:0 "Было уже далеко за полночь, когда празднества, связанные с коронацией Кризалис, наконец закончились. Яхс очень устал. Прилив адреналина после того, как он нашёл Секонд Винда перед парадом, давно покинул Яхса, а исполнение желаний императрицы Кризалис в последующие часы крайне опустошило его. Яхсу крайне хотелось забраться в постель и уснуть, но светила полная луна и была безоблачная ночью, так что он чувствовал себя просто обязанным провести несколько последних минут, любуясь сонным городом, прежде чем лечь спать.\n\nВыйдя на балкон, Яхс понял, что не одному ему пришла такая идея. Алкиппе, Марсилио, Финикус и даже Секонд Винд были там, тихо разговаривая и любуясь ночным небом. Их болтовня прекратилась, когда они услышали звук открытия двери, хотя и улыбнулись ему, когда тот закрыл дверь за собой. — Наслаждаетесь ночью? — спросил он трёх чейнджлингов (и одного пегаса).\n\n— Приятно немного побыть в тишине и покое, — сказала Алкиппе, а затем посмотрела в сторону пегаса, который опустил голову. — Мы только что разговаривали с Секонд Виндом. Он рассказал нам о том, что произошло.\n\n— Теперь это в прошлом, — сказал Марсилио. — И знание об этом не должно покинуть этот балкон. Это в интересах каждого из нас.\n\n— Хотя взорвать Кризалис было бы довольно забавно, — усмехнулся Финикус. Но потом он покачал головой. — Я просто шучу. Хорошо, что всё закончилось именно так, как закончилось. Это наилучший исход для всех нас.\n\nЯхс кивнул, присаживаясь с краю. — Это было долгое путешествие, но я рад, что оно закончилось, — сказал он, прислонившись спиной к стене и глядя на звезды над головой. — Так или иначе, мы сделали это, и это всё, о чём нас только можно было попросить. И мы можем попытаться сделать мир немного лучше, шаг за шагом.\n\n— Это всё, на что мы только можем надеяться, — сказал Секонд Винд. — Может быть, когда-нибудь пони и чейнджлинги будут равны.\n\n— Однажды, — сказал Яхс. — Я в этом уверен. Пока мы все работаем, чтобы сделать это действительностью."
changelings_paxchrysalia.519.a:0 "И мы сделаем это."

changelings_paxchrysalia.520.t:0 "Блаженны кроткие" ## Blue Ending - POW Parade ##
changelings_paxchrysalia.520.d:0 "Яхс осторожно сократил пространство между собой и Секонд Виндом, крепко держа пистолет в своей магической хватке. — Ты лишь ухудшишь положение пони, если убьешь её, — предупредил он пегаса. — Кризалис больше интересует личное удовлетворение, чем жестокость. И её всегда можно отвлечь, чтобы предотвратить реальный вред пони. Нужны лишь правильные существа, делающие правильные вещи в нужное время...\n\nНо Секонд Винд лишь указал на дорогу внизу, где уже начался парад военнопленных-пони. — И ты называешь это правильным поступком в нужное время? — Он плюнул на Яхса. — Это мои товарищи, мои братья и сёстры по оружию, выставленные напоказ перед всей вашей презренной армией. Они просто скот, униженный и сломленный! В этом нет никакой справедливости! В этом нет ничего хорошего! И если ты считаешь, что поступаешь правильно, то я больше не желаю быть твоей марионеткой!\n\n— Коммандант!— Крикнул Яхс, но пегас бросился на него и повалил на пол прежде, чем чейнджлинг успел выстрелить. Пистолет упал с колокольни, и Секонд Винд ударил голову Яхса о колокол, оглушив его. Затем, расправив крылья, пегас вылетел из башни и направился к проходящему внизу параду.\n\nЯхс вскочил на копыта и успел выскочить из башни вслед за мчавшимся пегасом. Но догнать его уже было невозможно. Вместо этого Яхс мог лишь выкрикнуть предупреждение солдатам на земле, и, к счастью, ему удалось привлечь внимание нескольких из них, прежде чем Секонд Винд достиг своей цели. Телохранители королевы Кризалис окружили её и начали стрелять в небо. Когда пегас-самоубийца приблизился, Яхс увидел брызги крови. Но Секонд Винд уже шёл верным курсом, так что гравитация делала за него оставшуюся работу. Прежде чем Яхс успел сделать хоть что-то, Секонд Винд потянул за шнур, свисавший с его плеча.\n\nЯркая вспышка света и раскат грома... Вот и всё, что смог запомнить Яхс, прежде чем рухнул с неба."
changelings_paxchrysalia.520.a:0 "Мир кончается не словами философов, а кровью мучеников."

changelings_paxchrysalia.521.t:0 "Действия важнее слов" ## Blue Ending - Idealistic ##
changelings_paxchrysalia.521.d:0 "Яхс осторожно сократил пространство между собой и Секонд Виндом, крепко держа пистолет в своей магической хватке. — Ты лишь ухудшишь положение пони, если убьешь её, — предупредил он пегаса. — Кризалис больше интересует личное удовлетворение, чем жестокость. И её всегда можно отвлечь, чтобы предотвратить реальный вред пони. Нужны лишь правильные существа, делающие правильные вещи в нужное время...\n\n— Именно это я и собираюсь сделать, — сказал Секонд Винд. — Тиранов нельзя свергнуть постоянным их умиротворением. Угнетение не закончится, если сказать "пожалуйста" и "спасибо". Реальные перемены могут быть вызваны только решительными действиями. Ты сам говорил мне, что статус-кво ещё не значит, что он верен. Просто нужны существа, готовые изменить его. И я готов стать мучеником смерть, чтобы освободить свою страну, если это необходимо!\n\n— Это не так, коммандант! — Крикнул Яхс, но пегас бросился на него и повалил на пол прежде, чем чейнджлинг успел выстрелить. Пистолет упал с колокольни, и Секонд Винд ударил голову Яхса о колокол, оглушив его. Затем, расправив крылья, пегас вылетел из башни и направился к проходящему внизу параду.\n\nЯхс вскочил на копыта и успел выскочить из башни вслед за мчавшимся пегасом. Но догнать его уже было невозможно. Вместо этого Яхс мог лишь выкрикнуть предупреждение солдатам на земле, и, к счастью, ему удалось привлечь внимание нескольких из них, прежде чем Секонд Винд достиг своей цели. Телохранители королевы Кризалис окружили её и начали стрелять в небо. Когда пегас-самоубийца приблизился, Яхс увидел брызги крови. Но Секонд Винд уже шёл верным курсом, так что гравитация делала за него оставшуюся работу. Прежде чем Яхс успел сделать хоть что-то, Секонд Винд потянул за шнур, свисавший с его плеча.\n\nЯркая вспышка света и раскат грома... Вот и всё, что смог запомнить Яхс, прежде чем рухнул с неба."
changelings_paxchrysalia.521.a:0 "Мир кончается не словами философов, а кровью мучеников."

changelings_paxchrysalia.522.t:0 "Восстановление" ## Blue Ending - Both ##
changelings_paxchrysalia.522.d:0 "Яхс проснулся от гудков оборудования и попытался сесть, но его тело болело так сильно, что через несколько секунд он сдался. До него донеслось тревожное бормотание, и он почувствовал, как кто-то мягко толкнул его копытом обратно на кровать. — Не вставай, Яхс, — раздался голос, и Яхс узнал Алкиппе. — Ты сильно пострадал при взрыве. Твой экзоскелет треснул во многих местах. Так что на выздоровление нужно какое-то время.\n\nКогда воспоминания о параде вернулись к Яхсу, [CHN_GetJachsRank] заставил себя открыть глаза и снова попытался сесть, остро ощущая все места, где были повреждены пластины его экзоскелета. — Королева, — прохрипел он, остановив свой затуманенный взор остановилось на морде Алкиппе. — Она...?"\n\n— С ней всё в порядке, — сказала Алкиппе к большому облегчению Яхса. — Её телохранители-единороги подняли заклинание щита, чтобы спасти её от взрыва. Некоторые солдаты на земле были серьёзно ранены, а любимая машина королевы нуждается в некотором ремонте, чтобы снова ездить. После этого парад, конечно, был отменен. Сегодня вечером Кризалис будет коронована наедине, в присутствии лишь королевской гвардии и нескольких генералов из армии. А что касается Секонд Винда...\n\nЭту фразу не нужно было договаривать, и Яхс закрыл глаза и откинулся на подушку. — Думаю, меня за это понизят в должности, — сказал он.\n\n— У вас есть множество свидетелей, которые видели, как вы лично пытались остановить Секонд Винда, рискуя собственной жизнью, — сказала Алкиппе. — Так что я бы об этом не беспокоилась. Ты – герой, Яхс, хоть и немного опоздавший. — Затем она снова мягко попросила его лечь обратно. — Ложитесь, Яхс и отдыхайте. УОБВ скоро потребуют объяснений. Если что, то я скажу, что вы всё это время спали.\n\nЯхс неохотно подчинился и застонал, когда перенес свой вес на кровать. — Конечно... спасибо, Алкиппе.\n\n— Всегда пожалуйста, — ответила. — И я просто очень рада, что с вами всё в порядке."
changelings_paxchrysalia.522.a:0 "Да... я тоже."

changelings_paxchrysalia.523.t:0 "Последнее слово" ## Blue Ending - Both ##
changelings_paxchrysalia.523.d:0 "Васпир Орн Кладисиум выключил диктофон, когда Яхс закончил давать показания. Два чейнджлинга некоторое время сидели в весьма напряжённой тишине, прежде чем глава УОБВ нарушил её. — Итак, мы уже подошли к концу, — сказал он, сводя копыта вместе и смотря на что-то сбоку от стола. — Какая же это замечательная история. От поражения в 1002 году до эпохи «Пакс Кризалия»... Мы ведь действительно прошли весь этот путь, не так ли?\n\n— Совершенно верно, — согласился Яхс, — но я уверен, что ни один из нас не желал быть частью этого.\n\n— Верно, — согласился Васпир. Затем, вздохнув, он встал. — Я не нахожу никаких оснований полагать, что именно вы, [CHN_GetJachsRank], организовали это фиаско на параде. Возможно, некоторые вещи почти произошли благодаря мелким ошибкам тут и там, но никто не может отрицать, что вы сделали всё возможное, чтобы остановить теракт. Я передам это заявление УОБВ, так что мы оба сможем продолжить жить как и раньше.\n\nОн подошел к Яхсу, и [CHN_GetJachsRank] встал, чтобы пожать его копыто. Затем Яхс покинул офис УОБВ и простоял некоторое время на солнце, прежде чем Алкиппе, Марсилио и Финикус не подошли поприветствовать его. Он немедленно заверил их всех, что всё в порядке. — Не о чем беспокоиться, — сказал он им всем. — Просто даю показания.\n\n— Что ж, приятно это слышать, — сказала Алкиппе, занимая своё обычное место рядом с Яхсом.\n\n— Я боялся, что если ты войдёшь туда, то больше не выйдешь, — добавил Финикус. Марсилио обогнул остальных, бросив взгляд на Яхса. — Ну, хотя бы твоя линька идёт хорошо, и скоро никто не сможет увидеть, что ты чуть не погиб от взрыва, который повредил твой экзоскелет. Ты хорошо себя чувствуешь? Что-нибудь болит?\n\n— Немного побаливает тут и там, но я в порядке, — сказал Яхс. — Всё достаточно хорошо, чтобы продолжать работать. И не делайте ошибок, у нас всё ещё есть немало работы, которую нужно выполнить. У каждого из нас. Время не ждёт ни чейнджлингов, ни пони, и мы должны извлечь максимум пользы из того, что у нас осталось."
changelings_paxchrysalia.523.a:0 "Так что давайте учиться на своих ошибках и стараться как можно лучше."

## Denouement Events ##
changelings_paxchrysalia.524.t:0 "Восхождение Глориосы"
changelings_paxchrysalia.524.d:0 "Глориоса усмехнулась, наблюдая, как заполняется отель Калихорния по мере приближения ночи. Благодаря договорённости с генералом-майором Яхсом ей удалось переместить общество «Рог изобилия» из подпольного наркопритона в весьма респектабельное заведение, где единороги и чейнджлинги могли спасаться от стрессов прошедшего дня. Биты менялись на экзотические любовные эликсиры, а богатые посетители доплачивали за отдельные комнаты и личную прислугу, где они могли на несколько часов погрузиться в блаженство. Всё это делало само общество сильнее, а Глориосу – ещё более могущественной.\n\nОна отхлебнула свой коктейль, оставив сладкий привкус любви на языке. Её соглашение с чейнджлингами позволило расставить доверенных единорогов на многие гражданские посты по всему городу. Она даже начала размещать своих сторонников в нижних эшелонах оккупационного гарнизона, и у Глориосы не было никаких сомнений, что её деньги и услуги в своё время позволят им добиться многого. Благодаря этим усилиям и ресурсам общества единороги наконец-то заняли своё законное место на вершине пирамиды пони. Кантерлот станет ярким маяком превосходства единорогов, и вскоре она распространит своё влияние на соседние провинции и регионы. За счёт накопленного капитала и партнёрства с чейнджлингами теперь возможно всё. Может быть, однажды ей даже не придётся больше с ними работать. Возможно, скоро единороги заберутся на следующую ступеньку пирамиды, и тогда уже чейнджлинги будут подчиняться им. В конце концов, единороги заслуживают того, чтобы править всеми. Сотрудничество было лишь кратковременным союзом.\n\nОна сделала ещё один глоток и отставила бокал в сторону. Однажды желание Глориосы осуществится. Она была в этом уверена. Но пока Яхс мог считать её верным партнёром.\n\nПока."
changelings_paxchrysalia.524.a:0 "Общество будет лояльно чейнджлингам, пока это выгодно единорогам."

changelings_paxchrysalia.525.t:0 "Бесславное падение"
changelings_paxchrysalia.525.d:0 "Пули свистели над головой Глориосы, когда она бежала по переулку. Она вслепую выстрелила из пистолета-пулемета, который держала своей магией, а когда оружие лишь щелкнуло, то она отбросила его в сторону. У неё кончились патроны, так что было бессмысленно цепляться за этот кусок металла.\n\nОна неслась сквозь ночь, стараясь увеличить дистанцию между той дырой, куда только что ворвались егеря. Она знала, что в конце концов [CHN_GetJachsRank] Яхс придёт за ней; она просто надеялась, что этот дурак, Секонд Винд, взорвёт королеву чейнджлингов чуть раньше. Хаос дал бы обществу возможность захватить контроль над Кантерлотом, но королева выжила и все её надежды рухнули. А когда чейнджлинги застрелили последнего из её единорогов в новом импровизированном убежище, Глориоса поняла, что с обществом покончено.\n\nНаконец, спустя много миль, она остановилась у реки, протекавшей через Кантерлот. Её конечности дрожали от усталости, но Глориоса сумела скрыться от преследователей. Но она знала, что они не перестанут её искать. Пока Глориоса жива, она представляет угрозу для Гегемонии. Ей придётся попытаться бежать из страны или, хотя бы, спрятаться в каком-нибудь безымянном городке и ждать, когда снова придет её время.\n\nОна сняла маску и посмотрела на неё. Никто из пони или же чейнджлингов не знал, как она выглядит под маской; Глориоса была маской, а не кобылой. В этом случае её истинное я станет идеальной маскировкой. Поэтому, сделав глубокий вдох, кобыла зашвырнула маску как можно дальше в реку. Может быть, жуки найдут её и решат, что она мертва. Вот бы ей так повезло!\n\nРазвернувшись, кобыла без имени растворилась во тьме ночи, и больше её никто и никогда не видел."
changelings_paxchrysalia.525.a:0 "Однажды общество снова возродится... когда придет время."

changelings_paxchrysalia.526.t:0 "Ветер перемен"
changelings_paxchrysalia.526.d:0 "Коммандант Секонд Винд поднял глаза, когда в его кабинет вошел пони. — Коммандант, — сказала кобыла, отдавая честь и ожидая его ответа.\n\n— Рядовая Парснип, — сказал он, быстро отсалютовав крылом и кивнув. — Чем я могу тебе помочь?\n\nПастернак прикусила губу, словно колеблясь в последний момент и думая, а стоит ли вообще делиться причиной своего визита. — Я просто..... Коммандант, сэр... Я сожалею кое о чём.\n\n— Сожалеешь? — Секонд Винд пригласил Парснип сесть напротив него, и та повиновалась. Он посмотрел на её встревоженное лицо и медленно кивнул. — Ага. Вижу. Ты не считаешь, что поступаешь правильно, служа в кантерлотской гвардии, не так ли? — Когда та медленно покачала головой, Секонд Винд убрал свои бумаги и положил копыта на стол. — Можешь говорить свободно, рядовая. Ничто из того, что ты скажешь, не покинет этой комнаты. Даю своё слово.\n\nНаконец Парснип глубоко вздохнула и опустила голову. — Мне не нравятся законы чейнджлингов относительно наших собратьев-пони, — сказала она. — Я чувствую себя плохой кобылой. Я ведь должна помогать этим пони, верно? Я не должна давить их и помогать жукам угнетать нашу страну. Чейнджлинги покорили нас, и теперь я лижу ботинки жуков лишь для того, чтобы мне не нужно было платить любовный налог и чтобы я могла получше обеспечивать свою семью. Что со мной не так?\n\n— С тобой всё в порядке, — заверил её Секонд Винд. — Ты делаешь то, что и должна. И посмотри на это с другой стороны, рядовая. — Он встал и указал на карту Кантерлота, висевшую на стене кабинета. — Кто, по твоему, лучше подходит для патрулирования улиц Кантерлота: мы или солдаты-жуки, только что прибывшие из Весалиполиса? Кто будет лучше относиться к пони: мы или солдаты-жуки, только что прибывшие из Весалиполиса? Кого бы ты предпочла: нас или...?\n\n— ...солдат-жуков, только что прибывших из Весалиполиса, — сказала Парснип, закончив фразу за Секонд Винда. — Я... Мне кажется, я понимаю, что вы имеете в виду. Лучше мы, чем жуки. — Ей даже удалось слегка улыбнуться. — Благодарю вас, коммандант. Разговор многое прояснил.\n\nСеконд Винд кивнул. — Обращайся в любое время, рядовая. И если у кого-нибудь из твоих друзей возникнут подобные мысли, скажи им, чтобы они сразу шли ко мне. Мы пони, и мы должны держаться вместе, понимаешь?"
changelings_paxchrysalia.526.a:0 "У кантерлотской гвардии есть шанс изменить жизнь пони Кантерлота к лучшему."

changelings_paxchrysalia.527.t:0 "Соучастники по преступлению"
changelings_paxchrysalia.527.d:0 "[CHN_GetAlcippeRank] Алкиппе вздохнула и размешала напиток своей магией. После коронации Кризалис она много о чём думала и все эти мысли были мрачными. У неё было множество вопросов, на которые очень трудно было найти ответы.\n\nК счастью, она заметила как Яхс привычно вышел на балкон вечером, чтобы выпить, и подошла к нему. — Алкиппе, — сказал Яхс, сопровождая своё неформальное приветствие легким кивком. — Ты как, держишься?\n\n— Не слишком хорошо, — призналась Алкиппе. — Я так много думала после того, как Секонд Винд... ну, вы знаете. — Она вздохнула. — То, что мы делаем... оно неправильно.\n\nЯхс поднял бровь. — Что ты имеешь в виду?\n\n— Всё, — разочарованно призналась Алкиппе. — Всё, что мы делали лишь продолжало удерживать сапог чейнджлингов на шее у пони. Чем больше я вижу последствий наших действий, тем лучше понимаю это. А попытка Секонд Винда убить императрицу заставила меня открыть глаза. Мы – злодеи в этой истории, Яхс. Чейнджлинги ничем не лучше пони, мы все должны быть равны. И всё же абсолютно всё, что мы делали, было направлено на то, чтобы мы продолжали стоять выше их. Как мы будем с этим жить?"
changelings_paxchrysalia.527.a:0 "Я думала о себе как о хорошем чейнджлинге, но я больше не уверена в этом."

changelings_paxchrysalia.8527.t:0 "Дабы изменить хоть что-то"
changelings_paxchrysalia.8527.d:0 "Яхсу потребовалось несколько секунд, чтобы сформулировать свой ответ. — Я понимаю, к чему ты клонишь, Алкиппе, — наконец сказал он, ставя свой бокал и поворачиваясь к ней мордой. — Не ты одна такая. У меня тоже появлялись подобные мысли после окончания войны. Я думаю, что все сводится к... — Яхс сделал паузу, подыскивая нужные слова. — Я полагаю, это зависит от того, что считать наиболее значимым и существенным способом осуществления изменений. Я мог бы хоть прямо сейчас подать в отставку и присоединиться к сторонникам Торакса — ну, или к тому, что от них осталось. Но вышестоящие чейнджлинги просто назначили бы другого офицера на мое место, а после этого гвардия королевы тут же начала бы занимать все командные посты, обладающие хоть какой-то реальной властью... Я не думаю, что мой преемник продолжит мою разумную и умеренную политику. С рациональной точки зрения лучшее, что я могу прямо сейчас сделать для пони, это по-прежнему оставаться губернатором и сдерживать наихудшие импульсы и идеи наших коллег.\n\n— Но мораль работает совсем не так, — покачала головой Алкиппе. — То, что мы относимся к военнопленным чуть лучше, вовсе не означает, что мы не несем никакой ответственности за их страдания. Маленькие проявления доброты и милосердия совершенно не перевешивают того зла, которое мы совершили.\n\n— И ты права, — согласился Яхс. — Мы получили огромную выгоду из этого несправедливого статуса-кво. И мы являемся соучастниками, когда обеспечиваем соблюдение «Пакс Кризалии». Но значительные перемены вполне можно вызвать вызваны маленькими шагами. На наших сегодняшних действиях будут учиться офицеры завтрашнего дня. И последующее поколение будет учиться у них. Мало-помалу мы делаем всё возможное, чтобы изменить ситуацию к лучшему. Но изменения не могут произойти немедленно, на это не способен ни один чейнджлинг-одиночка. Понимаешь, о чём я говорю?\n\n— Да... Я думаю, что да — сказала Алкиппе, нерешительно кивая.\n\n— Хорошо, — ответил Яхс и похлопал её по спине. — Я знаю, что эта мысль далеко не сразу успокаивает. И весьма нелегко жить с таким грузом на совести. Но если мы все будем работать вместе... ну, возможно, когда-нибудь следующие поколения смогут оценить по достоинству не только причинённое нами зло, но и совершённое добро."
changelings_paxchrysalia.8527.a:0 "Маленькие шаги постепенно приближают более светлое завтра."

changelings_paxchrysalia.528.t:0 "Возможность отдохнуть"
changelings_paxchrysalia.528.d:0 "В кои-то веки Яхс, которому приходилось одновременно исполнять обязанности [CHN_GetJachsRank]а в королевской армии, а также губернатора Кантерлота и центральной Эквестрии смог найти в своём сумасшедшем расписании немного свободного времени, а звёзды выстроились в ряд и подарили ему свободные выходные. В кои-то веки Эквестрия не стояла на грани полномасштабного бунта, и это дало возможность Яхсу и его сослуживцам вздохнуть полной грудью. Поэтому он решил заняться чем-нибудь веселым и расслабляющим и пригласил Алкиппе в свою резиденцию на просмотр довоенных эквестрийских фильмов.\n\nАлкиппе появилась вскоре после восьми вечера. Она была одета в простое и скромное платье, что делало её неотличимой от прочих чейнджлингов. Яхс приветственно улыбнулся, взял бутылку вина магией и откупорил. Затем, разлив напиток по бокалам, он последовал за Алкиппе в гостиную, где уже был установлен его личный проектор с загруженной плёнкой. Алкиппе присела на краешек дивана и посмотрела на стопку фильмов, лежащих рядом с проектором. — Сколько же тебе пришлось отдать за эту контрабанду? — спросила она, когда Яхс включил проектор.\n\n— Меньше, чем ты думаешь, но больше, чем тебе хотелось бы, — сказал Яхс со скромной улыбкой. — Но я знаю нескольких пони, которые были рады помочь мне.\n\n— И сколько у нас будет неприятностей, если УОБВ прознает про это? — Спросила Алкиппе с озорным огоньком в глазах.\n\n— Немало, — ответил Яхс. — Но держу пари, что Васпир в своё свободное время смотрит те же фильмы, так что всё будет в порядке.\n\nАлкиппе хихикнула, и вскоре из динамиков зазвучала вступительная музыка фильма. Сделав глоток вина, она устроилась поудобнее на диване и незаметно придвинулась ближе к Яхсу. В ответ тот прикрыл её спину своим крылом, а после накинул на их плечи ближайшее одеяло. Двое чейнджлингов улыбнулись, потерлись носами и радостно переключили своё внимание обратно на экран. Они были счастливы, потому что наконец-то могли провести вместе немного времени и позабыть о тяжести их обязанностей."
changelings_paxchrysalia.528.a:0 "Эпплвуд Филмс представляет..."

changelings_paxchrysalia.529.t:0 "Антидискриминационные меры"
changelings_paxchrysalia.529.d:0 "— Простите, сэр, но вы хотите нанять пони? Дать им работать квалифицированными техниками на наших заводах? И платить им зарплату?!\n\nФиникус закатил глаза, услышав этот возмущенный возглас от одного из членов совета директоров. — Да. И что в этом такого особенного?\n\n— Но, мистер Весали... они же пони, — запротестовал член правления. — Единственное, на что они годятся, – так это на физический труд, да и то не слишком хорошо. По правде говоря, это чудо, что их вид продержался так долго.\n\n— Просто чудо, что ты всё ещё в совете, проклятый идиот, — прорычал Финикус. Затем он встал и положил свои копыта на стол. — Что за чушь ты несешь? Неужели ты всерьез воспринимаешь тот мусор, которым тебя пичкает императрица и её дружки? Если бы пони были так плохи во всём, то война не продлилась бы так долго и не стоила бы нам так дорого. Правда заключается в том, что пони хороши во многих вещах. А пони, у которых на боку есть изображение шестерёнок и машин? Они разбираются лучше среднего трутня практически во всём, что есть на этой фабрике. Почему нам не хотеть нанимать их?\n\n— Но... сэр...\n\n— Пошёл вон отсюда, — сказал Финикус, свирепо глядя на чейнджлинга и указывая ему на дверь. — Тебе больше не рады в этой компании. И если мой ранг генерального директора и её президента не заставит тебя уйти в отставку, я попрошу [CHN_GetJachsRank]а Яхса или, возможно, саму императрицу разобраться с тобой. У меня сейчас немало влияния, так что я на твоём месте отнёсся к этому внимательно. — Вздохнув, Финикус посмотрел на остальную часть членов правления. — Ну, если достоинства пони не убедили вас в этой идее, то подумайте вот о чём. Мы можем быть первыми, кто примет квалифицированных техников-пони на наши заводы. Вы понимаете маркетинговую привлекательность этого? Вы понимаете, насколько более эффективной могла бы быть наша деятельность, когда на нас будут работать хорошо подготовленные специалисты-пони? Вы можете думать, что во время войны мы заработали много денег. Но вы даже не представляете, что нас ждёт, когда мы превзойдём наших конкурентов и станем монополистами в промышленном производстве! Звучит неплохо, а?"
changelings_paxchrysalia.529.a:0 "Мы получим прибыль, если будем работать с пони. Это действительно не так уж и трудно понять."

changelings_paxchrysalia.530.t:0 "Идеальная замена"
changelings_paxchrysalia.530.d:0 "— Клянусь, эти маленькие "пожертвования" с каждым разом становятся все легче, Марсилио. У нас хороший прогресс.\n\nГенерал-оберстабсарцт Марсилио кивнул и улыбнулся, глядя на распечатанные показания машины. В последние несколько недель он перенёс свою штаб-квартиру из Сиддла в Кантерлот, где юрисдикция Яхса защищала его работу от любопытных глаз королевской гвардии и УОБВ. Теперь он и его давний друг и партнер, доктор Спектрограф, изучали новый вопрос, который мог бы изменить мир. Они хотели создать искусственную любовь, которая была бы столь сильна, как и настоящая. — Рад это слышать, — сказал Марсилио, доставая отчёт из машины, как только он закончилась печать. Он прочитал его и нахмурился. — Ага... взгляни на это.\n\nДоктор Спектрограф убрал провода, приклеенные к телу, спрыгнул со стола и подошёл к Марсилио. Его глаза скользнули по строчкам и цифрам, а затем он присвистнул. — Сопоставимость в 37%? Это в два с лишним раза больше, чем у нас было неделю назад! Такими темпами мы уже через несколько месяцев получим приемлемую замену!\n\n— Ну, я бы не стал заглядывать так далеко, — сказал Марсилио. — Скорее всего мы выйдем на плато в какой-то момент, когда наткнемся на препятствие. Но да, это выглядит многообещающе. Если наша искусственная любовь обладает всего лишь в три раза уступает настоящей, то мы действительно достигли уже немалого прогресса.\n\nДоктор Спектрограф изумленно покачал головой. — Как удивительно... Ведь вскоре может наступить день, когда чейнджлингам не придётся насильно отнимать любовь у нас, пони. Как глубоко мы сможем сотрудничать друг с другом?\n\n— Я не могу и представить себе, — сказал Марсилио, но повернулся и ухмыльнулся Спектрографу. — Но думаю, что это будет выглядеть примерно так."
changelings_paxchrysalia.530.a:0 "Выпьем же за освобождение от калечащих оков любви!"

changelings_paxchrysalia.531.t:0 "Новая учебная программа"
changelings_paxchrysalia.531.d:0 "[CHN_GetAlcippeRank] Алкиппе наблюдала из-за трибуны, как новые кадеты-офицеры рассаживаются по местам в лекционном зале. Многие из них первый раз посетили Кантерлот и первый раз слушали лекцию от старшего офицера. Но и Алкиппе готовилась прочитать эту лекцию в первый раз. Она обратилась к Яхсу с просьбой реорганизовать учебную программу в офицерских школах, и каким-то образом [CHN_GetJachsRank] нашел нужные ниточки, чтобы осуществить это. Теперь любой будущий офицер, которому предстояло получить назначение где-нибудь в Эквестрии или Олении, сначала должен был пройти обучение в Кантерлоте, а не в Весалиполисе, и это позволяло Алкиппе рассказывать им то, что она и хотела.\n\nЧасы академии звоном сообщили о начале нового часа, так что Алкиппе выпрямилась и откашлялась. — Доброе утро, кадеты. Добро пожаловать на ваш первый урок образования. Меня зовут [CHN_GetAlcippeRank] Алкиппе, и я подчиняюсь непосредственно самому [CHN_GetJachsRank]у Яхсу. И сегодня мы будем учить вас тому, о чём вы должны постоянно помнить, если хотите быть офицером в армии: об уважении.\n\nОна включила проектор и на экране появился слайд с серией фотографий: на верхней была изображена императрица Кризалис, на левой – [CHN_GetJachsRank] Яхс, а на третьей – единорог, земной пони и пегаса, стоящие бок о бок. — Уважение – это то, на чем строится офицерский корпус. Прежде всего, уважение к нашей императрице, ибо именно она принесла ульям славу. Во-вторых, уважение к вышестоящим офицерам, ибо субординация всегда должна соблюдаться. И, наконец, уважение к пони Эквестрии. Это страна не так давно принадлежала именно им, и большинство из них до сих пор возмущены нашей оккупацией. Они имеют право на недовольство. Я тоже была бы недовольна, если бы всё случилось наоборот.\n\nОна рассматривала собравшихся, отмечая тех, кто проявлял наибольшее внимание. Алкиппе знала, что именно на этих кадетов она сможет рассчитывать в будущем. — Мы – завоеватели. Но это не значит, что мы должны быть угнетателями. Чтобы сохранить «Пакс Кризалию» мы должны быть почтительны к нашим подданным. Мы должны уважать их права, интересы и культуру. Потому что если мы этого не делаем, то не сможем быть теми праведными чейнджлингами, коими мы себя и считаем. Так мы станем обычными преступниками. А это будет величайшим оскорблением для нашей гордой расы."
changelings_paxchrysalia.531.a:0 "Но сейчас мы можем стать лучше!"

changelings_paxchrysalia.532.t:0 "Особенная книга"
changelings_paxchrysalia.532.d:0 "[CHN_GetJachsRank] Яхс поставил свою подпись на последнем бланке, лежавшем у него на столе, и бросил его в ящик для исходящей почты, которая будет отправлена вечером. Это был напряженный день, который принесёт множество новых и захватывающих перемен в будущем. Кусочек за кусочком Яхс использовал свой авторитет как губернатора кантерлотского комиссариата, чтобы проталкивать реформы, которые сделали бы жизнь пони, живущих под властью чейнджлингов, чуть более терпимой. И после недавних реформ он почувствовал, что добивается хорошего прогресса. Когда он впервые приехал в Кантерлот, пони яростно сопротивлялись жестокому угнетению. Но теперь сапог больше не прижимает их к земле. Его сменило доброжелательное копыто, готовое вести их в будущее.\n\nОднако на его столе лежал последний предмет. Свёрток, спрятанный под стопкой посланий, которые должны были быть составлены и подписаны. Яхс с любопытством придвинул его к себе. Развернув сверток, он обнаружил там книгу, обёрнутую в простую коричневую суперобложку. Открыв обложку, он сразу же наткнулся на сообщение от Секонд Винда, нацарапанное в углу страницы:\n\n— Яхс, ты так много сделал для пони Кантерлота. Ты так много для меня сделал. Некоторые даже могут назвать это дружбой. Взгляни на эту книгу и скажи мне, согласен ли ты с ней.\n-Секонд Винд\n\nЯхс перевернул страницу и ахнул, увидев название. — Дневник дружбы Твайлайт Спаркл? — пробормотал он себе под нос. Это было просто невозможно. Все уцелевшие экземпляры этого дневника были первым делом сожжены, когда чейнджлинги заняли Эквестрию. Получить уцелевшую копию в свои копыта...\n\nЯхс закрыл книгу и вздрогнул. В его копытах лежало самое незаконное произведение во всей Гегемонии. УОБВ казнит его, если узнает о том, что у него есть эта книга. Было бы безопаснее просто уничтожить её.\n\nНо опять же...\n\nУлыбаясь, Яхс открыл свою шуфлядку и сунул журнал внутрь вместе к остальным памятным вещам, собранным им за годы службы в армии и кантерлотском комиссариате. Избавляться от такой могучей книги было бы глупо. И может быть однажды он сможет открыто прочитать её и обсудить со своими друзьями."
changelings_paxchrysalia.532.a:0 "Разве это не стало бы замечательной историей?"

changelings_paxchrysalia.600.t:0 "Навёрстывание"
changelings_paxchrysalia.600.d:0 "Друг,\n\nПрошло уже довольно много времени с тех пор, как мы в последний раз собирались вместе после коронации императрицы Кризалис. Я знаю, что работа мешает нам встречаться и наслаждаться обществом друг друга, так как груз ответственности никогда не спадает с наших плеч, но всё же важно находить время, чтобы расслабляться и освежаться, прежде чем снова с головой окунаться в работу. В эту субботу я приглашаю тебе и остальных наших друзей присоединиться ко мне в моей резиденции за ужином с напитками. Я надеюсь, что ты сможешь найти время в своём расписании, чтобы присоединиться к нам.\n\nИскренне,\n[CHN_GetJachsRank] Яхс"
changelings_paxchrysalia.600.a:0 "Самое время снова собрать всю банду вместе!"

changelings_paxchrysalia.601.t:0 "Встреча умов"
changelings_paxchrysalia.601.d:0 "Алкиппе была очень рада снова увидеть Финикуса и Марсилио, а также Секонд Винда в доме Яхса. Все пятеро друзей целенаправленно делали всё возможное, чтобы избежать разговоров о работе во время ужина. Вместо этого разговор перешёл на события личной жизни каждого из них, и как они использовали возможности «Пакс Кризалии», чтобы наслаждаться своим свободным временем. Это создало непринужденную и беззаботную атмосферу, и после окончания ужина четверо чейнджлингов взяли свои напитки и расселись снаружи на крыльце Яхса, которое выходило на его просторный задний двор.\n\nТам их разговоры под воздействием алкоголя начали смещаться на другие темы, и Финикус, конечно же, был именно тем, кто поднял вопрос. — Эй, Яхс, помнишь тот раз, когда мы кайфовали в наркопритоне Глориосы? — Спросил он. — Это было нечто, не так ли?\n\nЯхс вздохнул и откинулся на спинку стула, потирая копытом свой висок. — Я помню ужасное похмелье на следующий день, даже слишком хорошо. Как бы мне ни хотелось забыть об этом.\n\n— Я же просила не пить этот напиток, — сказала Алкиппе, качая головой. — Я рада, что с тех пор ты туда не возвращался. Хотя не уверена, что могу сказать то же самое о Финикусе.\n\n— Послушай, иногда тебе просто нужно пробовать что-то другое, понимаешь? — Сказал Финикус, поднимая копыта в воздух. — Кроме того, я делаю это в исследовательских целях. Вполне уважительная причина."
changelings_paxchrysalia.601.a:0 "Исследовательских целей? Неплохое оправдание."

changelings_paxchrysalia.8601.t:0 "Вопрос о знаках"
changelings_paxchrysalia.8601.d:0 "— Я вам этого не говорил, но королевская гвардия недавно заключила гигантский контракт с несколькими военными исследовательскими фирмами, в том числе и «Мейн-Хайв», — сказал Финикус. — Они хотят получить каких-то суперсолдат или что-то в этом роде, но им на самом деле всё равно, как мы будем это делать. Поговаривают, что отдел закупок вооружений компании "Мэйфлай Электроникс" пытается создать магические экзоскелеты, которые позволили бы одному из наших егерей на равных сражаться с рыцарем-грифоном. Я также знаю, что университет в Сорифе планирует использовать генную инженерию и психологическую подготовку, чтобы вырастить новое поколение спроектированных личинок. Но у меня есть на примете кое-что получше: знаки отличия.\n\nАлкиппе фыркнула и покачала головой. — По-моему, ты слишком пристрастился к любви, — сказала она. — Это просто безумие. Наличие знака отличия не превратит чейнджлинга в суперсолдата.\n\n— Разве? — Финикус повернулся к Секонд Винду, который до сих пор молчал. — А ты как думаешь, Секонд? Ты здесь единственный с картинкой на заднице. Я бы сказал, что ты – самый квалифицированный специалист в этой сфере.\n\n— Ну, я не уверен насчёт чейнджлингов со знаками отличия, но лучшие солдаты и генералы в эквестрийской армии обладали очень подходящими знаками отличий, — сказал пегас. — Ты можешь обучить пони со стопкой кирпичей в качестве знака метко стрелять, но он никогда не будет стрелять так же хорошо, как кто-то с перекрестьем на своём боку. Даже наших генералов крайне сложно остановить, если у них был подходящий знак.\n\n— Как генерал Спирхэд, — сказал Яхс, после чего он и Алкиппе застонали и покачали головами. — Ульям очень повезло, что она стала командиром лишь ближе к концу войны. Она умела эффективно использовать и концентрировать танки, чтобы прорывать наши линии и постоянно угрожать флангам. Танковая дуэль между ней и Триммелем за пределами Лас-Пегасуса вошла в легенды, и мы победили её лишь тогда, когда у неё начались проблемы со снабжением и не она могла получать топливо для своих танков и грузовиков.\n\n— Звучит очень похоже на именной детерминизм, — согласился Марсилио. — Но как ты собираешься дать чейнджлингам знаки, Финикус?"
changelings_paxchrysalia.8601.a:0 "Это чуть сложнее, чем просто привести наших солдат в тату-салон."

changelings_paxchrysalia.9601.t:0 "Первородный грех"
changelings_paxchrysalia.9601.d:0 "— Понятия не имею, — признался Финикус. — У меня есть несколько первоначальных идей, но пока ничего конкретного. Нам нужно немало финансирования и помощи, чтобы запустить этот проект, но я уверен, что мы сможем добиться успеха. Кроме того, если мы осуществим всё то, то представьте чего сможем добиться! Подумайте обо всём, на что, в отличие от чейнджлингов, способны пони из-за отсутствия у них меток. Что было бы, если мы сумели найти недостающий фрагмент, который позволил бы расе чейнджлингов полностью раскрыть свой потенциал! Возможно, тогда нам не пришлось бы быть, — и тут Финикус понизил голос до театрального шепота, — паразитами, о чём так упорно твердит королева Кризалис.\n\n— Недостающий фрагмент? — Спросил Секонд Винд. — Что ты хочешь этим сказать? Ты думаешь, что знаки – это своего рода недостающая часть чейнджлингов?\n\n— Не знаю, разделяет ли мои чувства кто-нибудь из вас, — сказал Финикус, глядя на других чейнджлингов в комнате, — но мне всегда было интересно, как сложилась бы моя жизнь, если бы у меня был такой знак, как у пони. Очень здорово знать своё место в жизни. Не то чтобы мне не нравится занимать пост генерального директора «Мейн-Хайв», но...\n\n— После встречи с Твайлайт в шахтах, — сказал Марсилио, — она заставила меня задуматься о судьбе и индивидуальности. У пони всё это есть, и их знаки – огромная часть этого. И мне всегда было интересно, что произойдет, если мы дадим всем чейнджлингам эти самые знаки. Сможем ли мы придать индивидуальности виду чейнджлингов? Изменить нашу судьбу? Кто знает, чего мы могли бы достичь, если бы знаки, как считают пони, действительно меняли жизнь?\n\nСеконд Винд был шокирован этим утверждением. — Твайлайт? Твайлайт Спаркл? Она в шахтах под Кантерлотом?\n\n— Это долгая история, — сказал Яхс, — и я расскажу её тебе в другой раз. Важно лишь то, что мы должны держать это в секрете. — Он повернулся к Финикусу и остальным своим друзьям-чейнджлингам. — Но я должен признать... что это интересная идея. Сможем ли мы изменить общество чейнджлингов к лучшему, просто дав всем чейнджлингам знаки? Думаете, это может сработать?\n\n— Вероятно, — сказал Финикус и кивнул. Он покосился на Марсилио. — А как насчет тебя, господин учёный? Есть идеи?\n\nМарсилио пожал плечами. — Я полагаю, что это маловероятно, но отнюдь не невозможно. Я действительно считаю, что сейчас мы могли сделать поспешные выводы относительно того, что наличие меток будет означать для нас, чейнджлингов... но почему бы и нет? Мне бы хотелось верить, что в знаках заключается своя изменяющая жизнь внутренняя магия. И если мы объединим наши ресурсы, то, возможно, нам удастся что-то выяснить."
changelings_paxchrysalia.9601.a:0 "Давайте сделаем это!"

changelings_paxchrysalia.602.t:0 "Охота за талантами"
changelings_paxchrysalia.602.d:0 "— Это просто блестящая идея, — сказал Финикус чейнджлингу, идущему рядом с ним, когда они вдвоём гуляли по садам Кантерлота. — Красота, очевидно, заключается в простоте. Зачем тратить миллионы на передовые генетические или кибернетические исследования, когда мы можем использовать естественную щедрость окружающего мира, чтобы нанести картинки на наши бока и увеличить природные таланты чейнджлингов в двадцать раз?\n\nКапитан королевской гвардии Ласин Кардо нахмурился, когда они завернули за угол и продолжили путь по выложенной кирпичом дороге, извивающейся между садами. — Знаки – это символ пони, — сказал он. — Зачем нам извращать совершенство чейнджлингов, нанося эти знаки на наш хитин? Так мы признаем, что у пони есть преимущество, которого лишены чейнджлинги.\n\nФиникус закатил глаза. — А если мы прикрепим к нашим солдатам механические руки и превратим их в роботов, то это не "извратит совершенство чейнджлингов"? Пожалуйста. — Он ускорился, обогнал Ласина и стал идти задом наперед, чтобы они могли поговорить лицом к лицу. — Ты солдат, Ласин, и я знаю, что ты сражался с пони со знаками отличия. Правильный знак может практически превратить среднего пони в настоящего суперсолдата. Но если дать нашим солдатам хорошие знаки, то они станут не только прекрасными бойцами, но и великолепными инфильтраторами.\n\n— Великолепными инфильтраторами? — Спросил Ласин. — Как так?\n\n— Ты знаешь, как эквестрийцы разоблачали наших инфильтраторы? Они заставляли их демонстрировать особые таланты, связанный с их знаком. Наши инфильтраторы не могли делать эти вещи так же умело, как обладающие этим особым талантом пони, чем и раскрывали себя. Но если вы дадите инфильтратору настоящий знак и способности, присущие ему, то тогда они смогут более или менее неплохо выполнять проверки пони. Знаки – это то, что делает пони, собственно, пони и чейнджлинг со знаком значительно продвинется в том, чтобы стать великолепным инфильтратором — идеальным пони, так сказать.\n\nЛасин на мгновение задумался, но в конце концов кивнул в знак согласия. — Я понимаю твою мысль. Хорошо, хорошо. «Мейн-Хайв» получит поддержку королевской гвардии, но мы ожидаем результатов. Особенно от амбициозного проекта вроде этого."
changelings_paxchrysalia.602.a:0 "О, мы предоставим результаты, Ласин. Вы можете на это рассчитывать."

changelings_paxchrysalia.603.t:0 "Неожиданный визит"
changelings_paxchrysalia.603.d:0 "Финикус покинул свои новые лаборатории в Кантерлоте после того, как убедился, что они получили всё необходимое исследователям оборудование для начала работы. Покупка помещения в густонаселённом городе на вершине горы и последующее оснащение его самым современным оборудованием стоили очень и очень немало, но поскольку теперь королевская гвардия готовилась финансировать его работу, он не слишком беспокоился про это. К тому же, если он действительно добьется успеха, то результаты многократно окупятся. Ему больше никогда в жизни не придётся работать. Может быть, он создаст себе какой-нибудь художественный знак, чтобы найти хобби на пенсию. Он всегда думал, что рисовать картины акварелью будет довольно интересно.\n\nОднако, когда он уже собирался выйти из здания и пойти пообедать, дорогу ему преградили члены королевской гвардии и сама императрица Кризалис. Финикус низко поклонился, когда понял, что стал объектом внимания императрицы, и улыбнулся ей. — Ах, Ваше Величество, как приятно видеть вас здесь сейчас. Как скромный чейнджлинг вроде меня может быть полезен вам?\n\n— Я пришла осмотреть помещения, где будут проводиться ваши исследования, — сказала она. — Капитан Кардо сообщил мне, что вы пытаетесь дать чейнджлингам знаки отличия. Весьма честолюбиво, скажу я вам. Я буду внимательно следить за вашими успехами.\n\nЗатем она наклонилась так, чтобы оказаться почти нос к носу с Финикусом. — Но не заблуждайся, — предупредила она, — пони уступают нам. Не забывай об этом. Если бы ты смог украсть их знаки и отдать их нам, то так можно наделить чейнджлингов ещё большей силой, одновременно ещё сильнее унизив пони и лишив их данного им по праву рождения. И я не смогла придумать ничего более справедливого в этом мире.\n\nПотом она встала и улыбнулась ему. — О, я придумала. Если бы ты мог дать мне знак Селестии и её способность двигать солнце, ты стал бы настоящим героем всех чейнджлингов. О, что я могла сделать с этой силой... — Она хихикнула про себя и прошла мимо Финикуса. — Приятного аппетита, мой верный подданный. Не могу дождаться, когда увижу твой прогресс."
changelings_paxchrysalia.603.a:0 "Я не разочарую вас, императрица. Не сомневайтесь в этом."

changelings_paxchrysalia.1603.t:0 "«Желание сердца»"
changelings_paxchrysalia.1603.d:0 "Всю прошлую неделю Марсилио корпел над книгами, имевшимися в его распоряжении, многие из которых были украдены из кантерлотских архивов. В этих книгах было немало старых и неясных ссылок на вещи, о которых чейнджлинги мало что знали. Марсилио был просто счастлив, что ему удалось узнать так много во время оказания помощи проекту Финикуса. Но не только это: ему удалось привлечь к работе над проектом многих старых друзей, вроде его коллеги-пони доктора Спектрографа. В конце концов, они могли изменить общество чейнджлингов изнутри и снаружи...\n\n— А как насчет этого? — доктор Спектрограф пододвинул через стол книгу к Марсилио, постукивая копытом по изображению пони, покрытого знаками отличия, — В старых текстах упоминается "Оспа знаков отличия", поразившая маленький городок много веков назад. Граждане случайным образом получали знаки отличия, иногда десятки сразу, и они демонстрировали таланты от всех этих знаков, пока они у них оставались.\n\n— Это звучит невероятно, — сказал Марсилио, поднимая бровь и читая информацию из книги. — Но почему то, что дает пони так много талантов, считается оспой?\n\n— Потому что поражённые этой болезнью были вынуждены постоянно демонстрировать таланты, соответствующие их знакам, что часто приводило к истощению или даже смерти, — заявил Спектрограф. — Никто тогда так и не узнал причину болезни, хотя теперь считается, что она была вызвана цветком под названием "Желание сердца", который растёт в Вечнодиком лесу. В садах Кантерлота, вероятно, можно найти что-то подходящее для тестов. Возможно, мы нащупали верный путь.\n\n— Вероятно, — согласился Марсилио. — Быть может, мы сумеем использовать магию, заключенную в цветке, для наших целей. Я позабочусь, чтобы Финикус узнал об этом."
changelings_paxchrysalia.1603.a:0 "Неплохое начало, это точно."

changelings_paxchrysalia.2603.t:0 "Несколько вопросов"
changelings_paxchrysalia.2603.d:0 "Первые испытания «Желания сердца» оказались многообещающими, но они не обеспечили того прорыва, которого так ждал Марсилио. Разбавленные растворы, сделанные из пыльцы растения, вызывали появление одной или двух дополнительных меток у испытуемых пони. Они держались примерно неделю, а затем исчезали. Однако если дать пони следующую дозу раствора, то у него появится тот же знак, что и в прошлый раз. Первые испытания на добровольцах-чейнджлингах были гораздо менее успешными: знаки отличия появлялись на боках или шеях чейнджлингов лишь на несколько секунд, а затем снова исчезали. Это было лишь начало, но нужно было сделать что-то ещё.\n\nМарсилио принял во внимание природу этого источника магии и разыскал биолога, специализировавшегося на изучении Вечнодикого леса, которая переехала в Кантерлот после войны. У доктора Грин Хуф был скромный маленький домик рядом с раскинувшимися парками Кантерлота. Она, несомненно, выбрала его, чтобы быть ближе к зелени, которую она так любила. Доктор согласилась встретиться с Марсилио, чтобы обсудить свою работу. Хотя поначалу Грин Хуф неохотно желала сотрудничать, но её убедило обещание позволить присоединиться к экспедициям, которые будут изучать остатки Вечнодикого леса.\n\nИменно так и получилось, что в субботу днём Марсилио оказался на кухне доктора Грин Хуфа, пил чай и объяснял, что именно ему нужно. — «Желание сердца» – мощное магическое средство, но оно неустойчиво, — объяснил он ботанику. — Армия хочет использовать свойства этого растения для наших проектов, но нам нужно его как-то стабилизировать. Как я, так и армия надеемся, что вы сможете предоставить нам информацию о том, что можно использовать для этой цели.\n\nГрин Хуф потёрла подбородок и задумалось. — Ну, что-то может и найтись, — сказала она. — Конечно, никто и никогда не пыталась использовать "Желание сердца" для чего-либо, учитывая его побочные эффекты. Но вам, вероятно, смогут помочь растения из рода Инкредибилус."
changelings_paxchrysalia.2603.a:0 "— И какие же растения относятся к роду Инкредибилус, доктор?"

changelings_paxchrysalia.3603.t:0 "Парочка растений"
changelings_paxchrysalia.3603.d:0 "— Ну, первым на ум приходит очевидная и печально известная Инкредибилус Хьюморос, более известная как "Ядовитая шутка", — сказала Грин Хуф. — Если пыльца этого растения попадёт на кожу или панцирь живого существа, то само растение будет совершать "смешные" шалости над жертвой, нередко основываясь на имени. Эффекты "Ядовитой шутки" хаотичны, но не случайны, так что она в некоторой степени надёжна. Пыльца "Ядовитой шутки" в малых дозах может усиливать другие вещества. К примеру, с её помощью можно превратить слабую кислоту в сильную, а если начать принимать её с обезболивающими, то можно впасть в кататонию.\n\nМарсилио нахмурился. — Всё ещё слишком непредсказуемо, — сказал он. — Есть что-то ещё на примете?\n\n— Есть, — кивнула Грин Хуф. — Семена Инкредибилус Веритас, также известные как "Семена истины", традиционно использовались на эквестрийском юго-востоке как лекарство от всех видов психических заболеваний и недугов вроде шизофрении и слабоумия. Принципы их действия непонятны даже для такого опытного ботаника, как я, но считается, что он выявляет и усиливает "истинное я" существа, которое глотает их порошок. Хотя, конечно, всё не так просто: скорее всего, эти семена просто усиливают текущее состояние существа во время их приёма. У пациентов с деменцией симптомы резко ухудшаются, если они принимают семена во время приступа, но если съесть их в моменты ясности, то умственные способности значительно повысятся. Важно верно подобрать момент.\n\nМарсилио кивнул и улыбнулся ботанику. — Спасибо, доктор, — сказал он, протягивая ей копыто на прощание, — это было невероятно полезно. Если мне понадобится разгадать ещё какие-то ботанические тайны, то я приду прямо к вам.\n\n— Конечно, главный хирург, — ответила Грин Хуф, — и, пожалуйста, помните про ваше обещание. Вечнодикий лес сейчас опаснее, чем когда-либо прежде, и я хотел бы посетить его снова под охраной. Пожалуйста, возьмите меня с собой, когда будет организована следующая экспедиция."
changelings_paxchrysalia.3603.a:0 "Я обязательно это сделаю, доктор."

changelings_paxchrysalia.4603.t:0 "Ответственное решение"
changelings_paxchrysalia.4603.d:0 "— И вот что я смог придумать, — сказал Марсилио, закрывая папку перед собой своей магией. Когда речь хирурга окончилась, Яхс, Алкиппе и Финикус сделали то же самое. — «Желание сердца» – это основа того, что мы ищем. У это растения есть возможность сделать так, чтобы у чейнджлингов появились знаки, но оно недостаточно стабильно, чтобы сделать эффект долговечными. Поэтому нам нужна либо «Ядовитая шутка», которая может значительно усилить силу сыворотки «Желания сердца», либо «Семена истины», которые, как предполагается, способны усилить «истинное я» существа. Теперь нам нужно принять решение о дальнейших действиях.\n\n— Почему бы просто не использовать оба растения? — Спросил Финикус.\n\n— Эти растения можно найти лишь в Вечнодиком лесу или в небольших регионах юго-востока, — объяснил Марсилио. — И если принять во внимание хаос на юго-востоке и текущее состояние Вечнодикого леса, я думаю, что нам на самом деле будет легче сосредоточиться на лесу. Однако для этого понадобится хорошо вооружённая и быстрая экспедиция, которое поможет без задержек найти искомое и покинуть лес. У нас нет времени искать синие цветы, а затем выкапывать их семена. Мы можем получить лишь одно растение, так что я хотел бы услышать ваши мнения.\n\nЯхс пожал плечами и отодвинул папку от себя. — Не спрашивай меня, — сказал он. — Я бесполезен, когда дело касается биологии и ботаники.\n\n— Это ничего не значит, — сказал Финикус. — Я тоже бесполезен, но из того, что сказал Марсилио, совершенно ясно, что «Ядовитая шутка» – это правильный выбор. Да ладно, как можно сомневаться в растении, которое делает сильнее всё, к чему только прикасается?\n\n— Но «Семена истины», вероятно, более безопасный кандидат, — сказала Алкиппе. — Вообще-то я недолго изучала биологию, прежде чем пойти в армию, так что немного знакома с этим растением. «Семена истины» будут более безопасной альтернативой, чем «Ядовитая шутка». Кто знает, что может пойти не так, если этот голубой цветок решит сыграть с нами весьма злую шутку?\n\n— У нас ещё есть время всё обдумать, — сказал Яхс. — Мне все равно придётся подготовить экспедицию, на что уйдёт некоторое время. — Он кивнул своим спутникам. — Поразмыслите об этом, и мы обсудим это позже. Может быть, тогда мы сможем найти чёткий и ясный путь вперёд."
changelings_paxchrysalia.4603.a:0 "Как скажешь, Яхс."

changelings_paxchrysalia.604.t:0 "Суть вопроса"
changelings_paxchrysalia.604.d:0 "Финикус вздохнул и потёр глаза, отложив в сторону последний отчет. Он так долго просматривал результаты своих исследований и предварительные выводы, что его взгляд просто остекленел и он уже не мог сосредоточиваться на чём-либо ещё. Поэтому, заворчав, Финикус встал из-за стола и прошёл в другой конец своего личного кабинета, где его ждало лекарства от головной боли: открытая бутылка коньяка и набор хрустальных бокалов.\n\n— Хочешь немного? — сказал он через плечо другому чейнджлингу в комнате. Алкиппе лежала на плюшевом диване из искусственной кожи в дальнем конце комнаты. Она упиралась задними лапами в стену, свешиваясь головой почти до самого пола, и держала магией отчёты перед своим лицом. Она провела здесь так же много времени, как и Финикус, и они вместе долгими часами просматривая записи промышленника, пока Яхс и Марсилио были заняты другими аспектами своей работы.\n\n— Конечно, — сказала Алкиппе, бросая заметки на пол и с кряхтением возвращаясь в сидячее положение. Она взяла предложенный бокал магией и сделала большой глоток, тут же сморщившись и закашлявшись, когда коньяк попал ей на язык. — Коньяк?! Нужно было уточнить подробности, прежде чем соглашаться.\n\n— Такое полезно для тебя, это закаляет характер, — ухмыльнулся Финикус, потягивая напиток из своего бокала. Затем он уселся напротив Алкиппе и посмотрел на груду бумаг и папок, разложенных веером вокруг её дивана. — Ну как? Можешь похвастать каким-нибудь потрясающим прорывом?\n\n— Не сильно больше того, что мы уже и так знаем. — Алкиппе вздохнула и, несмотря на своё прежнее отвращение к напитку, сделала ещё один глоток коньяка. — Честно говоря, я даже не знаю, дадут ли "Семена истины" возможность появиться знакам отличия. У существ, принимающих их, случаются мощные галлюцинации, но, похоже, на этом всё.\n\nФиникус задумался на мгновение, и, сделав ещё один глоток коньяка, нахмурился. — Знаешь... я читаю все эти отчеты... и мне кажется, что я кое-что понял."
changelings_paxchrysalia.604.a:0 "Да? И что же?"

changelings_paxchrysalia.1604.t:0 "Смысл жизни"
changelings_paxchrysalia.1604.d:0 "— Я понял... ну, что мне плевать на знак отличия, — сказал Финикус. — Я не ищу свой знак, чтобы быть лучше в чём-то. Я ищу знак, который скажет мне, что делать со своей жизнью. Я почти всю свою жизнь посвятил одному-единственному делу: зарабатыванию денег. Мне было плевать на способы, которыми я этого добивался, я просто хотел это сделать просто потому, что думал, что деньги дадут мне ответ на вопрос о том, что делать со своей жизнью. Мне просто нужно было насытиться деньгами, и в конце концов я бы понял, что со всем этим делать.\n\n— А теперь у меня есть все эти деньги, — продолжал он, обводя комнату копытом. — У меня больше денег, чем я мог себе представить, ведь я – генеральный директор и президент «Мейн-Хайв». Они, деньги позволили мне приобрести этот удивительный дом, а также обеспечивают ежедневные удобства. Но что всё это мне даёт на самом деле? Ничего. И теперь, когда Великая Война и все сопутствующие ей отвратительные смерти и разрушения закончились, я больше не хочу быть частью всего этого. Так что я просто не знаю... что хочу делать со своей жизнью? — Финикус пожал плечами. — Может быть, эти семена помогут мне. В конце концов, какой смысл в том, чтобы получить знак отличия, если я даже не знаю, какой знак мне нужен? Я бы предпочёл просто знать, чем я должен заниматься всю оставшуюся жизнь, а потом приняться за дело своей жизни.\n\nАлкиппе, хоть и удивилась поначалу этому признанию, чуть позже медленно кивнула в ответ. — Да... Я понимаю, что ты имеешь в виду. Я никогда не знала, что именно хочу делать со своей жизнью. Я четыре раза меняла специальности в колледже, прежде чем в конце концов бросила учёбу и пошла в армию. Теперь я служу здесь Яхсу... но иногда мне кажется, что я являюсь лишь правым копытом Яхса. И я с радостью помогу ему в случае необходимости, не пойми меня неправильно... но если завтра Яхс уйдет на пенсию, то я не знаю, что мне делать дальше. Я не знаю, что сделает меня счастливой. Иногда мне хочется, чтобы можно было просто расспросить кого-то и выяснить у него, чем я должна заниматься в своей жизни...\n\nДвое чейнджлингов медленно встретились взглядами, и в этот момент приняли решение. — К Дискорду знаки и всё подобное им дерьмо, — сказал Финикус. — «Семена истины» дадут нам то, чего мы хотим. Жизнь – это нечто большее, чем просто маленькая картинка на твоей заднице. Это то, что ты делаешь с ним, а не то, что у тебя хорошо получается."
changelings_paxchrysalia.1604.a:0 "Будем надеяться, что наши друзья поймут это."

changelings_paxchrysalia.2604.t:0 "Встреча"
changelings_paxchrysalia.2604.d:0 "Алкиппе нервничала, пока Яхс и Марсилио обустраивались на своих местах, присоединившись к ней и Финикусу на собрании. Яхс потёр глаза, болевшие после очередной ночи, полной работы, и не стал терять времени даром, начав обсуждение. — Итак, Марсилио только вчера вечером сообщил мне, что, основываясь на информации от одного из его приятелей в Весалиполисе, королевская гвардия каким-то образом прослышала о наших попытках стабилизировать «Желание сердца» с помощью экстракта «Ядовитой шутки», чтобы дать чейнджлингам знаки. И теперь они инициировали свои собственные исследования в этой области. Кто-то из УОБВ, вероятно, предупредил их. Я до сих пор не могу понять, кто из наших сотрудников отчитывается Васпиру, а кто нет. Вероятно, я этого никогда и не пойму. Но теперь, когда королевская гвардия королевы и, следовательно, сама императрица Кризалис знают, что «Желание сердца» и «Ядовитая шутка» могут являться очень мощной комбинацией, способной давать знаки, они настаивают на проведении исследований в этой области. И вот чем мы будем заниматься. Алкиппе и Финикус, у вас есть хорошие аргументы в пользу «Семян истины»? Я знаю, что вы вдвоём проводили немало исследований на эту тему.\n\nАлкиппе и Финикус посмотрели друг на друга, и промышленник первым проявил инициативу. — Ну, вот тут кроется одна забавная штука. У меня с Алкиппе было несколько интересных бесед прошлой ночью, и мы подумали... подумали о том... что знаки нам не нужны. «Семена истины» не дадут чейнджлингам меток, но их можно использовать, чтобы заставить чейнджлинга или пони испытать очень яркие галлюцинации или, другими словами, настоящее прозрение. Если соединить этот эффект с «Желанием сердца»... ну, я думаю, что так любой чейнджлинг сможет понять смысл жизни... или, по крайней мере, СВОЕЙ жизни. А это, как нам кажется, важнее любой картинки на боку у чейнджлинга.\n\nЯхс и Марсилио переглянулись, как будто не были уверены в том, что правильно расслышали слова, а затем Яхс нахмурился. — Ты хочешь отказаться от идеи дать чейнджлингам знаки? Отказаться от величайшего открытия в истории нашего вида только потому, что не можете понять, что вы хотите делать со своими жизнями?\n\n— Это крайне эгоистично, — заметил Марсилио. — Ну, может быть, это звучит и слишком грубо. Но это определённо недальновидно и импульсивно. У нас есть шанс улучшить наш вид неисчислимыми способами. И какой-то интенсивный наркотический трип никак этому не поможет. Если вы действительно хотите помечтать о том, что делать со своей жизнью, то просто сходите к Глориосе и попросите у неё наркотиков. По крайней мере, так вы не будете тратить наши ресурсы, чтобы просто покайфовать."
changelings_paxchrysalia.2604.a:0 "Это пустая трата времени и ресурсов. «Ядовитая шутка» – вот путь к успеху."

changelings_paxchrysalia.3604.t:0 "Решение"
changelings_paxchrysalia.3604.d:0 "— Ты не сделаешь мир лучше, просто дав чейнджлингам знаки отличия, — возразила Алкиппе. — Разве ты считаешь, что любые открытия, сделанные нами, покинут пределы юрисдикции королевской гвардии? Конечно, они могут позволить вам, ребята, получить свой собственный знак отличия, но только не среднему чейнджлингу. Они отдадут знаки лишь своим лучшим солдатам или инфильтраторам, и только сделают удушающую хватку «Пакс Кризалии» ещё более жесткой. Вы просто создадите ещё более сильный и деспотичный режим с помощью этого. А вот с "Семенами истины" мы можем помочь нашему виду обрести индивидуальность, которой так жаждем. Мы сможем показать каждому чейнджлингу то, чего он действительно хочет в жизни. Даже после того, как само наше общество сокрушит все их надежды и мечты ещё в юности.\n\n— Вы упускаете саму суть, — поддержал Алкиппе Финикус. — Даже если мы дадим Кризалис знак Селестии, это не сделает её доброй и сострадательной. Хотя, безусловно, намного увеличит её силы. Наши искусственные знаки отличий просто станут ещё одним способом дать чейнджлингам дополнительный талант в той или иной задаче, или же попросту увеличат их эффективность в какой-то сфере. Но для того, чтобы фундаментально изменить весь наш вид и всю нашу суть, потребуется нечто больше, чем просто картинка на боку. Навязчивая идея воплотить искусственные знаки в реальности лишь ослепляет вас. И вы не видите того, что эти знаки сотворят с миром. Они точно не изменят его к лучшему.\n\nМарсилио открыл было рот, чтобы возразить, но Яхс остановил его поднятым копытом. — Я не хочу, чтобы это переросло в скандал и перекрикивание друг друга, — сказал он. — Я вчера поздно лёг, и у меня болит голова, так что мне бы хотелось, чтобы вы вели себя потише. Но ещё важнее то, что мы друзья, а друзьям не нужно рвать друг друга на части. Так что давайте договоримся об окончательном решении здесь, в этой комнате, и только между нами. Хорошо? — Когда все чейнджлинги кивнули, Яхс опустил копыта на стол. — Отлично. Я не собираюсь вмешиваться в это дело и становиться на чью-то сторону. Вы трое сможете разобраться с этим сами.\n\nМарсилио и Финикус тут же встретились взглядами. Алкиппе поняла, что ни один из них не отступит. С ужасом она осознала, что финальное решение зависит именно от неё. Так что же она хотела: способ дать чейнджлингам знаки отличия? Или возможность понять смысл их жизней?"
changelings_paxchrysalia.3604.a:0 "Мы будем использовать "Ядовитую шутку", чтобы дать чейнджлингам знаки отличия."
changelings_paxchrysalia.3604.b:0 "Мы будем использовать "Семена истины", чтобы понять смысл наших жизней."

changelings_paxchrysalia.605.t:0 "Охота за шуткой"
changelings_paxchrysalia.605.d:0 "[CHN_GetAlcippeRank] Алкиппе глубоко вздохнула, выходя из бронетранспортера и чувствуя влажную землю под своими копытами. Перед ней возвышались могучие деревья Вечнодикого леса, которые выглядели так, словно готовы поглотить её целиком. Похожие на кости ветви деревьев и покрытые пеплом стволы резко контрастировали с ещё живыми растениями. Всё это зрелище было напоминанием о шрамах, которые армия нанесла волшебному лесу, пытаясь подавить разгоревшееся в нём восстание.\n\nОна оставила машину позади и сделала несколько шагов по направлению к поляне, где несколько чейнджлингов разглядывали потрёпанную карту. Она сразу же узнала Марсилио, а также нескольких солдат из дивизии Яхса 96. Canterlonian, специально отобранных для этого задания, но остальные были ей незнакомы. Подойдя ближе, она откашлялась, после чего солдаты подняли головы и отдали ей честь.\n\n— Господа, — поприветствовала их Алкиппе, а затем перенесла своё внимание на Марсилио. — Ну что, генерал-оберштабсарцт? Как тут обстоят дела?\n\n[CHN_scripted_loc_event_1605]\n\nЗемная пони-ботаник рядом с Марсилио, его знакомая по имени Грин Хуф, кивнула. — Попытки армии усмирить лес оказали пагубное влияние на местную флору. Большинство мест произрастания "Ядовитой шутки", о которых я знал, теперь сожжены дотла. Нам придётся углубиться в лес, чтобы попытаться найти эти растения.\n\n— Не волнуйтесь, — сказал стоявший рядом с Алкиппе капитан, уверенно ухмыляясь собравшимся чейнджлингам. — Мои солдаты будут охранять нас изо всех сил. Мы быстро войдём в лес и выйдем из него, прежде чем нас настигнут неприятности.\n\n— Рада это слышать, — сказала Алкиппе. — Ну, что можно отправиться в путь?\n\n— Готовы, как никогда, — ответил Марсилио, складывая карту и засовывая её в карман куртки. — Выдвигаемся."
changelings_paxchrysalia.605.a:0 "Чем скорее мы найдем нужное растение, тем быстрее сможем покинуть это жуткое место."

changelings_paxchrysalia.1605.t:0 "В поисках правды"
changelings_paxchrysalia.1605.d:0 "[CHN_GetAlcippeRank] Алкиппе глубоко вздохнула, выходя из бронетранспортера и чувствуя влажную землю под своими копытами. Перед ней возвышались могучие деревья Вечнодикого леса, которые выглядели так, словно готовы поглотить её целиком. Похожие на кости ветви деревьев и покрытые пеплом стволы резко контрастировали с ещё живыми растениями. Всё это зрелище было напоминанием о шрамах, которые армия нанесла волшебному лесу, пытаясь подавить разгоревшееся в нём восстание.\n\nОна оставила машину позади и сделала несколько шагов по направлению к поляне, где несколько чейнджлингов разглядывали потрёпанную карту. Она сразу же узнала Марсилио, а также нескольких солдат из дивизии Яхса 96. Canterlonian, специально отобранных для этого задания, но остальные были ей незнакомы. Подойдя ближе, она откашлялась, после чего солдаты подняли головы и отдали ей честь.\n\n— Господа, — поприветствовала их Алкиппе, а затем перенесла своё внимание на Марсилио. — Ну что, генерал-оберштабсарцт? Как тут обстоят дела?\n\n[CHN_scripted_loc_event_1605]\n\nЗемная пони-ботаник рядом с Марсилио, его знакомая по имени Грин Хуф, кивнула. — Попытки армии усмирить лес оказали пагубное влияние на местную флору. Большинство стволов деревьев, с которых я раньше собирал "Семена истины", теперь выжжены. Нам нужно найти несколько совершенно нетронутых деревьев, если мы хотим найти неповрежденные стручки с семенами. Нам придётся углубиться в лес, чтобы попытаться найти эти деревья.\n\n— Не волнуйтесь, — сказал стоявший рядом с Алкиппе капитан, уверенно ухмыляясь собравшимся чейнджлингам. — Мои солдаты будут охранять нас изо всех сил. Мы быстро войдём в лес и выйдем из него, прежде чем нас настигнут неприятности.\n\n— Рада это слышать, — сказала Алкиппе. — Ну, что можно отправиться в путь?\n\n— Готовы, как никогда, — ответил Марсилио, складывая карту и засовывая её в карман куртки. — Выдвигаемся."
changelings_paxchrysalia.1605.a:0 "Чем скорее мы найдем нужное растение, тем быстрее сможем покинуть это жуткое место"

CHN_event_1605_Everfree_destroyed:0 "— Посмотри сама, — сказал Марсилио, указывая на мёртвые и засохшие деревья вокруг собравшихся. — Лес получил чувствительный удар от армии. Конечно, мы покончили с партизанами, что скрывались внутри его, но также уничтожили немало растительной и животной жизни. Будет непросто найти нужные нам растения, это точно. Но, с другой стороны, нам не нужно беспокоиться о нападениях монстров или засадах партизан."
CHN_event_1605_Everfree_not_destroyed:0 "— Посмотри сама, — сказал Марсилио, указывая на нависающие над ними деревья, чьи густые кроны блокировали солнечный свет. — Этот лес победил армию. Он выдержал всё, что мы бросили в него, и теперь мы пытаемся проскользнуть внутрь леса лишь с небольшим эскортом, чтобы быстро найти нужное нам растение и немедленно убраться. Если нам повезет, то мы сможем войти и выйти незамеченными. Но я уверен, что я не единственный жук, который чувствует, что кто-то наблюдает за нами из-за деревьев. Будем надеяться, что нашего эскорта хватит, чтобы отбить атаки любых монстров или партизан, с которыми мы можем столкнуться."

changelings_paxchrysalia.606.t:0 "В поисках семян" ## No Seeds of Truth ##
changelings_paxchrysalia.606.d:0 "Алкиппе проснулась после очередной ночи, полного беспокойного сна, в лагере в центре зловещего Вечнодикого леса. Хотя лес был разгромлен и потрёпан армией, менее жутким он не стал, и Алкиппе было трудно хорошо выспаться из-за страха, что ужасающие монстры могут рыскать прямо за пределами лагеря. Они уже понесли немало потерь за эту неделю, проведенную в лесу. Многие члены экспедиции и эскорта погибли из-за нападений древесных волков и засад мантикор. Так что теперь их отряд уменьшился в размере на четверть. Чем дольше они оставались в лесу, тем выше был риск, что никто из них не выберется отсюда живым.\n\nАлкиппе вышла из своей и направилась к столу, где Марсилио и Грин Хуф уже собрались рядом с кофейником в попытке набраться сил для ещё одного бесплодного дня поисков "Семян истины". — Я знаю, что никто из нас не выспался этой ночью, — сказала Алкиппе, присаживаясь и наливая себе кофе. — Как думаете, сколько ещё мы сможем тут продержаться?\n\n— Совсем недолго, по правде говоря, — ответил Марсилио. — Это место всем действует на нервы. Вы же слышали шёпот деревьев прошлой ночью? Я знаю, что это так.\n\n— Все старые места для сбора "Семян истины" сейчас уничтожены, — посетовала Грин Хуф. — Подходящие для них деревья растут лишь на болотистой почве, а все болота на периферии Вечнодикого леса пересохли. Нам придётся углубиться ещё сильнее в лес, чтобы хоть что-то найти... но я уверена, что вы понимаете, почему мне очень не нравится этот вариант.\n\n— Верно, — Сказала Алкиппе со вздохом. Даже кофе не помогло ей почувствовать себя лучше. Но, проглотив комок в горле, она повернулась к Марсилио. — Так что мы будем делать? Развернёмся назад и вернёмся домой с пустыми копытами? Или мы будем продолжать искать, пока все тут не умрём?\n\n— Да пошли эти семена, — пробормотал он, отбрасывая в сторону пустую кофейную чашку. — Здесь мы ничего не найдем. Давайте соберём вещи и будем выбираться из этого леса в безопасное место. Может быть, мы сможем найти какую-нибудь "Ядовитую шутку" на пути обратно, как я и хотел изначально. Это более надёжный вариант, чем какие-то стручки с семенами с болота."
changelings_paxchrysalia.606.a:0 "Видимо, мы никогда не узнаем правды..."

changelings_paxchrysalia.1606.t:0 "В поисках семян" ## Seeds of Truth Recovered ##
changelings_paxchrysalia.1606.d:0 "Эскорт, охранявший Алкиппе, Марсилио и Грин Хуф, продвигался всё глубже и глубже в лес. Пони-ботаник довольно быстро поняла, что их лучший шанс найти семена – отправиться в почти нетронутое сердце Вечнодикого леса. Забраться так глубоко требовало немалых усилий: стычки с партизанами были привычным делом из-за неудачи армии в покорении этого ужасного места много лет назад, так что эскорт нёс немалые потери. Даже гауптман Сколитин, который казался таким дерзким и самоуверенным в начале пути, становился всё более подавленным и серьезным с ростом потерь солдат в лесу. Они уже потеряли половину своих охранников, и Алкиппе было интересно, выживет ли кто-нибудь из них к тому времени, когда они решат вернуться домой.\n\nМеханизированный транспорт, в котором передвигалась Алкиппе вместе с Марсилио, Грин Хуфом и Сколитином, внезапно остановился, врезавшись во что-то невидимое впереди. — Засада! — крикнул кто-то с другой стороны пуленепробиваемого металла, и Алкиппе могла поклясться, что услышала, как кто-то ещё закричал "Это ведьма!" прежде чем началась стрельба. Она длилась несколько минут. Интенсивность выстрелов, как и громкость криков, медленно затихали, пока снаружи не установилась зловещая тишина.\n\nАльсипп, Марсилио и Грин Хуф забились в угол машины, а Сколитин схватил винтовку и осторожно направился к двери. Он лишь открыл её и выглянул из-за угла, как в ту же секунду бамбуковый шест ударил его в горло, раздробив его. Чейнджлинг упал на землю и стал задыхаться. Ещё один удар по голове остановил его агонию, а затем в дверном проеме появилась полосатая фигура, чьи глаза, казалось, горели под зелёной маской.\n\nАлкиппе потянулась за пистолетом, но зебра оказалась проворнее, мгновенно ворвалась в транспорт и ударила чейнджлинга головой о стену. Алкиппе слышала приглушенные крики между вспышками боли в своей голове, и когда её зрение прояснилась, чейнджлинг поняла, что её, Марсилио и Грин Хуф вытащила из транспорта зебра. И лишь тогда, в тусклом свете Вечнодикого леса, Алкиппе поняла, на кого именно она смотрит."
changelings_paxchrysalia.1606.a:0 "Это Зекора... ведьма Вечнодикого леса..."

changelings_paxchrysalia.2606.t:0 "Сделка с ведьмой" ## 1606 Continued ##
changelings_paxchrysalia.2606.d:0 "— Кого же я вижу в нашем лесу? — Сказала Зекора, оглядывая трёх своих пленников. — Чейнджлинги, которые не могли оставить лес в покое, а теперь пришли сюда лишь для того, чтобы умереть? Но я дам вам возможность высказаться перед смертью.\n\n— Стой! — Крикнул Грин Хуф, вскакивая на копыта. Зекора нахмурилась и приготовила свой посох, а ботаник нервно отступила назад. — Это не военная экспедиция, честное слово! — взмолилась ботаник. — Всё, что нам нужно... то есть чего хотят чейнджлинги – это найти «Семена истины». Они ищут способ изменить весь свой вид, дать ему немного индивидуальности. Они решили, что «Семена истины» подойдут лучше, чем «Ядовитая шутка». Чейнджлинги хотят понять свой истинный путь вперёд, найти способ стать чем-то иным... ну, чем то, кем они являются сейчас.\n\n— Мы здесь не для того, чтобы снова нападать на твой лес, — попытался убедить Зекору Марсилио. — Мы отказались от этого. Ты победила нас. Ты преодолела всё, что было в распоряжении армии, и мы не собираемся пытаться снова. Мы просто хотим собрать немного растений из Вечнодикого леса. И если мы окажемся правыми, то этот проект принесёт пользу как для чейнджлингов, так и для пони. В будущем мы сможем работать вместе.\n\nЗекора довольно долго прищурившись смотрела на них. — Вы слишком агрессивны и пока это не изменится, между нами не будет мира, — сказала она. Но в конце концов зебра порылась в сумке на боку и бросила маленький мешочек Грин Хуф, которая поймала его копытами. — Но я хочу верить в вашу честность, так что забирайте свои семена и уходите. Но не стоит задерживаться в этом лесу. Иначе вы можете остаться тут навсегда.\n\nПосле этих слов Зекора взяла свой посох, сунула его под ремень и начала отходить. Зашуршали кусты, зашевелились деревья и где-то завыл древесный волк. Зебра растворилась во тьме Вечнодикого леса, и трое выживших, у которых уже были искомые семена, предпочли не терять времени даром и не испытывать судьбу."
changelings_paxchrysalia.2606.a:0 "Давайте убираться отсюда. Немедленно."

changelings_paxchrysalia.3606.t:0 "Ядовитая шутка" ## Poison Joke, Defeated Everfree ##
changelings_paxchrysalia.3606.d:0 "— Вон там! Ядовитая шутка! Кажется, я её вижу!\n\nСон с Алкиппе как копытом сняло, когда транспорт остановился. Грин Хуф первой подбежала к транспортной двери, распахнула её и выскочила наружу. За ней последовал гауптман Сколитин с оружием наготове на случай нападения. Марсилио и Алкиппе вылезли вслед за ними, и глаза Алкиппе расширились, когда она увидела слабо светящееся голубое пятно из цветов всего в тридцати метрах от себя. Участок цветов располагался прямо под поросшими мхом ветвями огромной ивы, полностью невидимый для разведки с воздуха. Лишь слепая удача привела команду к этому месту.\n\nМарсилио широко улыбнулся, когда его команда немедленно приступила к тщательному сбору образцов опасного цветка. — "Ядовитая шутка", "Ядовитая шутка". Я знал, что рано или поздно мы тебя найдем. Мне не терпится изучить эти цветы в своей лаборатории.\n\n— Будем надеяться, что это сработает, — сказала Алкиппе. — Это, хотя бы, оправдает все хлопоты, через которые мы прошли.\n\nКоманда провела почти час, тщательно собирая и каталогизируя растения, но потом жуткий рёв прервал их. — Медвежук! С запада! — крикнул солдат, и пехотинцы эскорта заняли позицию, чтобы уничтожить чудовище с помощью тяжелого вооружения. Гауптман Сколитин подошёл к Алкиппе и Марсилио. — Лучше поторопитесь, — сказал он им. — Если тут есть один медвежук, то наверняка рядом есть и другие. — Затем он ушёл, чтобы присоединиться к своим солдатам, когда монстр приблизился к конвою.\n\nАлкиппе и Марсилио серьёзно отнеслись к предупреждению и поэтому быстро закончили сбор цветов. К тому времени противотанковые ружья их эскорта уже расправились с медвежуком. Так что вскоре конвой с дюжинами цветов, надёжно спрятанных в стеклянных банках внутри бронированных машин, двинулся в путь из леса."
changelings_paxchrysalia.3606.a:0 "Пришло время посмотреть, на что способны эти цветы!"

changelings_paxchrysalia.4606.t:0 "Ядовитая шутка" ## Poison Joke, Victorious Everfree ##
changelings_paxchrysalia.4606.d:0 "— Вон там! Ядовитая шутка! Кажется, я её вижу!\n\nСон с Алкиппе как копытом сняло, когда транспорт остановился. Грин Хуф первой подбежала к транспортной двери, распахнула её и выскочила наружу. За ней последовал гауптман Сколитин с оружием наготове на случай нападения. Марсилио и Алкиппе вылезли вслед за ними, и глаза Алкиппе расширились, когда она увидела слабо светящееся голубое пятно из цветов всего в тридцати метрах от себя. Участок цветов располагался прямо под поросшими мхом ветвями огромной ивы, полностью невидимый для разведки с воздуха. Лишь слепая удача привела команду к этому месту.\n\nМарсилио широко улыбнулся, когда его команда немедленно приступила к тщательному сбору образцов опасного цветка. — "Ядовитая шутка", "Ядовитая шутка". Я знал, что рано или поздно мы тебя найдем. Мне не терпится изучить эти цветы в своей лаборатории.\n\n— Будем надеяться, что это сработает, — сказала Алкиппе. — Это, хотя бы, оправдает все хлопоты, через которые мы прошли.\n\nИ именно в тот момент разразилась перестрелка. Раздался оглушительный боевой клич и пони-партизаны выскочили из зарослей, стреляя в растерянных чейнджлингов. — Засада! — закричал один солдат, который тут же был убит. Его товарищи падали в грязь и хватались за оружие, чтобы дать отпор. Алкиппе, Грин Хуф и Марсилио всё ещё собирали цветы, когда началась стрельба. Поняв, в какой опасности они находятся, чейнджлинги немедленно покинули рощу и помчались обратно к ожидающим их машинам. Пули свистели над головой Алкиппе, и она вслепую выстрелила из пистолета в заросли вокруг них, пытаясь выиграть хоть немного времени. Но когда они запрыгнули в кузов механизированного транспорта, Грин Хуф споткнулась и упала. Марсилио выпрыгнул обратно, чтобы втащить её в транспорт. Но не успела земная пони забраться внутрь, как Марсилио вскрикнул и упал на землю. Кровь окрасила его одежду и за считанные секунды пропитала её насквозь. — Марсилио! — Закричала Алкиппе, останавливаясь, чтобы схватить своего друга, но гауптман Сколитин успел затащить её внутрь машины и захлопнуть дверь. — Нет! — Алкиппе попыталась вернуться за Марсилио, но Сколит прижал её к днищу машины и ударил копытом о борт транспорта.\n\n— Вперёд! Вперёд! — он крикнул водителю, и через несколько секунд транспорт двинулся, сбегая из засады. Когда стрельба стихла, Алкиппе продолжила плакать и дрожать, зная, что она оставила своего друга умирать... даже если она ничего не могла сделать в такой глубине Вечнодикого леса, чтобы спасти его."
changelings_paxchrysalia.4606.a:0 "Эти цветы не стоят этого. Не стоят!"

changelings_paxchrysalia.607.t:0 "Пора приниматься за работу" ## Poison Joke Ending - Marsilio Alive ##
changelings_paxchrysalia.607.d:0 "Марсилио с гордостью продемонстрировал голубой цветок в стеклянной банке своим друзьям, которые наклонились поближе, чтобы получше рассмотреть его. — Красота, не правда ли? — сказал он с ухмылкой. — Один маленький цветок с невиданным потенциалом.\n\n— Тебе лучше быть поосторожнее с этой штукой, – предупредил Секонд Винд, который нашёл немного времени, чтобы посетить друзей. — Каждый жеребёнок в Эквестрии слышал истории об опасности "Ядовитых шуток". Название тут обманчиво, эффекты от этих цветов совсем несмешные.\n\n— Я – главный хирург армии, один из величайших учёных ульев, — возразил Марсилио. — Не беспокойся обо мне. Я знаю, что делаю.\n\n— Так ты думаешь, что это действительно сработает? — Спросил Яхс. — Что мы вот-вот получим знаки отличия?\n\n— У меня есть несколько добровольцев, которые помогут нам разобраться во всём этом. Как только мы получим стабильный состав, то начнём его испытывать.\n\n— Я всё ещё считаю, что нам нужно было сделать ставку на "Семена истины", — сказал Финикус, скрестив свои передние лапы. — Но что есть, что есть. Если эта штука действительно сработает, я буду считать всё это успехом.\n\n— Но откуда ты знаешь, что это действительно поможет всем чейнджлингам в целом? — Спросила Алкиппе. — скорее всего королевская гвардия просто собирается использовать наше открытие в своих целях, создавая лучших солдат и инфильтраторов. Какая от этого польза обычному чейнджлингу?\n\n— Польза... в конце концов она будет, — сказал Марсилио, отмахиваясь от этого вопроса копытом. — Как только знаки отличия широко распространятся в армии и королевской гвардии, они станут доступны и обычным гражданам. Произойдут огромные перемены в политике, культуре, даже в экономике. Как только в армии увидят, насколько полезны знаки отличия, то лишь вопрос времени, прежде чем они разрешат гражданское их использование. — Марсилио поднял стеклянную банку, постучал по ней и улыбнулся остальным своим друзьям. — А теперь мне пора за работу. Открытия никого не ждут!"
changelings_paxchrysalia.607.a:0 "Надеюсь, что это сработает..."

changelings_paxchrysalia.608.t:0 "Директива от УОБВ"
changelings_paxchrysalia.608.d:0 "Прошло несколько дней с тех пор, как Марсилио принялся искать идеальное сочетание для смеси "Желания сердца" и "Ядовитой шутки". Эксперименты проводились строго и методично. Концентрации каждого растения изменялись до тех пор, пока не будет сформирован оптимальный раствор. Но на этом пути проб и ошибок было гораздо больше сложностей, чем успехов. К счастью, у Марсилио была вся необходимая ему "Ядовитая шутка", и он даже смог отложить часть урожая, чтобы вырастить побольше растений. Если бы у него было достаточно времени, то он мог бы найти идеальное решение, которое поможет ему дать знаки отличия чейнджлингам.\n\nТолько вот времени у него не было. Через неделю после того, как он доложил об успешном сборе "Ядовитой шутки" УОБВ и королевской гвардии, он обнаружил на своём столе срочную директиву. В ней содержался приказ Васпира Орна Кладисиума немедленно приступить к экспериментам с подопытными. Похоже, что УОБВ хотелось получить знаки даже сильнее, чем предполагали Яхс и Марсилио. Хотя Марсилио и не хотел спешить, он понимал, что попытка убедить УОБВ подождать – не самое разумное решение. Итак, выбрав наилучший состав, который он успел разработать, Марсилио отправил запрос на храбрых добровольцев для последней тайной программы королевской гвардии."
changelings_paxchrysalia.608.a:0 "Нельзя торопить науку, а вот учёных – вполне."

changelings_paxchrysalia.609.t:0 "Испытание номер 1 — "Мёртвый глаз"-снайпер"
changelings_paxchrysalia.609.d:0 "ИМЯ ИССЛЕДОВАТЕЛЯ: Доктор Марсилио\n\nИДЕНТИФИКАТОР ЭКСПЕРИМЕНТА: 242aVIcVDa\n\nИДЕНТИФИКАТОР ИСПЫТУЕМОГО: 007 «Мёртвый глаз»\n\nПРОИСХОЖДЕНИЕ ИСПЫТУЕМОГО: 244 отряд Jagdkommando-Abteilung\n\nЗАМЕТКИ ПО ЭКСПЕРИМЕНТУ: Испытуемый был известен в егерском корпусе как превосходный стрелок. Испытуемому был выдан знак отличия, изображающий перекрестие прицела и мишень. Точность стрельбы возросла примерно на 500%, и испытуемый смог поражать цели на расстоянии до 1 км с помощью винтовки без прицела. Испытуемому был выдан экспериментальный магический пистолет-пулемет, с помощью которого он за 30 секунд произвёл 30 прицельных выстрелов по движущимся мишеням. Когда испытуемый перезарядил оружие и попытался продолжить стрельбу, с перегретым оружием произошла катастрофическая неисправность, и испытуемые получил серьёзные термические ожоги плазмой.\n\nСТАТУС: СКОНЧАЛСЯ"
changelings_paxchrysalia.609.a:0 "Какое несчастье."

changelings_paxchrysalia.1609.t:0 "Испытание номер 2 — Гастрономический гений"
changelings_paxchrysalia.1609.d:0 "ИМЯ ИССЛЕДОВАТЕЛЯ: Доктор Марсилио\n\nИДЕНТИФИКАТОР ЭКСПЕРИМЕНТА: 090Im46s0Y\n\nИДЕНТИФИКАТОР ИСПЫТУЕМОЙ: 024 «Пекарь»\n\nПРОИСХОЖДЕНИЕ ИСПЫТУЕМОГО: Отряд инфильтраторов УОБВ номер 046\n\nЗАМЕТКИ ПО ЭКСПЕРИМЕНТУ: Испытуемая была первоначально задействована в качестве дублёра известного грифоньего шеф-повара Густава Ле Гранда, который в прошлом служил императорам Грифонии, прежде чем эмигрировал в Эквестрию. Первоначально испытуемая должна была отправиться в Грифонстоун под видом Густава и снискать расположение местного двора, но ей первоначально отказали в получении знака отличия, связанного с выпечкой, для повышения её способностей. Она получила знак отличия с изображением огромного десертного торта. Испытания прошли успешно, даже несмотря на тот факт, что знак отличия не проявился в грифоньей маскировке. Испытуемая продемонстрировала способности на уровне лучших пекарей мира, хотя раньше совершенно не славилась умением готовить. Она начала экспериментировать с созданием всё более и более роскошных блюд, прежде чем странный несчастный случай, связанный с чрезмерно герметичной банкой взбитых сливок, катастрофически открывшейся рядом с лицом испытуемой, не отделил её голову от тела.\n\nСТАТУС: СКОНЧАЛАСЬ"
changelings_paxchrysalia.1609.a:0 "Кажется, это первый чейнджлинг, которого прикончило молоко..."

changelings_paxchrysalia.2609.t:0 "Испытание номер 3 — Сокрушитель"
changelings_paxchrysalia.2609.d:0 "ИМЯ ИССЛЕДОВАТЕЛЯ: Доктор Марсилио\n\nИДЕНТИФИКАТОР ЭКСПЕРИМЕНТА: 565JmKyn3u\n\nИДЕНТИФИКАТОР ИСПЫТУЕМОГО: 033 «Гладиатор»\n\nПРОИСХОЖДЕНИЕ ИСПЫТУЕМОГО: 43 штурмовой сапёрный батальон\n\nЗАМЕТКИ ПО ЭКСПЕРИМЕНТУ:\n\nИспытуемый был членом штурмовых бригад, которым было поручено использовать малейшие бреши в эквестрийской обороне для прорыва, а также он является опытным сапером и экспертом по ближнему бою. Испытуемому был предоставлен знак отличия, изображающий копыто, пробивающее кирпичную стену. Он сразу же прочувствовал возросшее мастерство в ближнем бою, отправляя в нокаут каждого спарринг-партнера, против которого он сражался, включая схватку, в которой его атаковали сразу пятнадцать противников. Субъект также проявлял увеличенную физическую силу и терпимость к боли, а также устойчивость к травмам. Испытуемый попытался пробить кирпичную стену во время демонстрации своей силы, но стена рухнула прямо на него, убив чейнджлинга на месте.\n\nСТАТУС: СКОНЧАЛСЯ"
changelings_paxchrysalia.2609.a:0 "Это... иронично."

changelings_paxchrysalia.3609.t:0 "Испытание номер 4 — Аэронавт-акробат"
changelings_paxchrysalia.3609.d:0 "ИМЯ ИССЛЕДОВАТЕЛЯ: Доктор Марсилио\n\nИДЕНТИФИКАТОР ЭКСПЕРИМЕНТА: 785VKhBZf1\n\nИДЕНТИФИКАТОР ИСПЫТУЕМОГО: 050 «Вогель»\n\nПРОИСХОЖДЕНИЕ ИСПЫТУЕМОГО: Истребительная эскадрилья люфтваффе номер 50\n\nЗАМЕТКИ ПО ЭКСПЕРИМЕНТУ:\n\nИспытуемый был асом-истребителем во время войны и лично сбил вражеского аса по имени Рэйнбоу Дэш в конце войны. Испытуемый получил знак отличия с изображением парящего над облаками истребителя. Лётные способности испытуемого были опробованы на экспериментальном реактивном истребителе. Он продемонстрировал отличные навыки по управлению машиной, несмотря на то что не был знаком с этим типом самолётов. Испытуемый очень хорошо показал себя и на испытаниях по ведению огня: он поражал муляжи танков и прочих буксируемые цели с точностью 98,7% на первом заходе и 100% на втором. Во время атак на дирижабли обломки одного из них серьёзно повредили реактивный самолет, вынудив испытуемого совершить аварийную посадку. Хотя он выжил при посадке, его крылья серьёзно пострадали в результате аварии. Когда испытуемого выписали из больницы и он попытался взлететь, внезапный порыв ветра отнёс его прямо под колёса едущего грузовика.\n\nСТАТУС: СКОНЧАЛСЯ"
changelings_paxchrysalia.3609.a:0 "Больше он уже не взлетит..."

changelings_paxchrysalia.610.t:0 "Убийственная шутка"
changelings_paxchrysalia.610.d:0 "Марсилио смотрел в окно своего кабинета, наблюдая как солнце снова садится за Кантерлотом. В углу его стола лежала отброшенная в сторону записка, описывающая последние испытания "Ядовитой шутки". Каждый раз случалось одно и тоже. Несмотря на то, что знаки отличия давали испытуемым то, что и планировал Марсилио, несмотря даже на то, что они отлично работали в краткосрочной перспективе, всегда происходил какой-то странный несчастный случай, который и убивал испытуемого. Каждое испытание заканчивалось смертью чейнджлинга, как будто сама вселенная говорила, что всё это нарушает естественный порядок мира. Может, так оно и было. Может быть, именно поэтому УОБВ велело ему остановиться.\n\nОн позволил письму выскользнуть из его магии. Сама по себе программа не была официально отменена. Скорее УОБВ и королевская гвардия решили перераспределить почти всё финансирование на другие, более перспективные проекты. Но эффект был таким же. Проект был мертв, и без средств для продолжения исследований у Марсилио не было другого выбора, кроме как остановиться. Другого способа описать произошедшее не было: он потерпел неудачу.\n\nТолько теперь Марсилио смог понять, что так долго затуманивало его зрение. Он и Яхс были крайне увлечены созданием знаков отличия. Но не для того, чтобы вид чейнджлингов в целом мог извлечь из этого выгоду. О нет. Они говорили именно о себе. Они хотели получить собственные знаки отличия, будто это поможет им схватить свою судьбу за рога и направлять её, что не было доступно ранее ни одному чейнджлингу. Сколько чейнджлингов и пони погибло, прежде чем он получил это письмо от УОБВ? И сколько ещё погибло бы, если бы УОБВ не отменило бы проект?\n\nНаконец-то Марсилио понял, насколько он был глуп. Весь этот проект был дурацкой затеей с самого первого дня. Но хорошо, что он смог понять это прежде, чем проект поглотил бы и его."
changelings_paxchrysalia.610.a:0 "Законы природы сильнее воли существ."

changelings_paxchrysalia.611.t:0 "Отчаяние"
changelings_paxchrysalia.611.d:0 "Марсилио столкнулся с озабоченным Финикусом прямо перед поездом, который должен был отвезти все записи и материалы по провалившемуся проекту со знаками отличия обратно в Весалиполис. — Финикус? — Спросил Марсилио, заставив промышленника подпрыгнуть от неожиданности. — Что ты здесь делаешь?\n\n— Как жаль, что проект отменили, — сказал Финикус, хмуро глядя на поезд. — Он был таким многообещающим. Мы могли бы сотворить так много великих вещей с его помощью.\n\n— Это слишком опасно, — сказал Марсилио, качая головой. — И мы были идиотами, когда преследовали эту цель. Лучше просто тихо и навсегда убрать этот проект со сцены.\n\n— Как ты можешь так говорить? — Рявкнул Финикус, застав Марсилио врасплох. — После всего, через что мы прошли, чтобы, наконец, дать чейнджлингам знаки отличия... как мы можем просто взять и сдаться сейчас? Как мы можем сдаться, когда наша судьба вот прямо там?!\n\n— Это не наша судьба, — возразил Марсилио. — Мы пытались взять под контроль силы, которых не понимаем. Никто: ни чейнджлинг, ни пони, не может знать про свою истинную судьбу. Наша судьба – это то, что мы выбираем делать со своей жизнью, а не то, что наша жизнь говорит нам делать.\n\n— Да пошло всё оно! — Воскликнул Финикус. — Да, я хотел использовать "Семена истины", чтобы они сказали мне, что делать со своей жизнью! Я чувствую себя таким растерянным и апатичным, как корабль без капитана. Эти семена могли бы помочь мне найти своём место в этом дурацком мире, в котором я живу! Да, у нас нет семян, но мы заполучили "Ядовитую шутку". Это было хорошим утешительным призом, с помощью которого я могу выбрать то, чем хочу заниматься в своей жизни. Но теперь это тоже отправляется в мусорку. И что мне теперь делать?!\n\nОн бросился к Марсилио, схватил его за лацканы пиджака и притянул к себе. — У тебя есть всё необходимое, чтобы создать хотя бы ещё одно зелье, дающее знаки отличия. Я знаю, что это так. Пожалуйста, просто дай мне метку с чем-то вроде акварели. Я всегда хотел быть художником, но у жизни были другие планы на меня. Меня готовили к этой дурацкой работе с самого детства. У меня не было права голоса относительно этого вопроса. Но теперь знаю. Теперь я хочу вернуться к своим мечтам. И ты можешь мне помочь. — Он отчаянно улыбнулся Марсилио. — Ты поможешь мне, Марсилио. Ведь так?"
changelings_paxchrysalia.611.a:0 "Я... Я могу, Финикус. Да, я помогу."
changelings_paxchrysalia.611.b:0 "Финикус, нет. Это должно прекратиться. Это должно прекратиться немедленно."

changelings_paxchrysalia.612.t:0 "Мрачная картина"
changelings_paxchrysalia.612.d:0 "— Тебя что-то беспокоит, Марсилио? — Спросил Яхс, откладывая вилку и нож в сторону. — Ты будто бы отсутствовал весь ужин.\n\nМарсилио вздохнул и покачал головой. — Помнишь отмененный проект "Знак отличия"?\n\n— Как можно о таком забыть, — сказал Яхс. — Какая же он оказался катастрофой! Ну... хотя бы теперь всё кончено.\n\n— Да, но... — Марсилио заколебался, а когда Яхс посмотрел чуть пристальнее на него, вздохнул и покачал головой. — Это не совсем так. Финикус умолял меня дать ему одно из моих последних зелий. Ему нужен был знак отличия, связанный с живописью. И я... я дал его ему.\n\nГлаза Яхса расширились. — Ты что сделал? — спросил он, но его тут же прервал вбежавший в ресторан адъютант, который отдал ему честь. Он показал копыто Марсилио и повернулся к адъютанту. — В чём дело?\n\n— [CHN_GetJachsRank]... [CHN_GetAlcippeRank] Алкиппе позвонила мне, чтобы сообщить вам о том, что ваш друг, Финикус Весали, был найден мертвым в своей квартире в Весалиполисе. — Солдат заколебался, увидев потрясение на лице Яхса, и склонил голову. — Я... прошу прощения, сэр.\n\n— Мёртвым, — пробормотал себе под нос Яхс и, взглянув на Марсилио, увидел ужас на лице друга. — Как он умер, солдат?\n\n— Его тело... нашли в кабинете, в окружении всевозможных картин, — сказал солдат. — В красках, которые он использовал, нашлись следы токсичных тяжёлых металлов. Коронер считает, что краска попала с холста картины в кофейную чашку, и так он и отравился. — Когда ни Яхс, ни Марсилио никак не ответили на это, солдат неловко отсалютовал ещё раз и отступил на шаг. — Я... организую поездку в Весалиполис, чтобы вы могли посетить похороны, сэр. Мне очень жаль, сэр.\n\nКогда он ушел, Яхс и Марсилио долго смотрели друг на друга в шоке, не вполне веря словам солдата."
changelings_paxchrysalia.612.a:0 "Что мы натворили?"

changelings_paxchrysalia.613.t:0 "Пора всё отменить" ## Escape Event from 611 ##
changelings_paxchrysalia.613.d:0 "После стычки с Марсилио в поезде Финикус на несколько дней уехал в свой дом в Кантерлоте, чтобы всё обдумать. Полный провал программы «Знак отличия» просто опустошил его. Он крайне хотел, чтобы некое божественное вмешательство смогло показать ему его судьбу. Он отказывался верить, что ему суждено провести остаток жизни на вершине корпорации, наживающейся на смерти и разрушении. Он хотя бы надеялся найти оправдание, которое подтвердило бы его желание оставить всё это позади и заняться чем-то другим, чем-то лучшим. Но этого не случилось. Ни с помощью «Ядовитой шутки», ни с помощью «Семян истины». Он остался там, где был – беспомощный и плывущий по течению жизни, и единственное, за что Финикус мог держаться теперь – это за статус-кво.\n\nНо постепенно он понял, что имел в виду Марсилио. Испытуемый за испытуемым умирали, получая свои знаки отличия. Всё это было лишь попыткой сыграть в бога, и они были наказаны за неё. Марсилио был прав: его судьба – выбирать, что делать со своей жизнью, а не то, что жизнь велит ему делать. И прямо сейчас у него был выбор. Он мог хандрить, потому что он не получил желаемого. Или же Финикус мог на самом деле взять на себя некоторую ответственность и сделать, как президент и генеральный директор «Мейн-Хайв Индастриз» всё возможное, чтобы сделать вещи чуточку лучше. Может быть, когда он закончит делать мир лучше, то сможет направить свои усилия на то, чтобы улучшить самого себя весьма старомодным способом. В любом случае идея о том, чтобы получить знак отличия в области живописи было простым обманом. А как же чувство гордости и удовлетворения?\n\nГлубоко вдохнув, Финикус прошёл в свой кабинет и начал набрасывать записку, объявляющую об отказе «Мейн-Хайв» от участия в проекте «Знак отличия». А потом, когда дела немного успокоятся, он сможет направить свою компанию на нечто лучшее, чем одна только война и смерть.\n\nПришло время изменить мир."
changelings_paxchrysalia.613.a:0 "Жизнь – это то, что ты делаешь с ней, а не то, что она делает с тобой."

changelings_paxchrysalia.614.t:0 "Трещины в дружбе" ## Marsilio is big dead ##
changelings_paxchrysalia.614.d:0 "Яхс сидел в своём кабинете, в котором были опущены шторы. Единственным источником света внутри комнаты был слабый солнечный свет, который пробивался сквозь щели. День был слишком ясным и веселым, и меньше всего Яхсу хотелось смотреть на голубое небо и белые пушистые облака. Вечнодикий лес забрал одного из его самых старых друзей, и у мира даже не хватило порядочности сделать вид, что он разделяет страдания Яхса.\n\nДверь в его кабинет распахнулась, и Яхс подпрыгнул, когда Финикус ворвался внутрь. — Невероятно, — прорычал он, топая копытами по полу. — Случилась катастрофа! Полная катастрофа! Марсилио кормит древесных волков, а армия вцепилась в мою задницу из-за его смерти. Как будто это я, а не они, не сумевшие усмирить лес, виноват в смерти Марсилио! «Мейн-Хайв» будет занесен в чёрный список армии и королевской гвардией навсегда, и мне повезет, если я смогу удержать свою компанию на плаву, продавая зубочистки!\n\nЯхс вздохнул и покачал головой. — Мы знали о рисках, — пробормотал он. — Всегда был шанс, что что-то подобное может случиться. Я надеялся, что эскорта будет достаточно...\n\n— Ну, это оказалось явно недостаточно, не так ли, Яхс? — Финикус плюнул в него. — Всё разваливается на куски, абсолютно всё! Всё, на что мы надеялись! Я пытался втолковать вам, идиотам, что "Ядовитая шутка" ничего нам не даст, и следовало искать "Семена истины" вместо этого ... \n\n— Довольно! — Крикнул Яхс, вставая и ударяя копытами по столу. — Ты пришел сюда лишь для того, чтобы пожаловаться на меня и ткнуть меня носом в грязь из-за смерти Марсилио? Да, я виноват, что Вечнодикий лес не сдержали, так что и смерть Марсилио на моих копытах! Если ты хочешь это сказать, то просто скажи прямо!\n\nГлаза Финикуса сузились, и он отступил назад. — Хорошо, Яхс. Ты убил его, если это то, что ты желаешь услышать. Но я пришел сюда не для того, чтобы сказать тебе это. Я пришёл сюда, чтобы сообщить, что я уезжаю в Весалиполис и навряд ли у вернусь в Кантерлот. Я должен спасти свою компанию, начав с доклада перед советом директоров в штаб-квартире. И не факт, что у меня ещё будет работа через месяц.\n\nНесколько долгих секунд в комнате царило молчание, а потом Финикус развернулся и ушёл. — Прощай, Яхс. Может быть, когда-нибудь мы ещё встретимся."
changelings_paxchrysalia.614.a:0 "Кантерлот начал пустеть..."

changelings_paxchrysalia.615.t:0 "Конец дружбы" ## Marsilio version ##
changelings_paxchrysalia.615.d:0 "— Алкиппе?\n\nУслышав за спиной голос Яхса, Алкиппе вздрогнула и, стиснув зубы, попыталась успокоиться. Она надеялась, что он не зайдет к ней до того как она уйдёт, но её мечтам не суждено было сбыться. — Да, [CHN_GetJachsRank]? — сказала она, бросая папки в портфель с помощью своей магии. Она не могла заставить себя оглянуться через плечо на приближающегося Яхса, из страха, что если она посмотрит Яхсу в глаза, то её решимость исчезнет.\n\n— Что тут происходит? — Спросил Яхс, наконец-то поравнявшись с Алкиппе. — Ты куда-то собираешься? — Он моргнул, и тут его челюсть отвисла, когда он понял смысл всего происходящего. — Ты же не...?\n\n— Я запросила перевод в Мейнхеттен, — наконец сказала Алкиппе, закрывая глаза, чтобы сдержать слезы. — У леди-протектора Лилак есть собственные идеи о том, как улучшить «Пакс Кризалию» для всех её подданных. И после всего того, что произошло здесь за последние несколько недель... Мне нужны перемены.\n\n— Алкиппе... — Яхс попытался положить копыто на плечо Алкиппе, но она резко стряхнула его и отступила в сторону. [CHN_GetJachsRank] несколько мгновений стоял на трёх копытах, а четвертое неуклюже держал в воздухе. Но потом медленно опустил его обратно на землю. — Я... понимаю. Если ты считаешь это правильным...\n\nАлкиппе судорожно вздохнула и кивнула. — Я... Да, считаю — наконец сказала она. — Я была недостаточно хороша, чтобы защитить Марсилио в поле. Я не был хорошим солдатом, но вдобавок ко всему я наблюдала, как весь этот дурацкий проект знаков отличия разрывает нас на части. Мы были очень и очень близкими друзьями, а потом всё это вбило клинья между нами. То, что мы пытались сделать... ну, оно работает на бумаге. Но в реальности этот проект подвёл всех нас... Я не знаю. — Она подняла копыта в воздух. — Я просто..... больше не могу здесь находиться, Яхс. Мне нужно больше пространства. Я лишь надеюсь, что смогу получить его в Мейнхеттене. Ты всегда был добр ко мне... но теперь мне нужно свой путь.\n\nЯхс помолчал некоторое время, прежде чем кивнуть. — Благодарю тебя, [CHN_GetAlcippeRank], — сказал он тихим голосом. — Я... я сожалею, что всё закончилось именно так. Но ты должна делать то, что должна. Как и я. — Он поджал губы, с трудом сглотнул, а затем развернулся. Он был уже на полпути к двери, когда остановился и снова повернулся обратно. — Ты... попрощаешься со мной, когда будешь готова уехать?\n\n— Я... да, [CHN_GetJachsRank], — сказала Алкиппе. Она не подняла голову, что посмотреть кивнул ли ей Яхс, но вскоре услышала, как он выходит из кабинета, оставляя её наедине с голым столом и пустыми полками. И там, в тихом одиночестве того места, которое было её домом в течение последних нескольких лет, Алкиппе опустила голову и заплакала."
changelings_paxchrysalia.615.a:0 "Мне очень жаль, Марсилио. Мне очень жаль, Яхс."

changelings_paxchrysalia.1615.t:0 "Конец дружбы" ## Finicus version ##
changelings_paxchrysalia.1615.d:0 "— Алкиппе?\n\nУслышав за спиной голос Яхса, Алкиппе вздрогнула и, стиснув зубы, попыталась успокоиться. Она надеялась, что он не зайдет к ней до того как она уйдёт, но её мечтам не суждено было сбыться. — Да, [CHN_GetJachsRank]? — сказала она, бросая папки в портфель с помощью своей магии. Она не могла заставить себя оглянуться через плечо на приближающегося Яхса, из страха, что если она посмотрит Яхсу в глаза, то её решимость исчезнет.\n\n— Что тут происходит? — Спросил Яхс, наконец-то поравнявшись с Алкиппе. — Ты куда-то собираешься? — Он моргнул, и тут его челюсть отвисла, когда он понял смысл всего происходящего. — Ты же не...?\n\n— Я запросила перевод в Мейнхеттен, — наконец сказала Алкиппе, закрывая глаза, чтобы сдержать слезы. — У леди-протектора Лилак есть собственные идеи о том, как улучшить «Пакс Кризалию» для всех её подданных. И после всего того, что произошло здесь за последние несколько недель... Мне нужны перемены.\n\n— Алкиппе... — Яхс попытался положить копыто на плечо Алкиппе, но она резко стряхнула его и отступила в сторону. [CHN_GetJachsRank] несколько мгновений стоял на трёх копытах, а четвертое неуклюже держал в воздухе. Но потом медленно опустил его обратно на землю. — Я... понимаю. Если ты считаешь это правильным...\n\nАлкиппе судорожно вздохнула и кивнула. — Я... Да, считаю — наконец сказала она. — Мы не были рядом с Финикусом, когда он нуждался в нас сильнее всего. Он отчаянно нуждался в чём-то, что помогло бы ему понять свою жизнь, сделать её лучше... и мы подвели его. — Алкиппе покачала головой, чувствуя, как слезы начинают капать из-под её век. — Я не думаю, что смогу простить Марсилио за то, что он дал ему это зелье и не сказал нам. Я должна была сильнее стараться утешить Финикуса после того, как проект зашёл в тупике. Я должна была помочь ему использовать "Семена истины", даже если проект "Ядовитой шутки" провалился. Я должна была что-то сделать, но всё же ничего не сделала. А теперь мне нужно начинать всё сначала... — Она подняла копыта в воздух. — Я просто..... больше не могу здесь находиться, Яхс. Мне нужно больше пространства. Я лишь надеюсь, что смогу получить его в Мейнхеттене. Ты всегда был добр ко мне... но теперь мне нужно свой путь.\n\nЯхс помолчал некоторое время, прежде чем кивнуть. — Благодарю тебя, [CHN_GetAlcippeRank], — сказал он тихим голосом. — Я... я сожалею, что всё закончилось именно так. Но ты должна делать то, что должна. Как и я. — Он поджал губы, с трудом сглотнул, а затем развернулся. Он был уже на полпути к двери, когда остановился и снова повернулся обратно. — Ты... попрощаешься со мной, когда будешь готова уехать?\n\n— Я... да, [CHN_GetJachsRank], — сказала Алкиппе. Она не подняла голову, что посмотреть кивнул ли ей Яхс, но вскоре услышала, как он выходит из кабинета, оставляя её наедине с голым столом и пустыми полками. И там, в тихом одиночестве того места, которое было её домом в течение последних нескольких лет, Алкиппе опустила голову и заплакала."
changelings_paxchrysalia.1615.a:0 "Мне очень жаль, Финикус. Мне очень жаль, Яхс."

changelings_paxchrysalia.616.t:0 "Приобретенное желание"
changelings_paxchrysalia.616.d:0 "Алкиппе сразу поняла, как здорово снова оказаться в Кантерлоте. Она провела так много времени в Вечнодиком лесу, что не чувствовала себя в безопасности, пока не вернулась на территорию дворца. Ей даже пришлось остановить себя, чтобы не выбежать навстречу Яхсу и обнять его, когда он и Финикус подошли для разбора полетов.\n\nСудя по улыбке на его лице, Яхс тоже испытал облегчение, когда увидел, что его друзья вернулись. Но эта улыбка сменилась озабоченным выражением, когда он понял, что из экспедиции вернулись только Алкиппе, Марсилио и Грин Хуф. — Что там произошло? Что случилось с остальными? — Спросил он.\n\n— Они все погибли, один за другим, — сказала Алкиппе. — Зекора лично убила Сколитина и остальных наших охранников, когда мы достигли сердца Вечнодикого леса. Нам повезло, что мы выбрались оттуда живыми.\n\n— Если бы с нами не было доктора Грин Хуф, то мы бы не выбрались оттуда, – сказал Марсилио, кивая на земную пони, которая покраснел и опустила голову. — Убедись, что она получит финансирование от армии за помощь нам. Но, самое главное это то, что мы получили то, за чем отправились в лес. — Он указал на Грин Хуф, которая подняла мешочек, полный семян, полученных от Зекоры.\n\n— Дай мне их! — Воскликнул Финикус, схватив мешочек своей магией прежде чем Грин Хуф успела даже моргнуть. Он высыпал их на своё вытянутое копыто и захихикал, как школьник, возбужденно жужжа своими крыльями. — Марсилио, тебе лучше как можно скорее начать работать с этими малышами.\n\n— Я смогу получить первые результаты в течение месяца, — заверил его Марсилио, забирая семена у Финикуса. — А как же ты и «Мейн-Хайв»? В конце концов, это не то, чего хотела королевская гвардия.\n\n— Да кому они нужны? — Спросил Финикус, отмахиваясь копытом. — Я просто скажу им, что мы потерпели неудачу в создании знаков отличия. Они дадут «Мейн-Хайв» пощёчину, а потом всё вернется на круги своя. Они не рисковали многим в этом проекте и, учитывая послужной список «Мейн-Хайв», неудачи время от времени вполне приемлемы. Мы будем в порядке."
changelings_paxchrysalia.616.a:0 "А теперь давайте приступим к работе!"

changelings_paxchrysalia.617.t:0 "Почти готово"
changelings_paxchrysalia.617.d:0 "— Так ты думаешь, что это сработает? Это действительно сработает?\n\nМарсилио вздохнул и потёр кончиком карандаша зудящий висок, когда Финикус практически навис над его плечом в лаборатории. — Это в конце концов будет работать. Возможно, потребуется некоторое время, чтобы выяснить подробности, но мы разберёмся. А теперь, пожалуйста, сядь на табурет и ничего не трогай.\n\nФиникус сделал так, как ему было сказано, но всё ещё буквально дрожал от возбуждения. — Интересно, что я увижу, когда сделаю первый глоток, — сказал он, глядя в потолок и предаваясь мечтам. — Не каждый день кому-то удаётся разгадать смысл собственной жизни.\n\n— Я скажу, когда всё будет готово, — проворчал Марсилио. Он уже жалел, что позволил Финикусу навестить его в лаборатории, пока сам работал над зельем. — Скажи, с королевской гвардией всё было в порядке?\n\n— Хммм? О, да, всё прошло именно так, как я сказал. Ласин и Васпир были не в восторге от того, что я не смог им дать собственные картинки на заднице, поэтому они конфисковали все исследования и заметки «Мейн-Хайв» по проекту, а также лишили нас финансирования. Но, помимо этого, они не сделали ничего. Как я и сказал, это была просто пощёчина.\n\nОн спрыгнул с табурета и посмотрел на часы, висевшие на стене над лабораторным столом Марсилио. — Мне всё равно нужно идти и поговорить с правлением насчет всей этой заварухи со знаками отличия. Как ты думаешь, когда это всё будет готово?\n\n— В течение недели, — ответил Марсилио. — Я потратил последние две недели на то, чтобы проверить, могут ли "Семена истины" работать совместно с "Желанием сердца" и сделать так, чтобы появились знаки отличия. И всё было в порядке. Теперь, когда королевская гвардия не вмешивается в наш проект, мы можем работать над собственными идеями. Результата не придётся ждать слишком долго."
changelings_paxchrysalia.617.a:0 "И тогда ты сможешь перестать спрашивать меня об успехах через день."

changelings_paxchrysalia.618.t:0 "Суматоха с зельем"
changelings_paxchrysalia.618.d:0 "Финикус едва сдерживался, когда Марсилио осторожно поставил на стол поднос, полный сияющих синих пузырьков. Наконец-то, после стольких недель работы, он может узнать свою судьбу. Это было как украсть огонь у богов – глоток этого зелья мог открыть другие грани в жизни чейнджлинга помимо служения улью. Индивидуальность, казалось, была в пределах досягаемости.\n\n— Это всё, что у нас есть, — предупредил Марсилио Финикуса, а также Яхса и Алкиппе, которые также пришли в его лабораторию, чтобы понаблюдать за результатом. — Я взял два семени и попытался вырастить ещё, но вряд ли они вырастут без полного воссоздания естественных условий болот Вечнодикого леса. Все остальные ушли на приготовление этих четырёх зелий. Надеюсь, это то, что мы ищем.\n\n— Я ни на секунду не сомневаюсь в тебе, Марсилио, — сказал Финикус, взяв одно из снадобий магией. Он вытащил пробку и почувствовал аромат, который, казалось, был похож одновременно на орех и вишню. — Ну, у этой штуки отличный запах. Ну что, мне пить это до дна?\n\n— Да, — сказал Марсилио. — Семена давали пони в толчёном виде, так что они должны сработать и при таком проглатывании.\n\n— До дна! — С этим возгласом Финикус поднес пузырек к губам и откинул голову назад. Зелье коснулось его языка и скользнуло вниз по горлу. Они было похоже на сироп и даже слегка шипело, как газировка. Остальные друзья Финикуса смотрели, как он сидит на месте, ожидая, чтобы что-то произошло... Финикус лишь моргнул и нахмурился. — Так, эм... как скоро оно должно начать действовать?\n\n— Я не совсем уверен, — сказал Марсилио, сверяясь со своими записями. — Иногда эффект срабатывал мгновенно, а иногда – только через несколько часов. Я не знаю как скоро это случится сейчас.\n\n— Хм. Ну, я не люблю пить в одиночестве. — Он указал на поднос и посмотрел на своих друзей. — А как насчет вас? Вас трое, и осталось три зелья. Вы же тоже собираетесь участвовать в этом?\n\nЯхс нахмурился, как будто не был уверен в этом, но Алкиппе схватила пузырёк и сделала глоток. Она облизнула губы и кивнула. — Ну, вкус точно хороший, — сказала она и повернулась к Марсилио. — Это действительно покажет нам нашу судьбу?\n\n— Я могу лишь надеяться, – признался Марсилио, беря один из флаконов. — Стоит попробовать.\n\n— У меня такое чувство, будто я снова в логове у Глориосы, — сказал Яхс, беря последний пузырек. — Была не была.\n\nФиникус усмехнулся и открыл рот, чтобы что-то сказать, но онемел, когда мир вокруг него начал раскачиваться. Он упал со стула, напугав этим своих друзей. Головокружение стало ещё сильнее его, и он почувствовал, что его сейчас стошнит. И как раз тогда, когда Финикус подумал, что больше не может это терпеть..."
changelings_paxchrysalia.618.a:0 "...тьма поглотила его."

changelings_paxchrysalia.619.t:0 "Капитан индустрии"
changelings_paxchrysalia.619.d:0 "Финикус проснулся посреди бесконечного пространства, полного ярких звезд. Он огляделся вокруг, но не увидел ничего, кроме галактик, разбросанных по вселенной. Как будто он и бесконечность были тут совершенно одни с самого начала времен.\n\nЗатем он увидел какое-то движение. К нему приближалась фиолетовая аликорн, сотканная из звёздного света. Он съежился, боясь того, что пони вот-вот собьет его с ног, но её рог зажёгся светом магии и приподнял его за подбородок. — Пойдём, — сказала она, подзывая его к себе. Финикус почувствовал, что он вынужден идти по её стопам. Он начал двигаться, а потом звёзды погасли и его окутала тьма.\n\nКогда он снова обрёл способность видеть, то обнаружил, что находится внутри фабрики, когда гул и грохот машин оглушили его. Он двинулся вперёд и проходил мимо бесконечного ряда машин, за которыми неустанно работали пони в поношенной униформе, прикованные к своему оборудованию. Жеребец рухнул на свой верстак, к нему стразу же подбежал охранник-чейнджлинг и принялся избивать жеребца, пока окровавленный пони не заставил себя подняться и снова приступить к работе. Именно тогда Финикус понял, что это не фабрика, а замаскированный под неё настоящий лагерь смерти.\n\nОн поднялся по лестнице из цеха и распахнул двери кабинета начальства, чтобы выразить своё отвращение, но в шоке остановился. За столом сидел он сам с бокалом выпивки в копыте, а громкая музыка в кабинете заглушала крики рабочих из цеха. Его зеркальный двойник, казалось, не замечал ничего, что происходило снаружи, пока солдат не прошёл мимо Финикуса и не обратился к его двойнику. — Рабочие быстро выдыхаются, сэр, — сказал стражник не-Финикусу. — Скоро нам понадобится свежая партия.\n\n— Скоро прибудет новая партия, — сказал не-Финикус, отставляя свой бокал в сторону и вставая с кресла. — Дискорд бы побрал этих ленивых пони. Они работают так, как будто им не нужен сегодняшний паек. Ну, если они не хотят его, то и не получат. Никто сегодня не уснёт сытым. Может быть, завтра они будут работать усерднее.\n\nОхранник кивнул и ушёл, а Финикусу оставалось только потрясенно наблюдать, как его бессердечный двойник встал и небрежно последовал за ним. Он даже не пошевелился, когда его двойник приблизился к настоящему Финикусу, и когда отражение прошло сквозь него, весь мир взорвался ярким светом."
changelings_paxchrysalia.619.a:0 "Я... Я был монстром..."

changelings_paxchrysalia.620.t:0 "Мясник Кантерлота"
changelings_paxchrysalia.620.d:0 "Алкиппе поняла, что она бродит по развалинам города через несколько мгновений после того, как последовала за фиолетовым аликорном. Она не знала, как оказалась здесь, но ей не потребовалось много времени, чтобы опознать в городе Кантерлот. Вот только в этом Кантерлоте, вернее, в его руинах, всё ещё висели знамена эквестрийской армии и принцесс на флагштоках, ткань которых почернела от пожара, что потух совсем недавно. Дым, поднимавшийся от углей под обломками, явно свидетельствовал об этом.\n\nАлкиппе вздрогнула, проходя мимо скелетов пони, многие из которых застыли в ужасных позах, на чьих почерневших костях всё ещё оставалась обугленная плоть. Она остановилась, увидев большой скелет, свернувшийся калачиком над маленьким... это мать и её жеребенок? От этого зрелища Алкиппе затошнило. Вокруг неё лежали бесчисленные мёртвые пони, чьи кости застыли во времени, дабы подчеркнуть их последние мучительные мгновения. А когда она не смогла найти винтовок или мундиров на трупах, то поняла, что они были гражданскими, а не солдатами.\n\nНо тут она услышала впереди смех и, оторвав взгляд от костей, взлетела и понеслась вперёд. Её встретило ужасающее зрелище: она увидела саму себя, пинком отправляющую череп пони скакать по обугленным булыжникам. Её двойник была одета в форму не армии, а королевской гвардии. Сквозь пелену шока она увидела, как к ней приближается капитан Ласин с широкой улыбкой на морде, под стать улыбке её двойника. — Отлично обращаешься с зажигательными снарядами, Алкиппе, — похвалил самозванку Ласин. — Ветер удачно раздул пламя, чтобы выкурить паразитов из их нор. О, я многое отдал бы, чтобы заглянуть в сердце огненной бури, чтобы увидеть, как эти жалкие пони кричат в агонии, когда их плоть кипит.\n\n— Я этого тоже не видела, но прекрасно слышала, — сказала самозванка Алкиппе. — Это было просто музыкой для моих ушей. Я заставила пушки прекратить стрельбу на пятнадцать минут, просто чтобы послушать их вопли.\n\nЛасин усмехнулся, потянулся магией в карман мундира, вытащил оттуда медаль и приколол её к груди Алкиппе. — Я думаю, что это заслуживает повышения. Как это звучит, генерал-майор? В армии и так слишком много оберстлейтенантов.\n\nАлкиппе с ужасом наблюдала, как её двойник ухмыляется. — Совершенно верно, капитан Кардо. Я не могу дождаться, чтобы провести то же шоу в Мейнхеттене."
changelings_paxchrysalia.620.a:0 "Это не... Это не я!"

changelings_paxchrysalia.621.t:0 "Во имя науки"
changelings_paxchrysalia.621.d:0 "Марсилио тщетно пытался найти выход из здания, в котором оказался. Коридоров и комнат было так много, что он понятия не имел, куда идти. Каждый раз, когда он останавливался, чтобы спросить дорогу у чейнджлинга, те проходили мимо, словно его вовсе не существовало. После пятой попытки он сдался, поняв, что происходит что-то странное. Стал ли он призраком? Неужели он мёртв? Он не знал, но с научной точки зрения это было невозможно. Так что же происходило?\n\nДвойные двери распахнулись, и оттуда вышли четверо чейнджлингов, державших измождённую пони. Её ноги были скованы так, что шагать становилось мучительно трудно. Сначала он подумал, что перед ним земная пони, но затем заметил: у неё ампутирован рог. Марсилио ошеломлённо моргнул. Удалить рог у единорога – всё равно что лишить чейнджлинга способности к перевоплощению. Это значит уничтожить ключевую часть личности. Какое же чудовище могло на это пойти? Ведь даже простая трещина в роге лишала единорога возможности творить что-либо сложнее элементарных заклинаний. Марсилио повернулся и проскользнул внутрь комнаты, прежде чем двери закрылись.\n\nОн тут же пожалел о своём решении.\n\nПеред ним оказался склад. Всё помещение от пола до потолка было заставлено клетками из нержавеющей стали. В каждой сидел больной и измученный пони. Места было так мало, что они не могли даже повернуться. Те, кто находился в нижних клетках, были покрыты нечистотами от тех, кому «повезло» оказаться выше. Вонь отбросов и болезней наполняла воздух. Пони напоминали животных, загнанных на бойню, и у большинства не осталось даже сил пожаловаться на своё положение. По их тусклым глазам Марсилио понял: они давно сдались.\n\nДверь снова открылась, и Марсилио увидел, как он сам входит внутрь в сопровождении учёных и ассистентов. — Нормальные условия жизни подопытных не увеличивают количество любви, которое они производят, — услышал он голос своего двойника, отчитывающего помощника. — Они будут давать одинаковое количество любви как в клетке, так и на свободе. Конечно, любовь можно слегка «подсластить», если у подопытных будут правильные отношения с другими пони, но это вчетверо увеличило бы стоимость содержания. Наши искусственные подсластители во время процесса очистки любви вполне компенсируют этот минус. Индустриализация, Педипальп! В ней таится будущее добычи любви!\n\nМарсилио мог лишь с ужасом и отвращением наблюдать, как его двойник свернул за угол и исчез за стеной из клеток, полных несчастных пони."
changelings_paxchrysalia.621.a:0 "Это не наука! Это промышленная жестокость высочайшего масштаба!"

changelings_paxchrysalia.622.t:0 "Хранители королевского мира"
changelings_paxchrysalia.622.d:0 "Яхс не знал, как и почему он оказался в этой студии. Он помнил лишь фиолетового аликорна посреди звёзд, а потом он очутился здесь. Но впереди послышались звуки какой-то деятельности и он ускорил шаг, надеясь найти кого-нибудь, кто объяснил бы ему, что произошло.\n\n— Места, занимайте свои места! — Яхс услышал крик режиссера и остановился как вкопанный – это был ЕГО голос. Теперь он был скорее заинтересован, чем обеспокоен. Яхс осторожно шагнул вперёд, чтобы получше рассмотреть происходящее. Сцена в студии изображала живописную эквестрийскую ферму, и он видел, как актеры-чейнджлинги готовятся к съёмкам. — Так, Пупа, твой персонаж, — двойник Яхса напомнил одному из актеров, и чейнджлинг хихикнула в лёгком смущении, превращаясь в веселую земную пони. Когда все разошлись по местам, Яхс увидел, как его двойник снова поднял мегафон. — Ладно, всё хорошо. Давайте попробуем снять всё это в последний раз, хорошо? Свет, камера, мотор!\n\nАктёры на сцене немедленно приступили к отрепетированной рутине, а солдат-чейнджлинг вместе с гражданским подошёл к входной двери фермы и постучал в неё, повысив голос, чтобы его записали микрофоны. — Мисс Джунбаг? Вы дома?\n\nАктриса, перевоплотившаяся в земную пони, немедленно открыла дверь и вышла наружу, преувеличенно радостно кивая солдату в форме. — О да, сэр, мистер Тарсус! Да, сэр! Чем я могу вам помочь, сэр?\n\nСолдат и штатский засмеялись, и пони захихикала вместе с ними. — Мисс Джунбаг, неужели вы забыли какой сегодня день? Сегодня день сбора урожая! Мой друг, Карапс, сказал, что вы забыли отдать свою долю любви сегодня!\n\nДжунбаг хлопнула копытом по голове. — О, нет, мистер! Я всё время забываю об этом! Слава королеве, что вы напомнили мне об этом! Как насчёт того, чтобы я отдала свою любовь прямо сейчас, раз уж вы здесь?\n\n— О, это прекрасный вариант! — Воскликнул Тарсус, и актриса, изображавшая штатского, шагнула вперед и открыла рот, как будто она высасывала любовь, после чего земная пони снова захихикала. Эта сцена длилась ещё несколько секунд, прежде чем самозванец-Яхс снова поднял свой мегафон. — Снято! Потом мы добавим голос за кадром. Отличная работа, чейнджлинги! Просто великолепная!\n\nКогда после окончания съемок чейнджлинги начали расходиться, настоящий Яхс мог лишь смотреть на них с недоверием. Он прошёл путь от солдата до кинорежиссера, обеляющего оккупационный режим? Он ни за что не опустился бы так низко! Что тут происходит?"
changelings_paxchrysalia.622.a:0 "Я никогда не пытался уклониться от правды. Я решаю проблемы, а не притворяюсь, что их не существует!"

changelings_paxchrysalia.623.t:0 "Отчёт о произошедшем"
changelings_paxchrysalia.623.d:0 "Когда Финикус наконец пришел в себя, то первым он увидел мерцание флуоресцентных ламп над головой. Вторым он заметил стол, под которым он частично лежал и упавший стул. Затем он почувствовал головную боль, и это заставило его выпрямиться.\n\nОн понял, что всё ещё находится в той комнате, где и принял зелье, пустой пузырек от которого валяется на полу рядом с ним. Также вокруг него лежали остальные друзья, которые сейчас медленно приходили в себя. Яхс первым что-то сказал и сразу же застонал, схватившись за голову. — Ух... Мне действительно нужно перестать принимать наркотики. Это непрофессионально.\n\nФиникус хмыкнул и прислонился спиной к стене. — Я понял, — сказал он, на мгновение закрыв глаза. Но потом к нему вернулись воспоминания об увиденном, и он нервно посмотрел на Яхса и остальных своих друзей. — Я, эээ... а что вы видели?\n\n— По-видимому, я был кинорежиссером, обеляющим горькую правду нашей оккупации, — проворчал Яхс. — Если такова моя судьба, то я в это ни капельки не верю.\n\n— Я... – тихо начала Алкиппе, дрожа всем телом. — Я служила в королевской гвардии во время битвы за Кантерлот. Я... я устроила огненный шторм, который убил бесчисленное количество мирных жителей... и я гордилась этим.\n\n— Я превратил свою лабораторию в бойню, — сказал Марсилио. — Я обращался с пони как со скотом... это не то, во что я верю. Я же написал целый манифест об этом!\n\nФиникус кивнул. — А я был лишь рабовладельцем, – сказал он. — Я превратил «Мейн-Хайв» в лагерь смерти, замаскированный под фабрику. Я не... Я ведь не настолько плох, правда?\n\n— Вовсе нет, – заверил его Яхс. Но потом он нахмурился. — Ни одно из наших видений совсем не было похоже на правду. Мы все лучше, чем те, кого мы видели. Так..."
changelings_paxchrysalia.623.a:0 "...что это всё значит?"

changelings_paxchrysalia.624.t:0 "В поисках своей судьбы"
changelings_paxchrysalia.624.d:0 "На мгновение в комнате воцарилась тишина, все присутствующие задумались о произошедшем, но Марсилио первым пришел к нужному выводу. — Семена показывали нам, какой стала бы наша жизнь, если бы мы не встретились, — сказал он. — Они показали нам, на что была бы похожа наша жизнь, если бы мы выполняли наихудшие приказы Кризалис, чтобы поддерживать её видение «Пакс Кризалии». Наши видения показали нам, как низко мы могли бы пасть...\n\n... и как высоко мы поднялись вместо этого, — сказала Алкиппе с кивком. — А остальные видели пурпурного аликорна? Потому что я видела её... Я думаю, это была Твайлайт. Она показала мне, сколько хорошего я сделала, с учётом того, сколько зла я могла бы сотворить.\n\n— Думаю, ты права, — согласился Яхс. — Если бы я не получил контроль над кантерлотским комиссариатом, то я вполне мог бы уйти в отставку и найти себе другое занятие. Я, вероятно, и сам бы не знал всех истинных ужасов «Пакс Кризалии».\n\nФиникус на мгновение задумался, а на его лице очень медленно появилась улыбка. — Знаешь что? Я думаю, что эти семена всё же показали мне мою судьбу.\n\nАлкиппе удивлённо приподняла брови. — Что ты имеешь в виду? Ты ведь не собираешься стать рабовладельцем, правда?!\n\n— Нет, нет! Совсем наоборот. Я имею в виду, что знаю, что мне теперь делать. Я буду стараться изо всех сил, чтобы сделать «Мейн-Хайв» противоположностью того, что я видел в этом видении. Я собираюсь работать этично и честно. Да пошло оно всё! Я сам найму пони, буду платить им приличную зарплату и освобожу от любовного налога, чтобы помочь им выбраться из этой передряги!\n\n— Знаешь что? Мне нравится эта идея, — сказал Марсилио. — Я собираюсь использовать свою лабораторию для поиска более безопасного и лёгкого способа сбора любви. Может быть, я однажды найду способ сделать искусственную любовь такой же хорошей, как и настоящая. Тогда нам не нужно будет бы загонять пони в стойло и регулярно отбирать их любовь.\n\n— Я сделаю всё возможное, чтобы стать образцом для подражания для всей армии, — сказала Алкиппе. — В армии не должно остаться ни одного офицера, который считал бы, что с пони нужно обращаться жестоко. Мы должны остановить эти идеи в высших эшелонах, если хотим, чтобы они распространились и среди рядовых.\n\n— А я позабочусь о том, чтобы мы исправляли несправедливости «Пакс Кризалии» одну за другой, а не прятали их под сукно и делали вид, что проблем не существует, — сказал Яхс. — Работая вместе, мы можем создать лучшее будущее для всех. Будь то для чейнджлингов, пони или даже оленей. Завтрашние перемены начинаются сегодня."
changelings_paxchrysalia.624.a:0 "Мы станем прародителями лучшего будущего."

changelings_paxchrysalia.701.t:0 "Декрет о формировании KuKC Erforschung- und Extraktion Konzern Posthaste"
changelings_paxchrysalia.701.d:0 "АДМИНИСТРАТИВНЫЙ УКАЗ номер 696.9\n\nПРИНИМАЯ ВО ВНИМАНИЕ высочайшую необходимость Гегемонии в импорте и потреблении природных ресурсов; \n\nПРИНИМАЯ ВО ВНИМАНИЕ, что ресурсы этих земель, находящихся под юрисдикцией местных посредников, напрямую принадлежат Гегемонии чейнджлингов;\n\nПРИНИМАЯ ВО ВНИМАНИЕ, что в настоящее младшие члены Гегемонии ещё не выплатили все свои взносы и долги с точки зрения ресурсов и материальных средств;\n\nПОЭТОМУ, я, королева Кризалис и единоличная правительница Объединённых Ульев Чейнджлингов и единоличная правительница как Олении, так и Эквестрии, приказываю своей абсолютной властью создать новое учреждение, которое будет непосредственно контролировать добычу ресурсов и материалов у младших членов Гегемонии. Эта организация будет официально именоваться Das Königin und Kaiserin Chrysalis Erforschung und Extraktion Konzern и получит полномочия в одностороннем порядке управлять добычей ресурсов и материальных средств по всей территории Гегемонии. Это новое учреждение будет отвечать лишь передо мной и теми, кому я доверяю административную власть. Полномочия KuKC Konzern вступят в силу немедленно.\n\nПодписано великой королевой Кризалис"
changelings_paxchrysalia.701.a:0 "Прямой контроль над ресурсами наших подданных усилит нас."

changelings_paxchrysalia.702.t:0 "Отступление из Вечнодикого леса"
changelings_paxchrysalia.702.d:0 "[CHN_GetAlcippeRank] Алкиппе нахмурилась, глядя на отчеты, лежащие на её столе, и ознакомилась с их содержанием, прежде чем передать их [CHN_GetJachsRank]у Яхсу. Сообщения, гласящие о том, что солдаты армии покидают свои аванпосты, расположенные вокруг и внутри Вечнодикого леса, поступали сюда со вчерашнего утра, и, хотя Алкиппе сначала планировала отложить эти отчёты и заняться очевидной проблемой дисциплины самостоятельно, растущая частота этих сообщений беспокоила её. Солдаты, бежавшие из леса, сообщали о значительном увеличении числа нападений монстров и засад партизан, что привело к большему потерь, чем предполагала армия, создавая эти гарнизоны. Увеличение числа атак вкупе с крайне враждебным окружением уничтожило половину личного состава гарнизонов, прежде чем они сумели отступить. Даже отряд королевской гвардии, храбрейших и самых фанатичных солдат во всей Гегемонии, сбежали из Вечнодикого леса, утверждая, что пони теней устроили охоту за ними в центре Замка Двух Сестёр, который им было поручено обыскать. Всё это было очень странно, и у Алкиппе возникло ощущение, что в лесу происходит что-то ещё, чего армия пока не понимает. Возможно, стоит мобилизовать часть войск и разместить их по периметру леса... на всякий случай."
changelings_paxchrysalia.702.a:0 "Деревья, как известно, не сопротивляются, но мы имеем дело с Вечнодиким лесом..."

cityfall.310.t:0 "Битва за Замок Двух Сестёр"
cityfall.310.d:0 "[This.GetNewspaperHeader]Мятежу эквестрийских партизан в Вечнодиком лесу практически пришёл конец. Силы чейнджлингов заняли Замок Двух Сестёр и захватили, вероятно, последний крупный оплот повстанцев в лесу. Информация о конфликте между Гегемонией чейнджлингов и повстанцами, возглавляемыми зеброй по имени Зекора, скудна и ненадёжна из-за активной цензуры чейнджлингов. Однако наблюдатели в Кантерлоте сообщают о массированных бомбардировках леса и развертывании сотен тысяч солдат чейнджлингов для подавления этого восстания. Также ходят слухи о возможном нанесении термоядерного удара по самому лесу. По мере поступления сообщений о необратимом ущербе окружающей среде, серьёзных жертвах среди гражданского населения и жестокости режима чейнджлингов становится ясно, что «Пакс Кризалия» всё ещё властвует над всей Эквестрией."
cityfall.310.a:0 "«Пакс Кризалию» не остановить!"
cityfall.310.b:0 "Мы будем сражаться дальше! Мечта не мертва!"
cityfall.310.c:0 "Чейнджлинги снова победили."

