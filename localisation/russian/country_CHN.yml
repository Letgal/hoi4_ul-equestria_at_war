 CHN_military_love_acquisition_decision: "Додатковий збір любові"
 CHN_military_love_acquisition_decision_desc:0 "Наши сухопутные войска, развёрнутые на оккупированных территориях, будут действовать самостоятельно и заниматься сбором любви напрямую у населения.\n\n§W£lovetax_text  = ( (§GB§!) ÷ ( (§YS§!) × 10 ) ) × ( ( 100 - (§RR§!) ) ÷ 100 )\n\nПриведенная выше формула используется для расчета общего количества £lovetax_text  §Cлюбви§!, полученного от операций [CHN_estimated_erots_TOOLTIP_FOR_MILITARY_LOVE_REQUISITIONS]:\n\n(§GB§!) представляет собой количество §Gфронтовых батальонов§!, развёрнутых государством [CHN.GetNameDef] (§Y[?CHN.num_battalions]§!). Количество фронтовых батальонов, учтенных в этом расчете, ограничено максимально допустимой величиной (§Y[?CHN_amount_of_allowed_battalions]§!).\n\n(§YS§!) представляет собой общее число ненациональных регионов, непосредственно контролируемых государством [CHN.GetNameDef], в дополнение к (§Y50%§!) из всех регионов, принадлежащих и контролируемых нашими марионетками (§Y[?CHN_weekly_love_gain_state_var]§!).\n\n(§RR§!) средний уровень сопротивления во всех регионах под Чейнджлингской оккупацией [CHN_average_resistance_TOOLTIP_FOR_MILITARY_LOVE_REQUISITIONS].§!"

 # Рішення з надбання любові (версія вище — застаріла)
  CHN_gain_love_decision: "Додатковий збір любові"
  CHN_gain_love_decision_desc:0 "Наши сухопутные войска, развёрнутые на оккупированных территориях, будут действовать самостоятельно и заниматься сбором любви напрямую у населения.\n\n§W£lovetax_text  = ( (§YS§!) - (§WУ§!) ) × 0.005 × ( ( 100 - (§RR§!) ) ÷ 100 )\n\n(§WУ§!) = ( ( (§YS§!) × 10 ) - (§GB§!) ) ÷ 10, (§WУ§!)£bigger_than_or_equal_to_icon_text (0)\n\n[CHN_collection_troops_bonus_loc_string]Приведенная выше формула рассчитывает общее количество £lovetax_text  §Cлюбви§!, получаемого от операции [CHN_estimated_erots_TOOLTIP_FOR_MILITARY_LOVE_REQUISITIONS]:\n\n(§GB§!) представляет собой количество §Gфронтовых батальонов§!, развёрнутых государством [CHN.GetNameDef] (§Y[?CHN.num_battalions]§!).\n\n(§YS§!) представляет собой общее число ненациональных регионов, непосредственно контролируемых государством [CHN.GetNameDef], в дополнение к (§Y50%§!) всех регионов, контролируемых нашими марионетками (§Y[?CHN_weekly_love_gain_state_var]§!).\n\n(§RR§!) средний уровень сопротивления во всех регионах под чейнджлингской оккупацией [CHN_average_resistance_TOOLTIP_FOR_MILITARY_LOVE_REQUISITIONS].§!"
  CHN_erots_VARIABLE_TOOLTIP_FOR_MILITARY_LOVE_REQUISITIONS:0 "(§G+[?CHN_military_love_acquisition_decision_erot_gain]§!) §Yэротов§! собранной любви £lovetax_text  будет добавлено в чейнджлингское хранилище.\n"
  CHN_estimated_erots_TOOLTIP_FOR_MILITARY_LOVE_REQUISITIONS_unselected: "(§Yбуде обчислено при виборі§!)"
  CHN_estimated_erots_TOOLTIP_FOR_MILITARY_LOVE_REQUISITIONS_selected: "(§C[?CHN_military_love_acquisition_decision_erot_gain]§! ерот.)"
  CHN_average_resistance_TOOLTIP_FOR_MILITARY_LOVE_REQUISITIONS_unselected: "(§Yбуде обчислено при виборі§!)"
