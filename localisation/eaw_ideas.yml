 agrarian_society6_desc: "$agrarian_society_desc$"
 tribal_society: "Примітивне суспільство"
 tribal_society_desc: "У широкому розумінні первісне суспільство характеризується відсутністю соціальної складності. Населення поділяється на незліченні невеликі групи, часто за родинними зв’язками, і не існує сильної центральної влади. Усе населення, за винятком кількох осіб, таких як духовні лідери, займається натуральним землеробством, скотарством або навіть полюванням та збиральництвом. Спеціалізація чи поділ праці практично відсутні. Немає спільної ідентичності, немає «нації», немає «країни» і немає «уряду». Проте все ще існують культура, мистецтво, релігія, мова і, перш за все, одвічна первісна мудрість." # (@:D)
 tribal_society2: "$tribal_society$"
 tribal_society2_desc: "$tribal_society_desc$"
 tribal_society3: "$tribal_society$"
 tribal_society3_desc: "$tribal_society_desc$"
 tribal_society4: "$tribal_society$"
 tribal_society4_desc: "$tribal_society_desc$"
 communal_society: "Комунальне суспільство"
 communal_society_desc: "Комунальні суспільства схожі на первісні, оскільки характеризуються простою організацією, фрагментацією суспільства та натуральним господарством. Відмінність полягає у поширеній культурі взаємозалежності та спільному користуванні землею та ресурсами, причому лідери виконують переважно суто церемоніальну роль. Окремі особи підтримують ширшу спільноту, яка, у свою чергу, підтримує їх." # (@:D)
 communal_society1: "$communal_society_desc$"
 communal_society1_desc: "$communal_society_desc$"
 detached_country: "Ізольована країна"
 detached_country_desc: "Ця країна практично не має зв’язків із зовнішнім світом: вона повністю закрила свої кордони й постійно патрулює їх, щоб запобігти проникненню чужинців. Через це до країни не надходять нові іноземні ідеї, а суспільство залишається застряглим у минулому, не маючи можливості розвиватися та суворо дотримуючись старих традицій." # (@:D)

 illiteracy_idea: ""
 illiteracy_level_idea: "Неграмотність"
 EFFECT_CHANGE_LAW_illiteracy_level_idea: "Змінює неграмотність на $NAME|Y$, що дасть §g(§!$DESC$§g)§!."
 no_lack_of_scientists: "Незначна неграмотність"
 no_lack_of_scientists_desc: "Рівень грамотності у країні перевищує 90%, насамперед завдяки майже універсальній шкільній освіті. Таким чином, боротьба з неписьменністю тут уважається завершеною."
 lack_of_scientists3: "Обмежена неграмотність"
 lack_of_scientists3_desc: "Менше чверті населення не вміє читати чи писати, але зростаюча доступність освіти забезпечує, що більшість громадян, особливо серед молодшого покоління, здобула базову грамотність. Кваліфікованих працівників більше не бракує."
 lack_of_scientists2: "Скромна неграмотність"
 lack_of_scientists2_desc: "Попри тривалі зусилля, десь половина населення в цій країні залишається неписьменною, і багато хто не може здобути жодну освіту. Однак, підвалини для надання освіти всьому населенню є і систему просто треба розширити."
 lack_of_scientists1: "Широка неграмотність"
 lack_of_scientists1_desc: "Очевидна більшість населення цієї держави зовсім не може читати чи писати, проте кількість грамотних громадян аж ніяк не мала. Базова освіта тут є, хай і в обмеженому доступі. Кваліфіковані працівники, здатні зрозуміти складні письмові інструкції, вкрай запотребовані."
 lack_of_scientists: "Масова неграмотність"
 lack_of_scientists_desc: "Через пандемічну неписьменність і неіснуючу систему освіти, щонайбільше лише дрібна частка населення здатна читати чи писати. Більшість робітників — некваліфікована та невчена, що внеможливлює працю на складніших посадах."

 poverty_idea: ""
 poverty_level_idea: "Бідність"
 EFFECT_CHANGE_LAW_poverty_level_idea: "Змінює бідність на $NAME|Y$, що дасть §g(§!$DESC$§g)§!."
 no_poverty: "Незначна бідність"
 no_poverty_desc: "Хоча в цій країні існує бідність, більшість громадян принаймні здатні якось давати собі раду й виживати самостійно, і лише дуже небагато з них помітно бідніші за інших." # (@:D)
 poverty5: "Легка бідність"
 poverty5_desc: "З різних причин деякі громадяни мають значно нижчий рівень життя, ніж більшість населення, оскільки втратили засоби до існування. Вони змушені покладатися на милостиню інших, щоб вижити, і не можуть зробити істотного внеску в розвиток суспільства." # (@:D)
 poverty4: "Низька бідність"
 poverty4_desc: "Існує меншина громадян, яку характеризує те, що вони бідніші за більшість. Їхня кількість є чималою, і деякі з них вдаються до відчайдушних заходів, щоб вижити, таких як жебрацтво чи злочинність." # (@:D)
 poverty3: "Помірна бідність"
 poverty3_desc: "З якихось причин значна частина населення страждає від відсутності доступу до засобів для задоволення основних потреб. Решта суспільства зневажливо ставиться до них, оскільки вони жебракують, виконують роботу, яку вважають рабською чи принизливою, та скоюють злочини. Проте вони страждають не з власної вини, і єдине, чого вони прагнуть, — це нормальне життя." # (@:D)
 poverty2: "Висока бідність"
 poverty2_desc: "Ця країна стикається з серйозними економічними проблемами: величезна кількість знедолених громадян мешкає у розлогих трущобах та напівзруйнованих сільських халупах. Вони нічого не мають, і як би не працювали, не заробляють достатньо, щоб прожити. Тому багато хто з них стає злочинцями або приєднується до радикальних рухів." # (@:D)
 poverty1: "Серйозна бідність"
 poverty1_desc: "Ця країна страждає від поширеної бідності, яка зачіпає більшість населення. Голод нищить бідняків, які блукають країною у пошуках будь-яких залишків їжі. Міста, що колись вирували життям, перетворилися на тихі міста-привиди. Злочинність процвітає, оскільки це найнадійніший спосіб заробити на життя." # (@:D)
 poverty: "Крайня бідність"
 poverty_desc: "Ця країна зазнала майже повного соціального колапсу, що призвело до надзвичайно високого рівня бідності в усіх верствах населення. Це диво, що не стався голод, адже ферми занедбані, а міські ринки спорожніли. Кримінальні авторитети панують у країні, оскільки уряд не має коштів на підтримання правопорядку. Спостерігається масовий відтік цивільного населення з країни." # (@:D)

