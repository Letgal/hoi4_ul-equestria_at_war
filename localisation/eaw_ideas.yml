 zebrica_legacy_of_storm1: "Спадщина Шторма"
 zebrica_legacy_of_storm1_desc: "Нещодавнє вторгнення Короля Шторма цілковито спустошило нашу країну. Попри всі наші зусилля, його військо спалило та розграбувало багато міст. Ми спробували сховати від нього наші скарби, але він був не дурний, і йому вдалося їх найти та забрати собі все цінне. Після цього він залишив осамоті зализувати наші рани. Тепер не лишилося нічого, крім як відбудовуватися." # (&+?)
 zebrica_legacy_of_storm2: "$zebrica_legacy_of_storm1$"
 zebrica_legacy_of_storm2_desc: "Не заперечити, що вторгнення Короля Шторма було лихом для нашої держави. Його військо розграбувало деякі міста, і багато наших цінних скарбів було втрачено. І все ж ми уникнули найгіршого, будь то задобривши його виплатою данини або відважно йому опираючися. Коли безумний завойовник отримав, що хотів, то пішов геть і забрав із собою своє військо. Відтоді ми відновлюємось, але попереду ще багато роботи." # (&+?)
 zebrica_legacy_of_storm3: "$zebrica_legacy_of_storm1$"
 zebrica_legacy_of_storm3_desc: "Коли Король Шторм вторгся до нас зі своїм військом, нам вдалось уникнути його гніву скромною даниною, мудрою дипломатією, хитрощами або ішими способами. Хоча ми втратили велику частину нашої скарбниці й багато цінних нам артефактів, Король Шторм був в основному вдоволений залишити нас у спокої. Деякі наші громадяни буркотять, що нам слід було запекліше відбиватися від єті-воєначальника, але принаймні наша країна залишається здебільшого неторкнутою." # (&+?)

