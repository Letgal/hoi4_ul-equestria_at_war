 science_idea: ""
 city_idea: "Науковий розвиток"
 EFFECT_CHANGE_LAW_city_idea: "Змінює науковий розвиток $NAME|Y$, що дасть §g(§!$DESC$§g)§!."
 proper_science_base: "Розвинена база знань"
 proper_science_base_desc: "Ця держава є частиною світової спільноти інтелектуалів і вчених. Таким чином, новітні винаходи поширюються тут швидко. Декотрі з них навіть походять із престижних сучасних університетів країни. Місцеві дослідники професійно застосовують наукові методи для створення об'єктивного погляду на магічний світ довкола нас."
 big_science_base: "Істотна база знань"
 big_science_base_desc: "Учені цієї країни прийняли еквестрійську наукову революцію, покинувши звичаї минулого. Однак вони стикаються з потужним обскурантизмом або взагалі ворожістю з боку ширшого суспільства. На додачу до цього, їм також бракує ресурсів і персоналу для проведення абияких широкомасштабних досліджень."
 better_science_base: "Мала база знань"
 better_science_base_desc: "Хоча декотрі філософи та вчені з цієї країни оспорюють традиційні погляди на природу та цікавляться іноземними ідеями, вони нечисленні й більшість інтелектуалів віддані вивченню натурфілософії, а не сучасної науки. Якщо тут є заклади вищої освіти, вони мають невеликий розмір."
 poor_science_base: "Нікчемна база знань"
 poor_science_base_desc: "«Наука» — невідоме тут поняття. Для пояснення функціонування світу використовуються забобони та чудернацькі ідеї. Магія розглядається як дика, неприборкана й навіть небезпечна сила, якої слід уникати. Більшість «інтелектуалів» — це старійшини чи жерці, які зосереджуються на засвідченні традиційних знань замість намагання впроваджувати інновації."

 society_idea: ""
 society_development_idea: "Суспільний розвиток"
 EFFECT_CHANGE_LAW_society_development_idea: "Змінює суспільний розвиток на $NAME|Y$, що дасть §g(§!$DESC$§g)§!."
 modern_society: "Сучасне суспільство"
 modern_society_desc: "Сучасне суспільство приборкало природний світ і взяло його під владою. Хоча це й не означає цілковите управління погодою, як в Еквестрії, це все ж свідчить, що держава перетворилася на надзвичайно складну, взаємопов'язану систему з сильними установами й ефективним широкомасштабним промисловим виробництвом. Розлогі міські агломерації забезпечені всією необхідною інфраструктурою для утримання свого величезного населення. У зв'язку з розширенням автоматизації та глобалізацією торгівлі дедалі більше громадян працюють у сфері послуг. За таких темпів країна зрештою вийде за межі сучасності." # (@:D) // перша проба: Сучасне суспільство приборкало та встановило владу над природою. Хоча може не означати цілковите управління погодою як в Еквестрії, це означає, що держава впорядувалась у неймовірно складну взаємосполучену сутність з дужими установами й ефективними широкомасштабним промисловим виробництвом.
 modern_society_upgrade_tooltip: "Змінює суспільний розвиток на §H$modern_society$§!, що видаляє всі штрафи.\n"
 outdated_industry: "Молоде промислове суспільство"
 outdated_industry_desc: "Незважаючи на індустріалізацію, ця країна ще не наздогнала більш розвинені держави. Деякі традиційні інститути й досі роблять усе можливе, щоб зупинити, здавалося б, неминучий поступ прогресу. Проте їхні зусилля видаються дедалі марнішими, оскільки суспільство навколо них продовжує стрімко змінюватися. Більшість населення вже проживає в містах і працює в промисловому секторі, а технології зв’язку та транспорту використовуються для того, щоб з’єднати столицю, що розбудовується, з усіма куточками країни, а також із широким світом за її межами. Досить скоро це суспільство зможе називати себе сучасним за будь-яким визначенням цього слова." # (@:D)
 outdated_industry2: "$outdated_industry$"
 outdated_industry2_desc: "$outdated_industry_desc$"
 pre_industrial_society: "Напівпромислове суспільство"
 pre_industrial_society_desc: "Це суспільство переживає промислову революцію. Нові машини імпортуються з-за кордону, а іноді навіть виробляються всередині країни, що дозволяє набагато ефективніше виробляти товари. Розширення бюрократичного апарату та запровадження принципу меритократії сприяють покращенню державного управління, економіки та охорони здоров’я, що, у свою чергу, забезпечує стрімке зростання чисельності населення. Оскільки на фермах потрібна менша кількість робітників, багато хто з них мігрує до міст у пошуках роботи на новостворених фабриках. Хоча деякі люди виступають проти цих радикальних змін, вони можуть лише уповільнити цей процес." # (@:D)
