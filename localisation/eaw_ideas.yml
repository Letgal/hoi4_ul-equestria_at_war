 agrarian_society: "Аграрне суспільство"
 agrarian_society_desc: "Аграрне суспільство — це суспільство, в якому значна частина населення, близько 90%, займається сільським господарством. Сільська місцевість поділена на незліченну кількість невеликих сіл і містечок, а великих міських поселень — лише декілька. Майже вся робота виконується вручну, з мінімальною автоматизацією та з використанням тяглових тварин. Життя тече повільно й незмінно, а традиційні інститути залишаються незмінними. Лише деякі мешканці великих міст коли-небудь виїжджають за кордон, а іноземців тут майже не зустрінеш. Лише небагато мешканців мегаполісів коли-небудь виїжджають за кордон, а іноземців тут майже не зустрінеш. Проте ці нечисленні зв’язки із зовнішнім світом потенційно можуть стати поштовхом до промислової революції." # (@:D)
