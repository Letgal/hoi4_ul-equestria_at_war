 EAWSE_MEMES_JADDAR: "1 квіт. 2025"

 EAWSE_AF25_TITLE: "Священна війна" # (@+++)
 EAWSE_AF25_T: "Священна війна" # (@+++)
 EAWSE_AF25_A: "Життя і смерть б'ються за Зебрику." # (@+++)
 EAWSE_AF25_D: "«Отже, я даю вам вибір. Станьте на бік Світла, або ж вас виженуть, як Темряву».\n($TBK_AF_jaddar_jexiszuir$)" # (@+++)
