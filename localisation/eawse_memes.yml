 EAWSE_MEMES_KATZ: "1 квіт. 2024"

 EAWSE_AF24_UFS_TITLE: "Останнє випробування" # (@+++)
 EAWSE_AF24_UFS_T: "Об'єднанні Вільні Держави" # (@+++)
 EAWSE_AF24_UFS_A: "Останнє випробування починається." # (@+++)
 EAWSE_AF24_UFS_D: "«Більшість вважає, що тепер на нас чекає або смерть, або перемога, але, на жаль, вони не розуміють, що ці поняття не є взаємовиключними».\n($RCT_river_swirl$)" # (@+++)

 EAWSE_AF24_UFS_VICTORY_TITLE: "Останнє випробування: Перемога ОВД" # (@+++)
 EAWSE_AF24_UFS_VICTORY_T: "Каттейла переможено" # (@+++)
 EAWSE_AF24_UFS_VICTORY_A: "Ось так і закінчується манія величі." # (@+++)
 EAWSE_AF24_UFS_VICTORY_D: "«Чи варто було систематично руйнувати створений мною порядок під приводом того, що він по суті своїй є поганим? Тільки через те, що я наважився кинути виклик вашому уряду? Ви хоч на мить задумалися про ті справжні блага, які я можу принести? Процвітання та рівність під чуйним керівництвом?»\n($KTZ_kaiser_kattail$)" # (@+++)

 EAWSE_AF24_CRUSADE_TITLE: "Останнє випробування: Перемога Каттейла" # (@+++)
 EAWSE_AF24_CRUSADE_T: "Каттейл об'єднує світ" # (@+++)
 EAWSE_AF24_CRUSADE_A: "Це лише початок." # (@+++)
 EAWSE_AF24_CRUSADE_D: "«Єдність — це єдиний шлях уперед, хоче того планета чи ні. Щоб захистити все розумне життя від подвійної загрози байдужих інопланетних загарбників та дріб'язкових циклічних колапсів, які в минулому знищили так багато великих цивілізацій».\n($KTZ_kaiser_kattail$)" # (@+++)

