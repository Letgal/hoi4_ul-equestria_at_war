 MTA_Tireless_Tracker: "Тайрлесс Трекер"
 MTA_Tireless_Tracker_desc: "§YБіографія§!: Хоча народжений у Еквестрії, Тайрлесс Трекер провів більшу частину свого життя в лісах Ґрайфвальда та їхніх околицях. Мисливець за скарбами в душі, він прагнув заглиблюватися в райони, які рідко досліджували інші; зрештою, у більшій частині Еквестрії й так вистачало своїх шукачів пригод. Хоча в Ґрайфвальді не було містичних лісів, на кшталт Вічнодикого, Тайрлесс прив'язався до цієї місцевості через фундаментальну красу інакше цілком звичайних лісових угідь.\n\nПісля багатьох років збирання різноманітних дрібничок і помірно цінних скарбів він натрапив на кілька дивних артефактів, які спантеличили його і всіх, кому він їх показував. Це привернуло увагу команди з пошуку артефактів, яка випадково опинилася в цьому районі. Після короткої розмови старший агент дійшов висновку, що Тайрлесс може стати в пригоді Раді. Агент зв'язався зі своїм керівництвом, і незабаром Тайрлесса було прийнято до лав їхньої організації.\n\nНезважаючи на те, що Тайрлесс Трекер — земний поні, він продемонстрував зразковий хист до пошуку маловідомих артефактів. Цей талант поширився і на інші сфери, що було продемонстровано під час важливої пошукової місії 3-го класу. Команда, яку супроводжував Тайрлесс, потрапила в засідку і опинилася розгубленою та пораненою на ворожій території. Вони були змушені сховатися в покинутому будинку, чекаючи на можливість втекти. Саме тоді Тайрлесс вказав на кілька недоліків у їхніх планах оборони і виправив їх, хоча на той час агентам, з якими він був, це здавалося нелогічним. Завдяки його діям уся команда змогла безпечно повернутися до штаб-квартири зі збереженим артефактом.\n\nЦя місія привернула до нього увагу Обсидіанової ради, яка вирішила, що його навички можуть бути краще використані на керівній посаді в їхніх оперативних групах. Відтоді Тайрлесс Трекер провів кілька успішних операцій з мінімальними втратами.\n\n§YАвтор портрета§!: Neither" # (@+++)

