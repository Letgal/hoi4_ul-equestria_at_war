### ПОДІЇ ###
 baltimare.1.t:0 "Іскра революції"
 baltimare.1.d:0 "As the sun was raised above Baltimare, it shone upon a liberated city.\n   Only some days ago, a coordinated attack had been launched against it. In the dark of the night, strange ponies armed with heavy weapons took over government buildings and the radio station, displaying an unknown black flag. They called themselves "lunarists" and broadcasted on the radio that the city was now part of the Lunar Empire of Nightmare Moon. This event came as a complete shock to the city's inhabitants. Only a little over seven years ago, they had learned that Nightmare Moon was real and not a legend. Now, not only was she somehow back, but had an entire army supporting her.\n   The city's elected mayor, Ash Moustache, tried to quickly salvage the situation. He was a friend of the mayor of Manehattan, a city heavily involved in the thestral integration movement, so he was able to convince the lunarists to let him remain in charge. He urged the citizens to remain calm and keep their heads down, desperately trying to avoid any bloodshed or chaos. Perhaps he was afraid of repeating the past, when the city's workers had protested against the previous mayor during the Winter Revolution.\n   His efforts were in vain.\n   The occupation turned out to be unbearable. A strict nighttime curfew was imposed, workers were forced to produce weaponry for the "Lunar Imperial Army", and those who supported Celestia disappeared one by one. Yet, unlike most other cities in the newly proclaimed Lunar Empire, Baltimare was prepared.\n   Ever since the Winter Revolution and the brutal crackdown against the protests in the city, the working class had readied themselves for a potential revolution if the opportunity ever presented itself. Now it had. All at once, different left-wing factions launched their attacks: anarchists, trade unions, the local communist party and even the police force, taken over by infiltrators among their ranks. The lunarists were soon forced to flee with heavy casualties and the traitor Ash Moustache was imprisoned. The revolution then spread into the countryside, going as far as it could before supplies ran low and opposition stiffened.\n   Now, on this bright and sunny day, Baltimare finds itself free and independent. The city's fate is now in the hooves of those who once worked for others." # (!)
 baltimare.1.a:0 "We must remain united in our cause." # (!)
 baltimare.2.t:0 "Перше засідання Конґресу"
 baltimare.2.d:0 "The old city hall, once the home of Mayor Ash Moustache, was now adorned with large red banners that fluttered in the wind. Numerous ponies flocked into the building, as the first meeting of the Baltimare Congress was about to begin.\n   Inside, a pony named Golden Delicious smiled as others warmly greeted him. Within a few days, he had risen to fame thanks to his valiant leadership during the offensive which drove the reactionary lunarists out of Baltimare. But the warmest greeting of all came from Cricket Chafer, who not only embraced him but also kissed him on both cheeks. "Comrade! What a glorious day it is today!"\n   Golden chuckled. "I am quite overwhelmed, yes. I never believed this would happen."\n   "The revolution relies on the belief that dreams can come true," Cricket said. "So, TER has decided to join the Popular Front after all?"\n   Most of the left-wing organizations in the city, including TER, the confederation of labour unions, had decided to unite in a political coalition, which allowed them to dominate the Congress. "Yes, even if our anarchist allies in CAN are rather upset about it."\n   Cricket snorted. "Of course. They'll come to understand the necessity of this government eventually, and then they'll join us too."\n   Nearby, Golden saw a shady figure walk past. He frowned. "Lavender Berry is here?"\n   "Why of course! IES has joined the Front as well. Do not worry, he is a good friend of mine."\n   Lavender looked back at Golden. There was a coldness in his eyes.\n   "We're not letting republicans or monarchists in the Congress, but we did let him in...?" Golden mumbled.\n   Cricket patted him on the shoulder. "Without IES's splendid work in infiltrating the police force, our revolution would have failed! We can trust them. Now come, let's get you elected as the provisional chairpony of the Congress!" With a gentle push, Golden Delicious walked forward." # (!)
 baltimare.2.a:0 "Ми маємо гарний початок."
 baltimare.3.t:0 "Революція в Балтимейрі"
 baltimare.3.d:0 "Нещодавно до Сікамеону надійшли новини про революцію в південно-східній частині охопленої війною Еквестрії. Утворення соціалістичної республіки в Балтимейрі порадувало радикалів і синдикалістів, адже місто було штаб-квартирою найбільшої конфедерації профспілок Еквестрії, КАБ-ПЕР. Деякі з них були настільки захоплені цим, що прагнули поїхати за кордон і допомогти своїм еквестрійським товаришам у боротьбі. Серед них — письменник Хорхе Орельяна, колишній вчитель, відомий своїми лівими романами. Він сказав, що хоче боротися проти прихильників монархізму, які виступали проти молодої республіки, і був упевнений у власних бойових здібностях."
 baltimare.3.a:0 "Будемо сподіватися, що всі вони повернуться цілими і неушкодженими."
 baltimare.4.t:0 "Підтримка від Сікамеону"
 baltimare.4.d:0 "Почувши про нашу революцію, синдикалісти і ліваки з держави [SIC.GetNameDef] прибули з-за моря, щоб підтримати нас у нашій боротьбі за свободу проти монархічних гнобителів. Серед них — письменник Хорхе Орельяна, який був готовий до боротьби. Він пройшов вишкіл у сикамеонському ополченні, і товариш Делішес запропонував підвищити його в чині, бо нам дуже бракує здібних офіцерів."
 baltimare.4.a:0 "Ласкаво просимо, товариші!"
 baltimare.5.t:0 "Прохання від Балтимейру"
 baltimare.5.d:0 "Крикет Чейфер, лідер комуністичної партії НОН у Балтимейрі, надіслав нам таємну телеграму з проханням про допомогу. Він каже, що їхня революційна боротьба могла б значно виграти, якби ми надіслали наших найкращих умів у якості радників. Перебуваючи там, вони могли б також працювати над тим, щоб відтіснити контрреволюційних анархістів і синдикалістів на конґресі в Балтимейрі.\n\nОднак він не уточнив, яких саме радників надсилати, тож це має вирішити політбюро. Чи повинні ми послати політичних радників, таких як Ґолд Маффин і Спайк Шпіґель, щоб підняти їхній бойовий дух і забезпечити неухильне дотримання комуністичних принципів, чи ми повинні послати військових радників, таких як Софія і Нєвський, щоб привести їхніх солдатів у форму? Чи варто взагалі когось посилати? Адже Балтимейр — небезпечна зона бойових дій."
 baltimare.5.a:0 "Ми надішлемо Ґолд Маффина та Шпіґеля."
 baltimare.5.b:0 "Надішлемо Софію та Нєвського."
 baltimare.5.c:0 "Це занадто ризиковано. Надішліть їм моральну підтримку."
 baltimare.6.t_accepted:0 "Сталліонград надсилає радників"
 baltimare.6.t_refused:0 "Сталліонград відхилив наш запит"
 baltimare.6.d_gold_spike:0 "Хороші новини! У супроводі кількох кораблів Червоного флоту до гавані Балтимейра прибули два радники зі Сталліонграду: Ґолд Маффин, чейнджлінґ-комуніст, біженець із Королівства Кризаліс і популярна фігура серед соціалістів Еквестрії, а також Спайк Шпіґель, один із поні, відповідальний за економічне планування військового виробництва Сталліонграду. Вони висловили готовність допомогти нам у нашій боротьбі." # qnd.
 baltimare.6.d_sofia_nevsky:0 "Хороші новини! У супроводі кількох кораблів Червоного флоту до гавані Балтимейра прибули два радники зі Сталліонграду: Софія, високопоставлений ветеран Зимової революції та експерт з мобільної війни, і Нєвський, офіцер, відомий своїм умілим управлінням логістикою. Вони висловили готовність допомогти нам у нашій боротьбі."
 baltimare.6.d_refused:0 "На жаль, було отримано телеграму зі Сталліонграду, в якій повідомляється, що вони не бажають відправляти своїх радників в зону активних бойових дій. Вони сказали, що інші шляхи для співпраці залишаються відкритими і будуть раді надіслати радників після закінчення бойових дій, але вже це ускладнило довіру до наших передбачуваних товаришів на півночі."
 baltimare.6.a:0 "Ми цінуємо їхню допомогу."
 baltimare.6.b:0 "Їхню допомогу цінують."
 baltimare.6.c:0 "Наші «товариші» кинули нас напризволяще..."
 baltimare.7.t:0 "Друге засідання Конґресу"
 baltimare.7.d:0 "The Congress once again gathered in the city hall of Baltimare, but this time allowed its former occupant Ash Moustache to enter. He was escorted by armed militiaponies and was brought in front of the Congress to hear what his fate would be.\n   Cricket Chafer was first to speak. "Comrades, I believe we should pardon the former mayor in the name of harmony. After all, he could not have known that the lunarist occupiers would be so harsh. Perhaps he believed in their false promises out of naivete. Whatever the case, I do not believe him to be malicious. Besides, by showing mercy, we will convince doubters of our moral superiority. And, perhaps, we could even benefit from his aid. He is a well-behaved gentlecolt with diplomatic talent."\n   The congressponies began to murmur, while Ash Moustache smiled and sighed in relief.\n   After the Congress went silent, Chairpony Golden Delicious spoke next. "While Chafer's proposal is a good one, I think we should not be naive ourselves. Ash Moustache has connections both to the old harmonic regime and the tyrannical lunarists. We should not blindly trust him. Even if he means no harm to us, he can still be a figurehead for counter-revolutionary forces to rally behind. I suggest we simply banish him from the Republic. This would not only discredit the old regime, but also remove a potential collaborator from the country."\n   Ash's smile faded as the congressponies seemed to approve of this idea much more than the previous one.\n   The room went quiet when they saw Lavender Berry. He glared down at the former mayor. "Leaving this bourgeois rat alive would be a terrible, terrible mistake. If we leave him here, he will betray us and undermine us. If we banish him, he will simply flee to the Celestial supporters and form a government in exile. No. Scum like him deserve only one fate: death by firing squad."\n   Some congressponies were mortified as there had never been any such executions in Equestria. But others cheered, chanting death, and making Ash appear terrified." # (!)
 baltimare.7.a:0 "Пробачити і забути."
 baltimare.7.b:0 "Виженіть його. Йому тут не місце."
 baltimare.7.c:0 "Пристрелити виродка!"
 baltimare.8.t:0 "Прибув мер Балтимейра"
 baltimare.8.d:0 "Скинутий мер Балтимейра, Еш Мастеш, нещодавно прибув до Портленда на кораблі. Він розповів нам, що його вигнали з рідного міста нелегітимним соціалістичним конґресом. They distrusted him due to his brief collaboration with the lunarists when they occupied the city. Він зараз на шляху до Стейблсайда і запевнив нас, що розчарувався в прихильниках Найтмер Мун після того, як їхня окупація виявилася більш безжальною, ніж він очікував. Він був більш ніж радий прийти нам на допомогу, якщо ми забезпечимо його новим одягом. Тепер, коли мер перебуває під нашим контролем, [Root.GetLeader] може попросити його сформувати муніципальний уряд у вигнанні для міста Балтимейр." # (!)
 baltimare.8.a:0 "Ми скоро врятуємо Балтимейр, не хвилюйтеся."
 baltimare.9.t:0 "Балтимейр стратив свого мера"
 baltimare.9.d:0 "Надійшла новина, що радикальні соціалістичні революціонери Республіки Балтимейр публічно стратили свого скинутого мера Еша Мастеша. Принаймні, вони проявили милосердя і зробили це через розстріл. Мер був звинувачений у співпраці з місячними окупантами і визнаний винним, але це покарання видається досить суворим, особливо враховуючи, що Еш Мастеш був відомим співчутливим джентльменом.\n   Республіка Балтимейр показала своє справжнє обличчя холоднокровного вбивці, який без вагань ліквідує тих, кого вважає загрозою. Вони, очевидно, повністю відмовилися від гармонії та дружби, тому ми не повинні навіть намагатися вести з ними переговори."
 baltimare.9.a:0 "Вони заплатять за те, що зробили..."
 baltimare.10.t:0 "Підготовка запиту"
 baltimare.10.d:0 "Much to Golden Delicious' displeasure, the Congress had voted to request military aid from Stalliongrad. However, the specifics of the request had been left vague, and they now had to be decided upon with the other leading ponies of the Popular Front. "Many ponies in the trade unions are eager to fight," Golden said, "but are unable to do so because of a lack of rifles, helmets and other basic infantry equipment. Besides, that is the cheapest request, so Stalliongrad should be able to spare it."\n   Cricket Chafer appeared to disagree. "We have enough rifles and such for now, comrade. We should request more expensive artillery guns, which we have a dire lack of and struggle to acquire or produce ourselves. With them, we can safely blast our enemies from afar, giving us an advantage!"\n   Golden frowned. He felt like Cricket's personal connections with Stalliongrad meant that he believed they'd fulfill any request he'd make, no matter how expensive.\n   Lavender Berry shook his head. "Tsk, tsk. What advantage would we gain from those? Our enemies also have rifles and guns. We need to take full advantage of Stalliongrad's support and get something our foes lack completely. We must ask for planes. With the skies under our control, we can dominate the battlefield and mow down our helpless, fleeing foes from above with impunity."\n   Golden shuddered from the way Lavender said it." # (!)
 baltimare.10.a:0 "Нам потрібна техніка для нашого ополчення!"
 baltimare.10.b:0 "З великими гарматами ми знищимо реакціонерів!"
 baltimare.10.c:0 "Якщо ми будемо панувати в небі за допомогою літаків, ми отримаємо перевагу."
 baltimare.11.t:0 "Балтимейр просить обладнання"
 baltimare.11.d_bal_rifles:0 "Надійшла термінова телеграма від Робітничої республіки Балтимейр, яка втягнута у важкий конфлікт з реакціонерами. Вони ґречно просять надіслати їм гвинтівки, каски, гранати та інше піхотне спорядження, щоб вони могли зібрати більше військ для битви. Зрозуміло, що ми повинні щедро допомагати нашим товаришам, але ми повинні подумати, чи можемо ми собі це дозволити. Наші власні військові залишаються для нас найвищим пріоритетом."
 baltimare.11.d_bal_guns:0 "Надійшла термінова телеграма від Робітничої республіки Балтимейр, яка втягнута у важкий конфлікт з реакціонерами. Вони ґречно просять надіслати їм важкі гармати, яких у них зовсім не вистачає. З ними вони могли б легко знищувати своїх погано озброєних ворогів здалеку. Зрозуміло, що ми повинні щедро допомагати нашим товаришам, але ми повинні подумати, чи можемо ми собі це дозволити. Наші власні військові залишаються для нас найвищим пріоритетом."
 baltimare.11.d_bal_planes:0 "Надійшла термінова телеграма від Робітничої республіки Балтимейр, яка втягнута у важкий конфлікт з реакціонерами. Вони ґречно просять надіслати їм винищувачі, щоб забезпечити перевагу в повітрі і отримати значну перевагу над ворогами. Зрозуміло, що ми повинні щедро допомагати нашим товаришам, але ми повинні подумати, чи можемо ми собі це дозволити. Наші власні військові залишаються для нас найвищим пріоритетом."
 baltimare.11.a:0 "Звісно, негайно готуйте вантаж!"
 baltimare.11.b:0 "Ми не можемо дозволити собі зараз нічого відправляти."
 baltimare.12.t:0 "Відправлення з Петерсгуфа"
 baltimare.12.d_bal_rifles:0 "До порту Балтимейра прибула партія піхотного спорядження з ескортом, і наші робітники вже розвантажують вантаж. Сталліонград надіслав нам багато гвинтівок, касок, набоїв та багато іншого, довівши, що ми дійсно можемо довіряти їм та їхній щедрій підтримці."
 baltimare.12.d_bal_guns:0 "Вантаж із артилерійським обладнанням у супроводі прибув до порту Балтимейра, і наші працівники вже розвантажують його. Сталліонград надіслав нам багато важких гармат, мінометів, артилерійських снарядів та багато іншого, довівши, що ми дійсно можемо довіряти їм та їхній щедрій підтримці."
 baltimare.12.d_bal_planes:0 "До порту Балтимейра прибула партія винищувачів у супроводі ескорту, і наші працівники вже розвантажують вантаж. Сталліонград надіслав нам багато високоякісних літаків, нещодавно виготовлених на їхніх заводах, доводячи, що ми дійсно можемо довіряти їм та їхній щедрій підтримці."
 baltimare.12.a:0 "Дякую вам, товариші!"
 baltimare.13.t:0 "Від Сталліонграду допомоги немає"
 baltimare.13.d:0 "Ми отримали відповідь на телеграму, яку ми відправили до Сталліонграда, і вона неприємна. Очевидно, Сталліонград, незважаючи на численні військові заводи і велику, порівняно з нашою, армію, не може "дозволити собі" надіслати будь-яке обладнання, яке ми просили. Над тими, хто запропонував цю ідею, зараз знущаються в Конґресі."
 baltimare.13.a:0 "Як комуністи можуть бути такими ж жадібними, як капіталісти?!"
 baltimare.14.t:0 "Геть принцес!"
 baltimare.14.d:0 ""No more idols, the pedestals shall fall!"\n   Slogans such as this echoed on the streets of Baltimare as a mass rally against monarchism was organized by the Popular Front. Propaganda about the corruption, incompetence and even cruelty of Celestia, Luna, Cadance and Twilight was blasted with loudspeakers and any statues of alicorns toppled and defaced. Grafitti art of an obese Celestia gorging on cake soon decorated walls and Luna - who had now become Nightmare Moon - was referred to as "Lunatic". The largest statue, depicting Celestia and standing in the central square, was blindfolded by a pegasus, then theatrically "executed" by a firing squad, and finally detonated with dynamite.\n   Other ponies looked in concern from the sidelines. For their entire lives, for countless generations, alicorn rule was all they had ever known, so such blatant and shameless mockery of the princesses was shocking to them. But some of the ponies realized that the entire civil war was the responsibility of the princesses. Without them, there would've been no such conflict. Yet here, these revolutionaries proposed an alternative: a future without princesses. An Equestria ruled by the ponies themselves, like in the distant past when Equestria had first been established by the three tribes.\n   Then there were those who were fanatically loyal to the princesses. The rally lured them out of their hiding places to organize a counter-protest. "Princess Celestia did nothing wrong," they chanted, "Luna did not become Nightmare Moon, do not fall for it! Princess Twilight will save the day, like always."\n   Without any warning, a group of masked ponies charged at the monarchists and beat them up violently. The counter-protest was dispersed as ponies fled in terror. Then, the masked ponies disappeared. No one knew if they had been anarchists or members of the IES." # (!)
 baltimare.14.a:0 "Кінець монархізму!"
 baltimare.15.t:0 "Антимонархічний мітинґ у Балтимейрі"
 baltimare.15.d:0 "До нас доходять новини про незвичайну подію в Балтимейрі, коли прихильники принцеси Селестії та Найтмер Мун в жаху тікають з міста. Ліві сили міста організували великий захід, повністю присвячений дискредитації інституту монархії, висміюванню принцес і побиттю тих поні, які залишилися їм вірними. Ґрафіті із зображенням огрядної Селестії, що об'їдається тортом, прикрашали стіни, а Луну називали «лунатичкою». Будь-які пам'ятники із зображенням принцес були повалені та спаплюжені. Найцікавішим прикладом була театралізована «страта» та подальше знесення великої статуї принцеси Селестії, що стояла на центральній площі Балтимейра."
 baltimare.15.a:0 "Вони заблудли..."
 baltimare.16.t:0 "Чистка"
 baltimare.16.d:0 "Nopony really knew who fired the first shot. There had been no official order given by the Congress, or by any military leader. It's possible a mixture of fear, paranoia, desire for revenge, built-up anger, distrust and revolutionary fervour drove ponies to act the way they did. In any case, the violence was blatantly against the values of friendship and harmony which had so recently been abandoned in Baltimare.\n   Rumours of a counter-revolutionary fifth column launched a wave of disorganized arrests by militaponies and IES-aligned law enforcement officers. These arrests then quickly turned into sudden executions without trial. Former landowners, businessponies, factory bosses, monarchists, lunarists and native priests were all suspects, even if they had done nothing, and were sent to internment camps. Temples of the natives in Kululu Forest were looted and burned down, as the "sun god" of the natives was seen as a ridiculous culmination of treacherous and naive Celestia-worship.\n   When the death toll rose to thousands and news arrived in Congress, Chairpony Golden Delicious urged for the violence to cease at once. Few obeyed immediately. Cricket Chafer pleaded to Lavender Berry, and soon enough IES cracked down on any militiaponies who were acting violently or carrying out unauthorized executions. Thousands of members of the Popular Front were thus arrested as well." # (!)
 baltimare.16.a:0 "...Що ми наробили?"
 baltimare.17.t:0 "Червоний терор у Балтимейрі"
 baltimare.17.d:0 "More news came from Baltimare as word spread about a violent crackdown on suspected "counter-revolutionaries". Armed militiaponies arrested former landowners, businessponies, factory bosses, monarchists, lunarists and native priests, sending them to internment camps and executing thousands of them without any sort of legal trial. Temples of the natives in Kululu Forest were looted and burned down as well. While Chairpony Golden Delicious ordered for the violence to stop, few obeyed his order before the violent militiaponies were themselves arrested as well.\n   Baltimare has shown its true face as a bloodthirsty regime bent on violence, trying to overturn the old order no matter the cost. They can no longer claim any kind of moral high ground against us. It is our duty to march to the city and liberate it from these leftist loonies." # (!)
 baltimare.17.a:0 "Чудовиська!"
 baltimare.18.t:0 "Репресії проти анархістів"
 baltimare.18.d:0 "Today PON and IES managed to push a controversial piece of legislation through the Congress: all private arms were now forbidden, and a powerful "non-political" police force would be formed, separate from trade union militias. This made representatives of TER so outraged that they marched out of the city hall in protest, but there was nothing they could do about it.\n   The law was immediately enforced on the next day. Lavender Berry became the head of the newly re-established Baltimare Police which went to work, disarming anarchists and syndicalists away from the frontline. Understandably, many of them feared that this was but the first step, and that the next step would be the dismantling of all communes and industrial committees as well as the nationalization of all remaining collectives, so resistance to the disarmament was fierce. Fighting broke out in Baltimare itself as anarchists refused to give up their weapons. Golden Delicious demanded the immediate removal of Lavender Berry from office, while Cricket Chafer tried to broker a ceasefire between the two sides, fearing it would escalate, spread and tear their young nation in half.\n   After several days of chaos, the Congress made an official statement saying that any violence against the police would be considered treason, punishable by death. Reluctantly, the anarcho-syndicalists lowered their weapons in response and were arrested. Soon Golden Delicious realized most of his supporters now sat behind bars." # (!)
 baltimare.18.a:0 "Щасливої дороги!"
 baltimare.19.t:0 "Знеславлення Конґресу"
 baltimare.19.d:0 "Today TER, with the official support of CAN, managed to push a controversial piece of legislation through the Congress: the Republic would be decentralized, delegating many responsibilities and powers of the Congress to lower levels of government, such as local municipalities and communes. This made representatives of PON and IES so outraged that they marched out of the city hall in protest, but there was nothing they could do about it.\n   The law immediately went to effect and communes elected their own councils. They were now responsible for their own legislation, healthcare, law enforcement, military, education and so on. In fact, the Congress was left with so little power that most communists no longer saw any reason to stay in it and resigned. Several protests to this change arrived from Stalliongrad, which feared that the revolution was now critically endangered. Fresh militiapony recruits found this reaction strange as they joined the reserves of Baltimare, ready to take up arms and defend their homes more eagerly than ever before." # (!)
 baltimare.19.a:0 "Кому взагалі потрібна держава?"
 baltimare.20.t:0 "Реакціонерів розгромлено"
 baltimare.20.d:0 "Червоні прапори тепер майорять у Стейблсайді, Аякачтлі та Теночтітлана. Армії контрреволюційних і реакційних ворогів лежать розкидані і розбиті, вони тікають вглиб джунглів, де мають намір продовжити свій хибний опір. Робітники по всьому півострову радіють, що час страждань і конфлікту нарешті добігає кінця. Вітання надходять від усіх соціалістичних партій світу, а комуністичні країни поспішають визнати нашу країну легітимною. Сталліонград вже відкриває посольство в Балтимейрі. Тимчасовий Конґрес провів своє останнє засідання, на якому формально саморозпустився і сформував національний Народний парламент, який стане його наступником. Незабаром відбудуться вибори.\n   Але мир не буде тривати вічно. Безумовно, нам доведеться боротися за нашу свободу і незалежність, оскільки контрреволюційні ідеї продовжують переважати за кордоном. Ми повинні готуватися, поки можемо, і відновлювати втрачені сили, щоб бути готовими прийняти бурю, коли вона неминуче прийде."
 baltimare.20.a:0 "Хай живе революція!"
 baltimare.21.t:0 "Грифони відлітають"
 baltimare.21.d:0 "Синдикалісти Сікамеону повернулися з фронту до гавані в Балтимейр. Із тисячі прибулих із-за кордону 612-еро готуються до від'їзду додому, серед них Хорхе Орельяна, який побував у бою. Він брав участь у відбитті нічної атаки фестралів, гнався за найманцем із багнетом і підірвав гранатою окоп селестійських лоялістів. На жаль, наприкінці війни був поранений кулею снайпера. Хоча він зміг продовжувати виконувати обов'язки командира, він більше не воював особисто, і тепер лікується у самої Мейдж Медоубрук.\n   Він пообіцяв Ґолден Делішесу, який став його добрим другом під час війни, що напише роман, заснований на його досвіді, поки він чекає повного загоєння своєї рани."
 baltimare.21.a:0 "Прощавайте, товариші."
 baltimare.22.t:0 "Нова республіка"
 baltimare.22.d:0 "Сьогодні тимчасовий уряд проголосив створення Південно-східної соціалістичної республіки, єдиної законної держави на півострові. Хоча дехто сприйняв цю новину зі скептицизмом і песимізмом, більшість міського населення на південному сході щиро вітає революцію. Умови праці під час війни в більшості місць були нестерпними, тому обіцянки робітників щодо власності на виробництво та скорочення робочого дня порадували багатьох. По всьому півострову вже створюються нові демократичні робітничі ради і комітети.\n   Однак, здебільшого неприборкана сільська місцевість залишається зовсім іншою справою. Місцеві племена, які не знають соціалізму, сприймають його як іноземну загрозу, що прагне викорінити їхній спосіб життя. Фестрали, яким не довіряють балтимейрці і яких переслідують у багатьох містах, готуються вести партизанську війну в джунглях. Багато еквестрійських поселенців, які живуть на фермах, особливо поблизу Стейблсайда, з нетерпінням чекають на земельну реформу, але ті, хто володіє найбільшою кількістю землі, бояться, що її у них заберуть.\n   Зрозуміло, що потрібно ще багато працювати, щоб все населення перейшло на наш бік, але це тільки початок."
 baltimare.22.a:0 "Хай живе Республіка!"
 baltimare.23.t:0 "Несподівана подія"
 baltimare.23.d:0 "In preparation for election day, voting ballots had been prepared across the country and political campaigning had lasted for weeks. But the anarchists of CAN had different ideas.\n   Masked militants raided voting stations across the country, burned ballot papers and vandalized government buildings which had only recently been occupied by workers' councils. The transitional government immediately ordered these militants to be stopped, but much to its dismay, the armed forces supported their actions instead. When the anarchists realized no one would stop them, their actions only escalated. They spread out from city to city, overthrowing any nascent governmental institutions that had been established in recent weeks, and made their way towards Baltimare. There, a small battle was fought before former Chairpony and leader of TER Golden Delicious intervened and ordered his loyal militiaponies to stand down and end the bloodshed. He convinced Cricket Chafer to flee the country and entered negotiations with the anarchists.\n   Several days later, an agreement was made and the transitional government was disbanded. The Southeast Equestrian Socialist Republic turned out to be stillborn as it was formally dismantled. Any remaining military units had to either join the anarchist militias or give up their weapons. The rule of statist government in the southeast had decisively ended." # (!)
 baltimare.23.a:0 "Влада породжує паразитів. Хай живе анархія!"
 baltimare.24.t:0 "Несподівана подія"
 baltimare.24.d:0 "In preparation for election day, voting ballots had been prepared across the country and Golden Delicious was holding a speech in Stableside.\n   "My fellow ponies, I know the revolution is a new arrival in this city. But I am here to assure you that it is nothing to be afraid of. In fact, it is to be welcomed warmly. If I get elected as the new chairpony, I will have the best interests of the oppressed urban working class in mind. Life has been rough, and I am sure the Celestial loyalists made many of you work hard for little pay, but I promise you all a better future. A future free of exploitation, free of violence-"\n   At that very moment, a loud gunshot echoed in the street and Golden Delicious collapsed on the ground. The listening crowd of ponies screamed and scattered in fear even as armed militiaponies started a hunt for the assassin.\n   On the following day, Golden Delicious, the hero of the revolution, was pronounced dead at the Stableside hospital. Now Cricket Chafer was confident of winning the elections and believed PON would gain control of the People's Parliament, too. He invited his good friend, Lavender Berry, to share cups of maize beer with him. "Ah, it is a shame what happened to Golden," he said to Lavender, "but he was the main contender in the elections, too. So, I can't exactly call it misfortune..."\n   Lavender said nothing and did not touch his drink.\n   "...Say, do you happen to know who shot him? Have you conducted an investigation yet?"\n   "I know who did it," he replied as a matter of fact. "And I have been told the same will happen to you, as well. Unless, of course, you step down from politics."\n   Cricket stared at him. He gulped, then tried to respond. "I... of course, I understand, haha... thanks for the advice, friend! I'll just... retire to my maize farm back in Saltlickingham, hehe..." He emptied his entire cup of maize beer at once and left.\n   What followed was PON's withdrawal from the elections, leaving IES as the only party that could be voted for, and Lavender Berry as the only candidate for chairpony. Afterwards almost all member of TER were arrested, suspected of participating in the murder of Golden Delicious, and Lavender Berry assumed emergency powers which he claimed were needed to ensure the guilty were found and put to justice." # (!)
 baltimare.24.a:0 "...я впевнений, що все буде добре."
 baltimare.25.t:0 "Вибори [GetYear] року"
 baltimare.25.d:0 "In preparation for election day, voting ballots had been prepared across the country. Due to the country needing all kinds of leaders on all levels, parliamentary elections and elections for the chairpony were held simultaneously. Naturally, only approved socialist candidates were allowed to run for office. Two of the most popular candidates were Golden Delicious of TER and Cricket Chafer of PON, who were having a public debate in Baltimare to sway the working class voters.\n   "The trade unions have worked tirelessly for years to protect Equestrian workers from exploitation," said Golden Delicious, "so you can trust us to continue doing so. We believe in devolution of power, in decentralized economic planning, and in workplace democracy. Our plan for the southeast is ambitious, but with your wholehearted support, it can succeed."\n   "Say, how's that one relative of yours doing?" Cricket Chafer asked. "Applejack, I believe? One of the Princess' pets?"\n   The crowd had a mixed reaction of amusement and shock as Golden stared at Cricket.\n   The bald pony laughed heartily in response. "I'm joking, I'm joking. Nothing wrong with having some family connections! Anyways, your promises sound great and all, but what I promise is a model that works. A model based on both Stalliongrad and Equestria. Taking the best parts from both and mixing them together. And of course, I promise you all this!" He proudly raised an ear of maize high into the air, admiring it. "Maize! Enough of it to feed everypony. No one will go hungry if you vote for me! Not in the cities, and not in the countryside."\n   The speeches continued and soon enough, voting took place and the ponies decided who would lead the newborn nation for the near future." # (!)
 baltimare.25.a:0 "Переможець — Ґолден Делішес!"
 baltimare.25.b:0 "Переможець — свиноподібний поні!"
 baltimare.26.t:0 "«Данина Балтимейру» Хорхе Орельяни"
 baltimare.26.d:0 "[This.GetNewspaperHeader]Сьогодні в Сікамеоні вийшов новий роман Хорхе Орельяни, який брав участь у Південно-Східній еквестрійській громадянській війні на боці Республіки Балтимейр. Книга є особистою розповіддю про його досвід під час конфлікту і містить багато деталей не лише про бойові дії, але й про революційне суспільство, створене соціалістами-лібертаріанцями з КАБ-ПЕР, яке, за його словами, було справді таким, де «робітничий клас був у сідлі» та де панували свобода і рівність. Однак він критикує комуністів НОН та ВВБ за те, що вони пішли на поступки реакціонерам, покладалися на іноземну підтримку і мало не зрадили революцію. Книга отримала змішані відгуки і була заборонена в кількох країнах."
 baltimare.26.a:0 "Добре написано, товаришу!"
 baltimare.26.b:0 "Спалити всі примірники цієї маячні."
 baltimare.26.c:0 "Цікаво, хоч і суперечливо."
 baltimare.27.t:0 "«1048» Хорхе Орельяни"
 baltimare.27.d:0 "[This.GetNewspaperHeader]Сьогодні в Сікамеоні вийшов новий роман, написаний Хорхе Орельяною, який брав участь у громадянській війні в Південно-Східній Еквестрії на боці Республіки Балтимейр. Книга є вигаданою і описує антиутопічне суспільство, яке існує в 1048 році, просто відоме як Держава. Вона контролює весь Еквус, тоді як дві інші наддержави контролюють Грифонію та Зебрику. Усі три перебувають у вічній війні, а Держава, хоча номінально соціалістична, є тоталітарним урядом, який використовує магію для масштабного стеження, пропаганди та промивання мізків. Партія MARESOC із Нового Мейрленду подала на нього до суду за наклеп, хоча він стверджує, що не знав про існування цієї партії, а натомість написав роман на основі свого досвіду в Республіці Балтимейр, де НОН та ВВБ впроваджували дедалі більш авторитарну політику."
 baltimare.27.a:0 "«Держава» зовсім не соціалістична, це справді наклеп!"
 baltimare.27.b:0 "«Держава» — це те, чим стають усі соціалістичні країни."
 baltimare.27.c:0 "Цікаво, але суперечливо."
 baltimare.28.t:0 "Наші бійці повертаються додому"
 baltimare.28.d:0 "Конфлікт на південному сході Еквусу нарешті завершився. Наші добровольці, або, принаймні, ті, хто ще живий і здоровий, повернулися додому через океан з Балтимеру. Багато з них не вижили, але тих, хто вижив, ліві в нашій країні святкують як героїв.\n   Хорхе Орельяна брав участь у бойових діях і був важко поранений, але вижив. Він сказав, що тепер планує написати роман, заснований на його досвіді під час війни."
 baltimare.28.a:0 "Ми з нетерпінням чекаємо на те, що він напише."
 baltimare.29.t:0 "Полювання"
 baltimare.29.d:0 "Лунаристи вважали, що зможуть ефективно протистояти соціалістам-переможцям, ведучи партизанську війну зі своїх схованок у джунглях та гірських печер. Але вони не знали, що анархістські бойовики самі були компетентні в асиметричній війні, і що кілька вождів нейуа зголосилися допомогти їм проти фестралів, їхніх смертельних ворогів.\n   За допомогою і під керівництвом аборигенів загони анархістських бойовиків увійшли в джунглі, і почалася смертельна гра в кота і мишу. Обидві сторони намагалися використовувати засідки, пастки і снайперів, і єдина різниця між тактикою двох сторін полягала в тому, що анархісти воювали вдень, а кажани — вночі.\n   Багато крові пролилося з обох сторін, але врешті-решт Старс Вірл, фактична лідерка лунаристів, загинула під час несподіваного нападу. Керівна структура кажанів почала розвалюватися, оскільки вони покладалися на жорстку ієрархію, яка керувала ними, але у анархістів таких проблем не було. Лунаристи не знайшли високопоставлених лідерів, на яких можна було б націлитися, не знайшли ієрархії, яку можна було б зруйнувати. Зрештою, їх просто не було.\n   Незадовго більша частина опору зійшла нанівець, а тисячі воїнів потрапили в полон. Племена тубільців святкували і хвалили анархістів за їхні доблесні зусилля. Тоді беззахисні мирні жителі кажанів масово втекли з південного сходу, їхні домівки були розграбовані і спалені анархістами, які вважали їх прихильниками Місяця і монархічними покидьками. Десятки тисяч, якщо не сотні тисяч, перетнули кордон, взявши з собою все, що могли. Багато хто загинув дорогою."
 baltimare.29.a:0 "Молодці, товариші."
 baltimare.30.t:0 "Астланська угода"
 baltimare.30.d:0 "Поні всіх місцевих племен вирушили до древнього, забутого храму посеред півострова, щоб зустрітися з обраними представниками південно-східних анархічних комун. Вони були розділені на чотири групи: нейуа, цінакатль, мейрая та кольтеків. Зустрічі проводилися з кожним окремо, але домовлялися про схожі речі:\n   анархісти поважатимуть право тубільців на самовизначення й автономію, а натомість племена погодяться надсилати представників на конфедеративний конґрес, коли б він не був скликаний, допомагати в обороні Вільного Південного Сходу від реакційних загарбників і розглянути питання про розширену колективізацію їхніх ресурсів. Що саме це означало, залишалося незрозумілим, оскільки тубільці вже не мали приватної власності, а натомість ґрунтувалися на родинних і кланових зв'язках. Тому племена з радістю погодилися."
 baltimare.30.a: "Перемога антиколоніалізму й антиімперіалізму!"
 baltimare.31.t:0 "Війна з лунаризмом"
 baltimare.31.d:0 "Golden Delicious looked as militaponies dragged so-called "moonspeakers" out of a temple. The building had been dedicated to moon worship, but this had been turned into fanatical praise of the mad alicorn Nightmare Moon. Everything valuable inside was also brought outside. It would be redistributed to the poor folks in the village. The temple itself would be turned into a convenient warehouse.\n   One of the moonspeakers saw Golden and recognized him. "You! The leader of the red dogs. Why are you doing this?!"\n   He looked back at her with ever so slight disgust in his expression. "After all the bad things you've done, you wonder why justice is being enacted upon you?"\n   "You call this justice? What laws have I broken? I demand fair trial! There is no justice in blind collective punishment."\n   He shook his head. "You know so little of class warfare. Imagine a crate full of apples, and some of them are rotten. These rotten apples make other ones spoil faster. What must be done is picking out all the bad apples from the bunch, as quickly as possible, to save the rest."\n   The moonspeaker stared at him with a mixture of confusion and anger. But before she could respond, the militiaponies pushed her forward and escorted her away.\n   As Golden glared at her, another militiapony galloped to him. "Comrade Delicious! News from the front. Operation Red Moon is a success. Both Stars Whirl and Starry Glory have been killed."\n   The chairpony's mood improved in an instant and he sighed in relief. "Those were the worst apples of them all."" # (!)
 baltimare.31.a:0 "Не було втрачено нічого цінного."
 baltimare.32.t: "Мир із тубільцями"
 baltimare.32.d:0 "A group of representatives of the Neighua, the Coltecs, the Mareyans, the Tzinacatl and other smaller native groups had gathered before Golden Delicious. After several moons of violent fighting, the chairpony had offered a ceasefire and invited the natives to negotiate, on the condition that the negotiators would be chosen from the ranks of the commonfolk. After all, the Republic refused to recognize the chiefs' legitimacy.\n   After formal greetings and some discussion (with the help of a native translator), one of them spoke: "It is tragic what you did to Chief Maita. He was a good stallion."\n   Golden inhaled deeply. "I apologize, but we did what we must. The chiefs, especially the ones resisting us, have to be dealt with. You must understand that they are petty kings who hoard surplus wealth. Your lives would be better without them."\n   The natives looked at each other, unconvinced.\n   "I offer you peace on the condition that all remaining chiefs are overthrown, and the priesthoods abolished. Then we will leave you entirely alone. You are not forced to participate in our revolution beyond this."\n   "This is a difficult offer to accept. Who will lead us if not our chiefs and priests, who have provided us guidance since time immemorial?"\n   "You will guide yourselves. Have confidence. The native worker deserves to be empowered just as much as the Equestrian worker. Have the tribes elect leaders much like you, the representatives, were elected. Vote together on matters that affect the entire tribe."\n   Some of the natives remained hesitant. But one of them said "We grow weary of war, and believe enough blood has been shed. This price is not a high one to pay for precious peace, is it not?" This seemed to convince more of them, and one by one they all agreed to Golden's proposal." # (!)
 baltimare.32.a: "Нарешті мир."
 baltimare.33.t:0 "Загальний страйк!"
 baltimare.33.d:0 "Уже кілька тижнів надходять повідомлення про те, що робітники нашої країни організовують вражаюче великий страйк. Коли він нарешті відбувся, його розмір виявився навіть більшим, ніж очікувалося, і в ньому взяли участь працівники майже всіх галузей економіки. Очевидно, що робітники тісно співпрацювали і мали спільний план, а це означає, що до цього були залучені профспілки, легальні чи ні. Наша поліція також підозрює, що була іноземна участь, і всі сліди вказують на державу [BAL.GetNameDef], де профспілкова організація ПЕР контролює ситуацію.\n   Питання полягає в тому, що ми робимо з цією справою? Робітники вимагають таких радикальних реформ, що ми ніколи не зможемо виконати всі їхні вимоги, але, можливо, ми можемо піти на деякі поступки."
 baltimare.33.a:0 "Давати нечіткі обіцянки реформ."
 baltimare.33.b:0 "Удар по джерелу розбіжностей!"
 baltimare.34.t:0 "Повідомлення від держави [From.GetNameDef]"
 baltimare.34.d:0 "[From.GetNameDefCap] відправила посланця на кораблі з повідомленням. У ньому сказано, що [From.GetLeader] бажає підписати офіційний договір про союз між нашими двома країнами і хоче заснувати посольство в місті [Root.Capital.GetName]. Він каже, що працівники Еквусу повинні триматися разом в ім'я солідарності, щоб вижити в ці неспокійні часи.\n   [From.GetLeader] в даний час контролює країну після виборів і проводить реформи, які схожі на нашу політику. У нас дійсно багато спільного, але, можливо, альянс в кінцевому підсумку виявиться тягарем — або небезпекою."
 baltimare.34.a:0 "Ми повинні триматися разом!"
 baltimare.34.b:0 "Ми можемо зробити це самостійно."
 baltimare.35.t:0 "[From.GetName] погоджується"
 baltimare.35.d:0 "[From.GetLeader] тепло прийняв нашого посланця. Після тривалих переговорів вони погодилися підписати офіційний союзний договір, що встановлює тісну дружбу між нашими народами. [Root.GetLeader] радіє, почувши цю новину. Нехай наш союз триватиме тисячу років!"
 baltimare.35.a:0 "Працівники Еквусу, єднайтеся!"
 baltimare.36.t:0 "[From.GetName] відмовляється"
 baltimare.36.d:0 "[From.GetLeader] прийняв нашого посланця тепло. Але після тривалих переговорів вони відмовилися підписати офіційний союзний договір, який би встановив тісну дружбу між нашими народами. Вони сказали, що їхні збройні сили абсолютно не готові допомагати нам, що ми потенційно будемо більше тягарем, і що вони мало що виграють від союзу. Це був довгий список відмовок, який давав зрозуміти, що вони не хотіли відмовлятися, але врешті-решт все одно вирішили це зробити."
 baltimare.36.a:0 "А я думав, що ми були товаришами?"
 baltimare.37.t:0 "Творити мир, а не війну"
 baltimare.37.d:0 "Cricket Chafer spoke on public radio, expecting the lunarists to listen to him. "I, the Chairpony of [Root.GetNameDef], wish to extend an olive branch of peace to all those still enacting acts of violence against our rightful rule. The time has come to bury the hatchet and end this senseless fighting. Light Narrative, if you are listening to me, I invite you to come and meet me in person. Perhaps we can come to an agreement. I look forward to talking with you."\n   Not long after, Light Narrative and Cricket Chafer met behind closed doors. After a while of exchanging pleasantries and sharing some drinks, Light Narrative said: "Alright, I think your idea is good. A party organization that combines both socialist and lunarist values and is allowed to join the People's Parliament. I think I can convince Stars Whirl to disarm afterwards. Just one issue."\n   Cricket Chafer put down his mug of maize beer and raised an eye brow. "And what would that be?"\n   "Starry Glory. The most fanatical figurehead of the lunarists. If he's not removed out of the picture, peace will remain a fantasy."\n   The chairpony frowned and rubbed his chin with his hoof. Then, he smiled. "I think he won't be an issue for long. My trustworthy comrade, Lavender Berry, will take care of it."\n   Less than a week later, news arrived that Starry Glory had been shot and stabbed to death by an unknown assailant. Without his fiery rhetoric, the resistance faltered, and Light Narrative swooped in, telling stories of how good their lives would be in a socialist society." # (!)
 baltimare.37.a: "Одною проблемою менше."
 baltimare.38.t:0 "Indigenization" # (!)
 baltimare.38.d:0 "While Cricket Chafer had no interest in negotiating with the despotic native chiefs, he needed to convince the natives themselves to end their violent resistance. Thus, in collaboration with pro-communist natives, he proclaimed the establishment of four native-ruled socialist states within [Root.GetNameDef]: the Neighua State, the Coltec State, the Mareyan State, and Tzinacatlian State. Other, smaller native groups would gain local autonomy on a lower level of government within larger states. These federated entities would receive plentiful support from the central government.\n   Most importantly, these new native-run local governments would implement land reform, open schools that taught native languages, and start various infrastructure projects. This made them popular in the eyes of many native commoners, who abandoned their chieftains in the jungles in order to have access to better services. State propaganda also played a prominent role, promising a better life for all natives that ended their resistance and joined these newborn states." # (!)
 baltimare.38.a: "Перемога без жодного пострілу."
 baltimare.39.t:0 "Велика пожежа"
 baltimare.39.d:0 "Десятки літаків, які раніше використовувалися для перевезення пошти, навчання пілотів або в сільському господарстві, були реквізовані державою і перепрофільовані в аеропорту Балтимейру. Тисячі каністр з напалмом, термітом та іншими запалювальними речовинами були підготовлені на хімічних заводах або придбані з-за кордону. Літаки мали використати їх, щоб покінчити з місячним опором раз і назавжди.\n   Вітряний флот вирушив разом вдень, коли бійці опору на Фестралії спали. Потім вони випустили свій смертоносний вантаж і підпалили джунглі під собою. Запалювальні бомби були скинуті на всі виявлені та підозрювані бази опору. У великому спалаху вони розривалися, крики вмираючих заглушалися несамовитим пекучим полум'ям.\n   Таких ударів було завдано багато разів по всьому півострову. Їхній основний ефект був психологічним, і справді, багато бойовиків незабаром здавалися, побачивши долю жертв пожеж.\n   Сотні або навіть тисячі гектарів джунглів були спалені дотла, і жертв серед цивільного населення уникнути не вдалося. Лавендер Беррі розпорядився перетворити багаті на попіл землі на ріллю, яка потім могла б використовуватися фермерами для виробництва продуктів харчування. Залишки обвуглених стел, звісно, потрібно було б спочатку розчистити."
 baltimare.39.a:0 "Це виявилося ефективним."
 baltimare.40.t:0 "Кричущі джунглі"
 baltimare.40.d:0 "Армія держави готувалася до похмурої, але необхідної місії: придушити опір незгодних тубільців, націоналізувати їхні землі та майно і забезпечити їхнє підкорення директивам уряду. Щоб забезпечити виконання цього завдання, солдатам радили бути безжальними і годували їх великою кількістю пропаганди, яка зображувала тубільців, які опираються, кровожерливими реакціонерами, які займаються канібалізмом і приносять в жертву поні.\n   Кожне вогнище опору і кожне тубільне село було націлене на попереджувальне бомбардування напалмом або термітом. Якщо вони не здавалися і не погоджувалися на негайну інтеграцію в державу, армія атакувала з вогнеметів і гвинтівок і систематично вистежувала незгодних. Такий метод систематично застосовувався від регіону до регіону, сотні сіл були знищені, а ще сотні успішно змушені були зігнутися. Лояльність забезпечувалася взяттям заручників і роззброєнням місцевих жителів.\n   У багатьох місцях місцеві жителі давали відсіч, використовуючи або вкрадену зброю, або саморобні грубі луки і списи. Жертв не вдалося уникнути, але тубільці були дезорганізовані і переважали чисельно, і мало що могли зробити проти вогню, який поглинав їхні рідні джунглі.\n   Кількість загиблих була великою, але після того, як дим розвіявся, настало затишшя. Нарешті на південному сході настав мир."
 baltimare.40.a:0 "Необхідний акт."
 baltimare.41.t:0 "Барабани війни"
 baltimare.41.d:0 "Однієї ночі в джунглях почало лунати звідусіль. Барабани, що безупинно били в повільному та рівномірному ритмі. Не минуло багато часу, як були мобілізовані патрулі, щоб знайти джерело цього несанкціонованого шуму, який вимагав дозволу від Міністерства музики. Але коли вони наближалися до джерела звуків, вони зникали, щоб з'явитися ще далі. Незабаром патрулі здалися.\n   Тоді барабани били ще несамовитіше. З кожним днем мир наставав все швидше. Звуки ставали гучнішими і численнішими. Але барабанщики залишалися прихованими і відчуженими. Солдати дедалі більше нервували.\n   Тоді вони почали зникати один за одним.\n   Незадовго солдати залишили свої пости, коли їхні товариші пропали безвісти під час патрулювання і вночі. Проте товариш Беррі був незадоволений і наказав розстрілювати дезертирів на місці, а в джунглі відправляв все більше і більше солдатів. Він знову почав готувати свої напалмові бомбардувальники, щоб швидко впоратися з цією неприємністю.\n   Приходили повідомлення про підірвані літаки і розграбовані арсенали. Вибухи відлунювали поблизу Балтимейру, коли склади з термітом і напалмом вибухали без чіткої причини. Беррі не знав, що це був лише початок.\n   Наступного дня почалася війна. Орди розлючених тубільців, поні і фестрали, заляпані кров'ю принесених у жертву солдатів, змели невеликі осередки опору. Не встигли мобілізувати армію, як половина півострова опинилася під контролем дикунів. Нарешті з'явився їхній вождь. Ауїсотль, Син Сонця і Місяця, Обіцяний. Вбивця тиранів."
 baltimare.41.a:0 "Ми повинні розчавити цих дисидентів негайно!"
 baltimare.41.b:0 "Смерть деспоту!"
 baltimare.42.t:0 "Південно-східне повстання"
 baltimare.42.d:0 "[This.GetNewspaperHeader]Лавендер Беррі, голова [BAL.GetNameDef], встановила справжнє панування терору в Південно-Східній Еквестрії, здійснюючи невимовні акти проти місцевого корінного і приїжджого населення. Зараз надходять непевні повідомлення про те, що розлючені аборигени і поні-кажани об'єдналися навколо одного лідера на ім'я Ауїсотль і почали широкомасштабне повстання. Очевидці стверджують, що тубільці вдаються до живих жертвоприношень поні та інших жахливих дій, щоб заслужити прихильність своїх богів, але це може бути перебільшенням. Поки що невідомо, чи зможуть повстанці повалити авторитарний уряд партії ВВБ."
 baltimare.42.a:0 "Чи варто підтримувати Беррі? Напевно, ні..."
 baltimare.42.b:0 "Розбийте їх, мої хоробрі солдати!"
 baltimare.42.c:0 "А за кого взагалі вболівати?"
 #baltimare.43.t:0 "ПССР просить інвестицій"
 #baltimare.43.d:0 "До [Root.Capital.GetName] надійшло комюніке від [From.GetLeader]. Він каже, що південний схід спустошений після жорстокої війни, і офіційно просить нас надіслати їм промислове обладнання та кошти для підтримки їхньої хворої економіки, обіцяючи швидке зростання і відновлення, якщо ми це зробимо. Він стверджує, що в наших інтересах мати сильного союзника на півдні. В обмін на це ПССР надасть нам частину свого річного виробництва каучуку, ресурсу, якого у нас дуже мало.\n\nЯк же ми відповімо нашим колегам-революціонерам?"
 #baltimare.43.a:0 "Звісно, ми допоможемо нашим товаришам!"
 #baltimare.43.b:0 "Ми не можемо собі цього дозволити."
 #baltimare.44.t:0 "Сталіноград погоджується інвестувати"
 #baltimare.44.d:0 "Надійшло повідомлення від генсека [From.GetLeader] зі Сталліонграда. Влада каже, що Сталліонград з радістю зробить все можливе, щоб допомогти своїм союзникам на Півдні, щоб ми могли процвітати разом і розвивати нашу дружбу далі. Вже відправлені кораблі з промисловим обладнанням та коштами, які нам вкрай необхідні. Чейфер вже готує документи, які дозволять Сталінограду отримати частину нашого каучукового виробництва. Співпраця виявляється дуже вигідною для нас обох."
 #baltimare.44.a:0 "Вперед до світлого майбутнього, товариші!"
 #baltimare.45.t:0 "Сталліонград не може інвестувати"
 #baltimare.45.d:0 "Надійшло повідомлення від генсека [From.GetLeader] зі Сталліонграда. Влада каже, що Сталліонград не може дозволити собі нічого відправити ні в даний момент, ні в найближчому майбутньому, а можливо, і в далекому майбутньому. Більше нічого в повідомленні немає. Це схоже на холодну зраду з боку тих, кого ми вважали своїми товаришами."
 #baltimare.45.a:0 "Вони діють більше як грифони, ніж комуністи..."
 baltimare.46.t: "Refugees From The Southeast" # (!)
 baltimare.46.d: "In recent months the anarchist rabble of Southeastern Equestria have cracked down on lunarist resistance, and unfortuantely our brave general Stars Whirl fell in battle while bravely fighting against the rebel scum. The last remnants of resistance were destroyed and thousands of lunar loyalists were taken prisoner.\n\nFollowing this disaster, things got worse as the anarchists attacked suspected lunar loyalists, driving them out of their homes and calling them monarchist filth. Tens of thousands of refugess have now been pouring across the border, seeking refuge away from the anarchy and chaos of the southeast. It is clear the criminals must be brought to justice as soon as possible and order restored once and for all." #Done
 baltimare.46.a: "Anarchist fools."
 baltimare.48.t: "Mango Province Lost"
 baltimare.48.d: "Reports have arrived that Mango Province, located in southeastern Equestria, has been seized by armed militiaponies affiliated with the Baltimare Republic. This daring operation was possible because we had no military units in the area to defend it. While Mango Province had little value to us strategically, Baltimare will be able to use it to strike their enemies from the north."
 baltimare.48.a: "We'll retake it soon enough."
 baltimare.49.t: "Prey"
 baltimare.49.d: "Mage Meadowbrook wrapped a bandage around Daring Do's leg. It quickly became stained with red blood. She shook her head and sighed. "You plan to keep fighting?"\n   The pegasus nodded defiantly. "Until the bitter end. I'm not the kind of pony to give up."\n   "A lot of your friends have fled the southeast recently. I helped some of them escape, you know. Because I aided the communists before, they let me do it. To be honest, I don't think they even care that I help you all, they just want you out of the picture..."\n   "Okay. But I'm still not leaving."\n   "Some day you will get a wound that even my magic cannot heal."\n   "So be it. I'll go down fighting."\n   Meadowbrook took a flask of healing potion and offered it to her.\n   Daring emptied it in one go. "Thank you." She offered the empty flask back to her. "Say, aren't you a Pillar of Old Equestria? Why are you not fighting with us?"\n   "Back in the day, we fought evil and protected Equestria from it. The communists, as far as I can tell, are not evil. Zealous? Yes. Misguided? Possibly. But evil? No. It would be wrong for me to fight against fellow Equestrians. This entire civil war is something I would not even have had nightmares about a thousand years ago. I think everypony should stop fighting each other, even if it means living under a strange new regime. Peace is more valuable than anything. I am tired of seeing dying ponies in my hooves."\n   Daring Do said nothing and stared off into the distance."
 baltimare.49.a: ""I understand. But heroes have to keep fighting, no matter what.""
 baltimare.50.t: "Going Home"
 baltimare.50.d: ""Boss, you sure about this?" one of Dr. Caballeron's three henchponies, Rogue, asked him.\n   The disguised earth pony looked into the distance. They were standing in the harbour of Mareidian, and a steel ship was sailing towards them. "Yes."\n   "We're really just giving up, huh?" said Biff. "I heard Daring Do is still fighting, y'know."\n   "Foolishly. That mare seems to have never learned when to let go, that's what makes her such an irritating headache." Caballeron grunted and looked off into the sea, losing the harshness in his expression. "The war is lost, and I haven't been back in Puerto Caballo in so long..."\n   "You sound tired, boss," Rogue said. "This really is it, isn't it?"\n   "I bit off more than I could chew. It's not the end of the world. I plan to retire and write some books. I even have a pen name in mind." He turned to look at his henchponies with a smile. "How does 'Q. Q. Martingale' sound?"\n   The three glanced at each other, then Withers, the quiet one, nodded. "Good name, boss," Rogue replied. "Fantastic, even," Biff added."
 baltimare.50.a: "And don't come back."
 baltimare.51.t: "Communists Take Over Equestria"
 baltimare.51.d_anarchy: "[This.GetNewspaperHeader]What started as a communist revolution in the port city of Baltimare has now spread all across Equestria. The old order of alicorn rule has been decisively toppled and a new age has begun in the country. The anarcho-communists of CAN have begun to dismantle all remnants of the state that they destroyed, aiming to create a stateless anarchist confederation of local worker communes. Reports are spreading of hundreds, if not thousands, of suspected monarchists and counter-revolutionaries being executed without trial."
 baltimare.51.d_normal: "[This.GetNewspaperHeader]What started as a communist revolution in the port city of Baltimare has now spread all across Equestria. The old order of alicorn rule has been decisively toppled and a new age has begun in the country. The socialist republic has been declared as the sole legitimate authority in the nation, with [BAL.GetLeader] as the chairpony. Thousands of wealthy ponies and monarchists are fleeing the country abroad."
 baltimare.51.d_nightmare: "[This.GetNewspaperHeader]What started as a communist revolution in the port city of Baltimare has now spread all across Equestria. The old order of alicorn rule has been decisively toppled and a new age has begun in the country. The authoritarian socialists of IES have begun to eradicate all remains of the state they destroyed, aiming to solidify their totalitarian communist regime. All private property has officially been nationalized. Reports are spreading of thousands of suspected monarchists and counter-revolutionaries being executed without trial."
 baltimare.51.a: "Of the past, let us wipe the slate clean!"
 baltimare.51.b: "What a horrible turn of events."
 baltimare.52.t: "Dawning Of A New Age"
 baltimare.52.d: "A thunderous rumbling echoed in central Equestria as the royal castle in Canterlot was detonated with tonnes of explosives. The building that had stood for over a millenium as a symbol of Princess Celestia's rule disappeared in a cloud of black smoke, its brickwork stumbling down the mountainside. Everything valuable inside had been taken away beforehoof and redistributed to the populace of Canterlot. However, half of the city was a ghost town as its wealthy unicorn elite had mostly fled. Only some remained defiantly, but they were all arrested and executed, their corpses thrown off the cliff.\n   Unfortunately, another monarchist monument in the town of Ponyville proved far more resilient. The empty Castle of Friendship survived a similar attempted demolition entirely unscathed. Undeterred, the anarchists decided to instead cover the building in anarchist flags and banners, draping the entire castle in black and red.\n   In Ponyville, in Canterlot, in every city, town and village, property was collectivized, workers' councils were elected and monuments to monarchy were destroyed. Some ponies, mostly the poorest ones, welcomed this change. But most remained sceptical or even outright hostile. Much work remained to be done to prevent a counter-revolution and ensure a bright anarchist future for the nation."
 baltimare.52.a: "Come, comrades, let's get to work!"
 baltimare.53.t: "Elements of Anarchy"
 baltimare.53.d: ""THE ELEMENTS OF ANARCHY: EQUALITY, DETERMINATION, HOPE, FREEDOM, SOLIDARITY, COMMUNITY"\n   A small group of ponies wearing hooded capes looked at the large poster with red text with a mixture of emotion. "These suck," one of them said. "'Oh look at me, I'm the element of community.' Doesn't it sound stupid?"\n   "...I don't think these are meant for individuals to represent like the Elements of Harmony. I think they're just common values, sort of."\n   "So they're not going to have element bearers anymore?" another pony asked and gasped. "But that means we're... UNEMPLOYED?!"\n   "Shush, be quiet, somepony might hear you," a fourth pony said. "'Sides, do they even... have unemployment? Don't think anypony has to work for a living anymore." She scoffed. "Hogwash."\n   Another group of ponies with rifles approached them, chatting and laughing.\n   "Quick, h-hide!" a fifth pony said, and the hooded ponies vanished into a shadowy alleyway."
 baltimare.53.a: "These are much better than the old ones."
 baltimare.54.t_golden: "The End Of PON"
 baltimare.54.d_golden: "Golden Delicious and Cricket Chafer were sitting at a bar. The latter had a mug of maize beer and looked at Golden's own mug curiously. "Hmm, what drink did you get?"\n   "Pear juice. I don't drink alcohol."\n   "Pear...?" Cricket smiled, then erupted into laughter. "You'll get disowned by the Apple family for that!"\n   "I already have been," Golden said, not showing signs of amusement and drinking his juice.\n   Cricket went quiet, then cleared his throat. "Right. Anyways, you know well why I invited you here."\n   "To talk about politics?"\n   He nodded. "People's Organisation of the Nation was like a foal of mine. I founded it in 998 and was its leader ever since. And now you went and killed it. Killed my own foal!" His amusement returned and he grinned. "How could you, I thought we were friends."\n   "I apologize, it was not personal. All other parties are gone too. Like IES." He did not try to hide his disgust saying the name of the party. "Parties are a foreign concept to Equestria, anyways. It's a Griffonian thing."\n   "What, are griffons not comrades?" Cricket said and snorted.\n   "I didn't mean it like that... I mean that the people are much more ready to embrace local rule and union-run economy than party rule from above. It's better this way."\n   Chafer nodded slowly. "You do have a point, I guess. I don't necessarily agree. But, well, you won the elections, so you get to do whatever you want."\n   "You can still run for chairpony, you know. Maybe if you win, you can bring parties back," Golden said with a smile."
 baltimare.54.t_cricket: "From Above"
 baltimare.54.d_cricket: "Golden Delicious and Cricket Chafer were sitting at a bar. The latter had a mug of maize beer and looked at Golden's own mug curiously. "Hmm, what drink did you get?"\n   "Pear juice. I don't drink alcohol."\n   "Pear...?" Cricket smiled, then erupted into laughter. "You'll get disowned by the Apple family for that!"\n   "I already have been," Golden said, not showing signs of amusement and drinking his juice.\n   Cricket went quiet, then cleared his throat. "Right. Anyways, why'd you invite me here?"\n   "To talk about politics."\n   Cricket chortled in amusement. "Come on. I thought we were going to take it easy and relax."\n   "I'm serious," Golden continued. "We at TER have been asking for more union representation in the government, but I did not think you'd establish the AUCCTU as a response."\n   The bald pony shrugged. "I gave you what you wanted, no? Is there a problem?"\n   "I know you had good intentions. I am just concerned about the concentration of political power in a central body. You've gone for a top-down solution instead of a grassroots organization."\n   "It's more efficient that way." He sipped some maize beer. "Trust me, it'll work out fine."\n   Golden frowned. "Well, I do trust you. That's the main reason why I've been trying to convince CAN-TER to let you do what you're doing. They are not particularly happy about your centralized statist policies."\n   Chafer grinned, some beer dripping from his mouth. "When they see how successful PON's policies are, they'll understand the necessity of using the state as a tool to build true communism.""
 baltimare.54.a: ""Maybe I will, who knows.""
 baltimare.54.b: ""Perhaps they will.""
 baltimare.55.t: "Back In Manehattan"
 baltimare.55.d: "The last time Golden Delicious had been in Manehattan, the largest city in Equestria, was before the civil war. Though the scars of conflict were visible in many places, most of the caput mundi was much the same it had been back then. It was still the beating heart of Equestrian industry, with towering skyscrapers and bustling streets. This was the true capital of the nation, Golden thought, not some gilded bourgeois relic on a mountainside far away. This is why he decided to hold a speech here, in front of an audience of thousands. The local trade unions that had been in hiding before liberation helped him organize the event.\n   As he stood on a podium, he took a deep breath and began to speak. "Citizens of Equestria! I am Chairpony Golden Delicious. I do not speak to you as a conqueror, but as a liberator. I have fought in the streets of Baltimare, in the sweltering jungles of the southeast, in the plains and the fields, all in the name of the revolution. I never believed I would not only survive, but one day reach Manehattan itself, the greatest city in the world."\n   Many ponies in the crowd cheered.\n   "Now at last the working class is the one in the saddle. Alicorn rule is no more, and a new age has begun. Already the changes and reforms of our revolution are being spread across the country. Here, too, the labour unions will take control. We will encourage the collectivization of all property, but contrary to what our enemies say, we will not force anypony to give up their property at gunpoint. I know some ponies will not welcome these changes. But I strongly believe that once they see their positive impact, once they have a taste of true liberty, they too will be convinced of our cause. Lastly, I would like to announce that I will not remain as chairpony forever. After the revolution is secure, elections will be held. Rest assured I have done none of this for personal gain or lust for power. I have dedicated my whole life to the revolution. And I ask all of you, please do the same. Only then will our dreams become reality.""
 baltimare.55.a: "The cacophonous cheering echoed in the streets."
 baltimare.56.t: "Meeting The Six"
 baltimare.56.d_twilight: "The wielders of the Elements of Harmony, the six legendary heroes of Equestria, had gone missing in the chaos of the civil war. It was commonly believed they had gone into hiding, or even met with a terrible fate. But luckily for the syndicalists, Chairpony Golden Delicious was a member of the Apple family, just like Applejack, the Element of Honesty. Therefore he decided to talk on a public radio broadcast, beseeching for his relative to come out of hiding and negotiate, swearing to not cause any harm to her or her friends. This worked, and soon enough the six ponies emerged out of hiding and a meeting was arranged.\n   The seven ponies met each other at a familiar location, in Applejack's farm near Ponyville. The farm still bore the scars of civil war. "Remember when the whole family gathered here?" Golden Delicious asked from his relative. "We could do that again, Fix up the whole place. It saddens me to see it in such a state."\n   Applejack sighed. "Me too, but I think we should talk 'bout that later."\n   "Right. Sorry. Ahem. I wanted to meet you all to convince you all that you're safe. You're not going to be arrested and thrown in jail or anything. You can live out your lives in peace, just like before... everything."\n   The six ponies glanced at each other. Twilight Sparkle then responded. "That's... nice and all. But that leaves some questions. What about all the things my friends own? Their homes and livelihoods. And what about my status as the Princess of Friendship?"\n   "I know our enemies have spread rumours that we steal all property, but this is false. All collectivization only concerns the means of production, and is purely voluntary. As for your title... would you be fine with no longer using it?"\n   "What the heck is a mean of production?" Rainbow Dash asked.\n   Twilight smiled at her. "I'll explain later." She then looked at Golden. "If that is all you ask for, then fine. Princess or not, I just want to continue to teach others about the values of harmony and friendship."\n   Golden nodded. "Good. I think I can convince my comrades to accept that. Equestria needs heroes like you now more than ever.""
 baltimare.56.d_sunrise: "The wielders of the Elements of Harmony, the six legendary heroes of Equestria, had gone missing in the chaos of the civil war. It was commonly believed they had gone into hiding, or even met with a terrible fate. But luckily for the syndicalists, Chairpony Golden Delicious was a member of the Apple family, just like Applejack, the Element of Honesty. Therefore he decided to talk on a public radio broadcast, beseeching for his relative to come out of hiding and negotiate, swearing to not cause any harm to her or her friends. This worked, and soon enough five ponies emerged out of hiding and a meeting was arranged.\n   The six ponies met each other at a familiar location, in Applejack's farm near Ponyville. The farm still bore the scars of civil war. "Remember when the whole family gathered here?" Golden Delicious asked from his relative. "We could do that again, Fix up the whole place. It saddens me to see it in such a state."\n   Applejack sighed. "Me too, but I think we should talk 'bout that later."\n   "Right. Sorry. Ahem. I wanted to meet you all to convince you all that you're safe. You're not going to be arrested and thrown in jail or anything. You can live out your lives in peace, just like before... everything."\n   The five ponies glanced at each other. Rarity then responded. "That is all wonderful to hear. Yet it leaves some questions. What about all the things me and my friends own? Our homes and livelihoods."\n   "I know our enemies have spread rumours that we steal all property, but this is false. All collectivization only concerns the means of production, and is purely voluntary."\n   "What the heck is a mean of production?" Rainbow Dash asked.\n   Pinkie sighed, her mane flat and straight. "I bet Twilight would've known..."\n   Golden offered her a sympathetic smile. "I am sorry about what happened to her. But I promise we will do our best to find her and figure out a way to turn her back to normal. In the meantime, do you agree to work together with us, despite our differences? Equestria needs heroes like you now more than ever.""
 baltimare.56.a: "Hooves were shaken and an agreement was made."
 baltimare.57.t: "A Proposal From [From.GetNameDefCap]"
 baltimare.57.d_syndie: "Our comrades in [From.GetNameDef] have approached us with a proposal. They are inviting us to join their federation, abolishing any borders and merging our administrations entirely. This would, of course, mean adopting their anarcho-syndicalist ideology and abandoning our own system. Is our sovereignty worth sacrificing in the name of revolutionary unity?"
 baltimare.57.d_commie: "Our comrades in [From.GetNameDef] have approached us with a proposal. They are inviting us to join their nation, abolishing any borders and merging our administrations entirely. This would, of course, mean accepting their own interpretation of Caramel Marks' ideas and abandoning our own system. Is our sovereignty worth sacrificing in the name of revolutionary unity?"
 baltimare.57.a: "Let us unite with our comrades!"
 baltimare.57.b: "No. They are revisionists."
 baltimare.58.t: "[From.GetNameDefCap] Agrees To Join"
 baltimare.58.d: "A response to our proposal has come from [From.GetNameDef], and they have accepted it. Any borders between us will be abolished as they will join our federation and merge with our administration. This does, of course, mean that they have abandoned their own model of socialism, but it seems they have understood that revolutionary unity is more important than anything."
 baltimare.58.a: "Workers of the world, unite!"
 baltimare.59.t: "[From.GetNameDefCap] Refuses To Join"
 baltimare.59.d: "A response to our proposal has come from [From.GetNameDef], and they have rejected it. It seems they want to maintain their own model of socialism and retain their sovereignty. Unfortunately, they do not see revolutionary unity as important as we do."
 baltimare.59.a: "A shame, but we cannot force them."
 baltimare.60.t: "A New Chaircreature"
 baltimare.60.d: "Golden Delicious sat at a worker's council in his home district, in the port city of Baltimare. He was no longer the chaircreature, but he was still a member of the apple crate haulers' union. The ponies in the council were discussing who to vote for as chaircreature. This was no mere bourgeois election, but a socialist one that relied on consensus. Each council would pick their candidate, and a federal congress would then be held to decide which of the most popular candidates would become the new chaircreature.\n   Golden looked down at a paper that included a list of candidates. His eyes widened when he saw a familiar name: Cricket Chafer. Seems he had decided to become a candidate after all. He smiled and chuckled to himself.\n   "Those of you who have Cricket Chafer as your preferred candidate, raise your appendage," said one of the council members.\n   Still smiling, Golden raised his hoof."
 baltimare.60.a: "In the end, Cricket Chafer wins the elections."
 baltimare.60.b: "In the end, Starry Plough wins the elections."
 baltimare.60.c: "In the end, Strawberry Snowflake wins the elections."
 baltimare.60.e: "In the end, Valery Stablein wins the elections."
 baltimare.61.t: "A New Dawn In Equestria"
 baltimare.61.d: "At the very same spot in Manehattan where Princess Luna was once going to hold her speech, Cricket Chafer now stood on a podium, in front of a massive and colourful crowd of ponies. He waved with his hoof, grinning gleefully, as the state orchestra played triumphant music.\n   After the music stopped, he cleared his throat, tapped a microphone on the podium and began to speak. "Comrades! Today is a glorious day in Equestrian history. Alicorn despotism is no more, and a new proletarian government is in place. Yet this does not mean an instant change, a total revolution. I believe in gradual change, and slow building of communism. I cannot promise you that this transition period will be without any problems, but I can assure you that we will do our best to make it as smooth as possible. I come to this city not as a conqueror imposing my will, but as a liberator, and that means respecting the rights and opinions of all ponies. After all, harmony can co-exist with communism. This was what Caramel Marks originally believed.\n   "Comrades, we have a monumental task ahead of us, but by putting our differences aside and working together, we can accomplish anything. Such is the power of the magic of friendship. A communist utopia, where everypony prospers and nopony is exploited, is now more than ever within our reach. Remember this, and you will be filled with such determination that you can overcome any challenges."\n   He continued to speak, rousing the crowd with excitement, despite all the weariness they felt after the civil war."
 baltimare.61.a: "The cacophonous cheering echoed in the streets."
 baltimare.62.t: "Meeting The Six"
 baltimare.62.d_twilight: "A MIS operative saluted the chairpony. "Comrade Chafer, we have brought the prisoners."\n   Seated behind his desk, Cricket grinned. "Good, bring them in."\n   Six ponies were escorted into the room by armed guards. The wielders of the elements of harmony showed a mixture of emotions in their war-weary faces. Some were defiant, others worried or scared.\n   "Welcome, heroes of Equestria!" Cricket exclaimed. "I am honoured to finally meet you all in person."\n   The former Princess of Friendship looked at him sceptically. "Unfortunately, I can't say the same. What do you want from us?"\n   "Oh come now, brighten up a little. I mean you no harm."\n   "Then why did you imprison us?!" Rainbow Dash asked.\n   "This was the best and most secure way to bring you all to the negotiation table. I don't want us to be enemies. Let bygones be bygones, alright? I want to offer you something. You see, I believe the Elements of Harmony can perfectly co-exist with communist values. The old order, with its capitalism and monarchism, in my opinion contradicts the values of friendship. There is nothing friendly about the rich exploiting the poor, or about an immortal despot making decisions on behalf of others. Once you realize this, you can join us. We need your help to build a better society for all creatures in Equestria, after all."\n   "Can I have my business back?" Rarity asked.\n   "And what about my family farm?" Applejack asked.\n   "And the Cake family's Sugarcube Corner?" Pinkie asked.\n   Cricket shook his head, but still smiled. "This is what I mean. You must leave the past behind you. Our new Equestria won't have petty bourgeois businesses!"\n   "So... I cannot be the Princess of Friendship anymore, then?" Twilight Sparkle asked.\n   "I'm afraid not."\n   She glanced at her friends, who glared at Cricket in anger, and sighed. "I'm sorry, but we can't work together with someone who took away everything we had."\n   Cricket's smile vanished. "So be it, then." He then turned to look at the guards and said:"
 baltimare.62.d_sunrise: "A MIS operative saluted the chairpony. "Comrade Chafer, we have brought the prisoners."\n   Seated behind his desk, Cricket grinned. "Good, bring them in."\n   Five ponies were escorted into the room by armed guards. The wielders of the elements of harmony showed a mixture of emotions in their war-weary faces. Some were defiant, others worried or scared.\n   "Welcome, heroes of Equestria!" Cricket exclaimed. "I am honoured to finally meet you all in person."\n   Applejack looked at him sceptically. "What do ya want from us?"\n   "Oh come now, brighten up a little. I mean you no harm."\n   "Then why did you imprison us?!" Rainbow Dash asked.\n   "This was the best and most secure way to bring you all to the negotiation table. I don't want us to be enemies. Let bygones be bygones, alright? I want to offer you something. You see, I believe the Elements of Harmony can perfectly co-exist with communist values. The old order, with its capitalism and monarchism, in my opinion contradicts the values of friendship. There is nothing friendly about the rich exploiting the poor, or about an immortal despot making decisions on behalf of others. Once you realize this, you can join us. We need your help to build a better society for all creatures in Equestria, after all."\n   "Can I have my business back?" Rarity asked.\n   "And what about my family farm?" Applejack asked.\n   "And the Cake family's Sugarcube Corner?" Pinkie asked.\n   Cricket shook his head, but still smiled. "This is what I mean. You must leave the past behind you. Our new Equestria won't have petty bourgeois businesses!"\n   "And... what about Twilight?" Fluttershy asked. "Are you going to find a way to turn her back to normal?"\n   "I'm afraid not. The things she did under Daybreaker's rule are unforgivable."\n   She glanced at her friends, who glared at Cricket in anger, and sighed. "I'm sorry, mister. But we can't work together with someone who doesn't want to help us in any way."\n   Cricket's smile vanished. "So be it, then." He then turned to look at the guards and said:"
 baltimare.62.a: ""Take them away to the re-education camps!""
 baltimare.63.t: "Re-Education Camp"
 baltimare.63.d_twilight: ""This is booooring," Rainbow Dash complained.\n   The six wielders of the Elements of Harmony were seated behind benches, alongside many other ponies, and watched a PON party member hold a lecture about communist ideology. The lecturer glared at Rainbow. "Could you please stay quiet and not interrupt me?"\n   "Hey, I'm just being honest."\n   "I thought you were the Element of Loyalty, not Honesty."\n   Applejack chuckled to herself while Rainbow shrugged and replied: "The elements aren't like, you know, restrictive. Applejack can be loyal, Fluttershy can be generous, Rarity can be kind and so on. We're not one-dimensional characters, y'know?"\n   The lecturer sighed. "I believe I am the one who is supposed to be holding a lecture here. Now, let us get back on topic-"\n   Rainbow immediately started snoring loudly.\n   "You can't be serious." The PON pony groaned. "Are you really this bad of a student?"\n   "Actually, she isn't," Twilight replied. "This just isn't how she learns about things. I think she could genuinely learn about the subject matter if you just-"\n   Applejack prodded her with her hoof. "Don't help 'em, what's wrong with you?"\n   "Oh, sorry, I actually find this interesting myself. I don't think there's any harm in learning about this. Just because we know about communism doesn't mean we have to agree with it."\n   "You know what, I quit!" the lecturer exclaimed. "I can't take this anymore." He then stormed out of the room, leaving behind a confused audience. Except for one light blue pony, who stopped pretending to snore and started laughing loudly."
 baltimare.63.d_sunrise: ""Is this what Twilight went through when she was brainwashed by Daybreaker?" Rarity whispered.\n   The five wielders of the Elements of Harmony were seated behind benches, alongside many other ponies, and watched a PON party member hold a lecture about communist ideology. The lecturer glared at Rarity. "Could you please stay quiet and concentrate on the lecture?"\n   "Apologies, I just-"\n   "She's right," Rainbow Dash interjected. "You're no better than the solarists!"\n   The audience in the room gasped and the lecturer appeared offended. "Excuse me? I am here simply educating you, not trying to corrupt you with an ideology of pure evil!"\n   Applejack looked at him with disdain. "Your ideology's about the state stealing land and businesses from the ponies. What's good about that?"\n   "Now is not the time for a debate-"\n   "She's right," one of the ponies in the audience said. "Why are we listening to this drivel? Even the heroes of Equestria don't agree with it!"\n   "You know what, I quit!" the lecturer exclaimed. "I can't take this anymore." He then stormed out of the room, leaving behind a confused audience."
 baltimare.63.a: "They'll become true communists eventually."
 baltimare.64.t: "The Last Stand"
 baltimare.64.d: "In the middle of the jungle, there was a bald treeless hill, jutting out from the green ocean around it. Now, it was the only safe refuge from an inferno that engulfed the surrounding jungle. A small group of ponies had set up camp there.\n   Mage Meadowbrook wrapped a bandage around Daring Do's leg. It quickly became stained with red blood. She coughed from all the smoke in the air. "This should stop the bleeding. Let me get you a healing potion..." She limped away from Daring to look through her meagre belongings.\n   Meanwhile, Doctor Caballeron slowly walked closer to Daring. The latter glared at him suspiciously. "What do you want? I'm a bit busy trying not to die here."\n   "I... look, we were never friends. But our rivalry has been legendary. So, I just wanted to say-"\n   "PLANES ARE COMING!" a guardpony exclaimed loudly. In an instant, the entire camp sprung into panicked motion, though there was nowhere to hide on the exposed hill. Their only hope was that the thick black smoke would cover them.\n   Daring Do tried to move, but winced in pain. At that moment, Meadowbrook galloped to her, offering a flask of liquid. Daring emptied in one go. "Thank you."\n   "Can you move?" Caballeron asked. "We can't just stay here-"\n   The loud roaring of the planes became deafening, and they saw numerous armed pegasi in black uniforms jumping out of them.\n   "Commie death squads!" a guardspony shouted and grabbed his rifle. "Open fire!"\n   Daring managed to get up, grinding her teeth. Caballeron quickly took two rifles and offered one to her with a smile. "You know, I never imagined it'd end like this. Even Yearling would never write something this cheesy."\n   A barely visible smile briefly appeared on Daring's lips. "No. It's not going to end." She took the rifle from him and aimed it at one of the rapidly approaching pegasi. "Because heroes never lose.""
 baltimare.64.a: "Leave no survivors."
 baltimare.65.t: "A Wave Of Sabotage"
 baltimare.65.d: "Reports have arrived in [Root.Capital.GetName] about various sabotage actions conducted across the country. Many factories have suffered, with vital machinery being destroyed by unknown actors. In addition, government personnel have been assassinated, and subversive underground propaganda has been spread undermining the rule of our government.\n   Our own intelligence services have concluded that this wave of covert action against us has been done by operatives of the Military Intelligence Service of [BAL.GetNameDef]. There is enough evidence to accuse them of being responsible. However, our military leaders are advising us to strike back at them hard to teach them a lesson, and to topple their hostile totalitarian government. [Root.GetLeader] has to decide how to respond to this situation."
 baltimare.65.a: "Condemn them publicly."
 baltimare.65.b: "They will pay for what they have done!"
 baltimare.66.t: "Year Zero"
 baltimare.66.d: "It was 0 ABS. After Birth of the State.\n   Lavender was in his office. There would be no grand speeches or ceremonies. The State had simply become a legal fact, with the signing of a document. He then signed some more documents. Execute three thousand former Equestrian government officials. Destroy the Canterlot Castle. Rename Canterlot and Manehattan. Execute fourteen thousand anti-communist agitators. His pen moved swiftly as he signed them.\n   He sighed. It was hard work, being a leader. He carried such heavy responsibility on his weary shoulders. A secretary took his documents and Lavender left his office. He deserved a hefty reward for his efforts. "Stop," he said to the secretary.\n   She froze in place. "Uh, what is it, comrade?"\n   "Tell them to get my limousine ready. I am going for a ride around the city later."\n   She gulped, and nodded.\n   An hour later, the armoured limousine drove down the streets. Berry's eyes scanned the ponies walking on the streets as armed bodyguards sat near him. His eyes locked onto a young mare wearing a beautiful dress. He raised his hoof and pointed at her. "That one. Bring her to my office."\n   The bodyguards nodded. The limousine stopped."
 baltimare.66.a: "Lavender smiled."
 baltimare.67.t: "Luring The Vermin"
 baltimare.67.d: "A campfire crackled in the depths of the Everfree Forest, and a small group of ponies were huddled around it for warmth. Then a hooded mare galloped towards it, carrying some newspapers. At first the ponies were alarmed, but calmed down when they saw who it was. "Oh, it's you," one of them said. "Um, is something wrong?"\n   She caught her breath and showed the newspapers to them. "Look!"\n   On the front cover of the newspaper were images of their parents and siblings, beaten and bruised, surrounded by armed ponies in black uniforms. The title was "HOSTAGES TAKEN, LAVENDER ISSUES FINAL WARNING TO THE ELEMENT BEARERS".\n   Everypony around the campfire stared at the newspaper in silent horror, their mouths open. "T-that can't be a real image, right?" one pony mumbled.\n   "He's bluffing, even if it's real." another pony replied.\n   "We can't risk it!" a third pony said. "We gotta surrender before it's too late."\n   "...No, we can't. W-we have to keep fighting. Nopony... will be spared, even if we surrender. We're... the last hope for Equestria."\n   "ARE YOU INSANE?! You're just telling us to sacrifice everypony?"\n   Some of them were starting to cry.\n   "We... shouldn't sacrifice ourselves as well." She gulped and struggled to keep talking. "If we surrender, we'll die alongside them."\n   The hooded pony gritted her teeth. "I hate that you're right." She then threw the newspapers into the campfire, which burned them in an instant."
 baltimare.67.a: "Oh well, it was worth an attempt."
 baltimare.68.t: "An Unexpected Turn Of Events"
 baltimare.68.d: "Lavender Berry entered a meeting room. As he sat down, his eyes carefully scanned the ponies seated around the table. They locked into a pony who shouldn't have been there. He frowned in a mix of anger and confusion. "Cricket Chafer? What are you doing here?"\n   Cricket stood up and pointed his hoof at him. "I hereby accuse Lavender Berry of treason. He is a capitalist spy working for foreign intelligence services. We also have testimonies from many ponies about his inappropriate, illegal behaviour. He is an enemy of the working class."\n   Now Lavender stood up as well. "What's going on, Cricket?" His worried eyes looked around at the other ponies, but no one looked back at him. "Listen to me, these accusations are false! I am innocent! Don't listen to his nonsense, he is the true traitor here!"\n   The doors behind him opened. Armed guardponies in uniform entered and surrounded him. His eyes widened in shock.\n   Cricket looked at him with pity. "You are hereby placed under arrest. Guards, take him away!"\n   As the guardsponies grabbed Lavender, he tried to resist. "No, please stop! T-there's been a terrible misunderstanding! Please, have mercy! I-I demand fair trial! No!" His glasses fell off in the struggle and shattered into pieces. He whined loudly as he was dragged away, then the doors slammed shut.\n   Cricket took a deep breath, then smiled and looked at the ponies around him. "So, comrades, let us vote for a new chairpony, now that Lavender Berry is unable to fulfill his duties.""
 baltimare.68.a: "They unanimously voted for Cricket Chafer."

