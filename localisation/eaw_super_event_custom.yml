# == (*) ==
 SE_GREAT_WAR_T: "Велика війна"
 SE_GREAT_WAR_A: "Кінець тисячарічного миру."
 SE_GREAT_WAR_D: "«Перед лицем великої цілі жодні жертви не здаються надто великими».\n($CHN_queen_chrysalis$)"

 SE_GREAT_WAR_EV_T: "Перемога Еквестрії"
 SE_GREAT_WAR_EV_A: "Еквестрійці ніколи не будуть рабами!"
 SE_GREAT_WAR_EV_D: "«Мої дорогі поні! Це ваша перемога! Кожен, кобила чи жеребець, доклали всіх зусиль. Усі доклалися. Ні довгі роки, ні небезпеки, ні жорстокі напади ворога в жоден спосіб не послабили нескориму рішучість еквестрійського народу».\n($EQS_princess_celestia$)"

 SE_GREAT_WAR_SV_T: "Перемога Сонячної Імперії"
 SE_GREAT_WAR_SV_A: "Oderint, dum metuant!"
 SE_GREAT_WAR_SV_D: "«Неможливо пробачити й неможливо зрозуміти все зло, що чейнджлінґи принесли на нашу землю. За злочини проти поні й Еквестрії їх усіх буде покарано. Великий суд чекає».\n($EQS_SOL_daybreaker$)"

 SE_GREAT_WAR_LV_T: "Перемога Місячної Імперії"
 SE_GREAT_WAR_LV_A: "Ніч перемагає."
 SE_GREAT_WAR_LV_D: "«Немає сумніву, що вина чейнджлінґів перед нами є дуже велика. Але я готова дати їм можливість спасти себе, служачи мені й моїй ночі. Ті ж, хто відмовиться... готуйтеся до жахіття».\n($NLR_nightmare_moon$)"

 SE_GREAT_WAR_CV_T: "Перемога чейнджлінґів"
 SE_GREAT_WAR_CV_A: "Колесо історії зробило оберт."
 SE_GREAT_WAR_CV_D: "«Тепер ганьбу змито. Почуваю себе зновународженим».\n($CHN_hivesmarschall_trimmel$)"

 SE_ELF_U_T: "Еквестрійський визвольний фронт"
 SE_ELF_U_A: "AUT VINCERE, AUT MORI."
 SE_ELF_U_D: "«Бій за Еквестрію розгоряється знову. Тому готуймося до виконання наших обов'язків, а відтак чинімо так, аби навіть по тисячі років поні й тоді казали: “Це була їхня зіркова година”».\n($EQS_starlight_glimmer$)"

 SE_ELF_V_T: "Перемога Еквестрійського визвольного фронту"
 SE_ELF_V_A: "Сьогодні кожен співає: «Перемога!»"
 SE_ELF_V_D: "«Великі жертви, що ми зробили в ім'я свободи Еквестрії, незліченні труднощі та страждання, пережиті нашим народом, тяжка праця в тилу й на фронті увінчалися цілковитою перемогою над ворогом. Відтепер над Еквусом буде майоріти велике знамено свободи та гармонії!»\n($EQS_starlight_glimmer$)"

 SE_ELF_D_T: "Поразка Еквестрійського визвольного фронту"
 SE_ELF_D_A: "Ліпше програти в бою..."
 SE_ELF_D_D: "«Усі з нас знали, що ми приречені. Але кожен був готовий боротися до останньої краплі крові. Загинемо ми — на наше місце прийдуть інші. Нехай знає ворог: Еквестрія ніколи не вмре!»\n(Запис у щоденнику солдата Визвольного фронту)"

 SE_SOMBRA_RETURNS_T: "Повернення Сомбри на престол"
 SE_SOMBRA_RETURNS_A: "Король тіней знову в дії."
 SE_SOMBRA_RETURNS_D: "«Я не просто якийсь монстр, Гоуп. Я король монстрів!»\n($sombra_chief$)" # king_of_monsters_desc

 SE_SOMBRA_VICTORY_T: "Сомбра перемагає Еквестрію"
 SE_SOMBRA_VICTORY_A: "Тиран домігся свого."
 SE_SOMBRA_VICTORY_D: "«Пригноблення інших — це слабкість, замаскована під силу».\n($princess_cadence$)"

 SE_NIGHTMARE_MOON_CV_T: "Громадянська війна в Еквестрії"
 SE_NIGHTMARE_MOON_CV_A: "Історія повторюється."
 SE_NIGHTMARE_MOON_CV_D: "«Не може бути жодного миру між нашим урядом, котрий стоїть за право, справедливість і щастя поні, та безумцями, котрі окупували Мейнгеттен і поставили собі одну ціль: знищити Еквестрію та винищити всіх, хто не є бетпоні».\n($EQS_prince_blueblood$)"

 SE_DAYBREAKER_T: "Дейбрейкер сходить"
 SE_DAYBREAKER_A: "Нова Еквестрія народилася."
 SE_DAYBREAKER_D: "«Ми мусимо не загрузнути в минулому, нерішучі та милосердні. Війна вже забрала стільки життів. Я кажу: “Годі цього!” Ми відіб'ємо загарбників! Еквестріє, я обіцяю тобі це, ми переможемо й від нших ворогів не зостанеться й попелу!»\n(Імператриця $EQS_SOL_daybreaker$)"

 SE_TWO_SISTERS_WAR_T: "Війна двох сестер"
 SE_TWO_SISTERS_WAR_A: "Стара Еквестрія мертва."
 SE_TWO_SISTERS_WAR_D: "«Я знаю, від кого тікаю, не знаючи, до кого тікаю».\n(Невизначений журналіст-поні)"
 #When Pompey and Caesar took opposite sides, he said, "I know from whom I flee without knowing to whom to flee.

 SE_GROVER_V_T: "Смерть Ґровера V"
 SE_GROVER_V_A: "Імперія висить на волосині."
 SE_GROVER_V_D: "«Смерть Його Величності — це грізний камінь, що впав із вершини гори і тепер жене сюди, щоби розбити цього колоса на глиняних ногах».\n(Імперський дворянин про Імперію Грифонів)"

 SE_LORD_PROTECTOR_START_T: "Лорд-протектор захоплює владу"
 SE_LORD_PROTECTOR_START_A: "Удар по серці імперії."
 SE_LORD_PROTECTOR_START_D: "«Сьогодні ви всі зробите свою останню жертву Батьківщині. Сьогодні Імперія постане з попелу старого порядку. Сьогодні я струшую паразитів і відновлюю наші давно втрачені славу та гордість!»\n(Фердінандове звернення до імперського двору)"

 SE_AQUILEIA_REVOLT_T: "Аквілейська революція"
 SE_AQUILEIA_REVOLT_A: "Liberté, égalité, fraternité."
 SE_AQUILEIA_REVOLT_D: "«Революція — це, ні більше, ні менше, ідеал, озброєний мечем».\n(Віктор Гюґо)"

 SE_REPUBLIC_WIN_T: "Триколор над Грифенгаймом"
 SE_REPUBLIC_WIN_A: "Мрія здійснилася."
 SE_REPUBLIC_WIN_D: "«Вони поклали свої життя на кривавім полі бою.\nГукай, гукай бойовий клич свободи!\nЇхнє гасло — то є опір: “Тиранам нік' не підкоряйся!”\nГукай, гукай бойовий клич свободи!\n(Республіканська пісня)"

 SE_REPUBLIC_LOSE_T: "Кінець республіканської мрії"
 SE_REPUBLIC_LOSE_A: "Останній подих Республіки."
 SE_REPUBLIC_LOSE_D: "«Народу здається, що він вільний у революції, та це жахливий самообман. У революції нема й не може бути свободи; революція завжди ворожа до духу свободи. Революція стається так, як стається хвороба, злидні, природне лихо, пожежа чи повінь».\n($archon_eros$)"

 SE_GROVER_VI_CORONATION_T: "Коронація Ґровера VI"
 SE_GROVER_VI_CORONATION_A: "Heil Kaiser, dir!"
 SE_GROVER_VI_CORONATION_D: "«Я свідомий свого обов'язку зберегти мир і захистити незалежність Імперії, заснованої на об'єднаній силі її народу. Я приймаю корону в надії, що грифони зможуть насолодитися нагородою за їхню палку й безкорисливу боротьбу за довготривалий мир у межах Батьківщини».\n(Із коронаційної промови Ґровера VI)"

 SE_GROVER_II_RESURRECTION_T: "Повернення Ґровера II"
 SE_GROVER_II_RESURRECTION_A: "Für Gott und Kaiser!"
 SE_GROVER_II_RESURRECTION_D: "«Коли про монарха кажуть, що він добрий, це значить, що він не хороший правитель».\n($YAL_emperor_grover_ii$)"

 SE_MARESOC_T: "MARESOC"
 SE_MARESOC_A: "Закуті назавжди."
 SE_MARESOC_D: "«Пролетарі ніколи не збунтуються, ані за тисячу років, ані мільйон. Вони не можуть. Якщо ви колись плекали абиякі мрії про насильницьке повстання, покиньте їх. Немає способу, в який Партію можна повалити. Правління Партії — це назавжди».\n(Член Внутрішньої партії)"

 SE_ESB_T: "Еквестрія у вигнанні б'є у відповідь"
 SE_ESB_A: "За свободу Еквестрії!"
 SE_ESB_D: "«Еквестрія програла битву, але Еквестрія не програла війну! Ніщо не втрачено й настане день, коли наша домовина відновиться свої свободу і велич! Саме тому я запрошую всіх еквестрійців, хай де вони є, об'єднатися зі мною в дії, в пожертві та в надії».\n($EQS_princess_celestia$)" # (&?)

 SE_TS_PH_T: "Твайлайт Спаркл короновано Принцесою Гармонії"
 SE_TS_PH_A: "Слава принцесі!"
 SE_TS_PH_D: "«Всі, хто прийшов до Кантерлота на цю церемонію або слухає її на радіош, ви всі тут заради мене. Я у щирості присвячую себе службі вам, як багато з вас присвятили себе службі мені. Протягом усього мого життя й усім своїм серцем я намагатимуся бути гідною вашої довіри».\n(Із коронаційної промови Твайлайт Спаркл)"

 SE_RIV_EMP_T: "Повернення Річкової імперії"
 SE_RIV_EMP_A: "Розкол у Річковій коаліції."
 SE_RIV_EMP_D: "«Усю таємницю кампаній, проведених проти Річкових земель, можна пояснити двома словами: демократія та комунізм... Ми маємо викорчувати ці два зла з нашої землі».\n(Генерал $LCT_wild_tree$)" # (&)

 SE_LP_UH_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_LP_UH_A: "Грифонський Райх устане."
 SE_LP_UH_D: "«Відновлення величі імперії — єдина ціль, про яку грифони можуть думати. Усі, хто перешкоджає цій великій меті, — це зрадники, і ми мусимо викорінити цю заразу — незалежно від їхнього статусу, статі або віку — знищити кожен дім, кожне гніздо, кожне яйце».\n($GRI_ferdinand_dawnclaw$)"

 SE_THX_UPRISING_S_T: "Торакс перемагає у громадянській війні"
 SE_THX_UPRISING_S_A: "Чейнджлінґи вільні від тиранії."
 SE_THX_UPRISING_S_D: "«Вина громадянської війни, злидні, які вона приносить у своєму поїзді, лежать при дверях тих, хто спровокував її незаконним гнобленням, а не тих, кого пригнали до зброї задля нав'язання їхніх природних прав як вільних істот».\n($CHN_thorax_name$)" # (&)

 SE_CHRYSALIS_CORONATION_T: "Кризаліс короновано імператрицею Еквусу"
 SE_CHRYSALIS_CORONATION_A: "Еквестрія в імлі."
 SE_CHRYSALIS_CORONATION_D: "«Коли я хочу знати, що чейнджлінґи хочуть, я питаю себе».\n($CHN_queen_chrysalis$)"

 SE_STG_UNITES_EQUESTRIA_T: "$SE_EQUESTRIA_UNITE_TITLE$"
 SE_STG_UNITES_EQUESTRIA_A: "Наперед, до яскравого майбутнього!"
 SE_STG_UNITES_EQUESTRIA_D: "«...на основі влад, наданих нам, ми, делегати республік рад, вирішуємо підписати угоду про утворення «Еквестрійської соціалістичної республіки».\n(Із Декларації про утворення ЕСР)" # (&?)

 SE_STG_DEFEATS_CHN_T: "Перемога Сталліонграду"
 SE_STG_DEFEATS_CHN_A: "Комунізм марширує по планеті."
 SE_STG_DEFEATS_CHN_D: "«Слава нашій героїчній Червоній армії, що захистила незалежність нашої вітчизни та здобула перемогу над ворогом!\nСлава нашому великому народу, народу-переможцю!\nВічна слава героям, що полягли в бою з ворогом і віддали свої життя в ім'я свободи та щастя нашого народу!»\n(Нестор Лунін)"

 SE_STG_DEFEATED_T: "Крах Сталліонграду"
 SE_STG_DEFEATED_A: "Комуністичний експеримент провалився."
 SE_STG_DEFEATED_D: "«Таємниця хорошого життя у країні — проста: тяжка праця, дотримання закону і жодного комунізму!»\n($BRF_king_kloseu_de_kissau$)"

 SE_DED_T: "Апокаліпсис"
 SE_DED_A: "І запала тиша."
 SE_DED_D: "«Друже, я б ніколи і не подумав,\nале принесеного війною гірше тиши не знайти».\n(Невідомий поет передапокаліптичної епохи)" # (@+++)

### 1.1.0 - 1.1.1 ###
 SE_OST_GRIFFONIA_T: "Ост-Грифонська імперія" # HLQ_empire_fascism
 SE_OST_GRIFFONIA_A: "Ненависть позбавила їх здорового глузду."
 SE_OST_GRIFFONIA_D: "«Дехто називає нас чудовиськами. Усе, що ми вчинили, ми вчинили в ім'я грифонів. І ми не заподіяли жодну шкоду нашу сутності, нашим душам і нашій вдачі».\n($HLQ_edler_von_wingenberg$)" # (&?)

 SE_PAN_GRIFFONIA_T: "Пангрифоняча соціалістична співдружність" # SRS_PGSC_communism
 SE_PAN_GRIFFONIA_A: "Уперед, до комунізму!"
 SE_PAN_GRIFFONIA_D: "«Соціалізм у житті вимагає повного духовного перетворення в масах, вироджених століттями правління буржуазії».\n($JER_char_allard$)" # (&?)

 SE_WORLD_SOC_REP_T: "Світова соціалістична республіка" # COM_world_communism(_DEF)
 SE_WORLD_SOC_REP_A: "Світ об'єднаний як ніколи раніше."
 SE_WORLD_SOC_REP_D: "«Життя прекрасне. Нехай майбутні покоління очистять його від усього зла, гноблення та насилля й потішаться йому наповну!»\n($STG_sinister_serov_name$)" # (&)

 SE_HOLY_PONY_EMPIRE_T: "Священна Імперія Поні" # LCT_griff_empire_fascism
 SE_HOLY_PONY_EMPIRE_A: "Отже, Грифонія тепер Понія?"
 SE_HOLY_PONY_EMPIRE_D: "«Подібно палаючим руїнам Грифенгайму спалахне і сама династія Ґроверів разом з їх гнилою імперією».\n(Великий принц $LCT_heavenly_snow$)" # (@+++)

 SE_GRI_RIV_WAR_GRI_T: "Велика Східна війна"
 SE_GRI_RIV_WAR_GRI_A: "Alea iacta est."
 SE_GRI_RIV_WAR_GRI_D: "«Тепер навіть найзатятіші ідеалісти розуміли, що добро і зло — лише філософські поняття. Це був час, коли навіть малих дітей навчали, що різанина, руйнування та винищення цілих народів є належними й гідними похвали вчинками. Щодня мільйони газетних шпальт стверджували й повторювали це».\n(Грифонський письменник)" # (@+++)

 SE_LNS_POWNER_T: "Герцланд у вогні"
 SE_LNS_POWNER_A: "Око за око."
 SE_LNS_POWNER_D: "«За кожного поні, вбитого реформістами,\nЗа кожен расистський закон, що вони ухвалили,\nЗа кожну кривду, що не була виправлена,\nЗа всіх загиблих Керстінінкай битимуться!»\n(Маршова пісня Керстінінкай)" # (@+++)

 SE_LNS_GM_T: "Грифкінзька імперія" # LSC_griffking_empire_cosmetic_neutrality
 SE_LNS_GM_A: "Утопія з таборами та репресіями?"
 SE_LNS_GM_D: "«Безглуздість революції полягає в бажанні утвердити чесноту на землі. Коли прагнеш зробити всіх істот добрими й мудрими, вільними, поміркованими та великодушними, неминуче приходиш до фатального бажання вбити кожного».\n(Анатоль Франс)" # (@+++)

 SE_KARTHIN_T: "Карфінська імперія" # WNG_EMPIRE_fascism
 SE_KARTHIN_A: "Тріумф! Тріумф!"
 SE_KARTHIN_D: "«За століття своєї історії Вінґбардія пережила чимало визначних моментів, але нинішній — безумовно, один із найурочистіших».\n($WNG_giulio_beakolini$)" # (@+++)

 SE_KARTHIN_COM_T: "Об'єднані соціалістичні республіки Південної Грифонії" # WNG_EMPIRE_communism
 SE_KARTHIN_COM_A: "Пролетаріат розриває кайдани."
 SE_KARTHIN_COM_D: "«Соціалізм є утвердженням нових прав особистості».\n($WNG_antonino_proletarino$)" # (@+++)

 SE_REPUBLIC_WIN_COM_T: "Триколор над Грифенгаймом"
 SE_REPUBLIC_WIN_COM_A: "Новій епосі — Нова Республіка." # (@+++)
 SE_REPUBLIC_WIN_COM_D: "«Нам орати й будувати,\nВчитись, діяти щомить,\nВ власні сили віру мати,\nВільний рід хай ввись злетить!»\n(Республіканська пісня)" # (@+++)

 SE_REPUBLIC_WIN_AUTH_T: "Триколор над Грифенгаймом"
 SE_REPUBLIC_WIN_AUTH_A: "Хай живе Республіка!"
 SE_REPUBLIC_WIN_AUTH_D: "«Єдність, право і свобода,\nЩастя захист і розмай,\nКвітни в сяйві цього щастя,\nКвітни, рідний отчий край!»\n(Республіканська пісня)" # (@+++)

 SE_REPUBLIC_WIN_S_T: "Триколор над Грифенгаймом"
 SE_REPUBLIC_WIN_S_A: "За сильну Республіку!" # (&?)
 SE_REPUBLIC_WIN_S_D: "«Нікому не варто дякувати мені за взятий тягар, адже це надто велика жертва, щоб іти на неї з метою комусь догодити чи з добротою. Я роблю це для своєї країни, виконуючи обов’язок перед власним сумлінням — холодно й спокійно».\n($FAT_reinhard_suntail$)" # (@+++)

 SE_STG_ATTACK_EQS_T: "Сталліонград марширує на Еквестрію" # (@+++)
 SE_STG_ATTACK_EQS_A: "Наступна сходинка революції." # (@+++)
 SE_STG_ATTACK_EQS_D: "«І тут, і там, серед лав, лунає один і той самий голос:\n“Хто не з нами — той проти нас! Серед нас нема байдужих, правда — за нами!”\nІ стою я серед них, у виючому полум’ї та диму,\nІ з усіх сил молюся за них і за інших».\n(Поема часів революції)" # (@+++)
 #https://ruverses.com/maximilian-voloshin/civil-war/

 SE_WAR_TWO_CONT_EQS_VS_GRI_T: "Схід проти заходу"
 SE_WAR_TWO_CONT_EQS_VS_GRI_A: "Кров, труд, сльози і піт."
 SE_WAR_TWO_CONT_EQS_VS_GRI_D: "«У війні між заходом і сходом перемагає південь».\n(Грифоняче прислів'я)"

 SE_WAR_TWO_CONT_CHN_VS_GRI_T: "Схід проти заходу"
 SE_WAR_TWO_CONT_CHN_VS_GRI_A: "Panzer, marsch!"
 SE_WAR_TWO_CONT_CHN_VS_GRI_D: "«Знову й знову повторювалася та сама історія: грандіозні плани й мізерні здобутки, адже бракувало мудрості й смиренності, щоб утілити ці великі задуми в життя; панувала гординя, а зрештою спалахувала війна, що клала край усім благородним починанням».\n(Фельдмаршал $GRI_erich_ebonwing$)" # (@+++)

 SE_WAR_TWO_CONT_STG_VS_GRI_T: "Схід проти заходу"
 SE_WAR_TWO_CONT_STG_VS_GRI_A: "Останній крок до світової револції."
 SE_WAR_TWO_CONT_STG_VS_GRI_D: "«Робітнику, хіба ти не чуєш?\nВиробники вугілля та сталі шепочуться!\nВиробництво хімічної зброї ричить!\nЦей шепіт лунає з усіх континентів!\n“Мобілізація проти Сталліонграда!”»\n(Сталліонградська пісня)" # (@+++)

 SE_WAR_TWO_CONT_SOL_VS_GRI_T: "Схід проти заходу"
 SE_WAR_TWO_CONT_SOL_VS_GRI_A: "Горе тим, хто прогнівив Сонце."
 SE_WAR_TWO_CONT_SOL_VS_GRI_D: "«Загроза грифонів нависала над нашим родом століттями. Багато років вони вбивали поні на Сході, і очевидно, що одного дня вони прийдуть і в наш дім. Я краще перетворю всю Грифонію на попіл, ніж дозволю хоча б одному ворожому солдату ступити на берег Еквуса».\n(Імператриця $EQS_SOL_daybreaker$)" # (@+++)

 SE_WAR_TWO_CONT_NLR_VS_GRI_T: "Схід проти заходу"
 SE_WAR_TWO_CONT_NLR_VS_GRI_A: "Просто як у старі погані часи."
 SE_WAR_TWO_CONT_NLR_VS_GRI_D: "«Грифони завжди вважали поні слабкими. Але правда в тому, що вони самі — не більше за агресивних, варварських хижаків. Нащо нам марнувати час на безглузді суперечки, якщо ми можемо знищити цю загрозу раз і назавжди? Наші Легіони встановлять стяги Імперії над їхніми містами!»\n(Імператриця $NLR_nightmare_moon$)" # (@+++)

### 1.2.0 ###
 SE_GREAT_WAR_CHN_D_T: "Кінець Гегемонії" # (@+++)
 SE_GREAT_WAR_CHN_D_A: "Знову переможені. В цей раз остаточно." # (@+++)
 SE_GREAT_WAR_CHN_D_D: "«Бомбардування, загороджувальний вогонь, вогневий вал, міни, газ, танки, кулемети, ручні гранати — слова, прості слова, але саме в них криється весь жах цього світу».\n(Грифонський журналіст)" # (@+++)

 SE_STG_INTERVENTION_T: "Сталліонградська інтервенція" # (@+++)
 SE_STG_INTERVENTION_A: "І знову продовжується бій..." # (@+++)
 SE_STG_INTERVENTION_D: "«Час настав — час визволення робітничого класу. Наш обов'язок — врятувати поні Еквестрії від схиблених на владі принцес та їхніх буржуазних поплічників».\n(З доповіді у Сталліонграді щодо питання інтервенції у громадянську війну)" # (@+++)

 SE_EQC_LIBERATES_EQS_T: "Еквестрія повертається з вигнання" # (@+++)
 SE_EQC_LIBERATES_EQS_A: "Новий Світ врятував Старий." # (@+++)
 SE_EQC_LIBERATES_EQS_D: "«Вкотре вільні народи Еквестрії та всього Еквусу вийшли переможцями зі смертельної битви. Жахлива тиранія, що загрожувала самому нашому існуванню, була розбита та знищена. Це і є справжня слава, і нехай вона буде з нами назавжди, освітлюючи наш шлях уперед!»\n($EQS_princess_celestia$)" # (@+++)

 SE_DED_BC_T: "Великий чорний похід" # на заміну хрестового походу
 SE_DED_BC_A: "Не така вже й казка."
 SE_DED_BC_D: "Вони йдуть\nВони йдуть\nВони йдуть\nВони йдуть"

 SE_DED_DEFEATED_T: "Священна перемога" # (@+++)
 SE_DED_DEFEATED_A: "In saecula saeculorum."
 SE_DED_DEFEATED_D: "«Протягом століть наш орден стримував орди монстрів, не даючи їм знищити цивілізацію. Протягом століть ми доблесно виконували свій обов'язок. І нарешті настав день, коли я можу оголосити: наше завдання позаду! Армій нежиті більше немає, настав час їм спочити назавжди».\n(Настоятель Арктурійського ордену)" # (@+++)

 SE_RIV_UNITE_TITLE: "Об'єднання Річкових земель"

 SE_RIV_RCT_RS_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_RCT_RS_A: "In varietate concordia."
 SE_RIV_RCT_RS_D: "«Цей Договір знаменує собою новий етап у процесі створення дедалі тіснішого союзу між створіннями Річкових Земель, у якому рішення приймаються максимально відкрито та максимально близько до громадянина».\n(З договору про заснування Річкової Федерації)" # (@+++)

 SE_RIV_RCT_AL_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_RCT_AL_A: "УГС стоїть на сторожі." # (@+++)
 SE_RIV_RCT_AL_D: "«Чекіст — це політичний боєць. Він — вірний син батьківщини. Він стоїть у перших лавах битви за зміцнення могутності нашої нації та держави».\n($RCT_arclight$)" # (@+++)

 SE_RIV_RCT_NW_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_RCT_NW_A: "Ex unitate vires."
 SE_RIV_RCT_NW_D: "«...І дружба між створіннями Річкових Земель — це велике й серйозне досягнення. Адже доки існує ця дружба, створіння нашої країни будуть вільними та залишуться непереможними. Ніхто нам не страшний, ані внутрішні, ані зовнішні вороги, доки ця дружба дихає».\n($RCT_nova_whirl$)" # (@+++)

 SE_RIV_RCT_CH_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_RCT_CH_A: "Червона зірка Сходу." # (@+++)
 SE_RIV_RCT_CH_D: "«Знищення класів досягається шляхом посилення класової боротьби. А відмирання держави відбудеться через максимальне зміцнення її ж влади, необхідне для того, аби добити залишки вмираючих класів і організувати оборону проти капіталістичного оточення».\n($RCT_caramel_haze$)" # (@+++)

 SE_RIV_NIM_MK_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_NIM_MK_A: "Свобода, рівність, єдність."
 SE_RIV_NIM_MK_D: "«Щира волелюбність — це те, що відрізняє народи Річкових земель від грифонів».\n($NIM_metakeros$)"

 SE_RIV_DEP_KG_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_DEP_KG_A: "Феодалізм досі в моді?" # (@+++)
 SE_RIV_DEP_KG_D: "«Що таке дворянство? Це спадковий і найвищий клас народу, тобто наділений великими перевагами щодо власності та особистої свободи. Ким? Народом або його представниками. З якою метою? З метою мати могутніх захисників або осіб, наближених до влади та безпосередніх представників».\n($DEP_king_grimhoof$)" # (@+++)

 SE_RIV_FRE_CR_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_FRE_CR_A: "Ченці на чолі Сходу." # (@+++)
 SE_RIV_FRE_CR_D: "«Запевняю вас, що ми захищатимемо унікальність усіх націй Річкових Земель. Ми більше не Коаліція, а Федерація Рівних. Кожен із нас важливий, і кожного буде почуто».\n($FRE_crimson_cridhe_an_dragon_nic_heart$)" # (@+++)

 SE_RIV_DMT_MOLLY_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_DMT_MOLLY_A: "Воістину, принцеса Річкових земель."
 SE_RIV_DMT_MOLLY_D: "«Я обіцяю вам захищати гармонію на нашій землі, боротися з будь-якою загрозою для наших народів і традицій. Я бачу нашу Батьківщину відкритою для всіх — поні, грифонів, собак, зебр та всіх, хто потребує допомоги. Але наша доброта не є слабкість і ми готові швидко нагадати чому Річкові Землі досі не змогли підкорити».\n($DMT_princess_molly$)" # (@+++)

 SE_RIV_DMT_ROVER_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_DMT_ROVER_A: "Мовчати! Король говорить."
 SE_RIV_DMT_ROVER_D: "«Я за монархію, бо така моя королівська воля».\n(Король Ровер)"

 SE_RIV_LCT_DS_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_LCT_DS_A: "Більше, ніж армія з країною." # (@+++)
 SE_RIV_LCT_DS_D: "«Ми відмовилися від планів помсти грифонам і обрали шлях миру, але нехай знають: якщо Імперія спробує захопити наші землі, сама природа обернеться проти них!»\n($LCT_deirdra_skye$)" # (@+++)

 SE_RIV_LCT_WL_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_LCT_WL_A: "Кошмар Імперії."
 SE_RIV_LCT_WL_D: "«Вір, корися, борися».\n($LCT_westerly_leeward$)" # (&?)

 SE_RIV_LCT_WB_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_LCT_WB_A: "Si vis pacem, para bellum."
 SE_RIV_LCT_WB_D: "«Яка б сила не прийшла нас знищити, ми завжди розбивали її. Ті, хто не зміг перемогти нас розділеними, нехай навіть не сміють думати про напад на нас об'єднаних».\n($LCT_wavebreaker$)" # (@+++)

 SE_RIV_BAK_WL_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_BAK_WL_A: "Маяк свободи."
 SE_RIV_BAK_WL_D: "«Демократія — це приваблива мета, а не безпечна гавань. Зрештою, як і свобода — це безперервний пошук, а не кінцеве досягнення».\n($BAK_water_lily$)" # (@+++)

 SE_RIV_BAK_TD_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_BAK_TD_A: "Менше контролю, більше свободи."
 SE_RIV_BAK_TD_D: "«Обмежена держава з вільною економічною системою — це ґрунт, на якому квітне дерево свободи».\n($BAK_tea_dip$)" # (@+++)

 SE_RIV_BAK_BF_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_BAK_BF_A: "Об'єднані раз і назавжди."
 SE_RIV_BAK_BF_D: "«Дорожіть братерством і єдністю, яко зіницею ока».\n($BAK_bray_foam$)"

 SE_RIV_BAK_FS_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_BAK_FS_A: "Одна країна, одна нація, одна культура."
 SE_RIV_BAK_FS_D: "«У демократії гидкі три речі: безхребетність, звичка колективної безвідповідальності та хибний міф про універсальне щастя й невпинний прогрес».\n($BAK_firm_scow$)"

 SE_RIV_WIT_WS_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_WIT_WS_A: "Еквестрія Сходу."
 SE_RIV_WIT_WS_D: "«Насправді монархія та республіка — це лише форми однієї й тієї ж сутності — держави, і цілі останньої однаково спільні для них обох. Чому прагнення до свободи та рівності має бути фундаментально чужим одній із цих форм?»\n(Королева $WIT_white_star$)" # (@+++)

 SE_RIV_WIT_V_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_WIT_V_A: "Рівність, освіта, свобода."
 SE_RIV_WIT_V_D: "«Ми повалили монархію, поклали край ненависній владі аристократії та принесли Віттенленду довгоочікувану свободу. Однак тепер перед нами стоїть набагато серйозніше завдання. Я обіцяю вам, що відтепер усі Річкові Землі стануть твердинею миру, рівності та свободи всій Грифонії».\n(Вольяр Джинджербірд)" # (@+++)

 SE_RIV_WIT_HARMONY_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_WIT_HARMONY_A: "У союзі та свободі." # (@+++)
 SE_RIV_WIT_HARMONY_D: "«Зважаючи на те, що зміцнення глибоко вкорінених відносин дружби, добросусідства та взаємовигідного співробітництва відповідає фундаментальним інтересам народів і служить справі миру та безпеки; усвідомлюючи нашу відповідальність за збереження громадянського миру та міжнаціональної злагоди, ми проголошуємо створення Річкової Федерації».\n(З договору про заснування Річкової Федерації)" # (@+++)

 SE_RIV_WIT_NEUTRAL_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_WIT_NEUTRAL_A: "Єдність, вірність, справедливість." # (@+++)
 SE_RIV_WIT_NEUTRAL_D: "«Відмова від традицій — навіть в ім'я свободи — призводить до руйнування норм спільноти, руйнування більш-менш прийнятних форм соціальної поведінки».\n(Віттенлендський дворянин)" # (@+++)

### 1.3.0 ###
 SE_HERZLAND_UNITE_TITLE: "Об'єднання Герцланду"

 # Енґрівер
 SE_HERZLAND_ANG_LEER_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_ANG_LEER_A: "Жага Леєра до влади зростає." # (@+++)
 SE_HERZLAND_ANG_LEER_D: "«Імперія відродилася. Нова, краща Імперія, що ґрунтується на трьох стовпах: беззаперечній відданості Імператору, нещадності до ворогів і фанатичній боротьбі проти будь-якого інакодумства».\n(Імператор Леєр)" # (@+++)

 SE_HERZLAND_ANG_KINGDOM_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_ANG_KINGDOM_A: "До світлого майбутнього." # (@+++)
 SE_HERZLAND_ANG_KINGDOM_D: "«Божевільна мрія про єдину країну для всіх грифонів — це не більше ніж вигадка фанатиків-реваншистів. Часи змінюються, і такі держави більше не життєздатні; їхня доля — впасти, немов Імперія. Моя мрія — забезпечити мир і стабільність у Герцланді, а не посилати ще одне покоління на забій».\n(Ґросмаршал Отмар)" # (@+++)

 SE_HERZLAND_ANG_ANARCHY_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_ANG_ANARCHY_A: "Свобода — найвища цінність." # (@+++)
 SE_HERZLAND_ANG_ANARCHY_D: "«Проти держави, гноблення та капіталізму!»\n($ANG_willie_scherler$)" # (@+++)

 SE_HERZLAND_ANG_BLUHM_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_ANG_BLUHM_A: "Мета — триколор над континентом!" # (@+++)
 SE_HERZLAND_ANG_BLUHM_D: "«Довгоочікувана мить нарешті настала: Імперію знищено, а на її руїнах майоріє триколор. Але хоча Герцланд звільнено, багато грифонів страждають під гнітом тиранів. Ми скуштуємо плоди нашої перемоги тільки коли прапор Республіки буде піднятий над землями від Нової Скайнавії до Ріапорту. До роботи, браття-грифони!»\n($little_kemerskai$)" # (@+++)

 SE_HERZLAND_ANG_ORDENSTAAT_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_ANG_ORDENSTAAT_A: "Чорне Сонце сходить..." # (@+++)
 SE_HERZLAND_ANG_ORDENSTAAT_D: "«STRENG GEHEIM»\n(STRENG GEHEIM)" # (@+++)

 SE_HERZLAND_ANG_WESCHLER_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_ANG_WESCHLER_A: "Республіка сміливо дивиться вперед." # (@+++)
 SE_HERZLAND_ANG_WESCHLER_D: "«Моя робота тут закінчена. Ми завершили революцію, що почали понад 30 років тому, і я пишаюся тим, що долучився до її успіху. Але нашій молодій республіці потрібні нові, молоді лідери, які виведуть Герцланд на абсолютно новий рівень».\n($ANG_Otto_Weschler$)" # (@+++)

 # Ґрайфенмаршен
 SE_HERZLAND_PYT_HARMONY_EQS_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_PYT_HARMONY_EQS_A: "Дружба — це диво!" # (@+++)
 SE_HERZLAND_PYT_HARMONY_EQS_D: "«Дорога принцесо Твайлайт,\nЗі щирою радістю повідомляю Вам, що війна, яка поглинула мою багатостраждальну Батьківщину, закінчилася. Я готовий взяти на себе відповідальність і повести грифонів у світле майбутнє, головними принципами якого стануть ідеї дружби та гармонії».\n(Ваш вірний учень, $PYT_archibald_dawnfeather$)" # (@+++)

 SE_HERZLAND_PYT_HARMONY_REPUBLIC_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_PYT_HARMONY_REPUBLIC_A: "Гармонія, Віра, Мир." # (@+++)
 SE_HERZLAND_PYT_HARMONY_REPUBLIC_D: "«Так само, як поні вірні своїм принцесам, так і ми вірні нашим богам. Так само, як Еквестрія століттями живе без війн, так і ми мріємо про те ж саме. З остаточним крахом проклятої Імперії та возз'єднанням нашої Батьківщини, для нас нарешті настає власна епоха миру та процвітання».\n($PYT_archibald_dawnfeather$)" # (@+++)

 SE_HERZLAND_PYT_COM_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_PYT_COM_A: "Імперія в червоних стягах." # (@+++)
 SE_HERZLAND_PYT_COM_D: "«Справжня свобода існує лише там, де знищено експлуатацію, де немає гноблення одних істот іншими, де немає безробіття та жебрацтва, де ніхто не тремтить через те, що завтра може втратити роботу, дім, свій хліб. Сьогодні ми визволили Герцланд, завтра ми визволимо всю Грифонію».\n($PYT_wingbert_rohmer$)" # (@+++)

 SE_HERZLAND_PYT_DIETRICH_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_PYT_DIETRICH_A: "Herzland über alles."
 SE_HERZLAND_PYT_DIETRICH_D: "«Герцландці — найдосконаліші з грифонів і по праву стоять вище за всіх інших. Саме Герцланд був культурним центром колишньої Імперії — не Вінґбардія, не Аквілея. Ми не можемо дозволити нікому забруднювати нашу дорогоцінну культуру! Ані іншим грифонам, ані іншим видам!»\n($PYT_dietrich_mach$)" # (@+++)

 SE_HERZLAND_PYT_TRUTHAHN_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_PYT_TRUTHAHN_A: "На це Божа воля." # (@+++)
 SE_HERZLAND_PYT_TRUTHAHN_D: "«Боги прихильні до нас! В ім'я Борея, Ейр та Арктурія ми вирушимо у священний похід проти зрадників та невірних — комуністів, республіканців, архонтів, атеїстів, мааритів та інших негідників! Не щадіть жодних паразитів, адже наші діяння угодні Богам!»\n($PYT_wilke_truthahn$)" # (@+++)

 SE_HERZLAND_PYT_EREBUS_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_PYT_EREBUS_A: "Немов фенікс із попелу." # (@+++)
 SE_HERZLAND_PYT_EREBUS_D: "«Імперія — це найбільше досягнення грифонів, а її занепад — найбільша катастрофа й ганьба. Але ми ніколи не тікали від труднощів, і якщо в нас є можливість відновити єдність та велич грифонів, то зробити це — наш обов'язок. За Імперію, за грифонів, за єдність!»\n($PYT_emperor_erebus$)" # (@+++)

 SE_HERZLAND_PYT_REPUBLIC_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_PYT_REPUBLIC_A: "Ґровер I перевернувся." # (@+++)
 SE_HERZLAND_PYT_REPUBLIC_D: "«Те, що нашому маленькому Ґрайфенмаршену вдалося знищити Імперію, стало чітким знаком: час тиранічних монархій відходить у минуле. Грифонам не потрібні завоювання на іншому кінці континенту чи імперська слава, їм потрібна їжа на столі та можливість самим вирішувати свою долю».\n($PYT_erebus_whiteplume$)" # (@+++)

 # Єль
 SE_HERZLAND_YAL_ARCHONT_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_YAL_ARCHONT_A: "По волі Богів!" # (@+++)
 SE_HERZLAND_YAL_ARCHONT_D: "«Нехай діяння ваших предків зворушать вас і спонукають ваш розум до мужніх звершень; слава та велич Ґровера I та його сина Ґровера II, які розширили на цих землях територію святої церкви. О, найдоблесніші воїни і нащадки непереможних предків, не звироднійте, а згадайте звитягу своїх предків!»\n(Протей III)" # (@+++)

 SE_HERZLAND_YAL_GROVER_II_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_YAL_GROVER_II_A: "Старий грифон ще має порох у порохівницях." # (@+++)
 SE_HERZLAND_YAL_GROVER_II_D: "«Імперія не має і не може мати жодних інших союзників, окрім її армії та флоту».\n($YAL_emperor_grover_ii$)" # (@+++)

 SE_HERZLAND_YAL_BOREAS_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_YAL_BOREAS_A: "Амінь." # (@+++)
 SE_HERZLAND_YAL_BOREAS_D: "«Veni, creator Spiritus,\nMentes tuorum visita,\nImple superna gratia,\nQuae tu creasti, pectora»." # (@+++)

 SE_HERZLAND_YAL_NEW_SPARK_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_YAL_NEW_SPARK_A: "Піднесення Федерації." # (@+++)
 SE_HERZLAND_YAL_NEW_SPARK_D: "«Хоч би як дехто критикував демократію, це найкраще, що світ може запропонувати нам на цей момент, якщо, звісно, ваша мета не полягає в тому, щоб скотитися у прірву тиранії чи анархії».\n($YAL_georgina_fredrika_schuler$)" # (@+++)

 SE_HERZLAND_YAL_TECHNOCRACY_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_YAL_TECHNOCRACY_A: "Наука в авангарді." # (@+++)
 SE_HERZLAND_YAL_TECHNOCRACY_D: "«У міру розвитку індустріального суспільства техноструктура відіграє дедалі важливішу роль як в економіці, так і в управлінні суспільством загалом. Тому політична влада має бути зосереджена в руках технічних спеціалістів, які керуватимуть суспільством на основі науково-технічних знань».\n($YAL_rector_magnificus_mikusian$)" # (@+++)

 SE_HERZLAND_YAL_COM_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_YAL_COM_A: "Анархія-мати, синів своїх любе." # (@+++)
 SE_HERZLAND_YAL_COM_D: "«Анархізм виступає за звільнення розуму від панування релігії та звільнення тіла від примусу власності; звільнення від кайданів та обмежень уряду. Він виступає за суспільний лад, заснований на вільному об'єднанні індивідів».\n($YAL_erich_muhschnabel$)" # (@+++)

 # Катерин
 SE_HERZLAND_KAT_COM_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_KAT_COM_A: "Соціалізм, Віра, Імперія." # (@+++)
 SE_HERZLAND_KAT_COM_D: "«Існує лише одна важлива відмінність між капіталізмом і соціалізмом: капіталізм — це шлях Маара та його слуг — експлуататорів-дворян, багатіїв і фальшивих архонтів, тоді як соціалізм — це шлях Богів, які зі щирою любов'ю наглядають за кожним грифоном».\n($KAT_heinrich_duskfeather$)" # (@+++)

 SE_HERZLAND_KAT_KATERINTREUE_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_KAT_KATERINTREUE_A: "Порядок в авангарді." # (@+++)
 SE_HERZLAND_KAT_KATERINTREUE_D: "«Влада найкращих — це природний порядок речей, встановлений з давніх-давен. Довірити простакам право вибору — означає фактично опуститися до їхнього рівня. У будь-якому разі, вони просто не зрозуміють, як розпорядитися владою».\n(Член Ради)" # (@+++)

 SE_HERZLAND_KAT_REPUBLIC_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_KAT_REPUBLIC_A: "За кращий світ." # (@+++)
 SE_HERZLAND_KAT_REPUBLIC_D: "«Я пишаюся тим, що живу в одній країні з тими, хто не плазував перед декадентською Імперією, дворянством та архонтами. І хоча багато синів і дочок нашого Фатерлянду більше ніколи не розплющать очі, їхня жертва не була марною. Герцланд скинув свої кайдани і більше ніколи не дозволить одягнути їх знову».\n($KAT_grandmaster_hector_ardennson$)" # (@+++)

 SE_HERZLAND_KAT_NEUTRAL_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_KAT_NEUTRAL_A: "Heil Herzland dir!"
 SE_HERZLAND_KAT_NEUTRAL_D: "«Століттями наша нація перебувала в тіні Імперії, вмираючи за Імперію, страждаючи за Імперію. Але в цей світлий час я можу з повною впевненістю сказати, що ця епоха минула. Зі щирою гордістю ми можемо заявити на весь світ — ми не якийсь там уламок Імперії! Ми не гірші за аквілейців чи вінґбардійців. Ми — герцландці!»\n($KAT_grandmaster_erik_grimclaw$)" # (@+++)

 # Ромау
 SE_HERZLAND_ROU_COM_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_ROU_COM_A: "Соціалізм крокує світом." # (@+++)
 SE_HERZLAND_ROU_COM_D: "«Єдність цієї воістину революційної боротьби пригнобленого класу за створення раю на землі для нас важливіша, ніж єдність думок пролетарів про рай на небі».\n($ROU_roland_ehrhardt$)" # (@+++)

 SE_HERZLAND_ROU_HARMONY_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_ROU_HARMONY_A: "Ідею не так легко вбити." # (@+++)
 SE_HERZLAND_ROU_HARMONY_D: "«Нехай іскра згасла там, але її полум'я спалахне тут! Ми підхопимо прапор свободи і станемо новим маяком надії для всіх пригноблених грифонів! Мрія Кемерская не мертва!»\n($ROU_gabriella_di_karthin$)" # (@+++)

 SE_HERZLAND_ROU_NEUTRAL_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_ROU_NEUTRAL_A: "Прибуток в авангарді." # (@+++)
 SE_HERZLAND_ROU_NEUTRAL_D: "«Епоха Імперії — це минуле. Епоха Республіки — це майбутнє. Передавши владу гідним громадянам, ми, безсумнівно, доведемо свою мудрість усьому світу. Очевидно, що ті, хто гідно забезпечили себе самостійно, зможуть забезпечити і країну. У виграші будуть усі».\n(Жюль Мішель Равіолі)" # (@+++)

 SE_HERZLAND_ROU_EYR_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_ROU_EYR_A: "Архонти захистять їх." # (@+++)
 SE_HERZLAND_ROU_EYR_D: "«Ейр плаче, дивлячись на нас! Грифонія занурилася в божевілля, єретики та зрадники повстають звідусіль! Лише передавши владу архонтам, обраним богами, ми зможемо створити державу, благословенну самими богами! Це єдиний спосіб уникнути їх гніву!»\n(Еріон XII)" # (@+++)

 # Фетізія
 SE_HERZLAND_FEA_STAPPENBELD_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_FEA_STAPPENBELD_A: "Сьогодні робітники не самотні!" # (@+++)
 SE_HERZLAND_FEA_STAPPENBELD_D: "«Капіталісти самі продадуть нам мотузку, на якій ми їх повісимо».\n($FEA_bernhardt_stappenbeld$)" # (@+++)

 SE_HERZLAND_FEA_KOGCHEL_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_FEA_KOGCHEL_A: "Впевненість у кращому майбутньому." # (@+++)
 SE_HERZLAND_FEA_KOGCHEL_D: "«Ми розмовляємо різними мовами, ми належимо до різних видів, але в нашій крові немає різниці — це кров і воля пролетаріату».\n($FEA_gerben_kogchel$)" # (@+++)

 SE_HERZLAND_FEA_ROZENKAMP_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_FEA_ROZENKAMP_A: "Клас і раса." # (@+++)
 SE_HERZLAND_FEA_ROZENKAMP_D: "«У правих ми візьмемо націоналізм, який так згубно об'єднався з капіталізмом, а в лівих ми візьмемо соціалізм, який уклав такий нещасливий союз з інтернаціоналізмом».\n($FEA_herman_rozenkamp$)" # (@+++)

 SE_HERZLAND_FEA_HEEREN_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_FEA_HEEREN_A: "Вони просто виконували накази." # (@+++)
 SE_HERZLAND_FEA_HEEREN_D: "«У моїй армії немає воєнних злочинців — лише герої війни».\n($FEA_godfried_heeren$)" # (@+++)

 SE_HERZLAND_FEA_MOLDERNIK_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_FEA_MOLDERNIK_A: "За Фетізію, за Імперію!" # (@+++)
 SE_HERZLAND_FEA_MOLDERNIK_D: "«ФНС — це не просто політична партія, а справжній союз народу, об'єднаного спільною метою, зацікавленого в підтриманні порядку, добробуту країни та розвитку нашої Батьківщини в релігійному, культурному та економічному аспектах».\n($FEA_anton_moldernik$)" # (@+++)

 SE_HERZLAND_FEA_VORST_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_FEA_VORST_A: "Знищити Імперію не так просто." # (@+++)
 SE_HERZLAND_FEA_VORST_D: "«Наш націоналізм не відроджується; зрештою, він ніколи й не вмирав. Це безсмертна рушійна сила нашої великої нації, яка завжди приходила їй на допомогу у важкі часи. Настав час вийти у світ і повернути нашу славу».\n(Герман ван Ворст-тот-Ворст)" # (@+++)

 SE_HERZLAND_FEA_DUKE_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_FEA_DUKE_A: "Отже, ось як помирає свобода." # (@+++)
 SE_HERZLAND_FEA_DUKE_D: "«Замах на моє життя залишив на мені шрами. Але запевняю вас, моя рішучість ще ніколи не була такою сильною! З метою забезпечення безпеки та подальшої стабільності, Фетізія та весь Герцланд будуть реорганізовані в Нову Імперію Грифонів! Заради безпечного та надійного суспільства!»\n(Імператор Герлах I)" # (@+++)

 SE_HERZLAND_FEA_UNWILLING_DICTATOR_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_FEA_UNWILLING_DICTATOR_A: "Хай живе Фетізія!" # (@+++)
 SE_HERZLAND_FEA_UNWILLING_DICTATOR_D: "«Мушу визнати, я досі шокований тим, куди ми зайшли. Відчайдушні заходи, яких ми вжили, щоб врятувати країну від Імперії, зрештою привели нас до Грифенгайма. Але багато хто з нас не очікував, що врешті-решт увесь Герцланд опиниться в наших пазурах. Ми виконали своє завдання, але чи варто нам іти далі? Я не впевнений».\n($FEA_edgar_pechvogel$)" # (@+++)

 SE_HERZLAND_FEA_COALITION_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_FEA_COALITION_A: "Мовчазний Герцог біля керма." # (@+++)
 SE_HERZLAND_FEA_COALITION_D: "«Демократичні реформи призвели до процвітання Фетізії, але тепер я можу лише сподіватися, що вони також допоможуть Імперії. Зрештою, революція показала, що ігнорування народу — це шлях у нікуди. Народ хоче бути почутим. Якщо це збереже Імперію живою і зробить грифонів щасливими, то це, безумовно, наш шлях».\n(Герлах IV)" # (@+++)

 # Паляниця
 SE_HERZLAND_STW_HARMONY_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_STW_HARMONY_A: "За Імперію та її народ."
 SE_HERZLAND_STW_HARMONY_D: "«Найвища з відзнак — це служба іншим».\n($STW_regina_eagleclaw$)"

 SE_HERZLAND_STW_COM_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_STW_COM_A: "Добре життя не дається просто так." # (@+++)
 SE_HERZLAND_STW_COM_D: "«Перемога ніколи не приходить сама — її зазвичай притягують силоміць».\n($STW_vitalius_moonbill$)" # (@+++)

 SE_HERZLAND_STW_NEUTRAL_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_STW_NEUTRAL_A: "Але якщо інших варіантів немає..." # (@+++)
 SE_HERZLAND_STW_NEUTRAL_D: "«Кожна війна між грифонами є війна громадянська».\n($STW_gabriela_eagleclaw$)" # (@+++)

 SE_HERZLAND_STW_SUPREMACY_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_STW_SUPREMACY_A: "І ніхто не зможе нас зупинити." # (@+++)
 SE_HERZLAND_STW_SUPREMACY_D: "«Ми, грифони, не боїмося нікого в світі, окрім Богів на небесах».\n($STW_julius_eagleclaw$)" # (@+++)

 # Бронзгілл
 SE_HERZLAND_BRZ_HARMONY_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_BRZ_HARMONY_A: "Імперія дихає." # (@+++)
 SE_HERZLAND_BRZ_HARMONY_D: "«Ми маємо намір утримати своє. І, можливо, повернути те, що втратили. Не для того я став Першим міністром Імператора, щоб головувати під час ліквідації Імперії Грифонів».\n($BRZ_winston_copperhill$)" # (@+++)

 SE_HERZLAND_BRZ_NEUTRAL_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_BRZ_NEUTRAL_A: "Стара гвардія у дії." # (@+++)
 SE_HERZLAND_BRZ_NEUTRAL_D: "«Не промовами й рішеннями більшості вирішуватимуться великі питання сучасності, а залізом і кров'ю. І на кону стоїть багато чого».\n($BRZ_ignatius_bronzetail$)" # (@+++)

 SE_HERZLAND_BRZ_COM_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_BRZ_COM_A: "Імператор та Ради." # (@+++)
 SE_HERZLAND_BRZ_COM_D: "«Капітал не визнає Батьківщини, і водночас він тим менш патріотичний, чим більше кричить про свій патріотизм».\n(Карл Лібаркнехт)" # (@+++)

 SE_HERZLAND_BRZ_JUCHE_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_BRZ_JUCHE_A: "По волі Ґровера!" # (@+++)
 SE_HERZLAND_BRZ_JUCHE_D: "«Ми повинні зробити монолітним авторитет Великого Вождя товариша Ґровера VI.\nМи повинні шанувати Великого Вождя товариша Ґровера VI з усією нашою відданістю».\n(Кімболл Баркинґ-Сан)" # (@+++)

 SE_HERZLAND_BRZ_LOUDBARK_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_BRZ_LOUDBARK_A: "Найвідданіші піддані." # (@+++)
 SE_HERZLAND_BRZ_LOUDBARK_D: "«Вірні пси Його Величності не підведуть Імператора! Його слово — закон для кожного з нас! І всі знають: краще померти за Ґровера, ніж жити для себе!»\n($BRZ_rufus_loudbark$)" # (@+++)

 SE_HERZLAND_BRZ_CHURCH_T: "$SE_HERZLAND_UNITE_TITLE$"
 SE_HERZLAND_BRZ_CHURCH_A: "Борей поведе нас." # (@+++)
 SE_HERZLAND_BRZ_CHURCH_D: "«Суспільство без релігії немов корабель без компаса. Без релігії будь-який грифон блукає в темряві. Лише релігія вказує грифонам на їхній початок і кінець».\n($BRZ_prelate_gunhild$)" # (@+++)

 # Бронзгілл: помста (НЕ об'єднання Герцланду)
 SE_HERZLAND_BRZ_REVENGE_COM_T: "Мавзолей Ґровера VI"
 SE_HERZLAND_BRZ_REVENGE_COM_A: "Спочивай із миром, Ґровере."
 SE_HERZLAND_BRZ_REVENGE_COM_D: "«Вічна пам'ять великому очільнику та наставнику, вічному імператорові Ґроверу VI».\n(Напис на мавзолеї)"

 SE_HERZLAND_BRZ_REVENGE_EMPIRE_OF_DOGS_T: "Імперія Псів"
 SE_HERZLAND_BRZ_REVENGE_EMPIRE_OF_DOGS_A: "Грифонам не можна довіряти."
 SE_HERZLAND_BRZ_REVENGE_EMPIRE_OF_DOGS_D: "«Ми підвели династію Ґроверів, але принаймні змусили зрадників захлинутися в крові. Відтепер спадщиною престолу Ґроверів опікуватимуться не віроломні грифони, а віддані династії та Імперії пси. Поки не знайдеться гідний кандидат, в імператорі нема сенсу».\n($BRZ_rufus_loudbark$)" # (@+++)

 # Не-Герцланд
 SE_DARK_WING_UNITES_EQS_T: "$SE_EQUESTRIA_UNITE_TITLE$"
 SE_DARK_WING_UNITES_EQS_A: "Цікавий поворот."
 SE_DARK_WING_UNITES_EQS_D: "«Дарк Вінґ — герой і чудовий поні!\nПолітик, лідер і борець!\nВеликий лідер, що країну підняв!\nВін Еквестрію не зрадив!»\n(«Шоу Дарк Вінґа»)" # (&)

 SE_LIGHT_CRUSADE_T: "Священна війна" # на заміну хрестового походу
 SE_LIGHT_CRUSADE_A: "Час покінчити з цією загрозою."
 SE_LIGHT_CRUSADE_D: "«З меж Півострова Жаху надійшла жахлива звістка, що нежить знову піднімає свої голови. На кого ж тоді покладено працю зі знищення цих монстрів, як не на вас? На вас, кого Боги наділили видатною воєнною славою, великою мужністю та силою, щоб трощити голови тим, хто чинить вам опір».\n(Звернення до лицарів Арктурійскього Ордену)" # (@+++)

 SE_NEW_MARELAND_EQUALIST_T: "Наша Держава"
 SE_NEW_MARELAND_EQUALIST_A: "Усміхайся."
 SE_NEW_MARELAND_EQUALIST_D: "«У суспільстві абсолютної рівності нема місця заздрості, ненависті та смутку. Радість і щастя — це єдині речі, які мешканці нашої красивої утопії можуть відчувати».\n($EQC_blueberry_frost$)"

 SE_IMPERIUM_OF_MAAR_T: "Імперіум Маара"
 SE_IMPERIUM_OF_MAAR_A: "Єресь."
 SE_IMPERIUM_OF_MAAR_D: "«Кров Маарові! Душі Маарові! Життя Маарові!»\n($AET_archon_erebus_i$)"

 SE_GRIFFONIAN_ANARCHY_T: "Грифонська вільна територія"
 SE_GRIFFONIAN_ANARCHY_A: "Свобода або смерть!"
 SE_GRIFFONIAN_ANARCHY_D: "«Влада породжує паразитів; хай живе анархія!»\n($AET_nestor_bernier$)"

 SE_GRF_WESTERN_EMPIRE_HIGHHILL_T: "Західна Імперія Грифонів" # GRF_EMP_neutrality
 SE_GRF_WESTERN_EMPIRE_HIGHHILL_A: "Новий гравець на світовій арені."
 SE_GRF_WESTERN_EMPIRE_HIGHHILL_D: "«Епоха нестабільності та хаосу нарешті минула. Як Імператор, я сповнений рішучості продемонструвати єдність, силу та непохитність нашого народу всьому світу. Більше ніхто не наважиться нам погрожувати».\n($erwin$)" # (@+++)

 SE_GRF_WESTERN_EMPIRE_IRONCLAW_T: "Західна Імперія Грифонів" # GRF_EMP_neutrality
 SE_GRF_WESTERN_EMPIRE_IRONCLAW_A: "Що вони більші, то гучніше падають." # (@+++)
 SE_GRF_WESTERN_EMPIRE_IRONCLAW_D: "«Ми, грифони — раса володарів, і маємо правити жорстко та справедливо. Необхідно розуміти, що найнікчемніший грифон у тисячу разів перевершує будь-якого поні, яка, чейнджлінґа та інших».\n($GRF_reyhard_ironclaw$)" # (@+++)

 SE_GRF_GOLDFEATHER_T: "Нова-Грифонія®" # GRF_shadowrun_fascism
 SE_GRF_GOLDFEATHER_A: "Усе купується і усе продається." # (@+++)
 SE_GRF_GOLDFEATHER_D: "«Як я став таким багатим? Я був розумнішим за найрозумніших і наполегливішим за найнаполегливіших!»\n($skeiron$)" # (@+++)

### 1.3.1 ###
 SE_KARTHIN_REPUBLIC_T: "Карфінська республіка" # WNG_EMPIRE_REPUBLIC_democratic
 SE_KARTHIN_REPUBLIC_A: "Ave!"
 SE_KARTHIN_REPUBLIC_D: "«У давні часи Картінська Республіка охоплювала найпрекраснішу частину світу і найцивілізованішу частку грифонячого роду. Кордони цієї республіки охоронялися давньою славою та дисциплінованою доблестю».\n(Едоардо Ґіббон, вінґбардійський історик)" # (@+++)

 SE_KARTHIN_KINGDOM_T: "Об'єднане Карфінське королівство" # WNG_EMPIRE_neutrality
 SE_KARTHIN_KINGDOM_A: "Корони нарешті об'єднані."
 SE_KARTHIN_KINGDOM_D: "«Ми об'єднали Південь. Тепер ми маємо об'єднати його народ».\n(Массімо д'Адзельйо, вінґбардійський романіст)"

### 1.4.0 ###
 SE_EQUESTRIA_UNITE_TITLE: "Об'єднання Еквестрії"

 SE_LSP_MAYOR_T: "$SE_EQUESTRIA_UNITE_TITLE$"
 SE_LSP_MAYOR_A: "Слава Еквестрійській республіці!"
 SE_LSP_MAYOR_D: "«...надалі я проголошую, що мир, порядок, спокій і цивільна влада відтепер існують у всіх Сполучених Штатах Еквестрії та на всій їхній території».\n(З прокламації про закінчення Громадянської війни)" # (@+++)

 SE_LSP_PINE_CHEST_T: "$SE_EQUESTRIA_UNITE_TITLE$"
 SE_LSP_PINE_CHEST_A: "Хай живе генерал Пайн Чест!"
 SE_LSP_PINE_CHEST_D: "«У кого ми маємо просити вибачення? У тих, хто намагався нас вбити? У тих, хто намагався знищити нашу країну? У кого? Це вони повинні просити вибачення за все, що зробили і збиралися зробити проти Еквестрії».\n($LSP_pine_chest$)" # (@+++)

 SE_LSP_ROCKFELLER_T: "$SE_EQUESTRIA_UNITE_TITLE$"
 SE_LSP_ROCKFELLER_A: "Гроші — відповідь на все."
 SE_LSP_ROCKFELLER_D: "«Я не вірю, що поні може покинути свою роботу. Йому доведеться думати про це вдень і мріяти вночі».\n($SCS_rockfeller$)"

 SE_LSP_MR_HORSE_T: "$SE_EQUESTRIA_UNITE_TITLE$"
 SE_LSP_MR_HORSE_A: "Горс завжди перемагає." # (@+++)
 SE_LSP_MR_HORSE_D: "«Але автократія? Міцний контроль у копитах технологічного й економічного візіонера? Так, Еквестрія це отримає».\n(Тротберт Горс)" # (@+++)

 SE_LSP_STARRY_T: "$SE_EQUESTRIA_UNITE_TITLE$"
 SE_LSP_STARRY_A: "Солідарність назавжди!" # (@+++)
 SE_LSP_STARRY_D: "«Коли натхнення спілки піде по нашій крові,\nНе буде сили більшої ніде під сонцем;\nЯка ж бо сила на землі слабша за міць одного,\nІ з єдністю незрівнянна!»\n(Еквестрійська профспілкова пісня)" # (@+++)

 SE_LSP_SPRINKLE_T: "$SE_EQUESTRIA_UNITE_TITLE$"
 SE_LSP_SPRINKLE_A: "Цю землю створено для тебе і мене."
 SE_LSP_SPRINKLE_D: "«Ця земля — твоя земля, і ця земля — моя земля\nВід Кольтіфоалнії до острова Мейнгеттен\nВід лісу Блек Ерлі до вод Теплих Берегів\nЦю землю створено для тебе і мене».\n(Еквестрійська народна пісня)" # «Остров Мейнгеттен» бо це копірка з оригіналу, де «острів Нью-Йорк»

 SE_BALTIMARE_GOLDEN_T: "$SE_EQUESTRIA_UNITE_TITLE$"
 SE_BALTIMARE_GOLDEN_A: "Перший крок до комунізму."
 SE_BALTIMARE_GOLDEN_D: "«Профспілки — це острівці анархії в морі хаосу».\n(Товариш Делішес)"

 SE_BALTIMARE_CHAFER_T: "$SE_EQUESTRIA_UNITE_TITLE$"
 SE_BALTIMARE_CHAFER_A: "Перемога робітничого класу."
 SE_BALTIMARE_CHAFER_D: "«Наші цілі ясні, наші завдання визначені! До роботи, товариші!»\n($BAL_cricket_chafer_name$)"

 SE_BALTIMARE_ANARCHISTS_T: "$SE_EQUESTRIA_UNITE_TITLE$"
 SE_BALTIMARE_ANARCHISTS_A: "Ні богів, ні господарів."
 SE_BALTIMARE_ANARCHISTS_D: "«Ми скасували уряд і передали засоби виробництва робітникам — прямо протилежне тому, що зробив Стіл Сталліон».\n($BAL_anarchist_advisor1$)" # (@+++)

 SE_BALTIMARE_LAVANDER_T: "$SE_EQUESTRIA_UNITE_TITLE$"
 SE_BALTIMARE_LAVANDER_A: "Слава Еквестрії!"
 SE_BALTIMARE_LAVANDER_D: "«Реакціонери, бетпоні та інший набрід усе ще можуть спокутувати свою провину перед Батьківщиною. Працюючи в таборах до самої смерті, вони знайдуть прощення в очах народу. Коли вони помруть, то зроблять це з усмішкою на вустах, бо знатимуть, що зробили свій внесок у благо держави».\n($berry1$)" # (@+++)

 SE_AHUIZOTL_EMPIRE_T: "Бог сонця і місяця"
 SE_AHUIZOTL_EMPIRE_A: "Дійсність гірша від кошмару."
 SE_AHUIZOTL_EMPIRE_D: "«Астланська імперія вічна! Нехай проллється жертовна кров наших ворогів!»\n($TEM_ahuizotl$)"

 SE_VANHOOVER_T: "$SE_EQUESTRIA_UNITE_TITLE$"
 SE_VANHOOVER_A: "Червоне знамено над Кантерлотом."
 SE_VANHOOVER_D: "«Геть Селестію та її камарилью!\nГеть хижу бюрократію!\nХай живе Радянська Еквестрія, фортеця трудящих!\nХай живе світова соціалістична революція!»\n($EQS_dust_hoover$)" # (@+++)

 SE_AQUILEIA_EMPIRE_T: "Аквілейська імперія"
 SE_AQUILEIA_EMPIRE_A: "Vive l'Impératrice!"
 SE_AQUILEIA_EMPIRE_D: "«В аквілейцях під попелом завжди жевріє відчуття національної гордості. Одної іскри досить, щоби запалити його».\n(Імператриця $JER_char_vivienne$)"

 SE_PAN_GRIFFONIA_DREAM_T: "Пангрифонська мрія"
 SE_PAN_GRIFFONIA_DREAM_A: "Від Скайнавії до Карфіна..."
 SE_PAN_GRIFFONIA_DREAM_D: "«Я маю мрію, що одного дня всі грифони повстануть втілять справжнє значення її кредо: “Ми вважаємо ці істини самоочевидними, що всі істоти створені рівними”.\nЯ маю мрію, що одного дня на красивих полях Полуниці сини колишніх селян і сини колишніх дворян зможуть сісти разом за стіл братерства».\n($FAT_alexander_kemerskai$)"

### 1.5.0 ###
 SE_EVI_UNITE_TITLE: "Об'єднання долини Еві"

 SE_EVI_BRODFELD_T: "$SE_EVI_UNITE_TITLE$"
 SE_EVI_BRODFELD_A: "Нарешті мир."
 SE_EVI_BRODFELD_D: "«Будь-яка війна в Еві — це війна громадянська».\n(Бродфельдський письменник)"

 SE_EVI_GLA_T: "$SE_EVI_UNITE_TITLE$"
 SE_EVI_GLA_A: "А перемоги визначають ціль."
 SE_EVI_GLA_D: "«Війна — це низка катастроф, яка призводить до перемоги».\n($GRW_comradegeneral_filip_redglad$)"

 SE_EVI_GRYPHIAN_HOST_T: "$SE_EVI_UNITE_TITLE$"
 SE_EVI_GRYPHIAN_HOST_A: "Не показуйте це Ґроверові."
 SE_EVI_GRYPHIAN_HOST_D: "«Імператорові. Ти диявол герцландський, проклятого чорта брат і товариш і самого Маара секретар. Який ти в чорта лицар, коли не вмієш голим гузном їжака забити? Чорт сере, а твоє військо жере. Твого війська ми не боїмось, землею і водою битимемось із тобою».\n(Відповідь евійських козаків Грифенгайму)"

 SE_EVI_LUSHI_T: "$SE_EVI_UNITE_TITLE$"
 SE_EVI_LUSHI_A: "Домовина стала сильніша." # (&?)
 SE_EVI_LUSHI_D: "«Ми любимо нашу країну — не тому, що вона велика, а тому, що вона наша».\n(Еліас Уайткрест)"

 SE_EVI_GRYPHUS_T: "$SE_EVI_UNITE_TITLE$"
 SE_EVI_GRYPHUS_A: "Нехай приходять."
 SE_EVI_GRYPHUS_D: "«Старе прислів'я каже: “У борні свобода зникає”. У Герцланді та Річкових землях це добре розуміють, і перш ніж абияка країна стає загрозою для них, вони намагаються розділити її мешканців і виправдати своє вторгнення, нібито з заклику одної сторони або щоби подбати про жертв».\n(Аґатон Ґіллер, ґрифуський журналіст)"

 SE_FALCOR_REVENGE_T: "Фалькорська вендетта"
 SE_FALCOR_REVENGE_A: "Karthin delenda est."
 SE_FALCOR_REVENGE_D: "«До нас не проявили жодного милосердя у Фалькорі.\nМи не проявимо жодного милосердя тут.\nНехай Карфін слугує прикладом.\nНехай Карфін горить».\n($FAL_gabriele_dartiglio$)" # (&)

 SE_GREAT_ZAPHIA_T: "Велика Зафія"
 SE_GREAT_ZAPHIA_A: "Слава козакам!"
 SE_GREAT_ZAPHIA_D: "«Де козак, там і слава».\n($GRY_yeven_krawvelets$)"

 SE_MEGALI_T: "Реалізація Великої ідеї"
 SE_MEGALI_A: "Мінотаври досі сильні."
 SE_MEGALI_D: "«Астеріон очікує від вас не просто вмерти за нього, бо це справді мало; він очікує від вас завоювання. Саме тому кожен із вас, навіть умираючи, має бути одержимий єдиною думкою: як зберегти свою силу до кінця, щоби завоювати могли ті, хто виживе. І ви завоюєте, я більш ніж певен у цьому».\n($MIT_andris_dory$)" # (&?)

 SE_SCS_CONFEDERATE_T: "$SE_EQUESTRIA_UNITE_TITLE$"
 SE_SCS_CONFEDERATE_A: "Слава Діксі!"
 SE_SCS_CONFEDERATE_D: "«Ідіть додому, всі ті хлопці, що боролися зі мною, і допоможіть розбудувати розбиті долі нашої старох держави».\n($SCS_trotbert_e_neigh$)" # (&)

 SE_RIV_DMT_COM_T: "$SE_RIV_UNITE_TITLE$"
 SE_RIV_DMT_COM_A: "Поки найостанншій ланцюг не зламається." # (&)
 SE_RIV_DMT_COM_D: "«Інтелектуали змальовують комуністів чудовиськами, але спробуйте обійтися без батога. Капіталісти не підняли Річкові землі протягом 200 років. А ми перегнали їх за кілька років».\n($DMT_clifford_the_red$)" # точніш. не підіймали РЗ

### 1.6.0 ###
 SE_BARRAD_FATE_TITLE: "Доля Барраду"

 SE_BAR_ASINTI_T: "$SE_BARRAD_FATE_TITLE$"
 SE_BAR_ASINTI_A: "Тепер тут іще й демони?"
 SE_BAR_ASINTI_D: "«Тартар прокладається з добрими намірами».\n(Грифонячий крилатий вислів)" # (&)

 SE_BAR_LEOPOLD_T: "$SE_BARRAD_FATE_TITLE$"
 SE_BAR_LEOPOLD_A: "Deus ex machina."
 SE_BAR_LEOPOLD_D: "«Немає проблеми, яку не можна вирішити армією механічних солдатів або чашкою хорошого чаю».\n($BAR_leopold_schmeller$)"

 SE_BAR_SILVER_T: "$SE_BARRAD_FATE_TITLE$"
 SE_BAR_SILVER_A: "Мертві друзі не зрадять."
 SE_BAR_SILVER_D: "«Я зробив те, що інші не могли! Я переміг! Я! Більше жоден дикун-козак чи будь-хто ще не зможе загрожувати мені чи моїй країні! Нехай колишна пентархи повстануть, щоби служити мені цілу вічність!»\n($BAR_silver_star$)"

 SE_BAR_VIIRA_H_T: "$SE_BARRAD_FATE_TITLE$"
 SE_BAR_VIIRA_H_A: "Во славу Машини!"
 SE_BAR_VIIRA_H_D: "«Машина вимагає покори від нас, і ми зобов'язані виконувати її бажання. Я несу Її слово та волю всьому народу Барраду. Невірці будуть покарані за їхні злочини проти Машини, і мир вернеться на наші землі».\n($BAR_viira_lehtola$)"

 SE_BAR_VIIRA_G_T: "$SE_BARRAD_FATE_TITLE$"
 SE_BAR_VIIRA_G_A: "Во славу Вііри!"
 SE_BAR_VIIRA_G_D: "«Я знищу старі цивілізації та збудую новий, ліпший, упорядкований і МІЙ власний світ на їхніх руїнах. Кожен поклониться своїй богині!»\n(Вііра)"

 SE_BAR_AMBROSIUS_T: "$SE_BARRAD_FATE_TITLE$"
 SE_BAR_AMBROSIUS_A: "Хмари над Баррадом розсіюються."
 SE_BAR_AMBROSIUS_D: "«Надія часто народжується з відчаю».\n(Стародавня вінґбардійська приказка)"

 SE_BAR_FALL_T: "$SE_BARRAD_FATE_TITLE$"
 SE_BAR_FALL_A: "Могутній, але не всесильний."
 SE_BAR_FALL_D: "«Відчай — це страх без надії».\n(Аквілейський філософ)"

 SE_BAR_VIIRA_END_T: "Справжня Богиня Грифонії" # (@+++)
 SE_BAR_VIIRA_END_A: "Абсолютна влада."
 SE_BAR_VIIRA_END_D: "«У світі немає сили, здатної навіть подумати про те, щоб змагатися зі Мною! Хто для мене Борей, Арктурій, Ейр чи ці жалюгідні алікорни? Ці нікчеми не зробили нічого, щоб захистити своїх мізерних послідовників. Відтепер — Я і є Новий Світовий Порядок!»\n(Вііра)" # (@+++)

### 1.6.3 ###
 SE_STL_OUR_T: "$SE_EQUESTRIA_UNITE_TITLE$"
 SE_STL_OUR_A: "Маршируйте гордо! Тепер усі разом!"
 SE_STL_OUR_D: "«Життя — це радість в Нашім Містечку\nТут рівні ми всі до одного\nНемає тут вищих і кращих\nІ страх не тривожить нікого!»" # (@+++)

### 1.7.0 ###
 SE_GRF_WESTERN_EMPIRE_VIRGIL_T: "Західна Імперія Грифонів" # GRF_EMP_neutrality
 SE_GRF_WESTERN_EMPIRE_VIRGIL_A: "Гарно зроблено."
 SE_GRF_WESTERN_EMPIRE_VIRGIL_D: "«Я так утомився від цієї дурні. А ці невдахи-республіканці досі хизуються. Ми революціонери, ми класні... прокляття!»\n(Імперський посланець)" # (&?)

 SE_GREAT_WAR_STG_T: "План «Червоний»"
 SE_GREAT_WAR_STG_A: "Ворог буде переможений!"
 SE_GREAT_WAR_STG_D: "«Усе наше населення має бути зараз стійким і згуртованим як ніколи раніше. Кожен із нас мусить вимагати від себе та від інших дисципліни, порядку та самопожертви, гідних справжнього радянського патріота, щоб забезпечити всі потреби Червоних армії, флоту та авіації для гарантованої перемоги над ворогом».\n(Заява Радянського інформбюро)" # (@+++)

 SE_NEW_MARELAND_KINGFISHER_T: "Мейрлендське століття"
 SE_NEW_MARELAND_KINGFISHER_A: "Риба-цар веде їх до успіху." # (&?)
 SE_NEW_MARELAND_KINGFISHER_D: "«Кожен поні — принцеса, кожен грифон — імператор, але ніхто не вдягає корону».\n($EQC_kingfisher$)"

 SE_NEW_MARELAND_LUNAR_DOMINION_T: "Об'єднані лунарні території Грифонії" # EQC_NLR_puppets
 SE_NEW_MARELAND_LUNAR_DOMINION_A: "Luna nobis providet, Luna nos custodit."
 SE_NEW_MARELAND_LUNAR_DOMINION_D:0 "«Ми — аванпост Імперії на іншому континенті. Ми — її щит, ми — її меч. І якщо Імператриця бажає нести світло істинної віри язичникам-грифонам, то ми з радістю будемо в її авангарді».\n($EQC_evening_dew$)" # (@+++)

 SE_NEW_MARELAND_LAST_STAND_T: "Вторгнення в Новий Мейрленд"
 SE_NEW_MARELAND_LAST_STAND_A: "Останній рубіж."
 SE_NEW_MARELAND_LAST_STAND_D: "«У всякому разі, ми битимемося до кінця. Я вірю в нашу перемогу, як і у факт, що завтрашнього ранку сонце напевне зійде знову».\n(Генерал $old_guard_guy$)"

 SE_GRI_RIV_WAR_RIV_V_T: "Перемога Коаліції"
 SE_GRI_RIV_WAR_RIV_V_A: "Кінець багатовікової боротьби." #Pobjeda! Pobjeda!
 SE_GRI_RIV_WAR_RIV_V_D: "«Так, ми успішні в цій війні,\nАле не хочем бачить знов,\nСолдатів, впалих у борні,\nЯких гірка земля взяла в свій схов».\n(Рієцька пісня)" # (@+++)

 SE_GRI_RIV_WAR_GRI_V_T: "Перемога Імперії"
 SE_GRI_RIV_WAR_GRI_V_A: "І квітне мак."
 SE_GRI_RIV_WAR_GRI_V_D: "«Ми загиблі. Ще кілька днів тому\nМи жили, тьму з світанком зустрічали,\nЛюбили й коханими були, а нині ми\nСпочили в полях Депонії, в полях Депонії».\n(Імперський вірш)" # (@+++)

 SE_AQUILEIAN_REPUBLIC_VICTORY_T: "La République victorieuse"
 SE_AQUILEIAN_REPUBLIC_VICTORY_A: "La République nous appelle."
SE_AQUILEIAN_REPUBLIC_VICTORY_D: "«Скрізь, у глибокій темряві ночей\nСкидаючи безславну владу королів,\nАквілея дарує всім народам\nСвободу й мир».\n(Аквілейська революційна пісня)" # (@+++)

 SE_LUNAR_EQUUS_T: "Правління Місяця"
 SE_LUNAR_EQUUS_A: "Nox aeterna."
 SE_LUNAR_EQUUS_D: "«Війни, які ми вели за нашу Імперію, не були марними. Свобода та слава нашого народу були здобуті на полях битв і залишаться для прийдешніх поколінь. Об'єднані ми стоїмо, разом ми процвітаємо. Слава Імператриці Найтмер Мун!»\n(Місячний капелан)" # (@+++)

 SE_SOLAR_EQUUS_T: "Правління Сонця"
 SE_SOLAR_EQUUS_A: "Sol invictus."
 SE_SOLAR_EQUUS_D: "«Нехай твоє правління буде вічним, Сонячна Імператрице! Нехай твоя слава простягнеться над усією землею! Нехай Світло вкриє нас твоїм пануванням!»\n(Сонячний капелан)" # (@+++)

 SE_TRIMMEL_ON_GRIFFONIAN_THRONE_T: "Марш Ґрайфвальду" # (&?)
 SE_TRIMMEL_ON_GRIFFONIAN_THRONE_A: "Чейнджлінґ на грифонському престолі?"
 SE_TRIMMEL_ON_GRIFFONIAN_THRONE_D: "«Солдат-чейнджлінґ вразив світ; лицар-грифон вразив солдата-чейнджлінґа».\n($chntrimmel$)" # (&?)

 SE_WAR_TWO_CONT_MARESOC_VS_EQUUS_T: "Схід проти заходу"
 SE_WAR_TWO_CONT_MARESOC_VS_EQUUS_A: "Нікуди тікати."
 SE_WAR_TWO_CONT_MARESOC_VS_EQUUS_D: "«Старі цивілізації стверджували, що засновані на любові або справедливості. Наша заснована на ненависті. У нашому світі не буде інших емоцій, окрім страху, люті, звитяги та самоприниження. Все інше ми знищимо. Все».\n(Член Внутрішньої партії)"

### 1.7.1 ###
 SE_WAR_TWO_CONT_VIIRA_VS_EQUUS_T: "Схід проти заходу"
 SE_WAR_TWO_CONT_VIIRA_VS_EQUUS_A: "Кінець близький."
 SE_WAR_TWO_CONT_VIIRA_VS_EQUUS_D: "«Відчуваєте це? Це ваші страх і відчай у повітрі.\nЧуєте, по вас подзвін?»\n(Вііра)" # (&?)

 SE_WAR_TWO_CONT_JUCHE_VS_EQUUS_T: "Схід проти заходу"
 SE_WAR_TWO_CONT_JUCHE_VS_EQUUS_A: "Світ буде червоним або мертвим." # (@+++)
 SE_WAR_TWO_CONT_JUCHE_VS_EQUUS_D: "«Називати соціалізм, за якого народні маси є господарями всього, «тоталітаризмом» — це, зрештою, безглузда брехня, яка ототожнює найпрогресивнішу ідею, що відображає вимоги народних мас, з реакційною ідеєю фашистських правителів».\n(Кімбалл Баркінґ-Сан)" # (@+++)

 SE_WAR_TWO_CONT_HLQ_VS_EQS_T: "Схід проти заходу"
 SE_WAR_TWO_CONT_HLQ_VS_EQS_A: "Хай щастить!"
 SE_WAR_TWO_CONT_HLQ_VS_EQS_D: "«Ви вирушаєте у Великій Похід. Ваше завдання буде нелегким. Ваш ворог добре навчений, добре оснащений і загартований у боях. Він битиметься люто. Але хід війни змінився! Вільні поні всього світу разом крокують до Перемоги!»\n($EQS_princess_celestia$)" # (@+++)
 #SE_WAR_TWO_CONT_HLQ_VS_EQS_D:0 "«Ви вирушаєте у Великій Похід, до якого ми прагнули всі ці довгі місяці. Надії та молитви всіх поні скрізь звернені до вас. Разом із нашими хоробрими Союзниками ви принесете знищення Імперії Грифонів та ліквідацію нацистської тиранії над пригнобленими народами Грифонії».\n(Принцеса Селестія)" # ТАК-ТАК, саме нацистської

 SE_CRYSTAL_REGENCY_T: "Кристальне Регентство" # (@+++)
 SE_CRYSTAL_REGENCY_A: "Перемога великою ціною..." # (@+++)
 SE_CRYSTAL_REGENCY_D: "«Я не твоя мама і ніколи не зможу її замінити, але, клянуся Гармонією, я зроблю все можливе, щоб подбати про тебе».\n(Обіцянка Твайлайт Спаркл Фларрі Гарт після страти її батьків Сомброю)" # (@+++)

### TNO MEME ###
 SE_TNO_TWILIGHT_T: "$SE_EQUESTRIA_UNITE_TITLE$"
 SE_TNO_TWILIGHT_A: "Роботи так багато."
 SE_TNO_TWILIGHT_D: "Зберігайте спокій.\nРегент тримається.\nСелестія живе.\nСвяте Еквестрійське Князівство виживе." # EQS_TWI_TABBY_REUNIFIED

 SE_TNO_SABLIN_T: "$SE_EQUESTRIA_UNITE_TITLE$"
 SE_TNO_SABLIN_A: "Яке благословенне врем'я."
 SE_TNO_SABLIN_D: "«Будьте сильні у вірі, що життя чудове. Будьте позитивні та вірте, що революція завжди переможе».\n($UESR_country_leader$)"

### 1.7.2 ###
 SE_WAR_TWO_CONT_RIV_VS_CHN_T: "Схід проти заходу"
 SE_WAR_TWO_CONT_RIV_VS_CHN_A: "Поні допомагають поні."
 SE_WAR_TWO_CONT_RIV_VS_CHN_D: "«Ми всі маємо одну спільність: ми маємо намір захищати нашу землю від тиранії й агресії і, наскільки можемо, маємо намір простягати копито іншим, хто може бути в більшій загрозі, ніж ми в цю мить».\n(Стаття в газеті «Річкозем'я»)" # (&?)

### 1.8.0 ###
 SE_NORTH_ZEBRICA_WAR_T: "Війна в Північній Зебриці"
 SE_NORTH_ZEBRICA_WAR_A: "Чи переживе Аріс бурю?"
 SE_NORTH_ZEBRICA_WAR_D: "«Отже, війна почалася. Великий історичний вузол розв'язано. Перший камінь покотився схилом. Інші покотяться за ним. Світ переступив поріг нової епохи».\n([HIP.GetLeader])" # (@+++)

 SE_HIP_HARMONY_T: "Тріумф Арісу"
 SE_HIP_HARMONY_A: "Аріс пережив усі випробування."
 SE_HIP_HARMONY_D: "«Трагедія Північної Зебрики шокує весь світ. Двічі за наше життя ми бачили, як ці прекрасні землі розколювалися та розривалися на шматки, залишаючи по собі лише обвуглені руїни. На нас лягла відповідальність утримати прапор свободи. Але торнадо минув. Грім гармат стих. Ми досі живі й вільні».\n([HIP.GetLeader])" # (@+++)

 SE_HIP_COM_T: "Тріумф Арісу"
 SE_HIP_COM_A: "Слава нашому великому переможному народу!"
 SE_HIP_COM_D: "«ТОВАРИШІ! Вітчизняна війна завершилася нашою цілковитою перемогою! Почався період мирного розвитку. Я вітаю вас із перемогою, мої любі друзі!»\n([HIP.GetLeader])"

 SE_HIP_AF_T: "Тріумф Арісу"
 SE_HIP_AF_A: "Це був довгий шлях до перемоги." # (@+++)
 SE_HIP_AF_D: "«Мушу сказати, ми досягли тріумфу не лише в битвах на суші, на морі та в повітрі — наші політичні та соціальні інститути показали себе з не менш найкращого боку».\n([HIP.GetLeader])" # (@+++)

 SE_HIP_FALANGA_T: "Сходження Гегемонії"
 SE_HIP_FALANGA_A: "Аріс понад усе."
 SE_HIP_FALANGA_D: "«Завжди, до перемоги! Батьківщина або смерть — ми переможемо!»\n([HIP.GetLeader])" # (&?)

 SE_ATOM_T: "Остання битва"
 SE_ATOM_A: "Чи не стане це фатальною помилкою?" # (@+++)
 SE_ATOM_D: "«Звісно, ми тут дещо перегинаємо палицю,\nАле все ж таки, було б доречно запитати:\nСкільки коштує їхнє життя порівняно з результатами,\nВід яких виграє весь світ?»\n($HIP_posada$)" # (@+++)

 SE_HIP_POSADA_FINALE_T: "Останній рубіж" # (@+++)
 SE_HIP_POSADA_FINALE_A: "Я вірю, друзі..." # (@+++)
 SE_HIP_POSADA_FINALE_D: "«Цієї миті все моє життя, здається, стиснулося в одну чудову мить. Усе, що я пережила і зробила досі, було підготовкою до цього моменту».\n($HIP_posada$)" # (@+++)

 SE_HIP_SIREN_T: "Пісня Північної Зебрики"
 SE_HIP_SIREN_A: "Вистава тільки починається."
 SE_HIP_SIREN_D: "«Нам потрібен світ, і бажано весь!»\n(Адажіо)"

 SE_HIP_SIREN_FINALE_T: "Пісня нової епохи"
 SE_HIP_SIREN_FINALE_A: "І нехай вона лине крізь вічність."
 SE_HIP_SIREN_FINALE_D: "«Урешті-решт, музика панує над усім».\n(Адажіо)" # (&)

 SE_TOBUCK_WHITE_T: "Пробудження Білої Сєвєряни"
 SE_TOBUCK_WHITE_A: "Ми підемо разом, як брати!" # (@+++)
 SE_TOBUCK_WHITE_D: "«Хай повернемось ми сивочолими\nЗ кривавої цієї праці.\nНад тобою, Сєвєряно,\nЗійде Новий Місяць».\n(Маршова пісня білого руху)" # (@+++)

 SE_TOBUCK_NEO_HAZRUMENIA_T: "Нео-Хазруменська імперія" # TBK_neo_hazrumenia
 SE_TOBUCK_NEO_HAZRUMENIA_A: "В ім'я Замалове!"
 SE_TOBUCK_NEO_HAZRUMENIA_D: "«Право служити істинному королю — уже привілей».\n($TBK_baragzen$)"

 SE_TOBUCK_SEVERYANA_T: "Сєвєрянське царство" # TBK_severyana(_DEF)
 SE_TOBUCK_SEVERYANA_A: "На славу нам! На страх ворогам!" # (@+++)
 SE_TOBUCK_SEVERYANA_D: "«Будучи доброї слави,\nУ щасливому життєвому шляху\nНа скромній дорозі\nБлагослови нас на землі!»\n(З гімну Сєвєряни)" # (@+++)

 SE_COL_FIRST_CIVIL_WAR_T: "Громадянська війна в Кольтфагені"
 SE_COL_FIRST_CIVIL_WAR_A: "Знову війна."
 SE_COL_FIRST_CIVIL_WAR_D: "«Вина за криваву міжусобицю лежить не на тих, хто, будучи пригнобленим, був змушений взятися за зброю, а на тих, хто не дав їм іншого вибору».\n($CVA_zeshmunazash_zeirutid$)" # (@+++)

 SE_COL_SECOND_CIVIL_WAR_T: "Друга громадянська війна в Кольтфагені"
 SE_COL_SECOND_CIVIL_WAR_A: "І знову брат проти брата."
 SE_COL_SECOND_CIVIL_WAR_D: "«У громадянській війні народ грає роль барикади».\n($GRW_comradegeneral_filip_redglad$)"

 SE_COL_THIRD_CIVIL_WAR_T: "Третя громадянська війна в Кольтфагені"
 SE_COL_THIRD_CIVIL_WAR_A: "Яка нещасна нація!" # (@+++)
 SE_COL_THIRD_CIVIL_WAR_D: "«Погляньте на них, на всіх цих бідних створінь. Кольфаген падає на коліна. І він більше ніколи не підніметься. Кольтфаген залишиться лише у спогадах».\n(З книги «Звіяні буревієм»)" # (@+++)

 SE_CLOUDBURY_KINGDOM_T: "Дуалістична монархія"
 SE_CLOUDBURY_KINGDOM_A: "Якби це бачив Кемерскай."
 SE_CLOUDBURY_KINGDOM_D: "«Є неабияка іронія в тому, що діти республіканців, які давно пішли на північ, повернулися сюди переконаними монархістами».\n($BRZ_count_ignatius$)" # (@+++)

 SE_GRIFF_EMPIRE_FINAL_T: "На варті Імперії" # (@+++)
 SE_GRIFF_EMPIRE_FINAL_A: "Lieb Vaterland, magst ruhig sein."
 SE_GRIFF_EMPIRE_FINAL_D: "«Поки останній живий стрілець,\nІ хоча б один курок натягнутий,\nІ один зі шпаги стисне кулак,\nНа берег твій не ступе ворог!»\n(Імперський патріотичний гімн)" #Текст «Die Wacht am Rhein», рими 0, але офіційний переклад # (@+++)
